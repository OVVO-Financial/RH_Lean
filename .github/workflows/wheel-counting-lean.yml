name: Finite wheel counting check

on:
  push:
    branches: [agent/wheel-counting-bound]
    paths:
      - RHLean/Analysis/RoughWheelFiniteCounting.lean
      - RHLean/Proof/PostRootCovariancePrimeWheel210Scratch.lean
      - RHLean/Proof/PostRootCovarianceWheelCounting.lean
      - .github/workflows/wheel-counting-lean.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheel-counting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Kernel-check finite interval counting
        run: lake build RHLean.Analysis.RoughWheelFiniteCounting --wfail
      - name: Kernel-check quantitative wheel proof
        run: lake build RHLean.Proof.PostRootCovarianceWheelCounting --wfail
