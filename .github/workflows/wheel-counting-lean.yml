name: Finite wheel counting check

on:
  pull_request:
    branches: [main]
    paths:
      - RHLean/Analysis/RoughWheelFiniteCounting.lean
      - RHLean/Proof/PostRootCovariancePrimeWheel210Scratch.lean
      - RHLean/Proof/PostRootCovarianceWheelCounting.lean
      - research/NAT_DIV_INTERVAL_WIDTH_SCRATCH.lean
      - research/WHEEL_2310_SECOND_OVERLAP_SCRATCH.lean
      - research/WHEEL_2310_TWO_OVERLAP_IDENTITY.lean
      - research/PRIME_WHEEL_SIGNED_INTERVAL_AGGREGATE.lean
      - .github/workflows/wheel-counting-lean.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheel-counting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore Lake packages
        id: lakepackages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Apply StrongPNT 4.24 compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py
      - name: Restore StrongPNT port build cache
        id: strongpntcache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Prebuild StrongPNT dependency
        run: lake build StrongPNT.PNT5_Strong
      - name: Save StrongPNT port build cache
        if: steps.strongpntcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-
      - name: Kernel-check finite interval counting
        run: lake build RHLean.Analysis.RoughWheelFiniteCounting --wfail
      - name: Kernel-check generic floor-width lemma
        run: lake env lean research/NAT_DIV_INTERVAL_WIDTH_SCRATCH.lean
      - name: Kernel-check 210 wheel staircase
        run: lake build RHLean.Proof.PostRootCovariancePrimeWheel210Scratch
      - name: Kernel-check exact two-overlap 2310 identity
        run: lake env lean research/WHEEL_2310_TWO_OVERLAP_IDENTITY.lean
      - name: Kernel-check signed prime-wheel interval aggregate
        run: lake env lean research/PRIME_WHEEL_SIGNED_INTERVAL_AGGREGATE.lean
