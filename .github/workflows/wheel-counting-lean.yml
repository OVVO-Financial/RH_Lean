name: Finite wheel counting check

on:
  pull_request:
    branches: [main]
    paths:
      - RHLean/Analysis/RoughWheelFiniteCounting.lean
      - RHLean/Proof/PostRootCovariancePrimeWheel210Scratch.lean
      - RHLean/Proof/PostRootCovarianceWheelCounting.lean
      - RHLean/Proof/PrimeWheelRoughSeatCorrelation.lean
      - research/NAT_DIV_INTERVAL_WIDTH_SCRATCH.lean
      - research/WHEEL_2310_SECOND_OVERLAP_SCRATCH.lean
      - research/WHEEL_2310_TWO_OVERLAP_IDENTITY.lean
      - research/PRIME_WHEEL_SIGNED_INTERVAL_AGGREGATE.lean
      - research/PRIME_WHEEL_TRUNCATED_MOBIUS_KERNEL.lean
      - research/PRIME_WHEEL_ROUGH_SEAT_SQRT_SPECIALIZATION.lean
      - research/PRIME_WHEEL_ROUGH_SEAT_FROZEN_BRIDGE.lean
      - .github/workflows/wheel-counting-lean.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: wheel-counting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore Lake packages
        id: lakepackages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Restore PNT+ build cache
        id: strongpntcache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Prebuild PNT+ StrongPNT dependency
        run: lake build PrimeNumberTheoremAnd.StrongPNT
      - name: Save PNT+ build cache
        if: steps.strongpntcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Restore RHLean build cache
        id: rhleancache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      - name: Kernel-check finite interval counting
        run: lake build RHLean.Analysis.RoughWheelFiniteCounting --wfail
      - name: Build RHLean modules imported by these research checks
        run: >-
          python3 scripts/compile_research_import_closure.py --library-only
          research/NAT_DIV_INTERVAL_WIDTH_SCRATCH.lean
          research/PRIME_WHEEL_ROUGH_SEAT_FROZEN_BRIDGE.lean
          research/PRIME_WHEEL_ROUGH_SEAT_SQRT_SPECIALIZATION.lean
          research/PRIME_WHEEL_SIGNED_INTERVAL_AGGREGATE.lean
          research/PRIME_WHEEL_TRUNCATED_MOBIUS_KERNEL.lean
          research/WHEEL_2310_TWO_OVERLAP_IDENTITY.lean
      - name: Kernel-check generic floor-width lemma
        run: lake env lean research/NAT_DIV_INTERVAL_WIDTH_SCRATCH.lean
      - name: Kernel-check 210 wheel staircase
        run: lake build RHLean.Proof.PostRootCovariancePrimeWheel210Scratch
      - name: Kernel-check promoted wheel counting bounds
        run: lake build RHLean.Proof.PostRootCovarianceWheelCounting --wfail
      - name: Kernel-check exact two-overlap 2310 identity
        run: lake env lean research/WHEEL_2310_TWO_OVERLAP_IDENTITY.lean
      - name: Kernel-check signed prime-wheel interval aggregate
        run: lake env lean research/PRIME_WHEEL_SIGNED_INTERVAL_AGGREGATE.lean
      - name: Kernel-check signed truncated wheel kernel
        run: lake env lean research/PRIME_WHEEL_TRUNCATED_MOBIUS_KERNEL.lean
      - name: Kernel-check promoted rough-seat correlation
        run: lake build RHLean.Proof.PrimeWheelRoughSeatCorrelation --wfail
      - name: Kernel-check square-root rough-seat specialization
        run: lake env lean research/PRIME_WHEEL_ROUGH_SEAT_SQRT_SPECIALIZATION.lean
      - name: Kernel-check frozen rough-seat bridge
        run: lake env lean research/PRIME_WHEEL_ROUGH_SEAT_FROZEN_BRIDGE.lean
      - name: Drop stale exact RHLean build cache
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.number) || github.ref }}
          CACHE_KEY: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/actions/caches?ref=${CACHE_REF}&per_page=100" \
            --jq ".actions_caches[] | select(.key == \"${CACHE_KEY}\") | .id" \
            | while read -r id; do
                [ -n "$id" ] || continue
                echo "deleting stale exact cache ${CACHE_KEY} (${id})"
                gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/caches/${id}"
              done
      - name: Save RHLean build cache
        uses: actions/cache/save@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
