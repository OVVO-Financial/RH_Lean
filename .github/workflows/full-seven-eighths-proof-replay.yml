name: Complete upstream seven-eighths proof replay

on:
  pull_request:
    paths:
      - '.github/workflows/full-seven-eighths-proof-replay.yml'
      - 'research/NATIVE_SEVEN_EIGHTHS_LOCAL_COMPENSATION_20261019.lean'
      - 'docs/NATIVE_SEVEN_EIGHTHS_REPLICATION_PROTOCOL_20261019.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-seven-eighths-proof-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-source-replay:
    name: Whole OAI 7/8 theorem and imported closure, no theorem premise
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GLIBC_TUNABLES: glibc.malloc.mmap_max=0:glibc.malloc.arena_max=1
      LEAN_NUM_THREADS: '2'
      OAI_PIN: 1581d4cbdd69a0faf34b2089614fe2a814316a6a
    steps:
      - name: Checkout RH_Lean branch (source provenance)
        uses: actions/checkout@v4

      - name: Checkout complete upstream formal proof at immutable commit
        uses: actions/checkout@v4
        with:
          repository: openai/math
          ref: 1581d4cbdd69a0faf34b2089614fe2a814316a6a
          path: upstream-math
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true
          filter: blob:none

      - name: Install Lean toolchain manager
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
          build: false
          test: false
          lint: false

      - name: Record exact paper, imports and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat upstream-math/lean/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          test "$(git -C upstream-math rev-parse HEAD)" = "$OAI_PIN"
          test -s upstream-math/lean/OAI/NumberTheory/DirichletL/Nonvanishing.lean
          test -s upstream-math/lean/OAI/NumberTheory/DirichletL/Detector/FinalAssemblyUnconditional.lean
          test -s upstream-math/lean/OAI/NumberTheory/DirichletL/Energy/CertifiedExistence.lean
          test -s upstream-math/lean/OAI/NumberTheory/DirichletL/Moments/DetectorPlainSlotProfile.lean
          printf 'Upstream commit: %s\n' "$OAI_PIN"
          sha256sum upstream-math/lean/OAI/NumberTheory/DirichletL/Nonvanishing.lean
          cat upstream-math/lean/lean-toolchain

      - name: Resolve exact pinned OAI dependency graph
        shell: bash
        working-directory: upstream-math/lean
        run: |
          set -euo pipefail
          lake update 2>&1 | tee ../../seven-eighths-lake-update.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('lake-manifest.json').read_text())
          pkgs = {r['name']:r['rev'] for r in manifest['packages']}
          assert pkgs['mathlib'] == 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          assert pkgs['StrongPNT'] == '2f5835c322314f55f1026ec2f139d704b7c45c69'
          assert pkgs['PrimeNumberTheoremAnd'] == 'c39a751132c88b6e8080b74c74023fd95b3d8be0'
          print('Full OAI pinned dependency graph verified')
          PY

      - name: Fetch upstream Mathlib precompiled artifacts
        shell: bash
        working-directory: upstream-math/lean
        run: |
          set -euo pipefail
          lake exe cache get 2>&1 | tee ../../seven-eighths-cache.log

      - name: Compile complete nonvanishing theorem and every imported analytic proof
        shell: bash
        working-directory: upstream-math/lean
        run: |
          set -euo pipefail
          lake -j 2 build OAI.NumberTheory.DirichletL.Nonvanishing 2>&1 | tee ../../seven-eighths-complete-build.log

      - name: Kernel-check FINAL theorem and axiom policy
        shell: bash
        working-directory: upstream-math/lean
        run: |
          set -euo pipefail
          cat > full-seven-eighths-check.lean <<'EOF'
          import OAI.NumberTheory.DirichletL.Nonvanishing
          #check OAI.riemannZeta_ne_zero_of_seven_eighths_lt_re
          #check OAI.DirichletCharacter.LFunction_ne_zero_of_seven_eighths_lt_re
          #print axioms OAI.riemannZeta_ne_zero_of_seven_eighths_lt_re
          #print axioms OAI.DirichletCharacter.LFunction_ne_zero_of_seven_eighths_lt_re
          EOF
          lake env lean -DwarningAsError=true full-seven-eighths-check.lean 2>&1 | tee ../../seven-eighths-axioms.log
          if grep -E -i 'sorryAx|admitAx' ../../seven-eighths-axioms.log; then
            echo 'Failure: proof depends on sorry/admit axioms' >&2
            exit 1
          fi
          echo 'COMPLETE upstream 7/8 imported dependency chain kernel-checked (not a new independent proof).'

      - name: Publish full-replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-seven-eighths-replay-log
          path: |
            seven-eighths-*.log
          if-no-files-found: ignore
          retention-days: 14
