          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_PROXY_ENERGY_PULL.olean research/VF_MID_PROXY_ENERGY_PULL.lean 2>&1 | tee vf-mid-proxy-energy-pull.log
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.FOUR_FANTASY_PROXY_RH_CLOSURES.olean research/FOUR_FANTASY_PROXY_RH_CLOSURES.lean 2>&1 | tee four-fantasy-proxy-rh-closures.log
