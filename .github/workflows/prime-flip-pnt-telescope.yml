name: Prime flip PNT telescope
# Composite-floor and square-theta attack strict check.

on:
  pull_request:
    branches: [main]
    paths:
      - research/PRIME_FLIP_PNT_TELESCOPE.lean
      - research/PRIME_FLIP_STATIC_CHRONOLOGY.lean
      - research/ALL_SCALE_LI_DISPLACEMENT_REDUCTION.lean
      - research/EXACT_LI_DICKMAN_FORMAL.lean
      - research/EXACT_LI_PURE_MODEL_CLOSURE.lean
      - research/VF_MID_VON_KOCH_BRIDGE.lean
      - research/VF_MID_OSCILLATION_SCALE.lean
      - research/LI_FLOOR_PRIME_COUNT_FANTASY.lean
      - research/VF_MID_FLOOR_LI_DISCRETE_BACKLOG.lean
      - research/VF_MID_FLOOR_LI_MEBOOT_MONTE_CARLO.md
      - numerics/floor_li_discrete_meboot/**
      - research/VF_MID_FLOOR_LI_DISCRETE_BACKLOG.lean
      - research/VF_MID_LINEAR_INTERPOLATION_FANTASY.lean
      - research/FOUR_FANTASY_PROXY_RH_CLOSURES.lean
      - research/VF_MID_DIRECT_SIGNED_DYNAMICS.lean
      - research/VF_MID_SQUARE_BAND_COMPOSITE_BRIDGE.lean
      - research/VF_MID_FRACTIONAL_PRIME_CLUSTER.lean
      - research/VF_MID_DIRECT_COMPOSITE_DESCENT.lean
      - research/VF_MID_DIRECT_OWNER_DESCENT.lean
      - research/VF_MID_DIRECT_ROUGH_CHILD.lean
      - research/VF_MID_DYADIC_PREFIX_OWNER.lean
      - research/VF_MID_DYADIC_OWNER_EXACT.lean
      - research/VF_MID_ODD_FRACTIONAL_CLUSTER.lean
      - research/VF_MID_SIGNED_SEAT_CHARGE.lean
      - research/VF_MID_RECURSIVE_CHILD_INJECTIVE.lean
      - research/VF_MID_RECURSIVE_SCALE_DESCENT.lean
      - research/VF_MID_RECURSIVE_REMAINDER_BOUND.lean
      - research/VF_MID_SQUARE_THETA_NATIVE_DESCENT.lean
      - research/VF_MID_PROXY_ENERGY_PULL.lean
      - research/VF_MID_PHI_OWNER_BRIDGE.lean
      - research/VF_MID_DYADIC_SUMMATION_TRANSFER.lean
      - research/VF_MID_PHI_CUTOFF_TELESCOPE.lean
      - research/VF_MID_PHI_ODD_LI_TRANSFER.lean
      - research/VF_MID_PHI_DIAGONAL_TRANSFER.lean
      - research/VF_MID_INTEGER_BLOCK_CAPTURE.lean
      - research/VF_MID_LITERAL_BLOCK_CROSSING.lean
      - research/VF_MID_ALIGNED_STEP_GRAPH.lean
      - research/VF_MID_STEP_GRAPH_BRACKETING.lean
      - research/VF_MID_SQUARE_WHEEL_BACKLOG.lean
      - research/VF_MID_MIDPOINT_COMPLEMENT_DISPERSION.lean
      - research/VF_MID_UNIFORMITY_BIAS_CORRELATION.lean
      - research/VF_MID_GLOBAL_PHASE_UNIFORMITY_BRIDGE.lean
      - research/VF_MID_HARMAN_FOUR_FIFTHS.lean
      - research/VF_MID_HARMAN_HALF_PHASE_BRIDGE.lean
      - research/VF_MID_COMPOSITE_FLOOR.lean
      - research/VF_MID_DIRECT_DISCREPANCY_ABEL.lean
      - FORMALIZATION_SEQUENCE.md
      - FORMALIZATION_CHECKLIST.md
      - .github/workflows/prime-flip-pnt-telescope.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify append-only formalization records
        run: |
          grep -F '## Prime-flip PNT telescope (2026-09-28; stacked on #804)' FORMALIZATION_SEQUENCE.md
          grep -F '## Prime-flip PNT telescope (2026-09-28; stacked on #804)' FORMALIZATION_CHECKLIST.md
          git rev-parse HEAD
      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Apply StrongPNT 4.24 compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py
      - name: Restore StrongPNT port build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-
            rhlean-build-${{ runner.os }}-
      - name: Audit repository assumptions
        run: bash scripts/audit_assumptions.sh
      - name: Build exact dependencies
        run: |
          lake build RHLean.Analysis.PrimeSieveAbelIdentity
          lake build RHLean.Analysis.SquareRootMiddleSequentialCoherence
          lake build RHLean.Proof.LargePrimeTerminalFlipLayers
          lake build RHLean.Proof.PrimeCombVisualizationFrames
          lake build RHLean.Proof.PrimeCombReciprocalBandCancellation
      - name: Kernel-check prime flip telescope
        run: |
          mkdir -p .lake/build/lib/lean
          set -o pipefail
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_VON_KOCH_BRIDGE.olean research/VF_MID_VON_KOCH_BRIDGE.lean 2>&1 | tee vf-mid-von-koch.log
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_OSCILLATION_SCALE.olean research/VF_MID_OSCILLATION_SCALE.lean 2>&1 | tee vf-mid-oscillation-scale.log
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.LI_FLOOR_PRIME_COUNT_FANTASY.olean research/LI_FLOOR_PRIME_COUNT_FANTASY.lean 2>&1 | tee li-floor-prime-count-fantasy.log
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_LINEAR_INTERPOLATION_FANTASY.olean research/VF_MID_LINEAR_INTERPOLATION_FANTASY.lean 2>&1 | tee vf-mid-linear-interpolation-fantasy.log
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_DIRECT_SIGNED_DYNAMICS.olean research/VF_MID_DIRECT_SIGNED_DYNAMICS.lean 2>&1 | tee vf-mid-direct-signed-dynamics.log
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_SQUARE_BAND_COMPOSITE_BRIDGE.olean research/VF_MID_SQUARE_BAND_COMPOSITE_BRIDGE.lean 2>&1 | tee vf-mid-square-band-composite-bridge.log
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_DIRECT_COMPOSITE_DESCENT.olean research/VF_MID_DIRECT_COMPOSITE_DESCENT.lean 2>&1 | tee vf-mid-direct-composite-descent.log
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_DIRECT_OWNER_DESCENT.olean research/VF_MID_DIRECT_OWNER_DESCENT.lean 2>&1 | tee vf-mid-direct-owner-descent.log
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_DIRECT_ROUGH_CHILD.olean research/VF_MID_DIRECT_ROUGH_CHILD.lean 2>&1 | tee vf-mid-direct-rough-child.log
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_INTEGER_BLOCK_CAPTURE.olean research/VF_MID_INTEGER_BLOCK_CAPTURE.lean 2>&1 | tee vf-mid-integer-block-capture.log
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_LITERAL_BLOCK_CROSSING.olean research/VF_MID_LITERAL_BLOCK_CROSSING.lean 2>&1 | tee vf-mid-literal-block-crossing.log
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_SQUARE_WHEEL_BACKLOG.olean research/VF_MID_SQUARE_WHEEL_BACKLOG.lean 2>&1 | tee vf-mid-square-wheel-backlog.log
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_DYADIC_PREFIX_OWNER.olean research/VF_MID_DYADIC_PREFIX_OWNER.lean 2>&1 | tee vf-mid-dyadic-prefix-owner.log
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_DYADIC_OWNER_EXACT.olean research/VF_MID_DYADIC_OWNER_EXACT.lean 2>&1 | tee vf-mid-dyadic-owner-exact.log
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_ODD_FRACTIONAL_CLUSTER.olean research/VF_MID_ODD_FRACTIONAL_CLUSTER.lean 2>&1 | tee vf-mid-odd-fractional-cluster.log
