      - name: Audit named theorem axioms
        run: |
          cat > /tmp/PrimeFlipPNTAxioms.lean <<'LEAN'
          import «research.PRIME_FLIP_STATIC_CHRONOLOGY»
          import «research.ALL_SCALE_LI_DISPLACEMENT_REDUCTION»
