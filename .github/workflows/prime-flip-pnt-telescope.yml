name: Prime flip PNT telescope

on:
  pull_request:
    branches: [main]
    paths:
      - research/PRIME_FLIP_PNT_TELESCOPE.lean
      - research/PRIME_FLIP_STATIC_CHRONOLOGY.lean
      - research/ALL_SCALE_LI_DISPLACEMENT_REDUCTION.lean
      - research/EXACT_LI_DICKMAN_FORMAL.lean
      - research/EXACT_LI_PURE_MODEL_CLOSURE.lean
      - research/VF_MID_VON_KOCH_BRIDGE.lean
      - research/VF_MID_DIRECT_SIGNED_DYNAMICS.lean
      - FORMALIZATION_SEQUENCE.md
      - FORMALIZATION_CHECKLIST.md
      - .github/workflows/prime-flip-pnt-telescope.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify append-only formalization records
        run: |
          grep -F '## Prime-flip PNT telescope (2026-09-28; stacked on #804)' FORMALIZATION_SEQUENCE.md
          grep -F '## Prime-flip PNT telescope (2026-09-28; stacked on #804)' FORMALIZATION_CHECKLIST.md
          git rev-parse HEAD
      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Apply StrongPNT 4.24 compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py
      - name: Restore StrongPNT port build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-
            rhlean-build-${{ runner.os }}-
      - name: Audit repository assumptions
        run: bash scripts/audit_assumptions.sh
      - name: Build exact dependencies
        run: |
          lake build RHLean.Analysis.PrimeSieveAbelIdentity
          lake build RHLean.Analysis.SquareRootMiddleSequentialCoherence
          lake build RHLean.Proof.LargePrimeTerminalFlipLayers
          lake build RHLean.Proof.PrimeCombVisualizationFrames
          lake build RHLean.Proof.PrimeCombReciprocalBandCancellation
      - name: Kernel-check prime flip telescope
        run: |
          mkdir -p .lake/build/lib/lean
          set -o pipefail
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_DIRECT_SIGNED_DYNAMICS.olean research/VF_MID_DIRECT_SIGNED_DYNAMICS.lean 2>&1 | tee vf-mid-direct-signed-dynamics.log
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.PRIME_FLIP_PNT_TELESCOPE.olean research/PRIME_FLIP_PNT_TELESCOPE.lean 2>&1 | tee prime-flip-pnt.log
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.PRIME_FLIP_STATIC_CHRONOLOGY.olean research/PRIME_FLIP_STATIC_CHRONOLOGY.lean 2>&1 | tee prime-flip-static-chronology.log
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.ALL_SCALE_LI_DISPLACEMENT_REDUCTION.olean research/ALL_SCALE_LI_DISPLACEMENT_REDUCTION.lean 2>&1 | tee all-scale-li-displacement.log
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.PRIME_DENSITY_UNIVERSAL_BASELINE.olean research/PRIME_DENSITY_UNIVERSAL_BASELINE.lean 2>&1 | tee prime-density-universal-baseline.log
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.PRIME_DENSITY_LOG_TIGHTENING.olean research/PRIME_DENSITY_LOG_TIGHTENING.lean 2>&1 | tee prime-density-log-tightening.log
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.PRIME_DENSITY_PNT_LOG_BOUND.olean research/PRIME_DENSITY_PNT_LOG_BOUND.lean 2>&1 | tee prime-density-pnt-log-bound.log
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.PRIME_DENSITY_INTEGRAL_TIGHTENING.olean research/PRIME_DENSITY_INTEGRAL_TIGHTENING.lean 2>&1 | tee prime-density-integral-tightening.log
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.EXACT_LI_DICKMAN_FORMAL.olean research/EXACT_LI_DICKMAN_FORMAL.lean 2>&1 | tee exact-li-dickman-formal.log
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.EXACT_LI_PURE_MODEL_CLOSURE.olean research/EXACT_LI_PURE_MODEL_CLOSURE.lean 2>&1 | tee exact-li-pure-model-closure.log
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_VON_KOCH_BRIDGE.olean research/VF_MID_VON_KOCH_BRIDGE.lean 2>&1 | tee vf-mid-von-koch.log
      - name: Audit named theorem axioms
        run: |
          cat > /tmp/PrimeFlipPNTAxioms.lean <<'LEAN'
          import «research.PRIME_FLIP_STATIC_CHRONOLOGY»
          import «research.ALL_SCALE_LI_DISPLACEMENT_REDUCTION»
          import «research.EXACT_LI_PURE_MODEL_CLOSURE»
          import «research.VF_MID_VON_KOCH_BRIDGE»
          #print axioms RHLean.Analysis.primeFlipExactResponse_eq_pnt_add_error
          #print axioms RHLean.Analysis.primeFlipExactResponse_eq_reciprocalPrimeCounts
          #print axioms RHLean.Analysis.primeFlipPNTError_eq_reciprocalDiscrepancy
          #print axioms RHLean.Analysis.primeFlipPNTError_eq_endpointDiscrepancy_sub_mertensPNTError
          #print axioms RHLean.Analysis.squareRoot_primeFlipPNTError_eq_moebiusAtoms
          #print axioms RHLean.Analysis.primeFlipAssembledEnergy_prime_eq_pnt_add_signedEffect
          #print axioms RHLean.Analysis.primeFlipPNTReplacementSignedEffect_le_four_error_sq
          #print axioms RHLean.Analysis.primeFlipPNTReplacementSignedEffect_le_model_sq_add_eight_error_sq
          #print axioms RHLean.Analysis.primeFlipSnapshot_postRootOwner_unique
          #print axioms RHLean.Analysis.primeFlipSnapshot_tailSeat_chronology
          #print axioms RHLean.Analysis.primeFlipSnapshot_topHalf_inert
          #print axioms RHLean.Analysis.primeFlipSnapshotLateCorrection_eq_two_exactResponse
          #print axioms RHLean.Analysis.primeFlipSnapshotLateCorrection_eq_reciprocalBands
          #print axioms RHLean.Analysis.primeFlipSnapshotPNTError_eq_moebiusAtoms
          #print axioms RHLean.Analysis.primeFrequencyState_sub_eq_signedDisplacement
          #print axioms RHLean.Analysis.primeFrequencyState_squareRoot_split
          #print axioms RHLean.Analysis.allScaleLiState_squareRoot_assembled_eq_diagonal
          #print axioms RHLean.Analysis.squareRoot_primeFlipPNTError_eq_neg_centeredDisplacement
          #print axioms RHLean.Analysis.squareRoot_centeredPrimeDisplacement_eq_moebiusAtoms
          #print axioms RHLean.Analysis.squareRoot_centeredPrimeDisplacement_eq_zero_of_exactLiAllocation
          #print axioms RHLean.Analysis.squareRoot_primeFlipPNTError_eq_zero_of_exactLiAllocation
          #print axioms RHLean.Analysis.squareRootPrimeDisplacementRootBounded_of_exactLiAllocation
          #print axioms RHLean.Analysis.allScaleLiState_squareRoot_assembled_norm_sq_eq_diagonal
          #print axioms RHLean.Analysis.degreeZeroLowerMass_add_upperMass
          #print axioms RHLean.Analysis.allScaleLiSquareRootBounded_of_uniformReference_linearTransfer
          #print axioms RHLean.Analysis.complexArithmeticLogWeight_poissonLocalFactor
          #print axioms RHLean.Analysis.complexArithmeticLogWeight_poissonProduct
          #print axioms RHLean.Analysis.arithmeticPoissonProduct_logarithmic_renewal
          #print axioms RHLean.Analysis.exactLiCriticalPoissonIntegerReference_logarithmic_renewal
          #print axioms RHLean.Analysis.exactLiLogKernelDefect_nonneg
          #print axioms RHLean.Analysis.exactLiLogKernelDefect_le
          #print axioms RHLean.Analysis.exactLiCriticalLogKernelDefect_summable
          #print axioms RHLean.Analysis.exactLiCriticalLogKernel_eq_unit_add_defect
          #print axioms RHLean.Analysis.norm_exactLiCriticalLogKernelDefect_children_le
          #print axioms RHLean.Analysis.allScaleLiSquareRootBounded_of_criticalPoisson_uniform
          #print axioms RHLean.Analysis.abs_exactLiContinuousCumulative_le
          #print axioms RHLean.Analysis.exactLiContinuousModel_root_closed
          #print axioms RHLean.Analysis.vfMidPrimeLiError_eq_primeError_add_liError
          #print axioms RHLean.Analysis.vfMidLiRootBounded
          #print axioms RHLean.Analysis.vfMid_primeCounting_add_le
          #print axioms RHLean.Analysis.abs_vfMidPrimeError_sub_square_le
          #print axioms RHLean.Analysis.vfMidVonKochBounded_of_squareEndpoint
          #print axioms RHLean.Analysis.vfMidSquareEndpointVonKochBounded_iff
          #print axioms RHLean.Analysis.primeLiVonKochBounded_of_vfMidSquareEndpoint
          #print axioms RHLean.Analysis.riemannHypothesis_of_vfMidSquareEndpoint
          #print axioms RHLean.Analysis.two_log_four_le_sqrt_mul_log
          #print axioms RHLean.Analysis.primeLiVonKochBounded_of_vfMid
          #print axioms RHLean.Analysis.vfMidVonKochBounded_of_primeLi
          #print axioms RHLean.Analysis.vfMidVonKochBounded_iff_primeLiVonKochBounded
          #print axioms RHLean.Analysis.vfMidSquareEndpointVonKochBounded_iff_primeLiVonKochBounded
          #print axioms RHLean.Analysis.riemannHypothesis_of_vfMidVonKoch
          LEAN
          set -o pipefail
          lake env lean -DwarningAsError=true /tmp/PrimeFlipPNTAxioms.lean 2>&1 | tee prime-flip-pnt-axioms.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          s = Path('prime-flip-pnt-axioms.log').read_text()
          records = re.findall(r"depends on axioms:\s*\[([^\]]*)\]", s, re.S)
          assert len(records) == 51, records
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for record in records:
              actual = {a.strip() for a in record.split(',') if a.strip()}
              assert actual <= allowed, actual
          PY
      - name: Retain compiler and axiom logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prime-flip-pnt-logs
          path: |
            prime-flip-pnt*.log
            prime-flip-static-chronology.log
            all-scale-li-displacement.log
            exact-li-pure-model-closure.log
            vf-mid-von-koch.log
            vf-mid-direct-signed-dynamics.log
          if-no-files-found: ignore
