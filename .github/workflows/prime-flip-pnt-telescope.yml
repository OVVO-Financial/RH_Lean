          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_HARMAN_FOUR_FIFTHS.olean research/VF_MID_HARMAN_FOUR_FIFTHS.lean 2>&1 | tee vf-mid-harman-four-fifths.log
