name: Stable far returned-fiber check

on:
  pull_request:
    branches: [main]
    paths:
      - RHLean/Proof/StableFarWallCrossingOwnerWindow.lean
      - research/STABLE_FAR_RETURNED_FIBER_PRODUCTION.lean
      - .github/workflows/stable-far-returned-fiber.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: stable-far-returned-fiber-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Prebuild PNT+ StrongPNT dependency
        run: lake build PrimeNumberTheoremAnd.StrongPNT

      - name: Build owner-window production module
        run: lake build RHLean.Proof.StableFarWallCrossingOwnerWindow --wfail

      - name: Build RHLean modules imported by these research checks
        run: >-
          python3 scripts/compile_research_import_closure.py --library-only
          research/STABLE_FAR_RETURNED_FIBER_PRODUCTION.lean

      - name: Kernel-check returned-fiber Fubini
        run: lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.STABLE_FAR_RETURNED_FIBER_PRODUCTION.olean research/STABLE_FAR_RETURNED_FIBER_PRODUCTION.lean
