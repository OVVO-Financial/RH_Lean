name: Nyman physical tail phases
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/NYMAN_TAIL_*.lean'
      - 'scripts/lean/nyman_tail_phases/**'
      - 'scripts/nyman_tail_phase_regression.py'
      - '.github/workflows/nyman-tail-phases.yml'
permissions:
  contents: read
concurrency:
  group: nyman-tail-phases-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true
jobs:
  tail-phase-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check the head, pins, proof inventory and exact rational fixtures
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          test "$(jq -r '.packages[] | select(.name=="mathlib") | .rev' lake-manifest.json)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          python3 scripts/nyman_tail_phase_regression.py
      - uses: ./.github/actions/lean-setup
      - uses: ./.github/actions/lean-compiled-cache
      - name: Warning-fatal original-source import closure
        id: proof
        uses: ./.github/actions/research-compile
        with:
          build-library: 'true'
          targets: research/NYMAN_TAIL_PHASES.lean
      - name: Elaborate exact types and audit transitive kernel axioms
        id: audit
        run: |
          set -euo pipefail
          lake env lean -DwarningAsError=true scripts/lean/nyman_tail_phases/ExactTypes.lean 2>&1 | tee tail-types.log
          lake env lean -DwarningAsError=true --run scripts/lean/nyman_tail_phases/Audit.lean 2>&1 | tee tail-audit.log
          test "$(grep -c '^TAIL_AUDIT ' tail-audit.log)" -eq 4
      - name: Record proof diagnostics on failure
        if: failure() && steps.proof.outcome == 'failure'
        run: |
          set -eu
          for file in research/NYMAN_TAIL_{ABEL,PHASES}.lean; do
            if ! lake env lean -DwarningAsError=true "$file" >tail-diagnostics.log 2>&1; then
              python3 - <<'PY'
          from pathlib import Path
          import re
          for m in re.finditer(r'(?ms)^([^\n]+?\.lean):(\d+):(\d+): (?:error|warning)(?:\([^)\n]+\))?: (.*?)(?=^[^\n]+?\.lean:\d+:\d+: |\Z)', Path('tail-diagnostics.log').read_text()):
              print(f'::error file={m[1]},line={m[2]},col={m[3]}::' + m[4].strip().replace('%','%25').replace('\n','%0A')[:2800])
          PY
              break
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always() && (steps.proof.outcome == 'failure' || steps.audit.outcome != 'skipped')
        with:
          name: nyman-tail-phases-${{ github.event.pull_request.head.sha }}
          path: |
            tail-types.log
            tail-audit.log
            tail-diagnostics.log
          if-no-files-found: error
