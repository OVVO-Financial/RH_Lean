name: Apply exact graph filter fix

on:
  push:
    branches: [claude/rh-lean-knowledge-graph-uhooqu]
    paths:
      - 'scripts/apply_exact_graph_source_filter.py'
      - '.github/workflows/exact-graph-filter-fixup.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: claude/rh-lean-knowledge-graph-uhooqu
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/apply_exact_graph_source_filter.py

      - name: Validate Python
        run: python3 -m py_compile scripts/decl_graph.py

      - name: Commit non-workflow fix
        run: |
          set -euo pipefail
          git config user.name 'OVVO-Financial'
          git config user.email 'ovvo.financial.systems@gmail.com'
          git add scripts/decl_graph.py
          git diff --cached --check
          git commit -m 'Induce exact graph on written declarations'
          git push origin HEAD:claude/rh-lean-knowledge-graph-uhooqu
