name: Stokes zero-target covariance check

on:
  pull_request:
    branches: [main]
    paths:
      - research/GLOBAL_RETURNED_CORE_STOKES_ZERO_TARGET_COVARIANCE.lean
      - research/ZERO_TARGET_PARTIAL_MOMENT_COVARIANCE.lean
      - research/GLOBAL_RETURNED_CORE_STOKES_GLOBAL_IDENTIFICATION.lean
      - research/GLOBAL_RETURNED_CORE_SIGNED_OWNER_TELESCOPE.lean
      - .github/workflows/stokes-zero-target-covariance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Apply StrongPNT 4.24 compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py

      - name: Restore StrongPNT port build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Prebuild StrongPNT dependency
        run: lake build StrongPNT.PNT5_Strong

      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-
            rhlean-build-${{ runner.os }}-

      - name: Build Stokes algebraic dependencies
        run: |
          lake build RHLean.Proof.GlobalPrefixCarrierOthello
          lake build RHLean.Arithmetic.PrimeWheelMobiusRecovery
          lake build RHLean.Analysis.PrimeWheelConductorGram
          lake build RHLean.Analysis.PrimeWheelRawConductorCoefficient
          lake build RHLean.Analysis.PrimeWheelRawConductorWeight
          lake build RHLean.Analysis.CorrectedConductorBoundaryDefectGeneral

      - name: Emit returned-core Stokes foundations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/signed-cell-stokes-bridge.yml').read_text()
          specs = [
              ('      - name: Emit returned-core dependency foundation through owner cube\n',
               '      - name: Kernel-check exact signed Stokes algebra through natural corrected conductors\n',
               '/tmp/stokes-base.sh'),
              ('      - name: Kernel-check exact signed Stokes algebra through natural corrected conductors\n',
               '      - name: Prebuild terminal RH consumer dependencies\n',
               '/tmp/stokes-exact.sh'),
          ]
          for start_marker, end_marker, out in specs:
              block = src.split(start_marker, 1)[1].split(end_marker, 1)[0]
              block = block.split('        run: |\n', 1)[1]
              lines = []
              for line in block.splitlines():
                  if line.startswith('          '):
                      line = line[10:]
                  lines.append(line)
              Path(out).write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/stokes-base.sh
          bash /tmp/stokes-exact.sh

      - name: Kernel-check final Stokes zero-target covariance identity
        run: |
          lake env lean -DwarningAsError=true \
            research/GLOBAL_RETURNED_CORE_STOKES_ZERO_TARGET_COVARIANCE.lean
