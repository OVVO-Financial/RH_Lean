name: Explicit finite-slot amplification bounds

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'RHLean/Proof/SquareRootAmplificationPowerBounds.lean'
      - 'RHLean/Proof/SquareRootAmplificationLogGrowth.lean'
      - 'RHLean/Proof/SquareRootAncestryRoot.lean'
      - 'RHLean.lean'
      - 'research/oai_434/VF919Explicit*.lean'
      - 'research/oai_434/VF919TotalMass*.lean'
      - 'scripts/lean/explicit_amplification/**'
      - 'scripts/lean/total_mass/**'
      - '.github/workflows/explicit-slot-amplification.yml'
      - '.github/actions/lean-setup/**'
      - '.github/actions/lean-compiled-cache/**'
      - '.github/actions/research-compile/**'
      - '.github/actions/oai-434-shared-cache/**'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: explicit-amplification-${{ github.head_ref || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  explicit-amplification-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify pinned compiler and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q 'd13f23b723b8a846827a245b89c10fc7d3f11612' lakefile.lean
          git rev-parse HEAD
      - uses: ./.github/actions/lean-setup
      - name: Checkout the exact original analytic source
        uses: actions/checkout@v4
        with:
          repository: openai/math
          ref: 1581d4cbdd69a0faf34b2089614fe2a814316a6a
          path: oai-upstream
          persist-credentials: false
      - name: Restore native and unpatched Wiener shared caches
        uses: ./.github/actions/lean-compiled-cache
      - name: Verify native Wiener prerequisites
        shell: bash
        run: |
          set -euo pipefail
          lake build PrimeNumberTheoremAnd.Wiener
          test -s .lake/packages/PrimeNumberTheoremAnd/.lake/build/lib/lean/PrimeNumberTheoremAnd/Wiener.olean
      - name: Compile the native arithmetic and amplification import closure
        uses: ./.github/actions/research-compile
        with:
          build-library: 'true'
          targets: >-
            research/VF_919_SEVEN_EIGHTHS_SIGNED_COVARIANCE_20261019.lean
            research/VF_919_SEVEN_EIGHTHS_SQUARE_SHELL_BRIDGE_20261019.lean
            research/CORR4_OAI_POWER_GUIDEPOST_20261024.lean
            research/NATIVE_OWNER_PREFIX_MERTENS_20261021.lean
            research/VF_919_OAI_ACTUAL_MARKED_FOURTH_REAL_NNS_20261021.lean
            research/VF_919_RESONANT_FIBER_NNS_RECOMBINATION_20261022.lean
      - name: Restore source-pinned original analytic shared cache
        id: oai_cache
        uses: ./.github/actions/oai-434-shared-cache
      - name: Compile original analytic prerequisites on cache miss
        if: ${{ steps.oai_cache.outputs.complete != 'true' }}
        shell: bash
        working-directory: oai-upstream/lean
        run: |
          set -euo pipefail
          lake build OAI.NumberTheory.DirichletL.Detector.FinalAssemblyUnconditional
      - name: Verify shared package identity and original source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C oai-upstream rev-parse HEAD)" = '1581d4cbdd69a0faf34b2089614fe2a814316a6a'
          python3 scripts/check_shared_lean_packages.py . oai-upstream/lean PrimeNumberTheoremAnd mathlib
      - name: Kernel-check finite source, exact amplification, types and axioms
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/lean/explicit_amplification/run.sh "$PWD"
      - name: Preserve exact proof evidence
        if: ${{ !cancelled() && steps.proof.outcome != 'skipped' && steps.proof.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: explicit-amplification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            anchored-tilt-generation.json
            total-mass-lean.log
            total-mass-audit.log
            total-mass-inventory.log
            explicit-amplification-lean.log
            explicit-amplification-audit.log
            explicit-amplification-inventory.log
            explicit-amplification-inventory.json
            RHLean/Proof/SquareRootAmplificationPowerBounds.lean
            research/oai_434/VF919Explicit*.lean
            scripts/lean/explicit_amplification/
          if-no-files-found: error
          retention-days: 30
