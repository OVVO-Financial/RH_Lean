name: Agent one-shot Lean patch

on:
  push:
    branches: [agent/native-pnt-proof-continuation]
    paths:
      - '.github/workflows/agent-patch.yml'
      - 'RHLean/Analysis/NativePNTMobiusSecondMoment.lean'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-pnt-proof-continuation
          fetch-depth: 0
      - name: Apply exact compiler fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('RHLean/Analysis/NativePNTMobiusSecondMoment.lean')
          text = path.read_text()
          old = "            simpa using nativeLogRecipMass_succ 2\n"
          new = "            convert nativeLogRecipMass_succ 2 using 1 <;> norm_num\n"
          assert old in text, 'target not found'
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RHLean/Analysis/NativePNTMobiusSecondMoment.lean
          git commit -m 'Normalize reciprocal-log endpoint increment'
          git push origin HEAD:agent/native-pnt-proof-continuation
