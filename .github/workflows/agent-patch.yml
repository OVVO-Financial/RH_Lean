name: Agent one-shot Lean patch

on:
  push:
    branches: [agent/native-pnt-proof-continuation]
    paths:
      - '.github/workflows/agent-patch.yml'
      - '.github/agent_patch.py'
      - 'RHLean/Analysis/NativePNTErdosContraction.lean'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-pnt-proof-continuation
          fetch-depth: 0
      - name: Apply proof patch
        run: python3 .github/agent_patch.py
      - name: Commit patch if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- RHLean/Analysis/NativePNTErdosContraction.lean; then
            git add RHLean/Analysis/NativePNTErdosContraction.lean
            git commit -m 'Add native PNT quotient-fibre bridge'
            git push origin HEAD:agent/native-pnt-proof-continuation
          fi
