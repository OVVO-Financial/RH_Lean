name: Agent one-shot Lean patch

on:
  push:
    branches: [agent/native-pnt-proof-continuation]
    paths:
      - '.github/workflows/agent-patch.yml'
      - '.github/agent_patch.py'
      - 'RHLean/Analysis/NativePNTSummatorySelberg.lean'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-pnt-proof-continuation
          fetch-depth: 0
      - name: Apply compiler fix
        run: python3 .github/agent_patch.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RHLean/Analysis/NativePNTSummatorySelberg.lean
          git commit -m 'Use ring normalization in Selberg remainder split'
          git push origin HEAD:agent/native-pnt-proof-continuation
