name: Agent one-shot Lean patch

on:
  push:
    branches: [agent/native-pnt-proof-continuation]
    paths:
      - '.github/workflows/agent-patch.yml'
      - '.github/agent_patch.py'
      - 'RHLean.lean'
      - 'RHLean/Analysis/NativePNTErdosContraction.lean'
      - 'RHLean/Analysis/NativePNTAxer.lean'
      - 'RHLean/Analysis/NativePNTTransfer.lean'
      - 'RHLean/Analysis/NativePNTQuantitativeStatements.lean'

permissions:
  actions: write
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-pnt-proof-continuation
          fetch-depth: 0
      - name: Apply proof patch
        run: python3 .github/agent_patch.py
      - name: Commit patch if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RHLean.lean RHLean/Analysis/NativePNTErdosContraction.lean RHLean/Analysis/NativePNTAxer.lean RHLean/Analysis/NativePNTTransfer.lean
          if [ -f RHLean/Analysis/NativePNTQuantitativeStatements.lean ]; then
            git add RHLean/Analysis/NativePNTQuantitativeStatements.lean
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update native PNT proof layer'
            git push origin HEAD:agent/native-pnt-proof-continuation
          fi
      - name: Dispatch hosted Lean build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run lean.yml --ref agent/native-pnt-proof-continuation
