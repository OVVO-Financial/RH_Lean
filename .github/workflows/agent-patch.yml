name: Agent one-shot Lean patch

on:
  push:
    branches: [agent/good-mass-charge-attack]
    paths:
      - '.github/workflows/agent-patch.yml'
      - '.github/agent_patch.py'
      - '.github/good_mass_append.leanfrag'

permissions:
  actions: write
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/good-mass-charge-attack
          fetch-depth: 0
      - name: Apply proof patch
        run: python3 .github/agent_patch.py
      - name: Commit patch if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RHLean/Analysis/PrimeSievePNTGoodMassChargeAttack.lean
          if ! git diff --cached --quiet; then
            git commit -m 'Extend good-mass charge attack'
            git push origin HEAD:agent/good-mass-charge-attack
          fi
      - name: Dispatch hosted Lean build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run lean.yml --ref agent/good-mass-charge-attack
