name: Agent one-shot Lean patch

on:
  push:
    branches: [agent/native-pnt-proof-continuation]
    paths:
      - '.github/workflows/agent-patch.yml'
      - 'RHLean/Analysis/NativePNTMobiusSecondMoment.lean'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-pnt-proof-continuation
          fetch-depth: 0

      - name: Apply exact compiler fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('RHLean/Analysis/NativePNTMobiusSecondMoment.lean')
          text = path.read_text()

          old1 = '''      _ = Real.log (2 : ℝ) / 2 + Real.log (3 : ℝ) / 3 := by
            rw [hmass1]
            ring
'''
          new1 = '''      _ = Real.log (2 : ℝ) / 2 + Real.log (3 : ℝ) / 3 := by
            rw [hmass1]
            norm_num
'''

          old2 = '''            exact mul_le_of_le_one_left hdiff (abs_nonneg _) hp
'''
          new2 = '''            exact mul_le_of_le_one_left hdiff hp
'''

          assert old1 in text, 'first target not found'
          assert old2 in text, 'second target not found'
          text = text.replace(old1, new1, 1).replace(old2, new2, 1)
          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RHLean/Analysis/NativePNTMobiusSecondMoment.lean
          git diff --cached --quiet && exit 0
          git commit -m 'Finish second Mobius moment compiler fixes'
          git push origin HEAD:agent/native-pnt-proof-continuation
