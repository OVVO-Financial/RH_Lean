name: Agent one-shot Lean patch

on:
  push:
    branches: [agent/native-pnt-proof-continuation]
    paths:
      - '.github/workflows/agent-patch.yml'
      - 'RHLean/Analysis/NativePNTMobiusSecondMoment.lean'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-pnt-proof-continuation
          fetch-depth: 0
      - name: Apply exact compiler fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('RHLean/Analysis/NativePNTMobiusSecondMoment.lean')
          text = path.read_text()
          old = "  have hmass3 :\n      nativeLogRecipMass 3 =\n        Real.log (2 : ℝ) / 2 + Real.log (3 : ℝ) / 3 := by\n    calc\n      nativeLogRecipMass 3 =\n          nativeLogRecipMass 2 + Real.log (3 : ℝ) / 3 := by\n            convert nativeLogRecipMass_succ 2 using 1 <;> norm_num\n      _ = (nativeLogRecipMass 1 + Real.log (2 : ℝ) / 2) +\n            Real.log (3 : ℝ) / 3 := by\n            rw [nativeLogRecipMass_succ 1]\n      _ = Real.log (2 : ℝ) / 2 + Real.log (3 : ℝ) / 3 := by\n            rw [hmass1]\n            norm_num\n"
          new = "  have hmass2 : nativeLogRecipMass 2 = Real.log (2 : ℝ) / 2 := by\n    rw [nativeLogRecipMass_succ 1, hmass1]\n    norm_num\n  have hmass3 :\n      nativeLogRecipMass 3 =\n        Real.log (2 : ℝ) / 2 + Real.log (3 : ℝ) / 3 := by\n    rw [nativeLogRecipMass_succ 2, hmass2]\n    norm_num\n"
          assert old in text, 'target block not found'
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RHLean/Analysis/NativePNTMobiusSecondMoment.lean
          git commit -m 'Normalize reciprocal-log masses at two and three'
          git push origin HEAD:agent/native-pnt-proof-continuation
