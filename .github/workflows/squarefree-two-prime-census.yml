name: Squarefree two-prime census check

on:
  push:
    branches: [agent/weighted-othello-stokes]
  pull_request:
    branches: [main]
    paths:
      - research/GLOBAL_RETURNED_CORE_SQUAREFREE_TWO_PRIME_CENSUS.lean
      - .github/workflows/squarefree-two-prime-census.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Build squarefree Mobius support dependency
        run: lake build RHLean.Analysis.PrimeWheelRunOthelloBoundary
      - name: Kernel-check exact squarefree two-prime census
        run: |
          mkdir -p .lake/build/lib/lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.GLOBAL_RETURNED_CORE_SQUAREFREE_TWO_PRIME_CENSUS.olean \
            research/GLOBAL_RETURNED_CORE_SQUAREFREE_TWO_PRIME_CENSUS.lean
