name: Mertens weighted covariance RH criterion

on:
  pull_request:
    paths:
      - 'research/MERTENS_WEIGHTED_COVARIANCE_RH.lean'
      - 'research/MERTENS_WEIGHTED_COVARIANCE_RH.md'
      - '.github/workflows/mertens-weighted-covariance-rh.yml'
      - 'RHLean/Analysis/DeterministicTGreenKuboComparison.lean'
      - 'RHLean/Analysis/MathlibMertensHook.lean'
      - 'research/MERTENS_CONVERSE_*.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: weighted-covariance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  weighted-covariance-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lean-setup
      - name: Restore PNT+ dependency artifacts
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Restore native library artifacts
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
      - name: Build RHLean modules imported by these research checks
        run: >-
          python3 scripts/compile_research_import_closure.py --library-only
          research/MERTENS_WEIGHTED_COVARIANCE_RH.lean
      - name: Compile exact imported Lean closure (warnings fatal)
        uses: ./.github/actions/research-compile
        with:
          targets: research/MERTENS_WEIGHTED_COVARIANCE_RH.lean
      - name: Native theorem and standard-axiom audit
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -DwarningAsError=true research/MERTENS_WEIGHTED_COVARIANCE_RH.lean 2>&1 | tee weighted-covariance-axioms.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path('research/MERTENS_WEIGHTED_COVARIANCE_RH.lean').read_text()
          expected = re.findall(r'^#print axioms\s+(\S+)', source, re.M)
          lines = Path('weighted-covariance-axioms.log').read_text()
          actual = re.findall(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]", lines)
          assert len(expected) >= 6, expected
          assert set(name for name, _ in actual) == set(expected), (expected, actual)
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for name, axioms in actual:
              found = {v.strip() for v in axioms.split(',') if v.strip()}
              assert found <= allowed, (name, found - allowed)
          print('PASS: weighted-covariance native acceptance axiom audit.')
          PY
