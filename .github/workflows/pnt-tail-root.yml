name: PNT tail root regeneration

on:
  push:
    branches: [agent/native-pnt-effective-contraction]
    paths:
      - '.github/workflows/pnt-tail-root.yml'
      - 'RHLean/Analysis/NativePNTSquarePrefixTail*.lean'

permissions:
  contents: write

jobs:
  root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-pnt-effective-contraction
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          mk_all-check: false
      - name: Regenerate root manifest
        run: lake exe mk_all
      - name: Commit root manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RHLean.lean
          if ! git diff --cached --quiet; then
            git commit -m 'Import PNT tail contraction modules'
            git push origin HEAD:agent/native-pnt-effective-contraction
          fi
