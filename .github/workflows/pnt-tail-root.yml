name: PNT tail root regeneration

on:
  push:
    branches: [agent/state-dependent-selberg-positive-gain]
    paths:
      - '.github/workflows/pnt-tail-root.yml'
      - 'RHLean/Analysis/NativePNTCubicContractionInequality.lean'
      - 'RHLean/Analysis/PrimeSieveStateDependentSelbergPositiveGain.lean'
      - 'RHLean/Analysis/PrimeSieveStateDependentSelbergPositiveGainCore.lean'
      - 'RHLean/Analysis/PrimeSieveStateDependentSelbergPositiveGainClosure.lean'
      - 'RHLean/Analysis/PrimeSieveStateDependentSelbergPositiveGainTrajectoryCore.lean'
      - 'RHLean/Analysis/PrimeSieveStateDependentSelbergPositiveGainCubicBudget.lean'

permissions:
  contents: write

jobs:
  root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/state-dependent-selberg-positive-gain
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          mk_all-check: false
      - name: Regenerate root manifest
        run: |
          set +e
          lake exe mk_all
          set -e
      - name: Commit root manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RHLean.lean
          if ! git diff --cached --quiet; then
            git commit -m 'Import state-dependent positive gain package'
            git push origin HEAD:agent/state-dependent-selberg-positive-gain
          fi
