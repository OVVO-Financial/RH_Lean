name: Dyadic long-range tether audit

on:
  pull_request:
    branches: [agent/post-769-dyadic-joint-packet]
    paths:
      - research/DYADIC_LONG_RANGE_TETHER_AUDIT.lean
      - .github/workflows/dyadic-long-range-tether-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Restore PNT+ build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Prebuild PNT+ StrongPNT dependency
        run: lake build PrimeNumberTheoremAnd.StrongPNT

      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-

      - name: Build RHLean modules imported by these research checks
        run: >-
          python3 scripts/compile_research_import_closure.py --library-only
          research/DYADIC_LONG_RANGE_TETHER_AUDIT.lean
          research/DYADIC_SMOOTH_HIGH_JOINT_PACKET.lean

      - name: Build transport dependencies
        run: |
          lake build RHLean.Analysis.SquareRootTransportTopFibreNoGo
          mkdir -p .lake/build/lib/lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.DYADIC_SMOOTH_HIGH_JOINT_PACKET.olean \
            research/DYADIC_SMOOTH_HIGH_JOINT_PACKET.lean

      - name: Kernel-check long-range tether audit
        run: lake env lean -DwarningAsError=true research/DYADIC_LONG_RANGE_TETHER_AUDIT.lean
