name: Wheel to ledger equivariance development gate

on:
  push:
    branches: [agent/wheel-to-ledger-equivariance]
    paths:
      - 'RHLean/Proof/WheelToLedgerEquivariance.lean'
      - 'RHLean/Proof/WheelToLedgerPushforward.lean'
      - '.github/workflows/wheel-to-ledger-equivariance-dev.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wheel-to-ledger-equivariance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wheel-to-ledger-equivariance

      - name: Restore Mathlib and dependency builds
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Set up Lean and Mathlib
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Build transport seam
        run: lake build RHLean.Proof.WheelToLedgerPushforward

      - name: Regenerate root manifest
        shell: bash
        run: |
          set -euo pipefail
          lake exe mk_all
          git diff --check
          changed="$(git diff --name-only)"
          if [ "$changed" != "RHLean.lean" ]; then
            echo "Unexpected generated changes:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Publish root manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- RHLean.lean
          git diff --cached --check
          git commit -m 'Regenerate root manifest for wheel-to-ledger seam'
          git push origin HEAD:agent/wheel-to-ledger-equivariance
