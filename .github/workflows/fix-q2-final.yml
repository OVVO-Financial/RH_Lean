name: Fix q2 final synthesis

on:
  push:
    branches:
      - agent/q2-bookkeeping-synthesis

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/q2-bookkeeping-synthesis
      - name: Apply exact repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('RHLean/Proof/PhysicalQ2TerminalSynthesis.lean')
          s = p.read_text()
          old = "  have hlambda : 0 ≤ lambda := by\n    dsimp [lambda]\n    positivity\n"
          new = "  have hlambda : 0 ≤ lambda := by\n    dsimp [lambda]\n    exact mul_nonneg (by norm_num) elevenWeightOneEnergyFactor_nonneg\n"
          assert old in s
          s = s.replace(old, new, 1)
          old = "    _ = (((z : ℚ) ^ 2 : ℚ) : ℝ) := by\n      norm_num [pow_two]\n"
          new = "    _ = (((z : ℚ) ^ 2 : ℚ) : ℝ) := by\n      push_cast\n      rw [pow_two]\n"
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          p = Path('RHLean/Proof/PhysicalQ2BookkeepingSynthesis.lean')
          s = p.read_text()
          old = "    | some p =>\n        have hpr : p = r := by simpa [ho] using h\n        simpa [ho, hpr]\n"
          new = "    | some p =>\n        simp [ho] at h\n        subst p\n        exact ho\n"
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RHLean/Proof/PhysicalQ2TerminalSynthesis.lean RHLean/Proof/PhysicalQ2BookkeepingSynthesis.lean
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Finish q2 synthesis elaboration cleanup'
          git push origin HEAD:agent/q2-bookkeeping-synthesis
