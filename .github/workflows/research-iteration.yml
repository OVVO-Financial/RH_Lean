name: Targeted Lean iteration

on:
  workflow_dispatch:
    inputs:
      targets:
        description: Space-separated research/*.lean files to compile at the selected branch
        required: true
        default: research/VF_MID_LI_UNIFORM_QUADRATURE.lean
        type: string
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      # Compile new/modified research proof files on draft PRs.
      - 'research/*.lean'
      - 'research/**/*.lean'
      - '.github/actions/**'
      - '.github/workflows/research-iteration.yml'
      - 'scripts/compile_research_import_closure.py'
      - 'scripts/test_research_compile.py'
      - 'scripts/repo_index.py'
      - 'scripts/rhlean_kg.py'

permissions:
  contents: read

concurrency:
  group: research-iteration-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      # Compute exact changed proof targets before expensive dependency setup.
      - name: Choose changed research Lean targets
        id: targets
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MANUAL_TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            if [[ ! "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'Missing valid PR base SHA.' >&2
              exit 1
            fi
            if ! git cat-file -e "$PR_BASE_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
            fi
            git diff --name-only --diff-filter=ACMR "$PR_BASE_SHA" HEAD -- research/ > /tmp/research-target-changes.txt
            # These OAI-dependent files are checked by the dedicated combined-
            # environment gates. The common-probe file is compiled AND audited
            # by vf919-oai-certified-core-434.yml with warnings fatal.
            # This routing is not proof acceptance or an exemption from that gate.
            if grep -qx 'research/VF_919_COMMON_PROBE_SEVEN_EIGHTHS_20261020.lean' /tmp/research-target-changes.txt; then
              grep -q 'research/VF_919_COMMON_PROBE_SEVEN_EIGHTHS_20261020.lean' .github/workflows/vf919-oai-certified-core-434.yml
              echo 'Common-probe theorem: mandatory LOW/HIGH combined-environment gate.' >> "$GITHUB_STEP_SUMMARY"
            fi
            changed="$(grep -E '^research/.+[.]lean$' /tmp/research-target-changes.txt | grep -vE '^research/(oai_434/|VF_919_COMMON_PROBE_SEVEN_EIGHTHS_20261020[.]lean$|VF_919_OPENAI_434_UNCONDITIONAL_SQUARE_BLOCK_COVARIANCE_20261019[.]lean$|VF_919_OPENAI_CERTIFIED_ORIGINAL_SQUARE_COVARIANCE_20261019[.]lean$)' | sort -u | paste -sd ' ' - || true)"
            targets="$changed"
            if [[ -z "$targets" ]]; then
              targets="research/VF_MID_LI_UNIFORM_QUADRATURE.lean"
            fi
          else
            targets="$MANUAL_TARGETS"
          fi
          if [[ -z "$targets" ]]; then
            echo 'No research Lean target provided.' >&2
            exit 1
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Selected Lean research targets: $targets"
          echo "### Research Lean targets" >> "$GITHUB_STEP_SUMMARY"
          echo "$targets" >> "$GITHUB_STEP_SUMMARY"

      - name: Check research cache regressions
        run: python3 -m unittest discover -s scripts -p test_research_compile.py -v
      - name: Set up Lean and cached Mathlib
        uses: ./.github/actions/lean-setup
      - name: Restore PNT+ build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Restore native library artifacts
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
      - name: Compile selected research closure with warnings fatal
        uses: ./.github/actions/research-compile
        with:
          targets: ${{ steps.targets.outputs.targets }}
      # A second compiler pass must reuse exactly this PR's selected targets.
      - name: Verify selected closure reuses compiled artifacts
        if: github.event_name == 'pull_request'
        env:
          RHLEAN_RESEARCH_TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          set -euo pipefail
          read -r first_target _ <<< "$RHLEAN_RESEARCH_TARGETS"
          touch "$first_target"
          python3 scripts/compile_research_import_closure.py | tee research-cache-smoke.log
          grep -q 'compiled=0 cached=' research-cache-smoke.log
