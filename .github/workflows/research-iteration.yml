name: Targeted Lean iteration

on:
  workflow_call:
    inputs:
      targets:
        description: Changed research entry points selected by the source audit
        required: true
        type: string
  workflow_dispatch:
    inputs:
      targets:
        description: Space-separated research/*.lean files to compile at the selected branch
        required: true
        default: research/VF_MID_LI_UNIFORM_QUADRATURE.lean
        type: string

permissions:
  contents: read

concurrency:
  group: research-iteration-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      # PR target selection happens in the cheap parent audit. This workflow
      # is reusable/manual so it cannot race the full build independently.
      - name: Resolve research Lean targets
        id: targets
        shell: bash
        env:
          RHLEAN_RESEARCH_TARGETS: ${{ inputs.targets }}
        run: |
          python3 - <<'PY'
          import os
          targets = ' '.join(os.environ['RHLEAN_RESEARCH_TARGETS'].split())
          if not targets:
              raise SystemExit('No research Lean target provided.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'targets={targets}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'### Research Lean targets\n{targets}\n')
          print(f'Selected Lean research targets: {targets}')
          PY

      - name: Check research cache regressions
        run: python3 -m unittest discover -s scripts -p test_research_compile.py -v
      - name: Set up Lean and cached Mathlib
        uses: ./.github/actions/lean-setup
      - name: Restore PNT+ build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Restore native library artifacts
        id: preflightcache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-preflight-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
            rhlean-preflight-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      - name: Compile selected research closure with warnings fatal
        id: compile
        uses: ./.github/actions/research-compile
        with:
          targets: ${{ steps.targets.outputs.targets }}
      # This large, independent supplier batch otherwise reveals only one
      # linter diagnostic per cold runner. This bounded pass is diagnostic
      # only: the original warning-fatal step stays failed, no research
      # certificate is emitted, and the full native build remains blocked.
      - name: Collect independent CM supplier diagnostics after failure
        if: >-
          failure() && steps.compile.outcome == 'failure' &&
          contains(inputs.targets, 'research/ALPOGE_CM_SEED_SERRE_MASS_AUDIT_20261123.lean')
        timeout-minutes: 16
        run: |
          python3 - <<'PY'
          import json
          import os
          import signal
          import subprocess
          from pathlib import Path

          plan = json.loads(Path('/tmp/rhlean-research-plan.json').read_text())
          targets = list(plan['library'])
          if not targets or len(targets) > 24:
              raise SystemExit('Unexpected CM diagnostic target set')
          print('DIAGNOSTIC ONLY; REQUIRED PREFLIGHT REMAINS FAILED', flush=True)
          process = subprocess.Popen(['lake', 'build', *targets], start_new_session=True)
          try:
              process.wait(timeout=900)
          except subprocess.TimeoutExpired:
              os.killpg(process.pid, signal.SIGTERM)
              try:
                  process.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  os.killpg(process.pid, signal.SIGKILL)
                  process.wait()
              print('CM diagnostic time limit reached', flush=True)
          raise SystemExit(1)
          PY
      # A second compiler pass must reuse exactly this PR's selected targets.
      - name: Verify selected closure reuses compiled artifacts
        if: github.event_name == 'pull_request'
        env:
          RHLEAN_RESEARCH_TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          set -euo pipefail
          read -r first_target _ <<< "$RHLEAN_RESEARCH_TARGETS"
          touch "$first_target"
          python3 scripts/compile_research_import_closure.py | tee research-cache-smoke.log
          grep -q 'compiled=0 cached=' research-cache-smoke.log

      # Preserve completed native prerequisites for both the next stage and
      # a repair iteration. The key is distinct from a complete root build.
      - name: Save completed native prerequisites
        if: >-
          !cancelled() && steps.preflightcache.outcome == 'success' &&
          steps.compile.outcome != 'skipped' &&
          steps.preflightcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .lake/build
          key: ${{ steps.preflightcache.outputs.cache-primary-key }}
