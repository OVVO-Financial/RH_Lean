name: Uniform completed Euler coefficients Lean

on:
  pull_request:
    paths:
      - "research/EULER_UNIFORM_COMPLETED_COEFFICIENTS_20261030.lean"
      - ".github/workflows/euler-uniform-completed-coefficients.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Lean and cached Mathlib
        uses: ./.github/actions/lean-setup
      - name: Restore PNT+ build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Prebuild PNT+ StrongPNT
        run: lake build PrimeNumberTheoremAnd.StrongPNT
      - name: Restore native library build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      - name: Compile exact research import closure with warnings fatal
        run: |
          python3 scripts/compile_research_import_closure.py --build-library \
            research/EULER_UNIFORM_COMPLETED_COEFFICIENTS_20261030.lean
      - name: Audit exact theorem types and axioms
        run: |
          cat > /tmp/euler_uniform_coeff_axioms.lean <<'EOF'
          import «research.EULER_UNIFORM_COMPLETED_COEFFICIENTS_20261030»
          #check RHLean.Proof.eulerCompletedProductCoeff_twice_eq_convolution
          #check RHLean.Proof.eulerCompletedProductCoeff_double
          #check RHLean.Proof.eulerPhysicalOddPacket_uniform
          #check RHLean.Proof.eulerPhysicalOddPacket_uniform_energy
          #print axioms RHLean.Proof.eulerCompletedProductCoeff_twice_eq_convolution
          #print axioms RHLean.Proof.eulerCompletedProductCoeff_double
          #print axioms RHLean.Proof.eulerPhysicalOddPacket_uniform
          #print axioms RHLean.Proof.eulerPhysicalOddPacket_uniform_energy
          EOF
          lake env lean -DwarningAsError=true /tmp/euler_uniform_coeff_axioms.lean | tee /tmp/euler_uniform_coeff_axioms.log
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path('/tmp/euler_uniform_coeff_axioms.log').read_text()
          assert 'sorryAx' not in log
          found = re.findall(r'depends on axioms:\s*\[([^]]*)\]', log, re.S)
          assert len(found) >= 4
          for item in found:
              used = {a.strip() for a in item.split(',') if a.strip()}
              assert used <= {'propext', 'Classical.choice', 'Quot.sound'}, used
          src = pathlib.Path('research/EULER_UNIFORM_COMPLETED_COEFFICIENTS_20261030.lean').read_text()
          src = re.sub(r'/-.*?-/', '', src, flags=re.S)
          src = re.sub(r'--.*', '', src)
          assert not re.search(r'\b(sorry|admit|axiom|native_decide)\b', src)
          print('PASS standard axioms and no proof holes')
          PY
