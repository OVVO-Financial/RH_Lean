name: Path 2 direct source transport (not a 7/8 certificate)

on:
  pull_request:
    paths:
      - 'research/VF_919_PATH2_FIXED_DIPOLE_TRANSPORT_20261020.lean'
      - 'research/VF_919_PATH2_FINITE_COFACTOR_ASSEMBLY_20261020.lean'
      - 'scripts/vf919_path2_transport_regression.py'
      - '.github/workflows/vf919-path2-direct-transport.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vf919-path2-transport-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-source-identities:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Require the actual pinned native compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.34.1'
      - uses: ./.github/actions/lean-setup
      - name: Kernel check the direct transport with warnings fatal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/research
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research/VF_919_PATH2_FIXED_DIPOLE_TRANSPORT_20261020.olean \
            research/VF_919_PATH2_FIXED_DIPOLE_TRANSPORT_20261020.lean | tee /tmp/path2-transport-axioms.txt
          if test -f research/VF_919_PATH2_FINITE_COFACTOR_ASSEMBLY_20261020.lean; then
            lake env lean -DwarningAsError=true \
              research/VF_919_PATH2_FINITE_COFACTOR_ASSEMBLY_20261020.lean | tee -a /tmp/path2-transport-axioms.txt
          fi
          if grep -E 'sorryAx|admitAx' /tmp/path2-transport-axioms.txt; then exit 1; fi
      - name: Reject forbidden proof shortcuts and run arithmetic regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          files = sorted(pathlib.Path('research').glob('VF_919_PATH2_*.lean'))
          forbidden = re.compile(r'\b(sorry|admit|axiom)\b|FinalAssemblyUnconditional|MERTENS_CONVERSE|riemannZeta_ne_zero_of_seven_eighths_lt_re')
          for path in files:
              source = path.read_text()
              source = re.sub(r'/\*.*?\*/', '', source, flags=re.S)
              source = re.sub(r'/-.*?-/', '', source, flags=re.S)
              source = re.sub(r'--[^\n]*', '', source)
              if forbidden.search(source):
                  raise SystemExit(f'Forbidden proof shortcut in {path}')
          print('PASS: no admitted proofs or imported terminal zero-free/converse shortcuts')
          PY
          if test -f scripts/vf919_path2_transport_regression.py; then
            python3 scripts/vf919_path2_transport_regression.py
          fi
