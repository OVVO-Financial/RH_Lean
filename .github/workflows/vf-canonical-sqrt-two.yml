name: Canonical VF sqrt2 full autopsy and all-real Li O(1)

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/VF_CANONICAL_*.lean'
      - 'research/VF_CANONICAL_*.md'
      - 'scripts/vf_canonical_definition_autopsy.py'
      - 'scripts/VFMidAlignedStepGraph/compare_canonical_pi_li.py'
      - 'README.md'
      - 'AGENTS.md'
      - 'CURRENT_PROOF_CONTRACT.md'
      - 'docs/DOCUMENTATION_INDEX.md'
      - 'RESEARCH_ROUTE_REGISTRY.md'
      - '.github/workflows/vf-canonical-sqrt-two.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-vf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  definition-autopsy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Audit all definitions and canonical phase migration
        run: |
          python3 -B scripts/vf_canonical_definition_autopsy.py \
            --json vf-canonical-definitions.json \
            --markdown vf-canonical-definitions.md \
            --strict
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-vf-definition-autopsy
          path: |
            vf-canonical-definitions.json
            vf-canonical-definitions.md

  genuine-primes-vs-li:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exhaustive genuine-prime VF/Li2/standard-li comparison
        run: |
          python3 -B scripts/VFMidAlignedStepGraph/compare_canonical_pi_li.py \
            --r-max 10000 --integer-max 1000000 \
            --json-out canonical-vf-prime-comparison.json \
            > /tmp/canonical-vf-prime-comparison.stdout
          python3 - <<'PY'
          import json
          j=json.load(open("canonical-vf-prime-comparison.json"))
          print("Square roots:", j["square_endpoints"])
          print("Every integer through 1e6:", j["integer_cutoffs"])
          for k in ("4","9","317","10000","100489","1000000","100000000"):
              print(k, j["examples"][k])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-vf-vs-genuine-prime-li
          path: canonical-vf-prime-comparison.json

  all-real-quadrature:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Lean and Mathlib
        uses: ./.github/actions/lean-setup
      - name: Build RHLean modules imported by these research checks
        run: >-
          python3 scripts/compile_research_import_closure.py --library-only
          research/VF_CANONICAL_ALL_REAL_LI_O_ONE.lean
          research/VF_MID_LI_UNIFORM_QUADRATURE.lean
          research/VF_MID_VON_KOCH_BRIDGE.lean
      - name: Compile original quadrature and NEW all-real O(1) proof
        run: |
          mkdir -p .lake/build/lib/lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.VF_MID_VON_KOCH_BRIDGE.olean \
            research/VF_MID_VON_KOCH_BRIDGE.lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.VF_MID_LI_UNIFORM_QUADRATURE.olean \
            research/VF_MID_LI_UNIFORM_QUADRATURE.lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.VF_CANONICAL_ALL_REAL_LI_O_ONE.olean \
            research/VF_CANONICAL_ALL_REAL_LI_O_ONE.lean
      - name: Lean declaration and standard-axiom audit
        run: |
          cat > /tmp/VFCanonicalAllRealAudit.lean <<'LEAN'
          import «research.VF_CANONICAL_ALL_REAL_LI_O_ONE»
          #check RHLean.Analysis.abs_vfMidLiError_le_uniform_allReal
          #check RHLean.Analysis.vfMidLiAllRealUniformBounded
          #print axioms RHLean.Analysis.abs_vfMidLiError_le_uniform_allReal
          #print axioms RHLean.Analysis.vfMidLiAllRealUniformBounded
          LEAN
          lake env lean -DwarningAsError=true /tmp/VFCanonicalAllRealAudit.lean

  canonical-vf-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Lean and cached Mathlib
        uses: ./.github/actions/lean-setup
      - name: Build RHLean modules imported by these research checks
        run: >-
          python3 scripts/compile_research_import_closure.py --library-only
          research/VF_CANONICAL_ALL_REAL_LI_O_ONE.lean
          research/VF_CANONICAL_SQRT_TWO.lean
          research/VF_CANONICAL_SQRT_TWO_VON_KOCH.lean
      - name: Strict native and research import-closure compile
        run: |
          python3 scripts/compile_research_import_closure.py --build-library \
            research/VF_CANONICAL_SQRT_TWO.lean \
            research/VF_CANONICAL_SQRT_TWO_VON_KOCH.lean
      - name: Ensure no admitted holes or project axioms
        run: |
          if grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' \
               research/VF_CANONICAL_ALL_REAL_LI_O_ONE.lean \
               research/VF_CANONICAL_SQRT_TWO.lean \
               research/VF_CANONICAL_SQRT_TWO_VON_KOCH.lean; then
            echo "Proof holes or explicit axioms forbidden"
            exit 1
          fi
          cat >/tmp/VFCanonicalKernelAudit.lean <<'LEAN'
          import «research.VF_CANONICAL_SQRT_TWO_VON_KOCH»
          #check RHLean.Analysis.vfCanonical_sq
          #check RHLean.Analysis.vfCanonicalFinishedMass_succ
          #check RHLean.Analysis.abs_vfCanonicalLiError_le_uniform_allReal
          #check RHLean.Analysis.vfCanonicalSquareDefect_succ
          #check RHLean.Analysis.vfCanonicalSquareDefect_sq_eq_legacy_cross_corrected
          #check RHLean.Analysis.vfCanonicalSquareDefect_interval_eq_legacy
          #check RHLean.Analysis.vfCanonicalIntegerLevel_succ_real
          #check RHLean.Analysis.vfCanonicalIntegerBacklog_eq_neg_defect_sub_rounding
          #check RHLean.Analysis.vfCanonicalPrimeError_abs_le_primeLi_abs_add_uniform
          #check RHLean.Analysis.vfCanonicalUpperLeftPhase_li_uniform
          #print axioms RHLean.Analysis.abs_vfCanonicalLiError_le_uniform_allReal
          #print axioms RHLean.Analysis.vfCanonicalSquareDefect_succ
          #print axioms RHLean.Analysis.vfCanonicalSquareDefect_sq_eq_legacy_cross_corrected
          #print axioms RHLean.Analysis.vfCanonicalIntegerBacklog_eq_neg_defect_sub_rounding
          #print axioms RHLean.Analysis.vfCanonicalUpperLeftPhase_li_uniform
          #check RHLean.Analysis.vfCanonicalSquareVonKoch_iff_legacy
          #check RHLean.Analysis.vfCanonicalSquareVonKoch_iff_primeLiVonKoch
          #check RHLean.Analysis.vfCanonicalRealVonKoch_iff_primeLiVonKoch
          #print axioms RHLean.Analysis.vfCanonicalSquareVonKoch_iff_legacy
          #print axioms RHLean.Analysis.vfCanonicalSquareVonKoch_iff_primeLiVonKoch
          LEAN
          lake env lean -DwarningAsError=true /tmp/VFCanonicalKernelAudit.lean
