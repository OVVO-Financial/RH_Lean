name: post-674-square-endpoint-q2-amplification

on:
  pull_request:
    paths:
      - 'RHLean/Proof/SignedTransportAmplificationAudit.lean'
      - 'research/SQUARE_ENDPOINT_Q2_SHELL_INTERPOLATION.lean'
      - '.github/workflows/post-674-square-endpoint-q2-amplification.yml'
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
      - name: Compile square-endpoint q2 amplification
        run: lake env lean RHLean/Proof/SignedTransportAmplificationAudit.lean
      - name: Compile unsigned q2 shell interpolation
        run: lake env lean research/SQUARE_ENDPOINT_Q2_SHELL_INTERPOLATION.lean
