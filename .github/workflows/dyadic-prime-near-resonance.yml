name: Genuine dyadic prime near resonance

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'research/DyadicPrimeNearResonance.lean'
      - 'research/DyadicPrimeNearResonanceAcceptance.lean'
      - 'RHLean/Analysis/TwoABPrimeDilation.lean'
      - '.github/workflows/dyadic-prime-near-resonance.yml'
      - '.github/actions/research-compile/**'
      - '.github/actions/lean-setup/**'
      - '.github/actions/lean-compiled-cache/**'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dyadic-prime-near-resonance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  near-resonance-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head and pinned toolchain
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q 'd13f23b723b8a846827a245b89c10fc7d3f11612' lakefile.lean
          git rev-parse HEAD
      - name: Pinned Lean and cached Mathlib
        uses: ./.github/actions/lean-setup
      - name: Restore native compiled prerequisites
        uses: ./.github/actions/lean-compiled-cache
      - name: Warning-fatal proof, exact public types and guarded standard axioms
        uses: ./.github/actions/research-compile
        with:
          build-library: 'true'
          targets: research/DyadicPrimeNearResonanceAcceptance.lean
