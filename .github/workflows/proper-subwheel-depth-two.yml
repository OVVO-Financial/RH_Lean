name: Proper subwheel depth-two check

on:
  pull_request:
    branches: [main]
    paths:
      - RHLean/Proof/PrimeWheelFrozenRoughSeatBridge.lean
      - RHLean/Proof/PrimeWheelProperSubwheelDepthTwo.lean
      - research/PROPER_SUBWHEEL_DEPTH_TWO_REASSEMBLY.lean
      - research/PROPER_SUBWHEEL_OUTER_PARITY_REASSEMBLY.lean
      - research/HALF_ROOT_PRIME_PAIR_WEIGHT.lean
      - research/HALF_ROOT_PRIME_PAIR_DISCREPANCY.lean
      - research/HALF_ROOT_PRIME_PAIR_FIRST_JUMP.lean
      - research/HALF_ROOT_WEIGHTED_FIRST_JUMP.lean
      - research/HALF_ROOT_RECOUPLED_FIRST_JUMP.lean
      - research/HALF_ROOT_PAIR_COLUMN_CANCELLATION.lean
      - research/HALF_ROOT_SQUARE_CORRECTION_BOUND.lean
      - .github/workflows/proper-subwheel-depth-two.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: proper-subwheel-depth-two-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Apply StrongPNT 4.24 compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py

      - name: Restore StrongPNT port build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Prebuild StrongPNT dependency
        run: lake build StrongPNT.PNT5_Strong

      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Kernel-check frozen rough-seat bridge
        run: lake build RHLean.Proof.PrimeWheelFrozenRoughSeatBridge --wfail

      - name: Kernel-check cubic proper-subwheel decomposition
        run: lake build RHLean.Proof.PrimeWheelProperSubwheelDepthTwo --wfail

      - name: Kernel-check all-Mertens depth-two reassembly
        run: lake env lean research/PROPER_SUBWHEEL_DEPTH_TWO_REASSEMBLY.lean

      - name: Kernel-check sign-visible outer parity reassembly
        run: lake env lean -o .lake/build/lib/lean/research.PROPER_SUBWHEEL_OUTER_PARITY_REASSEMBLY.olean research/PROPER_SUBWHEEL_OUTER_PARITY_REASSEMBLY.lean

      - name: Kernel-check explicit half-root prime-pair shell
        run: lake env lean -o .lake/build/lib/lean/research.HALF_ROOT_PRIME_PAIR_WEIGHT.olean research/HALF_ROOT_PRIME_PAIR_WEIGHT.lean

      - name: Kernel-check signed half-root pair discrepancy
        run: lake env lean -o .lake/build/lib/lean/research.HALF_ROOT_PRIME_PAIR_DISCREPANCY.olean research/HALF_ROOT_PRIME_PAIR_DISCREPANCY.lean

      - name: Kernel-check nonzero pair first-jump carrier bridge
        run: lake env lean -o .lake/build/lib/lean/research.HALF_ROOT_PRIME_PAIR_FIRST_JUMP.olean research/HALF_ROOT_PRIME_PAIR_FIRST_JUMP.lean

      - name: Kernel-check weighted first-jump shell realization
        run: lake env lean -o .lake/build/lib/lean/research.HALF_ROOT_WEIGHTED_FIRST_JUMP.olean research/HALF_ROOT_WEIGHTED_FIRST_JUMP.lean

      - name: Kernel-check global weighted first-jump recoupling
        run: lake env lean -o .lake/build/lib/lean/research.HALF_ROOT_RECOUPLED_FIRST_JUMP.olean research/HALF_ROOT_RECOUPLED_FIRST_JUMP.lean

      - name: Kernel-check half-root pair-column cancellation
        run: lake env lean -o .lake/build/lib/lean/research.HALF_ROOT_PAIR_COLUMN_CANCELLATION.olean research/HALF_ROOT_PAIR_COLUMN_CANCELLATION.lean

      - name: Kernel-check root-scale square correction
        run: lake env lean -o .lake/build/lib/lean/research.HALF_ROOT_SQUARE_CORRECTION_BOUND.olean research/HALF_ROOT_SQUARE_CORRECTION_BOUND.lean
