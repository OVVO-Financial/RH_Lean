name: Regenerate root manifest once

on:
  push:
    branches:
      - agent/square-run-top-escape-classification

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/square-run-top-escape-classification
      - name: Regenerate sorted RHLean root and remove this workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('RHLean')
          modules = sorted('.'.join(p.with_suffix('').parts) for p in root.rglob('*.lean'))
          Path('RHLean.lean').write_text(''.join(f'import {m}\n' for m in modules), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add RHLean.lean
          git rm .github/workflows/regenerate-root-manifest-once.yml
          git commit -m "Regenerate root manifest for top-escape classification"
          git push origin HEAD:agent/square-run-top-escape-classification
