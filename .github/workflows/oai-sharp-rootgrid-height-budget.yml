name: OAI sharp square-root grid height and collar budget

on:
  pull_request:
    branches: [main]
    paths:
      - "research/OAI_SHARP_ROOTGRID_HEIGHT_BUDGET_20261028.lean"
      - "research/OAI_SHARP_ROOTGRID_HEIGHT_AUDIT_20261028.md"
      - ".github/workflows/oai-sharp-rootgrid-height-budget.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oai-sharp-rootgrid-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Lean 4.34.1 and cached Mathlib
        uses: ./.github/actions/lean-setup
      - name: Compile exact quantitative exponent budgets, warning-fatal
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -DwarningAsError=true research/OAI_SHARP_ROOTGRID_HEIGHT_BUDGET_20261028.lean | tee /tmp/oai-rootgrid-budget.log
          if grep -Eq 'sorryAx|admitAx' /tmp/oai-rootgrid-budget.log; then
            echo "Unexpected proof-hole axiom"; exit 1
          fi
          python3 - <<'PY'
          import pathlib,re
          p = pathlib.Path("research/OAI_SHARP_ROOTGRID_HEIGHT_BUDGET_20261028.lean")
          s=p.read_text()
          s=re.sub(r"/-.*?-/", "", s, flags=re.S)
          s=re.sub(r"--.*", "", s)
          assert not re.search(r"\b(sorry|admit|axiom)\b", s)
          log=pathlib.Path("/tmp/oai-rootgrid-budget.log").read_text()
          assert "oaiGenericRelativeBudget_iff" in log
          assert "oaiGenericAbsoluteBudget_iff" in log
          allowed={"propext","Classical.choice","Quot.sound"}
          found=re.findall(r"depends on axioms:\s*\[([^\]]+)\]",log,re.S)
          for blob in found:
              used={x.strip() for x in blob.split(",") if x.strip()}
              assert used<=allowed,used-allowed
          print("PASS standard axioms only; both quantitative budget identities certified")
          PY
