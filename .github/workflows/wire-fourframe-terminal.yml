name: Wire post-672 synthesis modules

on:
  push:
    branches: [agent/post-672-recursive-energy-handoff]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/post-672-recursive-energy-handoff
      - name: Add and sort root imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('RHLean.lean')
          lines = p.read_text().splitlines()
          targets = {
              'import RHLean.Proof.PhysicalQ2FourFrameTerminalSynthesis',
              'import RHLean.Proof.StableFarWallCrossingRenewal',
          }
          for target in targets:
              if target not in lines:
                  lines.append(target)
          imports = sorted(x for x in lines if x.startswith('import '))
          other = [x for x in lines if not x.startswith('import ')]
          if any(x.strip() for x in other):
              raise SystemExit('RHLean.lean contains non-import content')
          p.write_text('\n'.join(imports) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- RHLean.lean; then exit 0; fi
          git add RHLean.lean
          git commit -m 'Import post-672 q2 synthesis modules'
          git push origin HEAD:agent/post-672-recursive-energy-handoff
