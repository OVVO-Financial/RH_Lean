name: Production x210 classifier

on:
  pull_request:
    paths:
      - experiments/production_x210_classifier.py
      - research/PRODUCTION_X210_CLASSIFIER.md
      - .github/workflows/production-x210-classifier.yml
  push:
    paths:
      - experiments/production_x210_classifier.py
      - research/PRODUCTION_X210_CLASSIFIER.md
      - .github/workflows/production-x210-classifier.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run production square-endpoint classifier
        run: python3 experiments/production_x210_classifier.py
