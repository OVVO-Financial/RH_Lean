name: Half-bootstrap exact algebra and finite source audit

on:
  pull_request:
    paths:
      - 'scripts/half_bootstrap/**'
      - 'research/half_bootstrap_20261116/**'
      - 'docs/RHLEAN_BOOTSTRAP_TO_HALF_20261116.md'
      - '.github/workflows/half-bootstrap-seam-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: half-bootstrap-audit-${{ github.head_ref || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  exact-algebra-and-finite-identities:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact algebra and original finite source
        run: python3 -B scripts/half_bootstrap/run_audit.py --json --output half-bootstrap-exact-audit.json
      - name: Preserve the scoped arithmetic audit
        uses: actions/upload-artifact@v4
        with:
          name: half-bootstrap-exact-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: half-bootstrap-exact-audit.json
          if-no-files-found: error
          retention-days: 30
