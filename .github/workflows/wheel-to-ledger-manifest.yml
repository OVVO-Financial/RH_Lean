name: Wheel to ledger manifest publisher

on:
  push:
    branches: [agent/wheel-to-ledger-equivariance]
    paths:
      - '.github/workflows/wheel-to-ledger-manifest.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wheel-to-ledger-equivariance
          fetch-depth: 0

      - name: Insert final root imports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('RHLean.lean')
          text = path.read_text()
          anchor = 'import RHLean.Proof.VanishingTransitionRelevance\n'
          addition = (
              anchor
              + 'import RHLean.Proof.WheelToLedgerEquivariance\n'
              + 'import RHLean.Proof.WheelToLedgerPushforward\n'
          )
          if 'import RHLean.Proof.WheelToLedgerEquivariance\n' in text:
              raise SystemExit('WheelToLedgerEquivariance already imported')
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one manifest anchor, found {text.count(anchor)}')
          path.write_text(text.replace(anchor, addition))
          PY
          git diff --check
          test "$(git diff --name-only)" = "RHLean.lean"

      - name: Publish root manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- RHLean.lean
          git diff --cached --check
          git commit -m 'Regenerate root manifest for wheel-to-ledger seam'
          git push origin HEAD:agent/wheel-to-ledger-equivariance
