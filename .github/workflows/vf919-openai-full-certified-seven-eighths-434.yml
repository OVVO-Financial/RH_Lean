name: Original OpenAI full certified 7/8 into RHLean square-block covariance

on:
  pull_request:
    paths:
      - 'research/VF_919_OPENAI_CERTIFIED_ORIGINAL_SQUARE_COVARIANCE_20261019.lean'
      - 'research/VF_919_SEVEN_EIGHTHS_SIGNED_COVARIANCE_20261019.lean'
      - 'research/VF_919_OAI_GLOBAL_SQUARE_BLOCK_ALL_PAIR_COVARIANCE_20261019.lean'
      - 'research/VF_919_OAI_GENUINE_IDEAL_ORDERED_PHYSICAL_PAIRS_20261019.lean'
      - '.github/workflows/vf919-openai-full-certified-seven-eighths-434.yml'
      - '.github/actions/lean-setup/**'
      - '.github/actions/research-compile/**'
      - 'scripts/apply_oai_434_upstream_patches.py'
      - 'scripts/check_shared_lean_packages.py'
      - 'scripts/compile_research_import_closure.py'
      - 'scripts/ci/**'
      - 'RHLean/**'
      - 'research/MERTENS_*.lean'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openai-original-complete-434-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  full-original-oai-proof-and-native-covariance:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Require original Lean 4.34.1 / Mathlib tracker pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.34.1"
          grep -q "d13f23b723b8a846827a245b89c10fc7d3f11612" lakefile.lean
      - name: Reject admitted proofs or new axioms
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' \
            research/VF_919_OPENAI_CERTIFIED_ORIGINAL_SQUARE_COVARIANCE_20261019.lean
      - uses: ./.github/actions/lean-setup
      - name: Checkout entire ACTUAL original OpenAI 7/8 proof DAG
        uses: actions/checkout@v4
        with:
          repository: openai/math
          ref: 1581d4cbdd69a0faf34b2089614fe2a814316a6a
          path: oai-upstream
          persist-credentials: false
      - name: Verify exact upstream checkout and compiler pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C oai-upstream rev-parse HEAD)" = "1581d4cbdd69a0faf34b2089614fe2a814316a6a"
          test "$(cat oai-upstream/lean/lean-toolchain)" = "leanprover/lean4:v4.34.1"
      - name: Restore native library and shared PNT build artifacts
        id: native_cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/build
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: rhlean-oai-native-full-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean/**/*.lean', 'scripts/compile_research_import_closure.py', 'scripts/ci/**') }}
      # Lean resolves a package root from ONE search-path entry. RH_PATH comes
      # first and supplies StrongPNT for the native converse, so it must also
      # supply Wiener for the OAI imports. OpenAI's chain is compiled below
      # against this same unpatched PrimeNumberTheoremAnd commit, so every
      # module in the combined check is loaded from the build it was checked
      # against. (OpenAI's PNT patch cannot be used on both sides: it removes
      # SmoothExistence, which native MediumPNT needs.)
      - name: Compile Wiener in the native PNT namespace before the expensive OAI build
        shell: bash
        run: |
          set -euo pipefail
          lake build PrimeNumberTheoremAnd.Wiener
          test -s .lake/packages/PrimeNumberTheoremAnd/.lake/build/lib/lean/PrimeNumberTheoremAnd/Wiener.olean
      - name: Compile RHLean original Green-Kubo and all-square coefficient pairs
        id: native_build
        uses: ./.github/actions/research-compile
        with:
          build-library: 'true'
          targets: >-
            research/VF_919_SEVEN_EIGHTHS_SIGNED_COVARIANCE_20261019.lean
            research/VF_919_OAI_GLOBAL_SQUARE_BLOCK_ALL_PAIR_COVARIANCE_20261019.lean
            research/VF_919_OAI_GENUINE_IDEAL_ORDERED_PHYSICAL_PAIRS_20261019.lean
      - name: Save native prerequisites before any downstream proof work
        if: ${{ steps.native_cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            .lake/build
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: ${{ steps.native_cache.outputs.cache-primary-key }}
      # Cache identity is independent of the RH_Lean PR commit. Only the
      # pinned upstream source, toolchain, dependency pins and patches matter.
      # Restore after checkout, so checkout's clean operation cannot erase it.
      - name: Restore pinned original OpenAI build and dependency traces
        id: oai_cache
        uses: actions/cache/restore@v5
        with:
          path: oai-upstream/lean/.lake
          key: oai-certified-434-pntnative-v2-${{ runner.os }}-${{ runner.arch }}-1581d4cbdd69a0faf34b2089614fe2a814316a6a-${{ hashFiles('oai-upstream/lean/lean-toolchain', 'oai-upstream/lean/lakefile.lean', 'oai-upstream/lean/lake-manifest.json', 'oai-upstream/lean/patches/**', 'scripts/apply_oai_434_upstream_patches.py') }}-complete
          restore-keys: |
            oai-certified-434-pntnative-v2-${{ runner.os }}-${{ runner.arch }}-1581d4cbdd69a0faf34b2089614fe2a814316a6a-${{ hashFiles('oai-upstream/lean/lean-toolchain', 'oai-upstream/lean/lakefile.lean', 'oai-upstream/lean/lake-manifest.json', 'oai-upstream/lean/patches/**', 'scripts/apply_oai_434_upstream_patches.py') }}-progress-
      - name: Fetch pinned original OpenAI dependencies on a cold or partial cache
        if: ${{ steps.oai_cache.outputs.cache-hit != 'true' }}
        shell: bash
        working-directory: oai-upstream/lean
        run: |
          set -euo pipefail
          lake exe cache get
      - name: Apply upstream OpenAI Lean 4.34.1 dependency patches (lake post_update)
        id: oai_patches
        run: python3 scripts/apply_oai_434_upstream_patches.py oai-upstream/lean --keep-pinned PrimeNumberTheoremAnd
      - name: Kernel-check patched pinned Rellich prerequisites before full OpenAI DAG
        shell: bash
        working-directory: oai-upstream/lean
        run: |
          set -euo pipefail
          lake build \
            RellichKondrachov.Analysis.FunctionalSpaces.Sobolev.Euclidean.TranslationEstimateL2 \
            RellichKondrachov.Analysis.FunctionalSpaces.Sobolev.Euclidean.L2Compactness.Approximation \
            RellichKondrachov.Analysis.FunctionalSpaces.Sobolev.Euclidean.L2Compactness.ArzelaAscoli \
            RellichKondrachov.Analysis.FunctionalSpaces.Sobolev.Euclidean.L2Compactness.Transfer
      # PrimeCounting/Progressions imports only PNT Wiener and uses each
      # Wiener declaration OpenAI needs; fail here, not after the full DAG.
      - name: Preflight OpenAI's PNT Wiener consumers against native PNT
        shell: bash
        working-directory: oai-upstream/lean
        run: |
          set -euo pipefail
          lake build OAI.NumberTheory.DirichletL.PrimeCounting.Progressions
      # Always invoke Lake, including on a cache hit. Its dependency traces
      # determine what must be rebuilt; a cache hit is not proof acceptance.
      - name: Compile entire original OpenAI moment and final detector chain
        id: oai_build
        shell: bash
        working-directory: oai-upstream/lean
        run: |
          set -euo pipefail
          lake build OAI.NumberTheory.DirichletL.Detector.FinalAssemblyUnconditional
          test -s .lake/build/lib/lean/OAI/NumberTheory/DirichletL/Detector/FinalAssemblyUnconditional.olean
      # Explicit save MUST precede the RH_Lean leaf check. A downstream
      # elaboration error must not discard a successfully completed OAI DAG.
      - name: Save completed original OpenAI DAG BEFORE the native theorem check
        if: ${{ !cancelled() && steps.oai_build.outcome == 'success' && steps.oai_cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: oai-upstream/lean/.lake
          key: ${{ steps.oai_cache.outputs.cache-primary-key }}
      # Failed compilation may still have thousands of valid prerequisites.
      # Keep it under a separate, immutable progress key, never a complete key.
      - name: Save partial original OpenAI build after an upstream failure
        if: ${{ !cancelled() && failure() && steps.oai_patches.outcome == 'success' && steps.oai_build.outcome != 'success' && steps.oai_cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: oai-upstream/lean/.lake
          key: oai-certified-434-pntnative-v2-${{ runner.os }}-${{ runner.arch }}-1581d4cbdd69a0faf34b2089614fe2a814316a6a-${{ hashFiles('oai-upstream/lean/lean-toolchain', 'oai-upstream/lean/lakefile.lean', 'oai-upstream/lean/lake-manifest.json', 'oai-upstream/lean/patches/**', 'scripts/apply_oai_434_upstream_patches.py') }}-progress-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Compile original OpenAI full theorem against native RHLean covariance
        id: native_theorem
        shell: bash
        run: |
          set -euo pipefail
          # Normalize each Lake path in the directory that produced it.
          OAI_PATH="$(cd oai-upstream/lean && lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          RH_PATH="$(lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          test -s .lake/packages/PrimeNumberTheoremAnd/.lake/build/lib/lean/PrimeNumberTheoremAnd/Wiener.olean
          python3 scripts/check_shared_lean_packages.py . oai-upstream/lean PrimeNumberTheoremAnd mathlib
          env LEAN_PATH="$RH_PATH:$OAI_PATH" lean -DwarningAsError=true \
            research/VF_919_OPENAI_CERTIFIED_ORIGINAL_SQUARE_COVARIANCE_20261019.lean \
            | tee /tmp/rhlean-original-openai-full-proof-axioms.log
          if grep -E 'sorryAx|admitAx|_private' /tmp/rhlean-original-openai-full-proof-axioms.log; then
            echo "Nonstandard axiom contamination in full theorem DAG" >&2
            exit 1
          fi
      - name: Report exact original OpenAI certificate and covariance acceptance
        run: |
          printf '%s\n' 'ACTUAL OpenAI terminal theorem kernel checked.'
          printf '%s\n' 'ACTUAL RHLean native signed covariance 7/8 kernel checked.'
          printf '%s\n' 'ACTUAL within- and cross-square-block global source bound kernel checked.'
      - name: Preserve final theorem and axiom-check diagnostics
        if: ${{ !cancelled() && steps.native_theorem.outcome != 'skipped' && steps.native_theorem.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: vf919-openai-full-certified-434-axioms-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/rhlean-original-openai-full-proof-axioms.log
          if-no-files-found: warn
          retention-days: 7
