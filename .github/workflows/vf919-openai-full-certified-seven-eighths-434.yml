name: Original OpenAI full certified 7/8 into RHLean square-block covariance

on:
  pull_request:
    paths:
      - 'research/VF_919_OPENAI_CERTIFIED_ORIGINAL_SQUARE_COVARIANCE_20261019.lean'
      - '.github/workflows/vf919-openai-full-certified-seven-eighths-434.yml'
      - 'scripts/patch_oai_434_rellich_compat.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openai-original-complete-434-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  full-original-oai-proof-and-native-covariance:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout actual RHLean source on Lean 4.34.1
        uses: actions/checkout@v4
      - name: Enforce compiler and pinned tracker Mathlib
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.34.1"
          grep -q 'd13f23b723b8a846827a245b89c10fc7d3f11612' lakefile.lean
      - name: Reject sorry/admit/axiom in the final theorem
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' \
            research/VF_919_OPENAI_CERTIFIED_ORIGINAL_SQUARE_COVARIANCE_20261019.lean
      - uses: ./.github/actions/lean-setup
      - name: Compile RHLean original Green-Kubo and all-square coefficient pairs
        uses: ./.github/actions/research-compile
        with:
          build-library: 'true'
          targets: >-
            research/VF_919_SEVEN_EIGHTHS_SIGNED_COVARIANCE_20261019.lean
            research/VF_919_OAI_GLOBAL_SQUARE_BLOCK_ALL_PAIR_COVARIANCE_20261019.lean
            research/VF_919_OAI_GENUINE_IDEAL_ORDERED_PHYSICAL_PAIRS_20261019.lean
      # OAI's full proof is cached separately; this RHLean dependency was
      # missing at the end of earlier two-hour runs. Fail BEFORE OAI checkout.
      - name: Restore cached native PNT Wiener prerequisites
        id: native-pnt-cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: vf919-pnt-wiener-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}
          restore-keys: |
            pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Build and preflight required native PNT Wiener imports
        id: native-pnt-build
        shell: bash
        run: |
          set -euo pipefail
          lake build PrimeNumberTheoremAnd.SmoothExistence PrimeNumberTheoremAnd.Wiener
          test -s .lake/packages/PrimeNumberTheoremAnd/.lake/build/lib/lean/PrimeNumberTheoremAnd/SmoothExistence.olean
          test -s .lake/packages/PrimeNumberTheoremAnd/.lake/build/lib/lean/PrimeNumberTheoremAnd/Wiener.olean
          lake env lean -DwarningAsError=true \
            research/VF_919_SEVEN_EIGHTHS_SIGNED_COVARIANCE_20261019.lean \
            > /tmp/vf919-original-native-pnt-preflight.log
          echo 'PASS: complete native Mertens import closure, including PNT Wiener'
      - name: Save independently verified native PNT prerequisites
        if: steps.native-pnt-build.outcome == 'success' && steps.native-pnt-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: ${{ steps.native-pnt-cache.outputs.cache-primary-key }}
      - name: Checkout pinned ORIGINAL complete OpenAI theorem and dependencies
        uses: actions/checkout@v4
        with:
          repository: openai/math
          ref: 1581d4cbdd69a0faf34b2089614fe2a814316a6a
          path: oai-upstream
          persist-credentials: false
      # These are exact Lean 4.34.1 / pinned OpenAI source / patch-hash
      # caches. A successful upstream build is saved BEFORE native consumers.
      - name: Restore kernel-checked complete OpenAI proof DAG
        id: oai-full-cache
        uses: actions/cache/restore@v5
        with:
          path: oai-upstream/lean/.lake
          key: vf919-oai-full-proof-v2-${{ runner.os }}-${{ runner.arch }}-1581d4cbdd69a0faf34b2089614fe2a814316a6a-${{ hashFiles('scripts/patch_oai_434_rellich_compat.py') }}
      - name: Restore previously compiled OpenAI intermediate analytic moments
        id: oai-intermediate-cache
        if: steps.oai-full-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: oai-upstream/lean/.lake
          key: vf919-oai-analytic-v1-${{ runner.os }}-${{ runner.arch }}-1581d4cbdd69a0faf34b2089614fe2a814316a6a-${{ hashFiles('scripts/patch_oai_434_rellich_compat.py') }}
      - name: Acquire original OpenAI dependencies (same Lean and Mathlib pins)
        if: steps.oai-full-cache.outputs.cache-hit != 'true' && steps.oai-intermediate-cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: oai-upstream/lean
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.34.1"
          lake exe cache get
      - name: Fix upstream Rellich pointwise elaboration without new axioms
        if: steps.oai-full-cache.outputs.cache-hit != 'true' && steps.oai-intermediate-cache.outputs.cache-hit != 'true'
        run: python3 scripts/patch_oai_434_rellich_compat.py
      - name: Kernel-check patched pinned Rellich prerequisites before full OpenAI DAG
        shell: bash
        working-directory: oai-upstream/lean
        run: |
          set -euo pipefail
          lake build \
            RellichKondrachov.Analysis.FunctionalSpaces.Sobolev.Euclidean.TranslationEstimateL2 \
            RellichKondrachov.Analysis.FunctionalSpaces.Sobolev.Euclidean.TranslationEstimateH1 \
            RellichKondrachov.Analysis.FunctionalSpaces.Sobolev.Euclidean.Rellich \
            RellichKondrachov.Analysis.FunctionalSpaces.Sobolev.Euclidean.L2Compactness.Approximation \
            RellichKondrachov.Analysis.FunctionalSpaces.Sobolev.Euclidean.L2Compactness.ArzelaAscoli \
            RellichKondrachov.Analysis.FunctionalSpaces.Sobolev.Euclidean.L2Compactness.Transfer
      - name: KERNEL BUILD THE ACTUAL COMPLETE OpenAI 7/8 CERTIFICATE
        id: oai-full-build
        shell: bash
        working-directory: oai-upstream/lean
        run: |
          set -euo pipefail
          lake build OAI.NumberTheory.DirichletL.Detector.FinalAssemblyUnconditional
      - name: Save completed original OpenAI full proof before native consumer
        if: steps.oai-full-build.outcome == 'success' && steps.oai-full-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: oai-upstream/lean/.lake
          key: ${{ steps.oai-full-cache.outputs.cache-primary-key }}
      - name: Compile original OpenAI full theorem against native RHLean covariance
        shell: bash
        run: |
          set -euo pipefail
          OAI_PATH="$(cd oai-upstream/lean && lake env printenv LEAN_PATH)"
          RH_PATH="$(lake env printenv LEAN_PATH)"
          env LEAN_PATH="$RH_PATH:$OAI_PATH" lean -DwarningAsError=true \
            research/VF_919_OPENAI_CERTIFIED_ORIGINAL_SQUARE_COVARIANCE_20261019.lean \
            | tee /tmp/rhlean-original-openai-full-proof-axioms.log
          if grep -E 'sorryAx|admitAx|_private' /tmp/rhlean-original-openai-full-proof-axioms.log; then
            exit 1
          fi
      - name: Report exact original OpenAI certificate and covariance acceptance
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'ACTUAL OpenAI terminal theorem kernel checked.'
          printf '%s\n' 'ACTUAL RHLean native signed covariance 7/8 kernel checked.'
          printf '%s\n' 'ACTUAL within- and cross-square-block global source bound kernel checked.'
