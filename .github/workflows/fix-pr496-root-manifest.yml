name: Fix PR496 root manifest

on:
  push:
    branches:
      - agent/repeated-parent-fiber-classification

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repeated-parent-fiber-classification
          fetch-depth: 0
      - name: Add missing root import and clean fixer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('RHLean.lean')
          text = path.read_text()
          needle = 'import RHLean.Proof.LowWheelCanonicalDowncrossParentFibers\n'
          target = 'import RHLean.Proof.LowWheelCanonicalRepeatedParentClassification\n'
          if target not in text:
              if needle not in text:
                  raise SystemExit('expected anchor import not found')
              text = text.replace(needle, needle + target, 1)
              path.write_text(text)
          PY
          rm .github/workflows/fix-pr496-root-manifest.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add RHLean.lean .github/workflows/fix-pr496-root-manifest.yml
          git commit -m 'Export repeated-parent classification from root'
          git push origin HEAD:agent/repeated-parent-fiber-classification
