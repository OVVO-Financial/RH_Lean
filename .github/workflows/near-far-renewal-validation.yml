name: Near-far renewal Lean validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/near-far-renewal-validation.yml'
      - 'RHLean/Analysis/PrimeWheelNearFarRenewalSquareEndpoint.lean'
      - 'RHLean.lean'

permissions:
  contents: read

concurrency:
  group: near-far-renewal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build near-far renewal module
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Lean with caches
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: true
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Build target with warnings fatal
        run: lake build RHLean.Analysis.PrimeWheelNearFarRenewalSquareEndpoint --wfail