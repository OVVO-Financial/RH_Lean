name: Fix root-floored predecessor arithmetic

on:
  push:
    branches:
      - agent/q2-parent-product-reassembly

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/q2-parent-product-reassembly
      - name: Patch RootFloored
        run: |
          python3 -c "from pathlib import Path; p=Path('RHLean/Proof/LowWheelFrozenSquareResidualRootFloored.lean'); s=p.read_text(); s=s.replace('  have hqR : q < R := by\\n    have hqle : q ≤ R - 1 := hqd.2\\n    omega','  have hqR : q < R := Nat.lt_of_le_pred hqd.2'); s=s.replace('    lowWheelFrozenSquareResidualPostRootSmooth_mass_eq_rootFlooredDiff hqd.1]\\n  push_cast','    lowWheelFrozenSquareResidualPostRootSmooth_mass_eq_rootFlooredDiff hqd.1]\\n  push_cast\\n  rfl'); p.write_text(s)"
          rm .github/workflows/fix-rootfloored-pred.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RHLean/Proof/LowWheelFrozenSquareResidualRootFloored.lean .github/workflows/fix-rootfloored-pred.yml
          git commit -m 'Close root-floored predecessor and cast goals'
          git push origin HEAD:agent/q2-parent-product-reassembly
