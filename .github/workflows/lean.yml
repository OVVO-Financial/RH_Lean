name: Full Lean warning sweep

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/lean.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-lean-warning-sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Full Lean warning sweep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Mathlib and dependency builds
        id: lakepackages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Set up Lean and Mathlib
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Remove all RHLean build artifacts
        run: rm -rf .lake/build

      - name: Build every RHLean job with warnings fatal
        id: directbuild
        continue-on-error: true
        run: lake build RHLean --wfail > lean-build.log 2>&1

      - name: Upload complete Lean build log
        if: ${{ always() && hashFiles('lean-build.log') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: full-lean-warning-sweep-log
          path: lean-build.log

      - name: Print complete Lean build log
        if: ${{ always() && hashFiles('lean-build.log') != '' }}
        run: cat lean-build.log

      - name: Fail if any Lean warning or build error occurred
        if: steps.directbuild.outcome == 'failure'
        run: exit 1
