name: Apply PR 57 closeout

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr57-closeout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/concrete-high-family-joint-gram
          fetch-depth: 0

      - name: Update canonical ledgers and restore workflow
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            python3 scripts/closeout_pr57.py
            rm scripts/closeout_pr57.py
            git diff --check
            git config user.name "OVVO-Financial"
            git config user.email "actions@users.noreply.github.com"
            git add FORMALIZATION_SEQUENCE.md FORMALIZATION_CHECKLIST.md .github/workflows/lean.yml scripts/closeout_pr57.py
            git commit -m "Record concrete complete-family joint Gram"
            git push origin HEAD:agent/concrete-high-family-joint-gram
          ) 2>&1 | tee closeout.log

      - name: Upload closeout diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closeout-diagnostic
          path: closeout.log
