name: Lean verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply one-time canonical occupancy documentation patch
        if: github.repository == 'OVVO-Financial/RH_Lean' && github.head_ref == 'agent/analysis-canonical-low-occupancy'
        run: |
          python scripts/patch_canonical_low_occupancy_docs.py
          if ! git diff --quiet -- FORMALIZATION_SEQUENCE.md FORMALIZATION_CHECKLIST.md paper/Squared_Complex_Framework_for_Square_Prefix_Mobius_Sums_Lean_Complete.tex; then
            git config user.name "OVVO Lean Automation"
            git config user.email "actions@users.noreply.github.com"
            git add FORMALIZATION_SEQUENCE.md FORMALIZATION_CHECKLIST.md paper/Squared_Complex_Framework_for_Square_Prefix_Mobius_Sums_Lean_Complete.tex
            git commit -m "Update canonical low occupancy documentation"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Check paper / Analysis boundary
        run: bash scripts/check_paper_analysis_boundary.sh

      - name: Audit unfinished proofs and axioms
        run: bash scripts/audit_assumptions.sh

      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: true
          build-args: "RHLean --wfail"
          test: false
          lint: false
