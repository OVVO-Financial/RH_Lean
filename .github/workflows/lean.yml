name: Lean verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Check paper / Analysis boundary
        run: bash scripts/check_paper_analysis_boundary.sh

      - name: Audit unfinished proofs and axioms
        run: bash scripts/audit_assumptions.sh

      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Capture Lean build failure
        if: github.repository == 'OVVO-Financial/RH_Lean' && github.head_ref == 'agent/move-proof-technology-to-proof'
        shell: bash
        run: |
          set +e
          lake build RHLean --wfail > /tmp/rhlean-build.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            tail -n 240 /tmp/rhlean-build.log > CI_FAILURE.log
            git config user.name "OVVO Lean Automation"
            git config user.email "actions@users.noreply.github.com"
            git add CI_FAILURE.log
            if ! git diff --cached --quiet; then
              git commit -m "Capture PR 77 Lean build failure"
              git push origin HEAD:${{ github.head_ref }}
            fi
            exit "$status"
          fi
