name: Lean source audits

on:
  push:
    branches: [main]
    paths:
      - '**.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - '.github/workflows/lean.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'lakefile.lean'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check paper / Analysis boundary
        run: bash scripts/check_paper_analysis_boundary.sh
      - name: Audit unfinished proofs and axioms
        run: bash scripts/audit_assumptions.sh
      - name: Check Lean root import manifest
        run: python3 scripts/check_root_manifest.py

  build:
    name: Hosted Lean build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Lean 4.24
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: false
          build: false
          test: false
          lint: false

      - name: Resolve StrongPNT dependency under Lean 4.24
        run: |
          rm -f lake-manifest.json
          lake update StrongPNT
          grep -A8 -B2 'StrongPNT' lake-manifest.json || true
          grep -A8 -B2 'mathlib' lake-manifest.json || true

      - name: Compile StrongPNT theorem import
        id: compatbuild
        continue-on-error: true
        run: |
          cat > StrongPNTCompat.lean <<'EOF'
          import StrongPNT.PNT5_Strong
          #check Strong_PNT
          #print axioms Strong_PNT
          EOF
          lake env lean StrongPNTCompat.lean > strongpnt-compat.log 2>&1

      - name: Print compatibility log
        if: always()
        run: cat strongpnt-compat.log || true

      - name: Fail if compatibility build failed
        if: steps.compatbuild.outcome == 'failure'
        run: exit 1
