name: Lean verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check paper / Analysis boundary
        run: bash scripts/check_paper_analysis_boundary.sh

      - name: Audit unfinished proofs and axioms
        run: bash scripts/audit_assumptions.sh

      - name: Build Lean project
        id: leanbuild
        continue-on-error: true
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: true
          build-args: "RHLean --wfail"
          test: false
          lint: false

      - name: Show Lean failure tail
        if: steps.leanbuild.outcome == 'failure'
        run: |
          lake build RHLean --wfail > /tmp/lean-build.log 2>&1 || true
          tail -n 240 /tmp/lean-build.log
          exit 1
