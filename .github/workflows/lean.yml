name: Full Lean warning sweep

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/lean.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-lean-warning-sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Full Lean warning sweep
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore dependency source trees
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Set up Lean without Mathlib oleans
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: false
          build: false
          test: false
          lint: false

      - name: Remove every compiled Lake artifact
        run: |
          set -euo pipefail
          rm -rf .lake/build
          find .lake/packages -type d -path '*/.lake/build' -prune -exec rm -rf '{}' +
          if find .lake -type d -path '*/.lake/build' -print -quit | grep -q .; then
            echo 'A .lake/build directory survived cleanup' >&2
            find .lake -type d -path '*/.lake/build' -print >&2
            exit 1
          fi

      - name: Build all 7779 jobs with warnings fatal
        id: directbuild
        continue-on-error: true
        run: lake build RHLean --wfail > lean-build.log 2>&1

      - name: Upload complete Lean build log
        if: ${{ always() && hashFiles('lean-build.log') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: full-lean-warning-sweep-log
          path: lean-build.log

      - name: Print complete Lean build log
        if: ${{ always() && hashFiles('lean-build.log') != '' }}
        run: cat lean-build.log

      - name: Fail if any Lean warning or build error occurred
        if: steps.directbuild.outcome == 'failure'
        run: exit 1
