name: Lean source audits

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.lean'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check_paper_analysis_boundary.sh
      - run: bash scripts/audit_assumptions.sh
      - run: python3 scripts/check_root_manifest.py

  build:
    name: RHLean 4.32.2 compatibility build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.32.2
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: false
          build: false
          test: false
          lint: false
      - name: Regenerate dependency manifest
        run: |
          rm -f lake-manifest.json
          lake update mathlib
          grep -A8 -B2 'mathlib' lake-manifest.json || true
          grep -A8 -B2 'batteries' lake-manifest.json || true
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Build RHLean under 4.32.2
        id: compatbuild
        continue-on-error: true
        run: lake build RHLean --wfail > rhlean-432.log 2>&1
      - name: Print build log
        if: always()
        run: cat rhlean-432.log || true
      - name: Fail if source port is needed
        if: steps.compatbuild.outcome == 'failure'
        run: exit 1
