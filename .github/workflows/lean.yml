name: Lean verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply canonical bridge relocation documentation patch
        if: github.repository == 'OVVO-Financial/RH_Lean' && github.head_ref == 'agent/move-canonical-high-bridge-to-analysis'
        run: |
          python scripts/patch_canonical_bridge_analysis_move.py
          if ! git diff --quiet; then
            git config user.name "OVVO Lean Automation"
            git config user.email "actions@users.noreply.github.com"
            git add RHLean/Analysis/CanonicalHighSectorCore.lean FORMALIZATION_SEQUENCE.md FORMALIZATION_CHECKLIST.md PAPER_ANALYSIS_BOUNDARY.md MULTIROUTE_FORMALIZATION_PLAN.md paper/Squared_Complex_Framework_Elementary_Pointwise_Bridge.tex paper/LEAN_ANALYSIS_INVENTORY.tex RHLean.lean RHLean/Proof/CanonicalHighSectorCovariance.lean RHLean/Proof/RealSquareBlockIncrements.lean
            git commit -m "Update canonical bridge analysis references"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Check paper / Analysis boundary
        run: bash scripts/check_paper_analysis_boundary.sh

      - name: Audit unfinished proofs and axioms
        run: bash scripts/audit_assumptions.sh

      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: true
          build-args: "RHLean --wfail"
          test: false
          lint: false
