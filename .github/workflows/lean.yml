name: PR 199 editorial cleanup

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '**.lean'
      - '**.md'
      - '.github/workflows/lean.yml'

permissions:
  contents: write

concurrency:
  group: pr-199-editorial-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.event.pull_request.number == 199 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply editorial corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('research/SIGNED_CANONICAL_HEIGHT.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '> least squares on `log |prefix|` against `log n` reports growth that is not there. An\n> an earlier pass':
                  '> least squares on `log |prefix|` against `log n` reports growth that is not there. An\n> earlier pass',
              'Everything above rules out estimating the **raw** halves. It does not say whether the\nexcess is structured.':
                  'Everything above rejects separate estimation of the **raw** halves under the\ndeclared finite diagnostic. It does not say whether the excess is structured.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected text not found: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit editorial corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/SIGNED_CANONICAL_HEIGHT.md
          git commit -m 'Polish finite-diagnostic wording'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
