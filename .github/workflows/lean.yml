name: Lean verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Audit unfinished proofs and axioms
        run: bash scripts/audit_assumptions.sh

      - name: Install Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake --version

      - name: Get mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Build complete high-family decomposition module
        shell: bash
        run: |
          set -o pipefail
          lake build RHLean.Proof.CompleteHighFamilyDecomposition 2>&1 | tee lean-diagnostic.log

      - name: Upload Lean diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-diagnostic
          path: lean-diagnostic.log
