name: Lean verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Audit unfinished proofs and axioms
        run: bash scripts/audit_assumptions.sh

      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Build Lean project
        id: lean-build
        shell: bash
        run: |
          set +e
          lake build RHLean --wfail 2>&1 | tee lean-build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Lean build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-diagnostics
          path: lean-build.log

      - name: Fail if Lean build failed
        if: steps.lean-build.outputs.status != '0'
        run: exit 1
