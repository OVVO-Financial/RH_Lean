name: Lean verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Apply legacy bridge-track relocation
        if: github.repository == 'OVVO-Financial/RH_Lean' && github.head_ref == 'agent/move-legacy-bridge-track-to-proof'
        run: |
          python scripts/patch_legacy_bridge_track_to_proof.py
          if ! git diff --quiet; then
            git config user.name "OVVO Lean Automation"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Move superseded bridge track into Proof"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Check paper / Analysis boundary
        run: bash scripts/check_paper_analysis_boundary.sh

      - name: Audit unfinished proofs and axioms
        run: bash scripts/audit_assumptions.sh

      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: true
          build-args: "RHLean --wfail"
          test: false
          lint: false
