name: Lean verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Audit unfinished proofs and axioms
        run: bash scripts/audit_assumptions.sh

      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Compile normalized cofactor proof modules
        run: |
          set +e
          lake env lean RHLean/Proof/NormalizedCofactorTripling.lean > proof-build.log 2>&1
          status=$?
          printf '%s\n' "$status" > proof-build.status
          exit 0

      - name: Upload proof compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: normalized-cofactor-proof-log
          path: proof-build.log
          if-no-files-found: error

      - name: Enforce proof compile result
        run: exit "$(cat proof-build.status)"
