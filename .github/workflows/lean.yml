name: Lean verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: agent/square-block-increment-energy

      - name: Apply formalization record updates
        run: |
          python .github/update_formalization_records.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FORMALIZATION_SEQUENCE.md FORMALIZATION_CHECKLIST.md
          git commit -m "Update formalization records for increment energy" || true
          git push origin HEAD:agent/square-block-increment-energy

      - name: Audit unfinished proofs and axioms
        run: bash scripts/audit_assumptions.sh

      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: true
          build-args: "RHLean --wfail"
          test: false
          lint: false
