name: Fix q2 terminal pow normalization

on:
  push:
    branches:
      - agent/q2-bookkeeping-synthesis

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/q2-bookkeeping-synthesis
      - name: Normalize square before mod_cast
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('RHLean/Proof/PhysicalQ2TerminalSynthesis.lean')
          s = p.read_text()
          old = "    rw [mertensSummatoryInt_eq_moebiusPrefix_local] at hlin\n    exact_mod_cast hlin\n"
          new = "    rw [mertensSummatoryInt_eq_moebiusPrefix_local] at hlin\n    rw [pow_two] at hlin\n    exact_mod_cast hlin\n"
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RHLean/Proof/PhysicalQ2TerminalSynthesis.lean
          git commit -m 'Normalize q2 terminal square before mod_cast'
          git push origin HEAD:agent/q2-bookkeeping-synthesis
