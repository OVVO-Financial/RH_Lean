name: Root record square closure

on:
  push:
    branches: [agent/record-square-row-bound]

permissions:
  contents: write

jobs:
  root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/record-square-row-bound
      - name: Root closure module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('RHLean.lean')
          s = p.read_text()
          old = 'import RHLean.Proof.PostRootCovarianceRecordSquareCharge\n'
          new = old + 'import RHLean.Proof.PostRootCovarianceRecordSquareChargeClosure\n'
          if 'import RHLean.Proof.PostRootCovarianceRecordSquareChargeClosure\n' not in s:
              if old not in s:
                  raise SystemExit('anchor import not found')
              p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'OVVO-Financial'
          git config user.email 'ovvo.financial.systems@gmail.com'
          git add RHLean.lean
          git diff --cached --quiet && exit 0
          git commit -m 'Root low-high record square charge closure'
          git push origin HEAD:agent/record-square-row-bound
