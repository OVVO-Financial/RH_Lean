name: Raw transfer cone Lean

on:
  pull_request:
    branches: [main]
    paths:
      - "research/RAW_TRANSFER_CONE_20261018.lean"
      - ".github/workflows/raw-transfer-cone.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Apply StrongPNT Lean 4.24 patches
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py
      - name: Restore StrongPNT build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Prebuild StrongPNT
        run: lake build StrongPNT.PNT5_Strong
      - name: Check raw transfer cone with warnings fatal
        run: |
          mkdir -p .lake/build/lib/lean
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.RAW_TRANSFER_CONE_20261018.olean research/RAW_TRANSFER_CONE_20261018.lean
      - name: Audit no new axioms
        run: |
          printf 'import «research.RAW_TRANSFER_CONE_20261018»\n#print axioms RHLean.Analysis.rawTransferCone_sq_sub_sq\n#print axioms RHLean.Analysis.rawTransferCone_sq_nonneg\n#print axioms RHLean.Analysis.rawTransferCone_moebius_sq_le_native_sq\n' >/tmp/raw_transfer_cone_axioms.lean
          lake env lean -DwarningAsError=true /tmp/raw_transfer_cone_axioms.lean
