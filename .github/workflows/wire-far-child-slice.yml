name: Wire far-wall child slice

on:
  push:
    branches: [agent/far-wall-low-cofactor-q2-descent]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/far-wall-low-cofactor-q2-descent
      - name: Add and sort root import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('RHLean.lean')
          lines = p.read_text().splitlines()
          target = 'import RHLean.Proof.StableFarWallQ2ChildFarSlice'
          if target not in lines:
              lines.append(target)
          imports = sorted(x for x in lines if x.startswith('import '))
          other = [x for x in lines if not x.startswith('import ')]
          if any(x.strip() for x in other):
              raise SystemExit('RHLean.lean contains non-import content')
          p.write_text('\n'.join(imports) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- RHLean.lean; then exit 0; fi
          git add RHLean.lean
          git commit -m 'Import far-wall q2 child far slice'
          git push origin HEAD:agent/far-wall-low-cofactor-q2-descent
