name: Refresh exceptional parent root manifest
on:
  push:
    branches: [agent/q2-bookkeeping-synthesis]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/q2-bookkeeping-synthesis
      - name: Regenerate root manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          modules = sorted('.'.join(p.with_suffix('').parts) for p in Path('RHLean').rglob('*.lean'))
          Path('RHLean.lean').write_text(''.join(f'import {m}\n' for m in modules), encoding='utf-8')
          PY
      - name: Commit manifest
        run: |
          if git diff --quiet -- RHLean.lean; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RHLean.lean
          git commit -m 'Regenerate root import manifest for exceptional parent partition'
          git push origin HEAD:agent/q2-bookkeeping-synthesis
