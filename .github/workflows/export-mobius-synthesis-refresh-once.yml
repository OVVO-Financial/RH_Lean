name: One-shot canonical Möbius export refresh

on:
  push:
    branches:
      - agent/export-mobius-synthesis-refresh

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out RH_Lean branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh canonical standalone package
        shell: bash
        run: |
          set -euo pipefail
          export_root=export_mobius_synthesis

          # Refresh every Lean module already exported from its canonical source.
          while IFS= read -r dest; do
            src="${dest#${export_root}/}"
            if [ -f "$src" ]; then
              cp "$src" "$dest"
            fi
          done < <(find "$export_root/RHLean" -type f -name '*.lean' -print | LC_ALL=C sort)

          # Add every Lean module merged by PR #364 that was not present in the
          # previous curated export. Existing paths are refreshed as well.
          changed_modules=(
            RHLean/Analysis/AffineExcursion.lean
            RHLean/Analysis/MobiusRenewalSquareWheelSynthesis.lean
            RHLean/Analysis/MobiusRenewalTelescope.lean
            RHLean/Analysis/PrimeBoundaryDefectBridge.lean
            RHLean/Analysis/PrimeSieveAbelTwoObligations.lean
            RHLean/Analysis/PrimeSieveAffineExcursion.lean
            RHLean/Analysis/PrimeSieveBackwardAffineExcursion.lean
            RHLean/Analysis/PrimeSieveLipschitzExcursion.lean
            RHLean/Arithmetic/BooleanCubeFiniteDifference.lean
            RHLean/Arithmetic/MobiusFourCellEndpointTransfer.lean
            RHLean/Arithmetic/PrimeCombFiniteDifference.lean
            RHLean/Arithmetic/PrimeCombFiniteDifferenceFreshPrime.lean
            RHLean/Arithmetic/PrimeSquareCollisionKernel.lean
            RHLean/Arithmetic/PrimeSquareCollisionPairingFrontier.lean
            RHLean/Arithmetic/PrimeWheelCorrectedLocalFlip.lean
            RHLean/Arithmetic/TruncatedBooleanCubeMaskedSecondToggle.lean
            RHLean/Arithmetic/TruncatedBooleanCubeSecondToggle.lean
            RHLean/Proof/SurvivorDyadicActivityMismatch.lean
            RHLean/Proof/SurvivorDyadicStaticCancellation.lean
            RHLean/Proof/SurvivorPrimeFaceFiniteDifference.lean
            RHLean/Proof/SurvivorResidueCovarianceCriterion.lean
            RHLean/Proof/SurvivorResidueSecondToggle.lean
          )
          for src in "${changed_modules[@]}"; do
            test -f "$src"
            dest="$export_root/$src"
            mkdir -p "$(dirname "$dest")"
            cp "$src" "$dest"
          done

          # The merged renewal synthesis is the current standalone synthesis
          # certificate, so the canonical export ledger advances from 2 to 3.
          cat > "$export_root/boundary/synthesis.json" <<'JSON'
          {
            "schema_version": 1,
            "revision": 3,
            "baseline": {
              "module": "RHLean.Analysis.PrimeSieveQuotientPNTError",
              "representative_theorem": "RHLean.Analysis.primorialMinimalSquareWheelNonzeroResponse_eq_pntCorrected_sub_two_reciprocalError",
              "summary": "Initial mathematical baseline: the canonical square-wheel nonzero response is identified exactly with the centered PNT-corrected comb minus twice the centered Mertens-weighted reciprocal-interval prime-count discrepancy."
            },
            "last_witness": {
              "module": "RHLean.Analysis.MobiusRenewalSquareWheelSynthesis",
              "theorem": "RHLean.Proof.primorialMinimalSquareWheelNonzeroResponse_eq_renewalFarSurvivorCenter",
              "summary": "At a synchronized primorial-wheel sample, applies the weighted renewal telescope to the established far-upper survivor Mertens transform inside the square-prefix decomposition, then substitutes the resulting identity into the existing wheel zero-mode center. This is an exact coordinate identity and asserts no new estimate.",
              "square_anchors": [
                "RHLean.Proof.squarePrefixMertens_eq_positiveSmooth_add_matched",
                "RHLean.Proof.survivorSixteenFarUpperPrimeMass_eq_neg_mertensTransform"
              ],
              "prime_wheel_anchors": [
                "RHLean.Analysis.primorialMinimalSquareWheelNonzeroResponse_eq_mertensCenter"
              ]
            },
            "description": "Monotone ledger for cross-track synthesis theorems. Revision 0 is the publication baseline; each accepted synthesis PR increments revision exactly once."
          }
          JSON

          # Rebuild the standalone root manifest from exactly the shipped files.
          find "$export_root/RHLean" -type f -name '*.lean' -print \
            | sed "s#^${export_root}/##" \
            | LC_ALL=C sort \
            | sed -e 's#/#.#g' -e 's#\.lean$##' -e 's#^#import #' \
            > "$export_root/RHLean.lean"

          # Normalize GitHub math delimiters in every Markdown file in the export,
          # without touching fenced code or inline code spans.
          cat > /tmp/normalize_export_markdown_math.py <<'PY'
          from pathlib import Path

          ROOT = Path('export_mobius_synthesis')
          TOKENS = ((r'\[', '$$'), (r'\]', '$$'), (r'\(', '$'), (r'\)', '$'))

          def rewrite_plain(text: str) -> str:
              for old, new in TOKENS:
                  text = text.replace(old, new)
              return text

          def rewrite_outside_inline_code(line: str) -> str:
              out = []
              i = 0
              plain = 0
              while i < len(line):
                  if line[i] != '`':
                      i += 1
                      continue
                  j = i
                  while j < len(line) and line[j] == '`':
                      j += 1
                  ticks = line[i:j]
                  close = line.find(ticks, j)
                  if close == -1:
                      i = j
                      continue
                  out.append(rewrite_plain(line[plain:i]))
                  out.append(line[i:close + len(ticks)])
                  i = close + len(ticks)
                  plain = i
              out.append(rewrite_plain(line[plain:]))
              return ''.join(out)

          for path in sorted(ROOT.rglob('*.md')):
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              out = []
              fence = None
              for line in lines:
                  stripped = line.lstrip()
                  if fence is None and (stripped.startswith('```') or stripped.startswith('~~~')):
                      fence = stripped[:3]
                      out.append(line)
                      continue
                  if fence is not None:
                      out.append(line)
                      if stripped.startswith(fence):
                          fence = None
                      continue
                  out.append(rewrite_outside_inline_code(line))
              path.write_text(''.join(out), encoding='utf-8')
          PY
          python3 /tmp/normalize_export_markdown_math.py

          mkdir -p "$export_root/scripts" "$export_root/.github/workflows"
          cat > "$export_root/scripts/check_markdown_math.py" <<'PY'
          #!/usr/bin/env python3
          """Reject Markdown math delimiters that do not render reliably on GitHub."""
          from pathlib import Path
          import sys

          BAD = (r'\[', r'\]', r'\(', r'\)')
          failures = []
          scanned = []

          def plain_segments(line: str):
              i = 0
              start = 0
              while i < len(line):
                  if line[i] != '`':
                      i += 1
                      continue
                  j = i
                  while j < len(line) and line[j] == '`':
                      j += 1
                  ticks = line[i:j]
                  close = line.find(ticks, j)
                  if close == -1:
                      i = j
                      continue
                  yield line[start:i]
                  i = close + len(ticks)
                  start = i
              yield line[start:]

          for path in sorted(Path('.').rglob('*.md')):
              if '.git' in path.parts:
                  continue
              scanned.append(str(path))
              fence = None
              for lineno, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  stripped = line.lstrip()
                  if fence is None and (stripped.startswith('```') or stripped.startswith('~~~')):
                      fence = stripped[:3]
                      continue
                  if fence is not None:
                      if stripped.startswith(fence):
                          fence = None
                      continue
                  for segment in plain_segments(line):
                      for token in BAD:
                          if token in segment:
                              failures.append(f'{path}:{lineno}: unsupported delimiter {token}')

          if failures:
              print('Unsupported GitHub Markdown math delimiters found:', file=sys.stderr)
              print('\n'.join(failures), file=sys.stderr)
              raise SystemExit(1)
          print(f'Markdown math delimiter audit passed for {len(scanned)} file(s).')
          PY
          chmod +x "$export_root/scripts/check_markdown_math.py"

          cat > "$export_root/.github/workflows/markdown-math.yml" <<'YAML'
          name: Markdown math audit

          on:
            push:
              paths:
                - '**.md'
                - 'scripts/check_markdown_math.py'
                - '.github/workflows/markdown-math.yml'
            pull_request:
              paths:
                - '**.md'
                - 'scripts/check_markdown_math.py'
                - '.github/workflows/markdown-math.yml'

          permissions:
            contents: read

          jobs:
            audit:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Check GitHub Markdown math delimiters
                  run: python3 scripts/check_markdown_math.py
          YAML

      - name: Verify canonical export
        shell: bash
        run: |
          set -euo pipefail
          cd export_mobius_synthesis
          python3 scripts/check_markdown_math.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          imports = re.findall(r'^\s*import\s+(RHLean(?:\.[A-Za-z0-9_]+)+)', Path('RHLean.lean').read_text(), re.M)
          shipped = sorted(Path('RHLean').rglob('*.lean'))
          missing = []
          for module in imports:
              path = Path(*module.split('.')).with_suffix('.lean')
              if not path.is_file():
                  missing.append(f'{module} -> {path}')
          if missing:
              raise SystemExit('Missing root imports:\n' + '\n'.join(missing))
          if len(imports) != len(shipped):
              raise SystemExit(f'Root manifest has {len(imports)} imports for {len(shipped)} shipped modules')
          if len(set(imports)) != len(imports):
              raise SystemExit('Root manifest contains duplicate imports')
          print(f'Root manifest covers all {len(shipped)} shipped Lean modules exactly once.')
          PY
          bash scripts/audit_assumptions.sh
          lake build RHLean --wfail

      - name: Commit export-folder refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add export_mobius_synthesis
          if git diff --cached --quiet; then
            echo 'No export changes to commit.'
            exit 0
          fi
          git commit -m 'Refresh canonical Möbius synthesis export'
          git push origin HEAD:agent/export-mobius-synthesis-refresh
