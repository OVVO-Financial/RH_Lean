name: VF first-bad active raw-parent splice

on:
  pull_request:
    branches: [vf-first-bad-weighted-sector-six-aggregate]
    paths:
      - research/VF_MID_FIRST_BAD_ACTIVE_RAW_PARENT_SPLICE.lean
      - .github/workflows/vf-first-bad-active-raw-parent-splice.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Apply StrongPNT compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py
      - name: Restore StrongPNT port build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Prebuild StrongPNT dependency
        run: lake build StrongPNT.PNT5_Strong
      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-
            rhlean-build-${{ runner.os }}-
      - name: Build library imports
        run: |
          python3 - <<'PY'
          import subprocess
          import sys
          sys.path.insert(0, 'scripts')
          import compile_research_import_closure as closure
          seen, roots = set(), set()
          def visit(module):
              if module in seen:
                  return
              seen.add(module)
              source = closure.source_for(module)
              for dependency in closure.research_imports(source):
                  visit(dependency)
              for line in source.read_text().splitlines():
                  if line.startswith('import RHLean'):
                      roots.add(line.removeprefix('import ').strip())
          visit('research.VF_MID_FIRST_BAD_ACTIVE_RAW_PARENT_SPLICE')
          subprocess.run(['lake', 'build', *sorted(roots)], check=True)
          PY
      - name: Compile and audit active raw-parent splice
        run: |
          python3 scripts/compile_research_import_closure.py research/VF_MID_FIRST_BAD_ACTIVE_RAW_PARENT_SPLICE.lean
          cat > /tmp/VF_ACTIVE_RAW_PARENT_SPLICE_AUDIT.lean <<'EOF'
          import «research.VF_MID_FIRST_BAD_ACTIVE_RAW_PARENT_SPLICE»
          #print axioms RHLean.Analysis.vfMidActiveReturnedPairCarrier_subset_offDiagonal
          #print axioms RHLean.Analysis.vfMidActiveScaledReturnedClippedCellMass_eq_offDiagonal
          #print axioms RHLean.Analysis.vfMidActiveScaledReturnedClippedCellMass_eq_ownerFibers
          #print axioms RHLean.Analysis.vfMidActiveScaledReturnedClippedCellMass_eq_rawParents
          #print axioms RHLean.Analysis.sum_vfMidRawParents_eq_completed_add_incomplete
          #print axioms RHLean.Analysis.vfMidActiveScaledReturnedClippedCellMass_eq_completed_add_incomplete
          #print axioms RHLean.Analysis.vfMidActiveReturnedPairWeight_secondMixed_eq_zero_of_completed
          #print axioms RHLean.Analysis.vfMidActiveReturnedPairWeight_firstMixed_eq_zero_of_completed
          #print axioms RHLean.Analysis.vfMidActiveReturnedRawParentFiberMass_eq_zero_of_completed
          #print axioms RHLean.Analysis.vfMidActiveScaledReturnedClippedCellMass_eq_incompleteRawParents
          #print axioms RHLean.Analysis.vfMidActiveScaledReturnedClippedCellMass_eq_sixOrientedSectors
          #print axioms RHLean.Analysis.sum_vfMidActiveWeightedCellExcess_le_two_sixOrientedBoundary
          #print axioms RHLean.Analysis.vfMidFirstBadAnchoredCoDivExcess_le_activeResidual_add_two_sixBoundary
          #print axioms RHLean.Analysis.vfMidFirstBadNNSNormalizedCovariance_le_half_of_activeSixBoundaryBudget
          #print axioms RHLean.Analysis.vfMidActualPrimeFirstBadAt_two_succ_false_of_activeSixBoundaryBudget
          EOF
          lake env lean -DwarningAsError=true /tmp/VF_ACTIVE_RAW_PARENT_SPLICE_AUDIT.lean | tee active-raw-parent-splice-axioms.log
          if grep -q 'sorryAx' active-raw-parent-splice-axioms.log; then exit 1; fi
