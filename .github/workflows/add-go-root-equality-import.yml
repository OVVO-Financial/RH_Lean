name: Add Go root equality import once

on:
  push:
    branches: [agent/go-crossing-global-partner]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add sorted import and remove this workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('RHLean.lean')
          target = 'import RHLean.Proof.SquareRootLowPrimeGoRootEqualityBoundary'
          lines = [x.strip() for x in p.read_text().splitlines() if x.strip()]
          if target not in lines:
              lines.append(target)
          p.write_text('\n'.join(sorted(lines)) + '\n')
          PY
          rm .github/workflows/add-go-root-equality-import.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RHLean.lean .github/workflows/add-go-root-equality-import.yml
          git commit -m 'Import Go root equality boundary module'
          git push
