name: Pinned Alpoge geometric source construction

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/alpoge-geometric-source-audit.yml'
      - 'scripts/alpoge_geometric_source_audit/AlpogeGeometryInputClosure.lean'
      - 'scripts/alpoge_geometric_source_audit/AlpogeShortConstructorClosure.lean'
      - 'scripts/alpoge_geometric_source_audit/AlpogeGeometryAxiomGuard.lean'
      - 'scripts/alpoge_geometric_source_audit/alpoge_geometric_closure_manifest.json'
      - 'scripts/alpoge_geometric_source_audit/audit_alpoge_geometric_closure.py'
      - 'scripts/alpoge_geometric_source_audit/verify_alpoge_axiom_log.py'
      - 'scripts/alpoge_geometric_source_audit/run_alpoge_geometric_audit.sh'

permissions:
  contents: read

concurrency:
  group: alpoge-geometric-source-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  geometric-source:
    name: Fresh original-source geometric constructors and axioms
    runs-on: ubuntu-latest
    # This selected closure has 52,223 source modules. Its result is separate
    # from RH_Lean's native-version build and never substitutes for that gate.
    timeout-minutes: 360
    steps:
      - name: Check out audit code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out pinned original Lean sources
        uses: actions/checkout@v4
        with:
          repository: CocoSgt/riemann-hypothesis-lean
          ref: 7cbf7a0c32fca1badf05931879a37c3f8a2b03b4
          path: upstream-geometric-source
          persist-credentials: false

      - name: Record source pin and runner capacity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream-geometric-source rev-parse HEAD)" = 7cbf7a0c32fca1badf05931879a37c3f8a2b03b4
          df -h . "$RUNNER_TEMP"
          free -h

      - name: Restore the exact original compiler
        id: compiler
        uses: actions/cache/restore@v5
        with:
          path: ~/.elan/toolchains
          key: alpoge-source-compiler-v1-${{ runner.os }}-${{ runner.arch }}-lean-4.33.1

      - name: Install the exact original compiler
        working-directory: upstream-geometric-source
        run: bash ../scripts/ci/install_pinned_lean_retry.sh

      - name: Save the verified original compiler
        if: steps.compiler.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.elan/toolchains
          key: alpoge-source-compiler-v1-${{ runner.os }}-${{ runner.arch }}-lean-4.33.1

      - name: Build selected constructors from fresh source and check axioms
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/alpoge_geometric_source_audit/run_alpoge_geometric_audit.sh \
            "$GITHUB_WORKSPACE/upstream-geometric-source" \
            "$RUNNER_TEMP/alpoge-geometric-construction"

      - name: Preserve source, build, and axiom receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-geometric-construction-receipts
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/alpoge-geometric-construction.static-source-report.json
            ${{ runner.temp }}/alpoge-geometric-construction/source-audit-receipt.json
            ${{ runner.temp }}/alpoge-geometric-construction/dependency-cache.log
            ${{ runner.temp }}/alpoge-geometric-construction/fresh-source-build.log
            ${{ runner.temp }}/alpoge-geometric-construction/geometric-axiom-audit.log
            ${{ runner.temp }}/alpoge-geometric-construction/geometric-axiom-report.json
