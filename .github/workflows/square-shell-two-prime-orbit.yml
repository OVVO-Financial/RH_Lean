name: Square-shell two-prime orbit Lean

on:
  pull_request:
    branches: [main]
    paths:
      - "research/SQUARE_SHELL_TWO_PRIME_ORBIT_20261018.lean"
      - ".github/workflows/square-shell-two-prime-orbit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Apply StrongPNT Lean 4.24 patches
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py
      - name: Restore StrongPNT build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Prebuild StrongPNT
        run: lake build StrongPNT.PNT5_Strong
      - name: Restore RHLean cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-
            rhlean-build-${{ runner.os }}-
      - name: Build research import closure
        run: |
          mkdir -p .lake/build/lib/lean
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_DYADIC_PREFIX_OWNER.olean research/VF_MID_DYADIC_PREFIX_OWNER.lean
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_DYADIC_OWNER_EXACT.olean research/VF_MID_DYADIC_OWNER_EXACT.lean
      - name: Check two-prime orbit obstruction with warnings fatal
        run: |
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.SQUARE_SHELL_TWO_PRIME_ORBIT_20261018.olean research/SQUARE_SHELL_TWO_PRIME_ORBIT_20261018.lean
      - name: Audit no new axioms
        run: |
          printf 'import «research.SQUARE_SHELL_TWO_PRIME_ORBIT_20261018»\n#print axioms RHLean.Analysis.squareShell_activeDivisorFactors_incomparable\n#print axioms RHLean.Analysis.squareShell_twoPrimeOrbit_moebius_eq\n#print axioms RHLean.Analysis.squareShell_twoPrimeOrbit_pairProduct_eq_sq\n#print axioms RHLean.Analysis.squareShell_twoPrimeOrbit_pairProduct_pos\n' >/tmp/square_shell_two_prime_axioms.lean
          lake env lean -DwarningAsError=true /tmp/square_shell_two_prime_axioms.lean
