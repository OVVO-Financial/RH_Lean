name: Fix source-scale daughter product manifest

on:
  push:
    branches:
      - agent/source-scale-daughter-product

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/source-scale-daughter-product
      - name: Add and sort root import
        run: python3 -c "from pathlib import Path; p=Path('RHLean.lean'); xs=[x for x in p.read_text().splitlines() if x.strip()]; imp='import RHLean.Proof.LowWheelFrozenSourceScaleDaughterProduct'; xs.append(imp) if imp not in xs else None; p.write_text('\\n'.join(sorted(xs))+'\\n')"
      - name: Commit manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RHLean.lean
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Export source-scale daughter product theorem'
          git push origin HEAD:agent/source-scale-daughter-product
