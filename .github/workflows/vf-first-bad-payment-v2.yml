name: VF first-bad v2 minimal fast

on:
  pull_request:
    branches: [main]
    paths:
      - research/VF_MID_FIRST_BAD_PAYMENT_V2_KERNEL.lean
      - research/VF_MID_FIRST_BAD_PAYMENT_V2_NATIVE_CONSUMER.lean
      - research/VF_MID_FIRST_BAD_ACTUAL_ADMISSIBILITY_CERTIFICATE.lean
      - scripts/vf_mid_first_bad_payment_v2_test.py
      - scripts/vf_mid_918_crossblock_moments.py
      - scripts/vf_mid_918_owner_matched_probe.py
      - .github/workflows/vf-first-bad-payment-v2.yml
  workflow_dispatch:
    inputs:
      deep_native:
        description: "Opt into slow native StrongPNT/research closure check"
        required: false
        default: false
        type: boolean
      crossblock_moments:
        description: "Opt into actual-prime full Co/Div matrices and owner matching (~5s compute after optional Python dependency setup)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: vf-first-bad-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Test first. No Lean toolchain, no third-party Python packages,
  # no StrongPNT, no workflow warmup. Runs in seconds.
  actual-primes:
    name: Actual primes and exact original NNS (seconds)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Full actual-prime audit to square root R=6000
        run: python3 -B scripts/vf_mid_first_bad_payment_v2_test.py --extended --floor-li
      - name: Exact historical sieve counterattack against prime drought
        run: python3 -B scripts/vf_mid_918_adversarial_sieve_duel.py
      - name: Syntax check opt-in matrix and genuine owner probes without external packages
        run: |
          python3 -m py_compile scripts/vf_mid_918_crossblock_moments.py
          python3 -m py_compile scripts/vf_mid_918_owner_matched_probe.py

  # Isolated algebraic Lean file, Mathlib ONLY. It cannot import
  # the 30+ files from the old #915 branch or compile StrongPNT5.
  algebraic-lean:
    name: Parity-contract Lean only (Mathlib cache)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Reject proof holes
        run: |
          if grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' \
            research/VF_MID_FIRST_BAD_PAYMENT_V2_KERNEL.lean; then
            echo "Proof holes or new axioms prohibited"
            exit 1
          fi
      - name: Restore pinned package download
        uses: actions/cache/restore@v4
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Get Lean and prebuilt Mathlib
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Compile exact signed parity/NNS kernel, warnings fatal
        run: |
          mkdir -p .lake/build/lib/lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.VF_MID_FIRST_BAD_PAYMENT_V2_KERNEL.olean \
            research/VF_MID_FIRST_BAD_PAYMENT_V2_KERNEL.lean
      - name: Check Lean declarations and axioms
        run: |
          cat > /tmp/vf_v2_acceptance.lean <<'LEAN'
          import «research.VF_MID_FIRST_BAD_PAYMENT_V2_KERNEL»
          #check RHLean.Analysis.vfV2Upper_sub_lower_eq_neg_next
          #check RHLean.Analysis.vfV2Upper_add_lower_eq_original_abs
          #check RHLean.Analysis.vfV2Balance_eq_originalMass_sub_two_next_sq
          #check RHLean.Analysis.vfV2Payment_iff_exactSignedBalance
          #check RHLean.Analysis.vfV2Payment_iff_twoSector
          #check RHLean.Analysis.vfV2LiPlus_actual
          #check RHLean.Analysis.vfV2LiMinus_actual
          #check RHLean.Analysis.vfV2Balance_factor
          #check RHLean.Analysis.vfV2Payment_of_floorLi_actual_signed_bounds
          #check RHLean.Analysis.vfV2OddCohortFloorLi_restores_primeError
          #check RHLean.Analysis.vfV2HistoricalPositiveWallClearance
          #check RHLean.Analysis.vfV2HistoricalNegativeWallClearance
          #check RHLean.Analysis.vfV2PositiveFirstBad_requires_historicalPrimeLiExcess
          #check RHLean.Analysis.vfV2NegativeFirstBad_requires_historicalPrimeLiDeficit
          #print axioms RHLean.Analysis.vfV2Payment_of_floorLi_actual_signed_bounds
          #check RHLean.Analysis.vfV2HistoricalPrefixLocksPrime
          #check RHLean.Analysis.vfV2HistoricalDrought_iff_completeFactorCover
          #check RHLean.Analysis.vfV2FiniteOwnerUnion_card_le_sum
          #check RHLean.Analysis.vfV2PartialWheelForcedPrimeLower
          #print axioms RHLean.Analysis.vfV2HistoricalPrefixLocksPrime
          #print axioms RHLean.Analysis.vfV2PartialWheelForcedPrimeLower
          #check RHLean.Analysis.vfV2FirstBad_requires_strictCurrentDeviation
          #check RHLean.Analysis.vfV2FirstBad_positive_outward
          #check RHLean.Analysis.vfV2FirstBad_negative_outward
          #check RHLean.Analysis.vfV2FirstBad_outward_orientation
          #check RHLean.Analysis.vfV2PriorGoodEvenNextGood_doesNotForcePhi_nonneg
          #print axioms RHLean.Analysis.vfV2FirstBad_outward_orientation
          #print axioms RHLean.Analysis.vfV2PriorGoodEvenNextGood_doesNotForcePhi_nonneg
          #check RHLean.Analysis.vfV2SixBudget_eq_originalExcess_add_pairCorrection
          #check RHLean.Analysis.vfV2SixPairCorrection_nonneg
          #check RHLean.Analysis.vfV2SixBudget_pos_of_originalExcess_pos
          #print axioms RHLean.Analysis.vfV2SixBudget_eq_originalExcess_add_pairCorrection
          #print axioms RHLean.Analysis.vfV2SixBudget_pos_of_originalExcess_pos
          #check RHLean.Analysis.vfV2NoUnconditionalAllStateCone
          #check RHLean.Analysis.vfV2SparseCofactorBeforeHalfAnchor
          #check RHLean.Analysis.vfV2SparseFourFactorImpossible
          #check RHLean.Analysis.vfV2SparseOwnerFubini
          #check RHLean.Analysis.vfV2SparseOwnerFloorLiResidual
          #check RHLean.Analysis.vfV2SparseCoDivFullCrossTerms
          #check RHLean.Analysis.vfV2HighFactorOneOddChildPerOpenBlock
          #check RHLean.Analysis.vfV2HighParentChargeOnceFubini
          #check RHLean.Analysis.vfV2HighParentRepeatedChargeOvercount
          #check RHLean.Analysis.vfV2GenericUnitStepCount_succ
          #check RHLean.Analysis.vfV2GenericUnitStepCount_monotone
          #check RHLean.Analysis.vfV2FiniteActualPrimeNonprimePopulation
          #check RHLean.Analysis.vfV2FiniteActualPrimeSignedSeatMass
          #check RHLean.Analysis.vfV2UniqueOwnerFiniteFubini
          #check RHLean.Analysis.vfV2UniqueOwnerOnceCharge
          #print axioms RHLean.Analysis.vfV2UniqueOwnerFiniteFubini
          #print axioms RHLean.Analysis.vfV2UniqueOwnerOnceCharge
          #print axioms RHLean.Analysis.vfV2HighParentChargeOnceFubini
          #print axioms RHLean.Analysis.vfV2HighParentRepeatedChargeOvercount
          #print axioms RHLean.Analysis.vfV2SparseCofactorBeforeHalfAnchor
          #print axioms RHLean.Analysis.vfV2HighFactorOneOddChildPerOpenBlock
          #print axioms RHLean.Analysis.vfV2Payment_iff_exactSignedBalance
          #check RHLean.Analysis.vfV2HighPrimeFactorUniqueOnOpenSquare
          #check RHLean.Analysis.vfV2HighPrimeParentPrecedesCurrentSquare
          #check RHLean.Analysis.vfV2AgeCohortNativeMass_sum
          #check RHLean.Analysis.vfV2AgeCohortNativeMass_disjoint
          #check RHLean.Analysis.vfV2AgeFourCohortFullGram
          #check RHLean.Analysis.vfV2FourAgeCohorts_do_not_create_restoringMass
          #check RHLean.Analysis.vfV2AgeCohortReferenceDifference
          #check RHLean.Analysis.vfV2StrictPastRoots_lt_current
          #check RHLean.Analysis.vfV2BlockFlux_telescope
          #check RHLean.Analysis.vfV2DelayedFlux_eq_futureBlockSum
          #check RHLean.Analysis.vfV2CurrentPlusDelayedFlux
          #check RHLean.Analysis.vfV2DelayedMovingWallClearance
          #check RHLean.Analysis.vfV2JointDelayedFluxCell_sum
          #check RHLean.Analysis.vfV2NoUniversalDelayedInwardFlux
          #print axioms RHLean.Analysis.vfV2HighPrimeFactorUniqueOnOpenSquare
          #print axioms RHLean.Analysis.vfV2AgeCohortNativeMass_sum
          #print axioms RHLean.Analysis.vfV2DelayedMovingWallClearance
          #print axioms RHLean.Analysis.vfV2JointDelayedFluxCell_sum
          #print axioms RHLean.Analysis.vfV2NoUniversalDelayedInwardFlux
          #print axioms RHLean.Analysis.vfV2NoUnconditionalAllStateCone
          LEAN
          lake env lean -DwarningAsError=true /tmp/vf_v2_acceptance.lean

  # The expensive native first-bad dependency graph is deliberately
  # NOT part of the fast pull_request/push path. Run manually on demand.
  native-deep-opt-in:
    name: Optional full native consumer (manual, cached)
    if: github.event_name == 'workflow_dispatch' && inputs.deep_native
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reject native consumer proof holes
        run: |
          if grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' \
            research/VF_MID_FIRST_BAD_PAYMENT_V2_NATIVE_CONSUMER.lean \
            research/VF_MID_FIRST_BAD_ACTUAL_ADMISSIBILITY_CERTIFICATE.lean; then
            echo "Native consumer must have no proof holes or axioms"
            exit 1
          fi
      - name: Restore pinned Lake dependencies
        uses: actions/cache/restore@v4
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Apply existing pinned StrongPNT port
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py
      - name: Restore existing StrongPNT port cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Ensure preexisting StrongPNT terminal dependency
        run: |
          if [ ! -f .lake/packages/StrongPNT/.lake/build/lib/lean/StrongPNT/PNT5_Strong.olean ]; then
            lake build StrongPNT.PNT5_Strong
          fi
      - name: Restore cached RHLean native oleans
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-
      - name: Build main native library and compile consumer import closure
        run: |
          lake build RHLean
          python3 scripts/compile_research_import_closure.py \
            research/VF_MID_FIRST_BAD_PAYMENT_V2_NATIVE_CONSUMER.lean
          python3 scripts/compile_research_import_closure.py \
            research/VF_MID_FIRST_BAD_ACTUAL_ADMISSIBILITY_CERTIFICATE.lean
      - name: Verify the native target is explicitly conditional
        run: |
          cat > /tmp/vf_v2_native_acceptance.lean <<'LEAN'
          import «research.VF_MID_FIRST_BAD_PAYMENT_V2_NATIVE_CONSUMER»
          import «research.VF_MID_FIRST_BAD_ACTUAL_ADMISSIBILITY_CERTIFICATE»
          #check RHLean.Analysis.VFMidMinimalActualFirstBadPaymentV2Statement
          #check RHLean.Analysis.VFMidActualPrimeVerifiedStructuralRules
          #check RHLean.Analysis.vfV2ActualPrime_verifiedStructuralRules
          #check RHLean.Analysis.vfV2ActualSixSectorSignedMass
          #check RHLean.Analysis.vfV2ActualHighPrimeParent_genuine
          #check RHLean.Analysis.vfV2ActualHighPrimeAgeNativeMass_sum
          #check RHLean.Analysis.vfV2ActualSquareFloorLiFlux_eq_trueBlockCorrection
          #check RHLean.Analysis.vfV2ActualDelayedFlux_eq_genuineFutureCorrections
          #check RHLean.Analysis.vfV2ActualDefect_eq_backlog_plus_deterministicBridge
          #check RHLean.Analysis.vfV2ActualDelayedMovingWallIdentity
          #check RHLean.Analysis.vfV2ActualOccurrencePreservingReturn_closes_firstBad
          #print axioms RHLean.Analysis.vfV2ActualHighPrimeAgeNativeMass_sum
          #print axioms RHLean.Analysis.vfV2ActualDelayedMovingWallIdentity
          #check RHLean.Analysis.vfV2ActualPrime_allInside_of_noFirstBad_and_base
          #check RHLean.Analysis.vfV2ActualPrime_RH_of_signedOwnerRule_and_base
          #print axioms RHLean.Analysis.vfV2ActualPrime_RH_of_signedOwnerRule_and_base
          #check RHLean.Analysis.vfV2ActualFirstBad_originalExcess_pos
          #check RHLean.Analysis.vfV2ActualFirstBad_sixSectorBudget_pos
          #print axioms RHLean.Analysis.vfV2ActualFirstBad_sixSectorBudget_pos
          #check RHLean.Analysis.VFMidActualPrimeSignedOwnerEscapeRule
          #check RHLean.Analysis.vfV2ActualPrime_noFirstBad_of_signedOwnerEscapeRule
          #check RHLean.Analysis.vfV2ActualPrime_admissibilityStatus
          #print axioms RHLean.Analysis.vfV2ActualPrime_verifiedStructuralRules
          #print axioms RHLean.Analysis.vfV2ActualPrime_admissibilityStatus
          #check RHLean.Analysis.vfMidMinimalActualFirstBad_closed_of_exactPaymentV2
          #print axioms RHLean.Analysis.vfMidMinimalActualFirstBad_closed_of_exactPaymentV2
          LEAN
          lake env lean -DwarningAsError=true /tmp/vf_v2_native_acceptance.lean

  crossblock-moments-opt-in:
    name: Optional 5993-block actual-prime partial-moment matrices
    if: github.event_name == 'workflow_dispatch' && inputs.crossblock_moments
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Set up scientific Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated research dependencies
        run: python3 -m pip install --quiet numpy scipy mpmath
      - name: Compare all fixed-target raw/normalized NNS and Pearson lagged matrices
        run: |
          python3 -B scripts/vf_mid_918_crossblock_moments.py \
            --max-root 6000 --outdir vf918_crossblock
      - name: Count genuine cross-block odd prime-to-composite owner pairs
        run: python3 -B scripts/vf_mid_918_owner_matched_probe.py --sparse-full
      - name: Publish reproducible comparison dataset
        uses: actions/upload-artifact@v4
        with:
          name: vf918-crossblock-actual-primes
          path: |
            vf918_crossblock/*.csv
            vf918_crossblock/*.json
          if-no-files-found: error
