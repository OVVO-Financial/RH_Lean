name: Signed cell Stokes bridge check

on:
  push:
    branches: [agent/weighted-othello-stokes, agent/stokes-boundary-terminal]
  pull_request:
    branches: [main]
    paths:
      - research/GLOBAL_RETURNED_CORE_SIGNED_CELL_STOKES_BRIDGE.lean
      - research/GLOBAL_RETURNED_CORE_CANONICAL_SIGNED_STOKES.lean
      - research/GLOBAL_RETURNED_CORE_ITERATED_PAIR_STOKES.lean
      - research/GLOBAL_RETURNED_CORE_PAIR_WEIGHTED_OTHELLO_STOKES.lean
      - research/GLOBAL_RETURNED_CORE_WEIGHTED_OTHELLO_STOKES.lean
      - research/GLOBAL_RETURNED_CORE_STOKES_BOUNDARY_IDENTIFICATION.lean
      - research/GLOBAL_RETURNED_CORE_STOKES_CLIP_AMPLITUDE_FACTOR.lean
      - research/GLOBAL_RETURNED_CORE_STOKES_TERMINAL_CLASSIFICATION.lean
      - research/GLOBAL_RETURNED_CORE_STOKES_TWO_STEP_BOUNDARY_NORMAL_FORM.lean
      - research/GLOBAL_RETURNED_CORE_STOKES_CROSS_AMPLITUDE_NORMAL_FORM.lean
      - research/GLOBAL_RETURNED_CORE_STOKES_GLOBAL_IDENTIFICATION.lean
      - research/GLOBAL_RETURNED_CORE_STOKES_CORRECTED_WHEEL_IDENTIFICATION.lean
      - research/GLOBAL_RETURNED_CORE_STOKES_ENDPOINT_AMPLITUDE_IDENTIFICATION.lean
      - research/GLOBAL_RETURNED_CORE_STOKES_ALL_ENDPOINT_MERTENS_LEDGER.lean
      - research/GLOBAL_RETURNED_CORE_STOKES_NEAREST_SQUARE_ENDPOINT_LEDGER.lean
      - research/GLOBAL_RETURNED_CORE_STOKES_ARBITRARY_CLOCK_WHEEL.lean
      - research/GLOBAL_RETURNED_CORE_STOKES_NATURAL_PERIOD_WHEEL.lean
      - research/GLOBAL_RETURNED_CORE_STOKES_NATURAL_PERIODIC_RAW_REALIZATION.lean
      - research/GLOBAL_RETURNED_CORE_STOKES_NATURAL_CORRECTED_CONDUCTOR_PACKET.lean
      - research/GLOBAL_RETURNED_CORE_STOKES_NATURAL_COMMON_SPECTRUM_LEDGER.lean
      - research/GLOBAL_RETURNED_CORE_STOKES_COMMON_SPECTRUM_LEDGER.lean
      - research/GLOBAL_RETURNED_CORE_STOKES_PERIODIC_RAW_REALIZATION.lean
      - research/GLOBAL_RETURNED_CORE_STOKES_CORRECTED_CONDUCTOR_PACKET.lean
      - research/GLOBAL_RETURNED_CORE_FINAL_STOKES_RH_BRIDGE.lean
      - research/GLOBAL_RETURNED_CORE_STOKES_PHYSICAL_FRAME_BRIDGE.lean
      - research/GLOBAL_RETURNED_CORE_POST789_DIAGONAL_SUBTRACTED_CONTROL.lean
      - research/STOKES_ENDPOINT_MAX_ALIGNMENT.lean
      - research/STOKES_ENDPOINT_MAX_ALIGNMENT_FRAME.lean
      - .github/workflows/signed-cell-stokes-bridge.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Apply StrongPNT 4.24 compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py
      - name: Restore StrongPNT port build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Prebuild StrongPNT dependency
        run: lake build StrongPNT.PNT5_Strong
      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-
            rhlean-build-${{ runner.os }}-
      - name: Build algebraic dependencies
        run: |
          lake build RHLean.Proof.GlobalPrefixCarrierOthello
          lake build RHLean.Arithmetic.PrimeWheelMobiusRecovery
          lake build RHLean.Analysis.PrimeWheelConductorGram
          lake build RHLean.Analysis.PrimeWheelRawConductorCoefficient
          lake build RHLean.Analysis.PrimeWheelRawConductorWeight
          lake build RHLean.Analysis.CorrectedConductorBoundaryDefectGeneral
      - name: Emit returned-core dependency foundation through owner cube
        run: |
          mkdir -p .lake/build/lib/lean
          emit() { f="$1"; b="$(basename "$f" .lean)"; lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/research.${b}.olean" "$f"; }
          emit research/STABLE_FAR_RETURNED_FIBER_PRODUCTION.lean
          emit research/STABLE_FAR_RETURNED_FIBER_FUBINI.lean
          emit research/STABLE_FAR_RECIPROCAL_OWNER_FUBINI.lean
          emit research/STABLE_FAR_RETURNED_RECIPROCAL_FROZEN_WINDOW.lean
          emit research/CANONICAL_ROUGH_GLOBAL_BOUNDS.lean
          emit research/CANONICAL_ROUGH_Q2_TAIL_REDUCTION.lean
          emit research/LOW_OWNER_HIGH_Q2_SCALAR_CANCELLATION.lean
          emit research/LOW_OWNER_CHILD_FAR_NORMAL_FORM.lean
          emit research/LOW_OWNER_PHYSICAL_CENSUS_CORRELATION.lean
          emit research/STABLE_FAR_LOG_FREQUENCY_DIAGONALIZATION.lean
          emit research/STABLE_FAR_PERRON_RETURNED_FIBER_INTERFACE.lean
          emit research/STABLE_FAR_CRITICAL_Q2_ENERGY_MULTIPLIER.lean
          emit research/STABLE_FAR_PERRON_QUARTER_FRAME_BOUND.lean
          emit research/LOW_OWNER_PHYSICAL_AMPLITUDE_TRANSPORT.lean
          emit research/COVARIANCE_RECIPROCAL_OWNER_CONGESTION.lean
          emit research/LOW_OWNER_AMPLITUDE_MELLIN_LEDGER_SPLICE.lean
          emit research/AMPLITUDE_STOKES_MEMORY_SPLIT.lean
