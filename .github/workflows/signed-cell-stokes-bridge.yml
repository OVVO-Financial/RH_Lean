          emit research/DIRECT_SUM_DYADIC_DISPERSION_BRIDGE.lean
          emit research/DIRECT_SUM_LOW_FRESHNESS_ABEL.lean
          emit research/DIRECT_SUM_COUPLED_PACKET.lean
          emit research/DIRECT_SUM_COUPLED_FRESH_PRIME_RANGE_EXIT.lean
          emit research/DIRECT_SUM_COUPLED_RANGE_EXIT_COLLAPSE.lean
