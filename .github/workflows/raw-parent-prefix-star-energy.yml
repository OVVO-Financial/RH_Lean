          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.GLOBAL_RETURNED_CORE_RAW_PARENT_GLOBAL_AMPLITUDE_REASSEMBLY.olean \
            research/GLOBAL_RETURNED_CORE_RAW_PARENT_GLOBAL_AMPLITUDE_REASSEMBLY.lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.GLOBAL_RETURNED_CORE_THRESHOLD_MERTENS_WALL.olean \
            research/GLOBAL_RETURNED_CORE_THRESHOLD_MERTENS_WALL.lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.GLOBAL_RETURNED_CORE_RAW_PARENT_Q2_MERTENS_REASSEMBLY.olean \
            research/GLOBAL_RETURNED_CORE_RAW_PARENT_Q2_MERTENS_REASSEMBLY.lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.GLOBAL_RETURNED_CORE_RAW_PARENT_GLOBAL_ENDPOINT_GAP.olean \
            research/GLOBAL_RETURNED_CORE_RAW_PARENT_GLOBAL_ENDPOINT_GAP.lean
          lake env lean -DwarningAsError=true \
            research/GLOBAL_RETURNED_CORE_POST755_AMPLITUDE_CLOSURE.lean
