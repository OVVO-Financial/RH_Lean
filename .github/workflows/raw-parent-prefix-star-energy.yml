          research/ZERO_TARGET_MELLIN_FRESH_PRIME_SQUARE.lean
          research/ZERO_TARGET_MELLIN_PHYSICAL_LCM_STENCIL.lean
          research/ZERO_TARGET_PARTIAL_MOMENT_COVARIANCE.lean
          research/ZERO_TARGET_PERRON_RECIPROCAL_IDENTIFICATION.lean

      - name: Emit returned-core dependency foundation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/raw-parent-orbit-partition.yml').read_text()
          start_marker = '      - name: Emit returned-core dependency foundation\n'
          end_marker = '      - name: Check raw-parent Fubini\n'
          block = src.split(start_marker, 1)[1].split(end_marker, 1)[0]
          block = block.split('        run: |\n', 1)[1]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          Path('/tmp/raw-parent-foundation.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/raw-parent-foundation.sh

      - name: Emit raw-parent exact chain
        run: |
          emit() { f="$1"; b="$(basename "$f" .lean)"; lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/research.${b}.olean" "$f"; }
          emit research/GLOBAL_RETURNED_CORE_POLARIZATION_RAW_PARENT_FUBINI.lean
          emit research/GLOBAL_RETURNED_CORE_RAW_PARENT_ORBIT_PARTITION.lean
          emit research/GLOBAL_RETURNED_CORE_RAW_PARENT_FOUR_CORNER_OCCUPANCY.lean
