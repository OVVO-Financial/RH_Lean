name: Raw-parent prefix-star energy check

on:
  pull_request:
    branches: [main]
    paths:
      - research/GLOBAL_RETURNED_CORE_RAW_PARENT_PREFIX_STAR.lean
      - research/GLOBAL_RETURNED_CORE_RAW_PARENT_PREFIX_STAR_ENERGY.lean
      - research/GLOBAL_RETURNED_CORE_RAW_PARENT_BRANCH_SQUARES.lean
      - research/GLOBAL_RETURNED_CORE_RAW_PARENT_BRANCH_ENERGY_NORMAL_FORM.lean
      - research/GLOBAL_RETURNED_CORE_RAW_PARENT_THRESHOLD_ORBIT_AMPLITUDE.lean
      - research/GLOBAL_RETURNED_CORE_RAW_PARENT_INERT_EQ_TAIL.lean
      - research/GLOBAL_RETURNED_CORE_RAW_PARENT_FULL_BRANCH_CURRENCY.lean
      - research/GLOBAL_RETURNED_CORE_RAW_PARENT_SAME_BRANCH_NONNEG.lean
      - research/GLOBAL_RETURNED_CORE_RAW_PARENT_BRANCH_CROSS_AMPLITUDE.lean
      - research/GLOBAL_RETURNED_CORE_RAW_PARENT_INCIDENCE_AMPLITUDE_FUBINI.lean
      - research/GLOBAL_RETURNED_CORE_RAW_PARENT_GLOBAL_AMPLITUDE_REASSEMBLY.lean
      - research/GLOBAL_RETURNED_CORE_THRESHOLD_MERTENS_WALL.lean
      - research/GLOBAL_RETURNED_CORE_RAW_PARENT_Q2_MERTENS_REASSEMBLY.lean
      - research/GLOBAL_RETURNED_CORE_RAW_PARENT_GLOBAL_ENDPOINT_GAP.lean
      - research/GLOBAL_RETURNED_CORE_POST755_AMPLITUDE_CLOSURE.lean
      - research/GLOBAL_RETURNED_CORE_VIRTUAL_OWNER_HALF_GATE.lean
      - research/GLOBAL_RETURNED_CORE_RAW_PARENT_ENDPOINT_CORRECTION_SUPPORT.lean
      - research/GLOBAL_RETURNED_CORE_DIRICHLET_THRESHOLD_ENDPOINT_CORRECTION.lean
      - research/GLOBAL_RETURNED_CORE_RAW_PARENT_DIRICHLET_INCIDENCE_GATE.lean
      - .github/workflows/raw-parent-prefix-star-energy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Restore PNT+ build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Prebuild PNT+ StrongPNT dependency
        run: lake build PrimeNumberTheoremAnd.StrongPNT

      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-

      - name: Build RHLean modules imported by these research checks
        run: >-
          python3 scripts/compile_research_import_closure.py --library-only
          research/AMPLITUDE_GLOBAL_PHYSICAL_DEFECT_LEDGER.lean
          research/AMPLITUDE_RECIPROCAL_DROP_PHYSICAL_DEFECT.lean
          research/AMPLITUDE_RETURNED_FIBER_PHYSICAL_BRIDGE.lean
          research/AMPLITUDE_STOKES_MEMORY_SPLIT.lean
          research/CANONICAL_DESCENDING_PRIME_CHRONOLOGY.lean
          research/CANONICAL_ROUGH_GLOBAL_BOUNDS.lean
          research/CANONICAL_ROUGH_Q2_TAIL_REDUCTION.lean
          research/COVARIANCE_RECIPROCAL_OWNER_CONGESTION.lean
          research/DIRECT_SUM_COUPLED_FRESH_PRIME_RANGE_EXIT.lean
          research/DIRECT_SUM_COUPLED_PACKET.lean
          research/DIRECT_SUM_COUPLED_RANGE_EXIT_COLLAPSE.lean
          research/DIRECT_SUM_DYADIC_DISPERSION_BRIDGE.lean
          research/DIRECT_SUM_FRESH_PRIME_GLOBAL_COLLAPSE.lean
          research/DIRECT_SUM_FRESH_PRIME_STOKES_PRE_SQUARE.lean
          research/DIRECT_SUM_LOW_FRESHNESS_ABEL.lean
