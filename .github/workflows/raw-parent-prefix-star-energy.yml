name: Raw-parent prefix-star energy check

on:
  pull_request:
    branches: [main]
    paths:
      - research/GLOBAL_RETURNED_CORE_RAW_PARENT_PREFIX_STAR.lean
      - research/GLOBAL_RETURNED_CORE_RAW_PARENT_PREFIX_STAR_ENERGY.lean
      - research/GLOBAL_RETURNED_CORE_RAW_PARENT_BRANCH_SQUARES.lean
      - research/GLOBAL_RETURNED_CORE_RAW_PARENT_BRANCH_ENERGY_NORMAL_FORM.lean
      - research/GLOBAL_RETURNED_CORE_RAW_PARENT_THRESHOLD_ORBIT_AMPLITUDE.lean
      - research/GLOBAL_RETURNED_CORE_RAW_PARENT_INERT_EQ_TAIL.lean
      - research/GLOBAL_RETURNED_CORE_RAW_PARENT_FULL_BRANCH_CURRENCY.lean
      - research/GLOBAL_RETURNED_CORE_RAW_PARENT_SAME_BRANCH_NONNEG.lean
      - research/GLOBAL_RETURNED_CORE_RAW_PARENT_BRANCH_CROSS_AMPLITUDE.lean
      - research/GLOBAL_RETURNED_CORE_RAW_PARENT_INCIDENCE_AMPLITUDE_FUBINI.lean
      - research/GLOBAL_RETURNED_CORE_RAW_PARENT_GLOBAL_AMPLITUDE_REASSEMBLY.lean
      - research/GLOBAL_RETURNED_CORE_THRESHOLD_MERTENS_WALL.lean
      - research/GLOBAL_RETURNED_CORE_RAW_PARENT_Q2_MERTENS_REASSEMBLY.lean
      - research/GLOBAL_RETURNED_CORE_RAW_PARENT_GLOBAL_ENDPOINT_GAP.lean
      - research/GLOBAL_RETURNED_CORE_RAW_PARENT_ENDPOINT_CORRECTION_SUPPORT.lean
      - research/GLOBAL_RETURNED_CORE_DIRICHLET_THRESHOLD_ENDPOINT_CORRECTION.lean
      - research/GLOBAL_RETURNED_CORE_RAW_PARENT_DIRICHLET_INCIDENCE_GATE.lean
      - .github/workflows/raw-parent-prefix-star-energy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Apply StrongPNT 4.24 compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py

      - name: Restore StrongPNT port build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-

      - name: Prebuild StrongPNT dependency
        run: lake build StrongPNT.PNT5_Strong

      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-
            rhlean-build-${{ runner.os }}-

      - name: Emit returned-core dependency foundation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/raw-parent-orbit-partition.yml').read_text()
          start_marker = '      - name: Emit returned-core dependency foundation\n'
          end_marker = '      - name: Check raw-parent Fubini\n'
          block = src.split(start_marker, 1)[1].split(end_marker, 1)[0]
          block = block.split('        run: |\n', 1)[1]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          Path('/tmp/raw-parent-foundation.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/raw-parent-foundation.sh

      - name: Emit raw-parent exact chain
        run: |
          emit() { f="$1"; b="$(basename "$f" .lean)"; lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/research.${b}.olean" "$f"; }
          emit research/GLOBAL_RETURNED_CORE_POLARIZATION_RAW_PARENT_FUBINI.lean
          emit research/GLOBAL_RETURNED_CORE_RAW_PARENT_ORBIT_PARTITION.lean
          emit research/GLOBAL_RETURNED_CORE_RAW_PARENT_FOUR_CORNER_OCCUPANCY.lean
          emit research/GLOBAL_RETURNED_CORE_RAW_PARENT_VIRTUAL_CUBE_SPLICE.lean
          emit research/GLOBAL_RETURNED_CORE_RAW_PARENT_FULL_ORBIT_RECURSION.lean
          emit research/GLOBAL_RETURNED_CORE_RAW_PARENT_INERT_PERSISTENCE.lean
          emit research/GLOBAL_RETURNED_CORE_RAW_PARENT_INERT_OWNER_FUBINI.lean
          emit research/GLOBAL_RETURNED_CORE_RAW_PARENT_INERT_DIAGONAL_BOUND.lean
          emit research/GLOBAL_RETURNED_CORE_SIGNED_INCIDENCE_ENERGY_GATE.lean
          emit research/GLOBAL_RETURNED_CORE_RAW_PARENT_COMPLETED_GATE_SPLIT.lean
          emit research/GLOBAL_RETURNED_CORE_RAW_PARENT_INCOMPLETE_CLASSIFICATION.lean
          emit research/GLOBAL_RETURNED_CORE_RAW_PARENT_INCOMPLETE_FUBINI.lean
          emit research/GLOBAL_RETURNED_CORE_RAW_PARENT_BOUNDARY_NORMAL_FORM.lean
          emit research/GLOBAL_RETURNED_CORE_RAW_PARENT_DIRICHLET_INCIDENCE_GATE.lean
          emit research/GLOBAL_RETURNED_CORE_DIRICHLET_THRESHOLD_ENDPOINT_CORRECTION.lean
          emit research/GLOBAL_RETURNED_CORE_RAW_PARENT_ENDPOINT_CORRECTION_SUPPORT.lean
          lake build RHLean.Proof.GlobalPrefixCarrierOthello
          emit research/GLOBAL_RETURNED_CORE_WEIGHTED_OTHELLO_STOKES.lean
          emit research/GLOBAL_RETURNED_CORE_PAIR_WEIGHTED_OTHELLO_STOKES.lean
          emit research/GLOBAL_RETURNED_CORE_ITERATED_PAIR_STOKES.lean
          emit research/GLOBAL_RETURNED_CORE_SIGNED_CELL_STOKES_BRIDGE.lean
          emit research/GLOBAL_RETURNED_CORE_CANONICAL_SIGNED_STOKES.lean
          emit research/GLOBAL_RETURNED_CORE_STOKES_BOUNDARY_IDENTIFICATION.lean
          emit research/GLOBAL_RETURNED_CORE_STOKES_TERMINAL_CLASSIFICATION.lean
          emit research/GLOBAL_RETURNED_CORE_STOKES_TWO_STEP_BOUNDARY_NORMAL_FORM.lean
          emit research/GLOBAL_RETURNED_CORE_STOKES_CROSS_AMPLITUDE_NORMAL_FORM.lean
          emit research/GLOBAL_RETURNED_CORE_STOKES_GLOBAL_IDENTIFICATION.lean
          emit research/GLOBAL_RETURNED_CORE_FIRST_OWNER_CELL_SUM.lean
          emit research/GLOBAL_RETURNED_CORE_FIRST_OWNER_GRAM_TO_CELLS.lean
          emit research/GLOBAL_RETURNED_CORE_SIGNED_OWNER_TELESCOPE.lean
          emit research/GLOBAL_RETURNED_CORE_STOKES_ENDPOINT_AMPLITUDE_IDENTIFICATION.lean
          emit research/GLOBAL_RETURNED_CORE_STOKES_ALL_ENDPOINT_MERTENS_LEDGER.lean
          emit research/GLOBAL_RETURNED_CORE_RAW_PARENT_PREFIX_STAR.lean
          emit research/GLOBAL_RETURNED_CORE_RAW_PARENT_PREFIX_STAR_ENERGY.lean
          emit research/GLOBAL_RETURNED_CORE_RAW_PARENT_BRANCH_SQUARES.lean
          emit research/GLOBAL_RETURNED_CORE_RAW_PARENT_INERT_EQ_TAIL.lean
          emit research/GLOBAL_RETURNED_CORE_RAW_PARENT_FULL_BRANCH_CURRENCY.lean
          emit research/GLOBAL_RETURNED_CORE_RAW_PARENT_SAME_BRANCH_NONNEG.lean
          emit research/GLOBAL_RETURNED_CORE_EMITTED_RECIPROCAL_CHARGE.lean
          emit research/GLOBAL_RETURNED_CORE_UNIQUE_OWNER_CONTINUATION_LEDGER.lean
          emit research/GLOBAL_RETURNED_CORE_OWNER_PARENT_CONTINUATION.lean
          emit research/GLOBAL_RETURNED_CORE_INHERITED_DETERMINISTIC_CANCELLATION.lean
          emit research/GLOBAL_RETURNED_CORE_DIAGONAL_BOUND.lean

      - name: Kernel-check branch currency, orbit, and cross-amplitude gate
        run: |
          lake env lean -DwarningAsError=true \
            research/GLOBAL_RETURNED_CORE_RAW_PARENT_BRANCH_ENERGY_NORMAL_FORM.lean
          lake env lean -DwarningAsError=true \
            research/GLOBAL_RETURNED_CORE_RAW_PARENT_THRESHOLD_ORBIT_AMPLITUDE.lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.GLOBAL_RETURNED_CORE_RAW_PARENT_BRANCH_CROSS_AMPLITUDE.olean \
            research/GLOBAL_RETURNED_CORE_RAW_PARENT_BRANCH_CROSS_AMPLITUDE.lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.GLOBAL_RETURNED_CORE_RAW_PARENT_INCIDENCE_AMPLITUDE_FUBINI.olean \
            research/GLOBAL_RETURNED_CORE_RAW_PARENT_INCIDENCE_AMPLITUDE_FUBINI.lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.GLOBAL_RETURNED_CORE_INHERITED_MIXED_CLOCK_L2.olean \
            research/GLOBAL_RETURNED_CORE_INHERITED_MIXED_CLOCK_L2.lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.GLOBAL_RETURNED_CORE_RAW_PARENT_GLOBAL_AMPLITUDE_REASSEMBLY.olean \
            research/GLOBAL_RETURNED_CORE_RAW_PARENT_GLOBAL_AMPLITUDE_REASSEMBLY.lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.GLOBAL_RETURNED_CORE_THRESHOLD_MERTENS_WALL.olean \
            research/GLOBAL_RETURNED_CORE_THRESHOLD_MERTENS_WALL.lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.GLOBAL_RETURNED_CORE_RAW_PARENT_Q2_MERTENS_REASSEMBLY.olean \
            research/GLOBAL_RETURNED_CORE_RAW_PARENT_Q2_MERTENS_REASSEMBLY.lean
          lake env lean -DwarningAsError=true \
            research/GLOBAL_RETURNED_CORE_RAW_PARENT_GLOBAL_ENDPOINT_GAP.lean
