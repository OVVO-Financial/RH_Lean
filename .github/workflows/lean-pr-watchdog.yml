name: Lean PR watchdog

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**/*.lean'
      - '*.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - '.github/workflows/lean.yml'
      - '.github/workflows/lean-pr-watchdog.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: lean-pr-watchdog
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch missing Lean verification
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflowId = 'lean.yml';

            const isLeanRelevant = (filename) =>
              filename.endsWith('.lean') ||
              filename === 'lean-toolchain' ||
              filename === 'lake-manifest.json' ||
              filename === '.github/workflows/lean.yml' ||
              filename === '.github/workflows/lean-pr-watchdog.yml';

            let pullRequests;
            if (context.eventName === 'pull_request_target') {
              pullRequests = [context.payload.pull_request];
            } else {
              pullRequests = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'open',
                per_page: 100
              });
            }

            const workflowRuns = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id: workflowId,
                per_page: 100
              }
            );

            for (const pr of pullRequests) {
              try {
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  owner,
                  repo,
                  pull_number: pr.number,
                  per_page: 100
                });

                if (!files.some((file) => isLeanRelevant(file.filename))) {
                  core.info(`PR #${pr.number} has no Lean-relevant changes.`);
                  continue;
                }

                const commitResponse = await github.rest.repos.getCommit({
                  owner,
                  repo,
                  ref: pr.head.sha
                });
                const commit = commitResponse.data.commit;
                const commitDate = new Date(
                  commit.committer?.date || commit.author?.date || 0
                );
                const expectedTitle = `Lean verification for PR #${pr.number}`;

                const covered = workflowRuns.some((run) => {
                  const samePullRequest = (run.pull_requests || [])
                    .some((item) => item.number === pr.number);
                  const sameTitle = run.display_title === expectedTitle;
                  const fresh = new Date(run.created_at) >= commitDate;
                  const usable = run.conclusion !== 'cancelled' &&
                    run.conclusion !== 'skipped';
                  return fresh && usable && (samePullRequest || sameTitle);
                });

                if (covered) {
                  core.info(`PR #${pr.number} already has Lean verification for its current head.`);
                  continue;
                }

                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: workflowId,
                  ref: pr.base.ref,
                  inputs: {
                    pr_number: String(pr.number),
                    head_sha: pr.head.sha
                  }
                });
                core.info(`Dispatched Lean verification for PR #${pr.number}.`);
              } catch (error) {
                core.warning(`Could not verify PR #${pr.number}: ${error.message}`);
              }
            }
