name: Zero-target Mellin square check

on:
  pull_request:
    branches: [main, agent/zero-target-critical-clipped-edge]
    paths:
      - research/ZERO_TARGET_MELLIN_FRESH_PRIME_SQUARE.lean
      - research/ZERO_TARGET_PERRON_RECIPROCAL_IDENTIFICATION.lean
      - research/ZERO_TARGET_MELLIN_PHYSICAL_LCM_STENCIL.lean
      - research/ZERO_TARGET_MELLIN_COMPLETE_POST_ROOT_CUBES.lean
      - research/ZERO_TARGET_CRITICAL_CLIPPED_EDGE.lean
      - research/ZERO_TARGET_CRITICAL_CLIPPED_EDGE_BOUNDARY_SPLIT.lean
      - research/STABLE_FAR_PERRON_REALIFICATION.lean
      - research/STABLE_FAR_PERRON_QUARTER_FRAME_BOUND.lean
      - research/ZERO_TARGET_PARTIAL_MOMENT_COVARIANCE.lean
      - research/ZERO_TARGET_COVARIANCE_OWNER_DESCENT.lean
      - RHLean/Proof/PostRootCovarianceLcmBoundaryClosure.lean
      - .github/workflows/zero-target-mellin-square.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Apply StrongPNT 4.24 compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py
      - name: Restore StrongPNT port build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Prebuild StrongPNT dependency
        run: lake build StrongPNT.PNT5_Strong
      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-
      - name: Emit prerequisite research oleans
        run: |
          mkdir -p .lake/build/lib/lean
          emit() { f="$1"; b="$(basename "$f" .lean)"; lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/research.${b}.olean" "$f"; }
          emit research/STABLE_FAR_RETURNED_FIBER_PRODUCTION.lean
          emit research/STABLE_FAR_LOG_FREQUENCY_DIAGONALIZATION.lean
          emit research/STABLE_FAR_PERRON_RETURNED_FIBER_INTERFACE.lean
          emit research/STABLE_FAR_CRITICAL_Q2_ENERGY_MULTIPLIER.lean
          emit research/STABLE_FAR_PERRON_REALIFICATION.lean
          emit research/STABLE_FAR_PERRON_QUARTER_FRAME_BOUND.lean
          emit research/ZERO_TARGET_PARTIAL_MOMENT_COVARIANCE.lean
          emit research/ZERO_TARGET_COVARIANCE_OWNER_DESCENT.lean
          emit research/ZERO_TARGET_MELLIN_FRESH_PRIME_SQUARE.lean
          emit research/ZERO_TARGET_PERRON_RECIPROCAL_IDENTIFICATION.lean
          emit research/ZERO_TARGET_MELLIN_PHYSICAL_LCM_STENCIL.lean
          emit research/ZERO_TARGET_CRITICAL_CLIPPED_EDGE.lean
      - name: Kernel-check complete post-root Mellin cubes
        run: lake env lean -DwarningAsError=true research/ZERO_TARGET_MELLIN_COMPLETE_POST_ROOT_CUBES.lean
      - name: Kernel-check critical clipped edge
        run: lake env lean -DwarningAsError=true research/ZERO_TARGET_CRITICAL_CLIPPED_EDGE.lean
      - name: Kernel-check clipped-edge boundary split
        run: lake env lean -DwarningAsError=true research/ZERO_TARGET_CRITICAL_CLIPPED_EDGE_BOUNDARY_SPLIT.lean
