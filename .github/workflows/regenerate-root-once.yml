name: Regenerate root manifest once

on:
  push:
    branches:
      - agent/post-683-partner-compression

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/post-683-partner-compression
      - name: Regenerate RHLean.lean
        run: |
          python3 - <<'PY'
          from pathlib import Path
          modules = sorted(
              '.'.join(p.with_suffix('').parts)
              for p in Path('RHLean').rglob('*.lean')
          )
          Path('RHLean.lean').write_text(
              ''.join(f'import {m}\n' for m in modules),
              encoding='utf-8',
          )
          PY
      - name: Commit manifest if changed
        run: |
          if git diff --quiet -- RHLean.lean; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RHLean.lean
          git commit -m "Regenerate root import manifest"
          git push origin HEAD:agent/post-683-partner-compression
