name: Inherited Basel activity check

on:
  pull_request:
    branches: [main]
    paths:
      - research/STABLE_FAR_PERRON_BASEL_FRAME_SHARPENING.lean
      - research/COVARIANCE_RECIPROCAL_OWNER_BASEL_CONTRACTION.lean
      - research/COVARIANCE_RECIPROCAL_OWNER_BASEL_CLIPPED_CONTRACTION.lean
      - research/GLOBAL_RETURNED_CORE_GREATEST_OWNER_BASEL_CONTRACTION.lean
      - research/GLOBAL_RETURNED_CORE_INHERITED_BASEL_ACTIVITY.lean
      - research/GLOBAL_RETURNED_CORE_INHERITED_DETERMINISTIC_CANCELLATION.lean
      - .github/workflows/inherited-basel-activity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Restore PNT+ build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Prebuild PNT+ StrongPNT dependency
        run: lake build PrimeNumberTheoremAnd.StrongPNT

      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            rhlean-build-${{ runner.os }}-

      - name: Emit owner-parent dependency foundation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/owner-parent-continuation.yml').read_text()
          start_marker = '      - name: Emit returned-core dependency foundation\n'
          end_marker = '      - name: Check owner-parent continuation\n'
          block = src.split(start_marker, 1)[1].split(end_marker, 1)[0]
          block = block.split('        run: |\n', 1)[1]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          Path('/tmp/owner-parent-foundation.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/owner-parent-foundation.sh

      - name: Build RHLean modules imported by these research checks
        run: >-
          python3 scripts/compile_research_import_closure.py --library-only
          research/COVARIANCE_RECIPROCAL_OWNER_BASEL_CLIPPED_CONTRACTION.lean
          research/COVARIANCE_RECIPROCAL_OWNER_BASEL_CONTRACTION.lean
          research/GLOBAL_RETURNED_CORE_GREATEST_OWNER_BASEL_CONTRACTION.lean
          research/GLOBAL_RETURNED_CORE_INHERITED_BASEL_ACTIVITY.lean
          research/GLOBAL_RETURNED_CORE_INHERITED_DETERMINISTIC_CANCELLATION.lean
          research/GLOBAL_RETURNED_CORE_OWNER_PARENT_CONTINUATION.lean
          research/GLOBAL_RETURNED_CORE_RETAINED_COEFFICIENT_OUTGOING_ENERGY.lean
          research/STABLE_FAR_PERRON_BASEL_FRAME_SHARPENING.lean

      - name: Emit Basel sharpening and covariance contraction
        run: |
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.STABLE_FAR_PERRON_BASEL_FRAME_SHARPENING.olean \
            research/STABLE_FAR_PERRON_BASEL_FRAME_SHARPENING.lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.COVARIANCE_RECIPROCAL_OWNER_BASEL_CONTRACTION.olean \
            research/COVARIANCE_RECIPROCAL_OWNER_BASEL_CONTRACTION.lean

      - name: Kernel-check Basel clipped covariance contraction
        run: |
          lake env lean -DwarningAsError=true \
            research/COVARIANCE_RECIPROCAL_OWNER_BASEL_CLIPPED_CONTRACTION.lean

      - name: Emit retained-coefficient greatest-owner stack
        run: |
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.GLOBAL_RETURNED_CORE_RETAINED_COEFFICIENT_OUTGOING_ENERGY.olean \
            research/GLOBAL_RETURNED_CORE_RETAINED_COEFFICIENT_OUTGOING_ENERGY.lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.GLOBAL_RETURNED_CORE_OWNER_PARENT_CONTINUATION.olean \
            research/GLOBAL_RETURNED_CORE_OWNER_PARENT_CONTINUATION.lean

      - name: Kernel-check Basel greatest-owner contraction
        run: |
          lake env lean -DwarningAsError=true \
            research/GLOBAL_RETURNED_CORE_GREATEST_OWNER_BASEL_CONTRACTION.lean

      - name: Emit deterministic inherited cancellation
        run: |
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.GLOBAL_RETURNED_CORE_INHERITED_DETERMINISTIC_CANCELLATION.olean \
            research/GLOBAL_RETURNED_CORE_INHERITED_DETERMINISTIC_CANCELLATION.lean

      - name: Kernel-check Basel inherited activity
        run: |
          lake env lean -DwarningAsError=true \
            research/GLOBAL_RETURNED_CORE_INHERITED_BASEL_ACTIVITY.lean
