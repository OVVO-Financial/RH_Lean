name: Off-critical zero HIGH, Dirichlet and canonical VF bridges

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/OFF_CRITICAL_ZERO_*.lean'
      - 'research/OFF_CRITICAL_ZERO_*.md'
      - '.github/workflows/offcritical-high-vf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offcritical-high-vf-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Setup Lean 4.34.1 and cached mathlib
        uses: ./.github/actions/lean-setup
      - name: Reject proof holes or project axioms
        run: |
          if grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' \
               research/OFF_CRITICAL_ZERO_*.lean; then
            echo "Unproved source declarations are prohibited."
            exit 1
          fi
      - name: Warning-fatal complete import closure
        run: |
          python3 scripts/compile_research_import_closure.py --build-library \
            research/OFF_CRITICAL_ZERO_HIGH_VF_BRIDGE_20261029.lean \
            research/OFF_CRITICAL_ZERO_LOW_HIGH_COEFFICIENTS_20261029.lean \
            research/OFF_CRITICAL_ZERO_EULER_LOGDERIV_20261029.lean \
            research/OFF_CRITICAL_ZERO_REALIFIED_SCALE_20261029.lean \
            research/OFF_CRITICAL_ZERO_MELLIN_RESIDUE_20261029.lean
      - name: Verify theorem signatures, source axiom dependencies, and imports
        run: |
          cat > /tmp/OffCriticalZeroAudit.lean <<'LEAN'
          import «research.OFF_CRITICAL_ZERO_HIGH_VF_BRIDGE_20261029»
          import «research.OFF_CRITICAL_ZERO_LOW_HIGH_COEFFICIENTS_20261029»
          import «research.OFF_CRITICAL_ZERO_EULER_LOGDERIV_20261029»
          import «research.OFF_CRITICAL_ZERO_REALIFIED_SCALE_20261029»
          import «research.OFF_CRITICAL_ZERO_MELLIN_RESIDUE_20261029»
          #check RHLean.Analysis.offCriticalRightZero_forces_highEnergyCriterion_failure
          #check RHLean.Analysis.offCriticalRightZero_forces_mertensPower_failure
          #check RHLean.Proof.offcriticalLowSupport_card_le
          #check RHLean.Proof.offcriticalLow_absoluteMass_isBigO
          #check RHLean.Proof.offcriticalLow_LSeriesSummable
          #check RHLean.Proof.offcriticalLow_LSeries_differentiableAt
          #check RHLean.Proof.offcriticalLowHigh_LSeries_eq_invZeta
          #check RHLean.Proof.offcritical_logDerivative_split_algebra
          #check RHLean.Analysis.actualThetaSquareShortage_coarsen_eq_endpoints
          #check RHLean.Analysis.canonicalVF_step_eq_signed_nativeOwner_and_descent
          #check RHLean.Analysis.offcriticalZeroMode_coarsen
          #check RHLean.Analysis.offcriticalZeroMode_realified_coarsen
          #check RHLean.Analysis.offcritical_MellinCoarsen_residue_of_regularDefect
          #print axioms RHLean.Analysis.offCriticalRightZero_forces_highEnergyCriterion_failure
          #print axioms RHLean.Proof.offcriticalLow_LSeries_differentiableAt
          #print axioms RHLean.Proof.offcriticalLowHigh_LSeries_eq_invZeta
          #print axioms RHLean.Analysis.offcriticalZeroMode_coarsen
          #print axioms RHLean.Analysis.offcritical_MellinCoarsen_residue_of_regularDefect
          LEAN
          lake env lean -DwarningAsError=true /tmp/OffCriticalZeroAudit.lean
