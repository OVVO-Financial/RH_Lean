name: Paper equivalence revision PDF

on:
  push:
    branches: [agent/update-paper-equivalence-pdf]
    paths:
      - paper/apply_equivalence_revision.py
      - .github/workflows/paper-equivalence-pdf.yml
  pull_request:
    paths:
      - paper/apply_equivalence_revision.py
      - .github/workflows/paper-equivalence-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply deterministic equivalence revision
        run: python paper/apply_equivalence_revision.py

      - name: Compile LaTeX paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Squared_Complex_Framework_for_Square_Prefix_Mobius_Sums_Lean_Complete.tex
          working_directory: paper
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Commit revised source and PDF to branch
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/Squared_Complex_Framework_for_Square_Prefix_Mobius_Sums_Lean_Complete.tex
          git add paper/Squared_Complex_Framework_for_Square_Prefix_Mobius_Sums_Lean_Complete.pdf
          git diff --cached --quiet || git commit -m "Update paper with exact geometric RH equivalence"
          git push

      - name: Upload revised paper artifacts
        uses: actions/upload-artifact@v4
        with:
          name: squared-complex-framework-paper
          path: |
            paper/Squared_Complex_Framework_for_Square_Prefix_Mobius_Sums_Lean_Complete.tex
            paper/Squared_Complex_Framework_for_Square_Prefix_Mobius_Sums_Lean_Complete.pdf
          if-no-files-found: error
