name: Paper equivalence revision PDF

on:
  push:
    branches: [agent/update-paper-equivalence-pdf]
    paths:
      - paper/apply_equivalence_revision.py
      - paper/run_equivalence_revision.py
      - .github/workflows/paper-equivalence-pdf.yml
  pull_request:
    paths:
      - paper/apply_equivalence_revision.py
      - paper/run_equivalence_revision.py
      - .github/workflows/paper-equivalence-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Clone branch quietly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --depth 1 --branch agent/update-paper-equivalence-pdf \
            "https://x-access-token:${GH_TOKEN}@github.com/OVVO-Financial/RH_Lean.git" repo

      - name: Apply deterministic equivalence revision
        working-directory: repo
        run: python paper/run_equivalence_revision.py

      - name: Compile LaTeX paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Squared_Complex_Framework_for_Square_Prefix_Mobius_Sums_Lean_Complete.tex
          working_directory: repo/paper
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Commit revised source and PDF
        if: github.event_name == 'push'
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/Squared_Complex_Framework_for_Square_Prefix_Mobius_Sums_Lean_Complete.tex
          git add paper/Squared_Complex_Framework_for_Square_Prefix_Mobius_Sums_Lean_Complete.pdf
          git diff --cached --quiet || git commit -m "Update paper with exact geometric RH equivalence"
          git push origin HEAD:agent/update-paper-equivalence-pdf

      - name: Upload revised paper artifacts
        uses: actions/upload-artifact@v4
        with:
          name: squared-complex-framework-paper
          path: |
            repo/paper/Squared_Complex_Framework_for_Square_Prefix_Mobius_Sums_Lean_Complete.tex
            repo/paper/Squared_Complex_Framework_for_Square_Prefix_Mobius_Sums_Lean_Complete.pdf
          if-no-files-found: error
