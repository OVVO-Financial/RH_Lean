name: VF first-bad final aggregate contraction

on:
  push:
    branches: [main, vf-first-bad-final-aggregate-contraction]
    paths:
      - 'research/**/*.lean'
      - 'RHLean.lean'
      - 'RHLean/**/*.lean'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'scripts/strongpnt_424/**'
      - '.github/actions/**'
      - 'scripts/compile_research_import_closure.py'
      - .github/workflows/vf-first-bad-final-aggregate-contraction.yml
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'research/**/*.lean'
      - .github/workflows/vf-first-bad-final-aggregate-contraction.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Route changed files through the import DAG
        id: affected
        uses: ./.github/actions/research-affected
        with:
          targets: |
            research/VF_MID_FIRST_BAD_FINAL_AGGREGATE_CONTRACTION.lean
      - name: Set up Lean and cached Mathlib
        if: steps.affected.outputs.affected == 'true'
        uses: ./.github/actions/lean-setup
      - name: Apply StrongPNT compatibility patch
        if: steps.affected.outputs.affected == 'true'
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py
      - name: Restore StrongPNT port build cache
        if: steps.affected.outputs.affected == 'true'
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Prebuild StrongPNT dependency
        if: steps.affected.outputs.affected == 'true'
        run: lake build StrongPNT.PNT5_Strong
      - name: Restore RHLean build cache
        if: steps.affected.outputs.affected == 'true'
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
      - name: Compile cached research import closure
        if: steps.affected.outputs.affected == 'true'
        uses: ./.github/actions/research-compile
        with:
          targets: |
            research/VF_MID_FIRST_BAD_FINAL_AGGREGATE_CONTRACTION.lean
      - name: Compile and audit final aggregate contraction
        if: steps.affected.outputs.affected == 'true'
        run: |
          cat > /tmp/VF_FINAL_AGGREGATE_AUDIT.lean <<'EOF'
          import «research.VF_MID_FIRST_BAD_FINAL_AGGREGATE_CONTRACTION»
          #print axioms RHLean.Analysis.vfMidActiveReturnedRawParentFiberMass_eq_zero_of_completed
          #print axioms RHLean.Analysis.vfMidActiveScaledReturnedClippedCellMass_eq_incompleteRawParents
          #print axioms RHLean.Analysis.sum_vfMidActiveReturnedIncomplete_eq_sixOrientedSectors
          #print axioms RHLean.Analysis.vfMidActiveScaledReturnedClippedCellMass_eq_sixOrientedBoundary
          #print axioms RHLean.Analysis.vfMidActiveReturnedRawParentFiberMass_eq_zero_of_firstClipRight
          #print axioms RHLean.Analysis.vfMidActiveReturnedRawParentFiberMass_eq_zero_of_nextClipLeft
          #print axioms RHLean.Analysis.vfMidActiveReturnedRawParentFiberMass_eq_zero_of_returnedClipRight
          #print axioms RHLean.Analysis.vfMidActiveScaledReturnedClippedCellMass_eq_threeBoundarySectors
          #print axioms RHLean.Analysis.sum_vfMidActiveCellGram_eq_threeBoundaryMass
          #print axioms RHLean.Analysis.sum_vfMidActiveWeightedCellExcess_le_two_threeBoundaryMass
          #print axioms RHLean.Analysis.vfMidFirstBadAnchoredCoDivExcess_le_activeResidual_add_threeBoundary
          #print axioms RHLean.Analysis.vfMidActualPrimeFirstBadAt_two_succ_activeExcess_nonpos_of_threeBoundaryBudget
          #print axioms RHLean.Analysis.vfMidFirstBadSourceToSectorSixInlet_of_threeBoundaryBudget
          #print axioms RHLean.Analysis.vfMidActualPrimeFirstBadAt_two_succ_closed_of_threeBoundaryBudget
          #print axioms RHLean.Analysis.vfMidActiveSourceSq_eq_diagonal_add_two_threeBoundary
          #print axioms RHLean.Analysis.vfMidFirstBadThreeBoundaryBudgetLHS_eq_physicalNormalForm
          #print axioms RHLean.Analysis.vfMidFirstBadThreeBoundaryBudgetLHS_eq_squarefulNormalForm
          #print axioms RHLean.Analysis.vfMidPointwiseCoDivExcess_add_neg
          #print axioms RHLean.Analysis.sum_vfMidPointwiseCoDivExcess_add_neg
          #print axioms RHLean.Analysis.descendingGreatestOwner_retained_pointwiseCoDivExcess_pair_eq_heat
          #print axioms RHLean.Analysis.descendingGreatestOwner_retained_pointwiseCoDivExcess_pair_nonpos
          #print axioms RHLean.Analysis.vfMidActiveReturnedPairWeight_eq_physical
          #print axioms RHLean.Analysis.vfMidActiveWeightedCellExcess_eq_returnedCoDivExcess
          #print axioms RHLean.Analysis.vfMidActiveWeightedCellExcess_eq_threeBoundaryExcess
          #print axioms RHLean.Analysis.sum_vfMidActiveWeightedCellExcess_eq_threeBoundaryExcess
          #print axioms RHLean.Analysis.vfMidFirstBadAnchoredCoDivExcess_eq_activeResidual_add_threeBoundaryExcess
          #print axioms RHLean.Analysis.vfMidActiveReturnedRawParentFiberExcess_eq_fourMass_sub_twoAbs
          #print axioms RHLean.Analysis.vfMidActiveThreeBoundaryExcess_eq_fourMass_sub_twoAbs
          #print axioms RHLean.Analysis.vfMidFirstBadAnchoredCoDivExcess_eq_activeResidual_add_fourBoundary_sub_heat
          #print axioms RHLean.Analysis.vfMidActualPrimeFirstBadAt_two_succ_activeExcess_nonpos_of_exactBudget
          EOF
          lake env lean -DwarningAsError=true /tmp/VF_FINAL_AGGREGATE_AUDIT.lean | tee final-aggregate-axioms.log
          if grep -q 'sorryAx' final-aggregate-axioms.log; then exit 1; fi
      - name: Save verified research closure for #915
        if: steps.affected.outputs.affected == 'true'
        uses: actions/cache/save@v5
        with:
          path: .lake/build/lib/lean/research.*
          key: vf915-research-base-${{ runner.os }}-${{ runner.arch }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
