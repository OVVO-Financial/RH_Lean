name: Fix q2 terminal cast

on:
  push:
    branches:
      - agent/q2-bookkeeping-synthesis

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/q2-bookkeeping-synthesis
      - name: Apply cast normalization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('RHLean/Proof/PhysicalQ2TerminalSynthesis.lean')
          s = p.read_text()
          old = "    _ = (((z : ℚ) ^ 2 : ℚ) : ℝ) := by\n      push_cast\n      rw [pow_two]\n"
          new = "    _ = (((z : ℚ) ^ 2 : ℚ) : ℝ) := by\n      norm_cast\n"
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RHLean/Proof/PhysicalQ2TerminalSynthesis.lean
          git commit -m 'Normalize terminal Mertens cast'
          git push origin HEAD:agent/q2-bookkeeping-synthesis
