name: Repair completed partner root manifest

on:
  push:
    paths:
      - .github/workflows/repair-completed-partner-root-manifest.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Insert generated root import
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("RHLean.lean")
          target = "import RHLean.Proof.LowPrimeCompletedPartnerWindowFold"
          lines = manifest.read_text(encoding="utf-8").splitlines()
          if target not in lines:
              lines.append(target)
          lines.sort()
          manifest.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Commit root manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RHLean.lean
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Import completed partner fold in root manifest"
          git push origin HEAD:${{ github.ref_name }}
