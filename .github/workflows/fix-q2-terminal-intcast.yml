name: Fix q2 terminal intcast

on:
  push:
    branches:
      - agent/q2-bookkeeping-synthesis

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/q2-bookkeeping-synthesis
      - name: Apply existing integer-square cast pattern
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('RHLean/Proof/PhysicalQ2TerminalSynthesis.lean')
          s = p.read_text()
          old = "private theorem norm_intCast_complex_sq_eq_ratCast (z : ℤ) :\n    ‖((z : ℤ) : ℂ)‖ ^ 2 = (((z : ℚ) ^ 2 : ℚ) : ℝ) := by\n  calc\n    ‖((z : ℤ) : ℂ)‖ ^ 2 = ((z : ℝ) ^ 2) := by\n      rw [Complex.sq_norm]\n      norm_num [Complex.normSq_apply]\n    _ = (((z : ℚ) ^ 2 : ℚ) : ℝ) := by\n      push_cast\n      ring\n"
          new = "private theorem norm_intCast_complex_sq_eq_intCast (z : ℤ) :\n    ‖((z : ℤ) : ℂ)‖ ^ 2 = ((z * z : ℤ) : ℝ) := by\n  rw [Complex.sq_norm]\n  norm_num [Complex.normSq_apply]\n"
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace('norm_intCast_complex_sq_eq_ratCast]', 'norm_intCast_complex_sq_eq_intCast]', 1)
          p.write_text(s)
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RHLean/Proof/PhysicalQ2TerminalSynthesis.lean
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use integer-square cast bridge in q2 terminal synthesis'
          git push origin HEAD:agent/q2-bookkeeping-synthesis
