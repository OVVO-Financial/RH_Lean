name: Native three-prime character fibres
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/ALPOGE_LOCAL_PRIME_FIBRES.lean'
      - 'scripts/lean/local_prime_fibres/**'
      - 'scripts/audit_preservation_sources.py'
      - '.github/workflows/local-prime-fibres.yml'
      - 'lean-toolchain'
      - 'lake-manifest.json'
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Pin tested arithmetic revision
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p local-fibre-evidence
          git rev-parse HEAD | tee local-fibre-evidence/head
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          jq -e '.packages[] | select(.name=="mathlib") | .rev=="d13f23b723b8a846827a245b89c10fc7d3f11612"' lake-manifest.json
          python3 scripts/lean/local_prime_fibres/regression.py | tee local-fibre-evidence/replay.log
      - uses: ./.github/actions/lean-setup
      - uses: ./.github/actions/lean-compiled-cache
      - name: Compile native finite character proof with warnings fatal
        run: |
          set -euo pipefail
          python3 scripts/compile_research_import_closure.py --build-library --force research/ALPOGE_LOCAL_PRIME_FIBRES.lean 2>&1 | tee local-fibre-evidence/build.log
      - name: Check statement shapes, parity boundaries, dependencies and axioms
        run: |
          set -euo pipefail
          lake env lean -DwarningAsError=true scripts/lean/local_prime_fibres/ExactTypes.lean 2>&1 | tee local-fibre-evidence/types.log
          python3 scripts/lean/local_prime_fibres/audit.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: local-fibres-${{ github.event.pull_request.head.sha }}
          path: local-fibre-evidence/
          if-no-files-found: error
