name: VF first-bad exact budget fast loop

on:
  pull_request:
    branches: [vf-first-bad-final-aggregate-contraction]
    paths:
      - research/VF_MID_FIRST_BAD_EXACT_BUDGET_CLOSE.lean
      - .github/workflows/vf-first-bad-exact-budget-fast.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Apply StrongPNT compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py

      - name: Restore StrongPNT port build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Ensure StrongPNT terminal dependency
        run: |
          if [ ! -f .lake/packages/StrongPNT/.lake/build/lib/lean/StrongPNT/PNT5_Strong.olean ]; then
            lake build StrongPNT.PNT5_Strong
          fi

      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-
            rhlean-build-${{ runner.os }}-

      - name: Restore stable #914 research closure
        id: research-cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build/lib/lean/research.*
          key: vf915-research-base-${{ runner.os }}-${{ runner.arch }}-${{ github.event.pull_request.base.sha || github.sha }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Verify warm dependency cache
        run: |
          test -f .lake/build/lib/lean/research.VF_MID_FIRST_BAD_FINAL_AGGREGATE_CONTRACTION.olean || {
            echo "Stable #914 research cache is not warm yet."
            echo "Let the full 'VF first-bad exact budget close' workflow seed it once, then rerun this fast job."
            exit 1
          }

      - name: Compile #915 only against cached dependencies
        run: |
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.VF_MID_FIRST_BAD_EXACT_BUDGET_CLOSE.olean \
            research/VF_MID_FIRST_BAD_EXACT_BUDGET_CLOSE.lean
