name: VF first-bad exact budget fast loop

on:
  pull_request:
    branches: [vf-first-bad-final-aggregate-contraction]
    paths:
      - research/VF_MID_FIRST_BAD_EXACT_BUDGET_CLOSE.lean
      - research/VF_MID_915_SECTOR_SIX_CONE_AUDIT.md
      - scripts/vf_mid_sector_six_direct_probe.py
      - scripts/vf_mid_sector_six_cone_regression.py
      - scripts/vf_mid_sector_six_exact_r18.py
      - scripts/vf_mid_915_ascending_sieve_regression.py
      - scripts/vf_mid_915_pnt_production_regression.py
      - scripts/vf_mid_915_two_owner_flux_regression.py
      - research/VF_MID_915_TWO_OWNER_CLIPPED_FLUX.lean
      - research/VF_MID_915_LATE_PREFIX_WEIGHTED_DYADIC.lean
      - research/VF_MID_915_EXACT_HISTORICAL_NNS_COMPRESSION.lean
      - research/VF_MID_915_CENTERED_OWNER_TRIANGULAR.lean
      - research/VF_MID_915_COMPRESSED_HISTORY_SINK.lean
      - research/VF_MID_915_FIXED17_ACTUAL_SIGNED_INLET.lean
      - research/VF_MID_915_FLOOR_LI_TRANSPORT_BOUNDARY.lean
      - research/VF_MID_915_PRIME_INTERVAL_LI_STRATIFICATION.lean
      - scripts/vf_mid_915_prime_interval_li_regression.py
      - scripts/vf_mid_915_historical_cofactor_abel_regression.py
      - scripts/vf_mid_915_top_third_sector_restoration_regression.py
      - research/VF_MID_915_TERMINAL_TOP_THIRD_TRANSPORT.lean
      - research/VF_MID_915_PARITY_REFINEMENT_EXACT_PRICE.lean
      - research/VF_MID_915_MIDDLE_PRIME_COMPOSITE_CAPACITY.lean
      - research/VF_MID_915_PARITY_REFINEMENT_PAYMENT_AUDIT.md
      - scripts/vf_mid_915_middle_prime_composite_capacity_regression.py
      - research/VF_MID_915_TERMINAL_TOP_THIRD_TRANSPORT.md
      - scripts/vf_mid_915_floor_li_transport_regression.py
      - scripts/vf_mid_915_centered_owner_triangular_regression.py
      - scripts/vf_mid_915_late_prefix_weighted_regression.py
      - .github/workflows/vf-first-bad-exact-budget-fast.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Regress Sector Six, ascending owner-2, and PNT-star signed payment
        run: |
          python3 scripts/vf_mid_sector_six_cone_regression.py
          python3 scripts/vf_mid_sector_six_exact_r18.py
          python3 scripts/vf_mid_915_ascending_sieve_regression.py
          python3 scripts/vf_mid_915_pnt_production_regression.py --extended
          python3 scripts/vf_mid_915_two_owner_flux_regression.py
          python3 scripts/vf_mid_915_late_prefix_weighted_regression.py
          python3 scripts/vf_mid_915_centered_owner_triangular_regression.py
          python3 scripts/vf_mid_915_floor_li_transport_regression.py
          python3 scripts/vf_mid_915_prime_interval_li_regression.py
          python3 scripts/vf_mid_915_historical_cofactor_abel_regression.py
          python3 scripts/vf_mid_915_top_third_sector_restoration_regression.py
          python3 scripts/vf_mid_915_middle_prime_composite_capacity_regression.py --extended

      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Apply StrongPNT compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py

      - name: Restore StrongPNT port build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Ensure StrongPNT terminal dependency
        run: |
          if [ ! -f .lake/packages/StrongPNT/.lake/build/lib/lean/StrongPNT/PNT5_Strong.olean ]; then
            lake build StrongPNT.PNT5_Strong
          fi

      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-
            rhlean-build-${{ runner.os }}-

      - name: Restore stable #914 research closure
        id: research-cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build/lib/lean/research.*
          key: vf915-research-base-${{ runner.os }}-${{ runner.arch }}-${{ github.event.pull_request.base.sha || github.sha }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Build stable #914 research closure on cache miss
        if: steps.research-cache.outputs.cache-hit != 'true'
        run: |
          python3 - <<'PY'
          import subprocess
          import sys
          sys.path.insert(0, 'scripts')
          import compile_research_import_closure as closure
          seen, roots = set(), set()
          def visit(module):
              if module in seen:
                  return
              seen.add(module)
              source = closure.source_for(module)
              for dependency in closure.research_imports(source):
                  visit(dependency)
              for line in source.read_text().splitlines():
                  if line.startswith('import RHLean'):
                      roots.add(line.removeprefix('import ').strip())
          visit('research.VF_MID_FIRST_BAD_FINAL_AGGREGATE_CONTRACTION')
          if roots:
              subprocess.run(['lake', 'build', *sorted(roots)], check=True)
          PY
          python3 scripts/compile_research_import_closure.py research/VF_MID_FIRST_BAD_FINAL_AGGREGATE_CONTRACTION.lean

      - name: Save stable #914 research closure
        if: steps.research-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .lake/build/lib/lean/research.*
          key: vf915-research-base-${{ runner.os }}-${{ runner.arch }}-${{ github.event.pull_request.base.sha || github.sha }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Compile new #915 exact two-owner clipped-flux lemmas
        run: lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_915_TWO_OWNER_CLIPPED_FLUX.olean research/VF_MID_915_TWO_OWNER_CLIPPED_FLUX.lean

      - name: Compile inherited-prefix weighted dyadic VF physics
        run: |
          lake build RHLean.Proof.PrimeCombReciprocalBandCancellation
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_915_LATE_PREFIX_WEIGHTED_DYADIC.olean research/VF_MID_915_LATE_PREFIX_WEIGHTED_DYADIC.lean

      - name: Compile exact historical NNS cross-pair compression sink
        run: lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_915_COMPRESSED_HISTORY_SINK.olean research/VF_MID_915_COMPRESSED_HISTORY_SINK.lean

      - name: Compile centered owner triangular Fubini and original VF denominator
        run: lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_915_CENTERED_OWNER_TRIANGULAR.olean research/VF_MID_915_CENTERED_OWNER_TRIANGULAR.lean

      - name: Compile exact original NNS historical compression and restoration
        run: lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_915_EXACT_HISTORICAL_NNS_COMPRESSION.olean research/VF_MID_915_EXACT_HISTORICAL_NNS_COMPRESSION.lean

      - name: Compile actual after-17 owner historical signed VF inlet
        run: lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_915_FIXED17_ACTUAL_SIGNED_INLET.olean research/VF_MID_915_FIXED17_ACTUAL_SIGNED_INLET.lean

      - name: Build established discrete-Li transport import closure
        run: python3 scripts/compile_research_import_closure.py research/VF_MID_FLOOR_LI_TRANSPORT_CANCELLATION.lean

      - name: Compile exact #915 actual-owner to unmatched floor-Li boundary transfer
        run: lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_915_FLOOR_LI_TRANSPORT_BOUNDARY.olean research/VF_MID_915_FLOOR_LI_TRANSPORT_BOUNDARY.lean

      - name: Compile arbitrary sqrt-cofactor prime-band floor-Li stratification
        run: lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_915_PRIME_INTERVAL_LI_STRATIFICATION.olean research/VF_MID_915_PRIME_INTERVAL_LI_STRATIFICATION.lean

      - name: Compile top-third no-descendant arithmetic / floor-Li split
        run: lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_915_TERMINAL_TOP_THIRD_TRANSPORT.olean research/VF_MID_915_TERMINAL_TOP_THIRD_TRANSPORT.lean

      - name: Compile 30/6 wheel physical middle-prime/composite donor capacity
        run: lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_915_MIDDLE_PRIME_COMPOSITE_CAPACITY.olean research/VF_MID_915_MIDDLE_PRIME_COMPOSITE_CAPACITY.lean

      - name: Compile exact full parity NNS denominator restoration cost
        run: lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.VF_MID_915_PARITY_REFINEMENT_EXACT_PRICE.olean research/VF_MID_915_PARITY_REFINEMENT_EXACT_PRICE.lean

      - name: Compile #915 only against cached dependencies
        run: |
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.VF_MID_FIRST_BAD_EXACT_BUDGET_CLOSE.olean \
            research/VF_MID_FIRST_BAD_EXACT_BUDGET_CLOSE.lean
