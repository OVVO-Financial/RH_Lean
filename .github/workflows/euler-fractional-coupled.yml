name: Euler fractional coupled original signed source Lean

on:
  pull_request:
    branches: [main]
    paths:
      - "research/EULER_FRACTIONAL_COUPLED_20261027.lean"
      - "research/EULER_RANK_ONE_FRACTIONAL_ROWS_20261027.lean"
      - "research/EULER_FRACTIONAL_COUPLED_AUDIT_20261027.md"
      - "scripts/audit_euler_fractional_axioms.py"
      - "scripts/test_euler_fractional_axioms.py"
      - ".github/workflows/euler-fractional-coupled.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Regress missing declarations, multiline axioms, and compiler failures
        run: python3 -m unittest discover -s scripts -p 'test_euler_fractional_axioms.py' -v
      - name: Set up pinned Lean and cached Mathlib
        uses: ./.github/actions/lean-setup
      - name: Restore PNT+ build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Prebuild PNT+ StrongPNT
        run: lake build PrimeNumberTheoremAnd.StrongPNT
      - name: Restore native library build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      - name: Compile exact research import closure with warnings fatal
        uses: ./.github/actions/research-compile
        with:
          build-library: 'true'
          targets: research/EULER_RANK_ONE_FRACTIONAL_ROWS_20261027.lean
      - name: Audit exact theorem types and axiom coverage
        id: euler_axioms
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_euler_fractional_axioms.py --output-dir /tmp/euler-fractional-audit
      - name: Preserve exact theorem signatures and axiom evidence
        if: ${{ !cancelled() && steps.euler_axioms.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: euler-fractional-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/euler-fractional-audit/
          if-no-files-found: error
      - name: Reject admitted proofs in changed source
        run: |
          python3 - <<'PY'
          import pathlib, re
          paths = [
              'research/EULER_FRACTIONAL_COUPLED_20261027.lean',
              'research/EULER_RANK_ONE_FRACTIONAL_ROWS_20261027.lean',
          ]
          for path in paths:
              body = pathlib.Path(path).read_text()
              body = re.sub(r'/-.*?-/', '', body, flags=re.S)
              body = re.sub(r'--.*', '', body)
              assert not re.search(r'\b(sorry|admit|axiom)\b', body), path
          print('PASS no sorry, admit or new axiom')
          PY
