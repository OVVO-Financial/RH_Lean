name: Euler fractional coupled original signed source Lean

on:
  pull_request:
    branches: [main]
    paths:
      - "research/EULER_FRACTIONAL_COUPLED_20261027.lean"
      - "research/EULER_RANK_ONE_FRACTIONAL_ROWS_20261027.lean"
      - "research/EULER_FRACTIONAL_COUPLED_AUDIT_20261027.md"
      - ".github/workflows/euler-fractional-coupled.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Lean and cached Mathlib
        uses: ./.github/actions/lean-setup
      - name: Restore PNT+ build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Prebuild PNT+ StrongPNT
        run: lake build PrimeNumberTheoremAnd.StrongPNT
      - name: Restore native library build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      - name: Compile exact research import closure with warnings fatal
        run: |
          python3 scripts/compile_research_import_closure.py --build-library \
            research/EULER_RANK_ONE_FRACTIONAL_ROWS_20261027.lean
      - name: Audit new theorem axioms
        run: |
          cat > /tmp/euler_fractional_axioms.lean <<'EOF'
          import «research.EULER_HYBRID_TRIANGULAR_GRAM_20261027»
          #print axioms RHLean.Proof.eulerFloorBilinearQ_eq_continuous_sub_fractional
          #print axioms RHLean.Proof.eulerContinuousBilinearQ_eq_reciprocal_square
          #print axioms RHLean.Proof.eulerFloorBilinearQ_cast_eq_original
          #print axioms RHLean.Proof.eulerFloorBilinearQ_eq_continuous_sub_diag_sub_twice_off
          #print axioms RHLean.Proof.eulerFractionDiagonalQ_bounds
          #print axioms RHLean.Proof.eulerRankOneFloorKernel_eq_coupled_fracs
          #print axioms RHLean.Proof.eulerRankOneResidualQ_eq_floor_sub_linear
          #print axioms RHLean.Proof.eulerRankOneFloorKernel_divisor_row
          EOF
          lake env lean -DwarningAsError=true /tmp/euler_fractional_axioms.lean | tee /tmp/euler_fractional_axioms.log
          if grep -q 'sorryAx' /tmp/euler_fractional_axioms.log; then exit 1; fi
          python3 - <<'PY'
          import re
          log = open('/tmp/euler_fractional_axioms.log').read()
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for line in log.splitlines():
              match = re.search(r"depends on axioms: \[(.*)\]", line)
              if match:
                  used = {a.strip() for a in match.group(1).split(',') if a.strip()}
                  assert used <= allowed, f"Nonstandard axioms: {used - allowed}"
          print("PASS standard axioms only")
          PY
      - name: Reject admitted proofs in changed source
        run: |
          python3 - <<'PY'
          import pathlib, re
          paths = [
              'research/EULER_FRACTIONAL_COUPLED_20261027.lean',
              'research/EULER_RANK_ONE_FRACTIONAL_ROWS_20261027.lean',
          ]
          for path in paths:
              body = pathlib.Path(path).read_text()
              body = re.sub(r'/-.*?-/', '', body, flags=re.S)
              body = re.sub(r'--.*', '', body)
              assert not re.search(r'\b(sorry|admit|axiom)\b', body), path
          print('PASS no sorry, admit or new axiom')
          PY
