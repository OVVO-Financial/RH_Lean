name: Temporary 646 root manifest refresh

on:
  push:
    branches: [agent/combined-tagged-eleven-pushforward]

permissions:
  contents: write

concurrency:
  group: tmp-646-root-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Mathlib packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Set up Lean and Mathlib
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Regenerate root manifest
        shell: bash
        run: |
          set +e
          lake exe mk_all
          status=$?
          set -e
          if ! git diff --quiet -- RHLean.lean; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add RHLean.lean
            git commit -m "Import #646 population modules"
            git push origin HEAD:agent/combined-tagged-eleven-pushforward
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
