name: Fix SR q2 manifest

on:
  push:
    branches:
      - agent/square-residual-q2-reindex

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/square-residual-q2-reindex
      - name: Sort root imports
        run: python3 -c "from pathlib import Path; p=Path('RHLean.lean'); xs=[x for x in p.read_text().splitlines() if x.strip()]; p.write_text('\\n'.join(sorted(xs))+'\\n')"
      - name: Commit manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RHLean.lean
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Sort root manifest for square residual q2 reindex'
          git push origin HEAD:agent/square-residual-q2-reindex
