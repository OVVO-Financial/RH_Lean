name: Canonical response-child characterization check

on:
  push:
    branches: [agent/full-sequential-canonical-frontier-bridge]
    paths:
      - RHLean/Proof/SquareRootLowPrimeCanonicalChildCharacterization.lean
      - RHLean/Proof/SquareRootLowPrimeSignedResponseChildren.lean
      - .github/workflows/canonical-child-characterization-lean.yml
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Import module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('RHLean.lean')
          target = 'import RHLean.Proof.SquareRootLowPrimeCanonicalChildCharacterization'
          lines = [x.strip() for x in p.read_text().splitlines() if x.strip()]
          p.write_text('\n'.join(sorted(set(lines) | {target})) + '\n')
          PY
          if ! git diff --quiet -- RHLean.lean; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add RHLean.lean
            git commit -m "Import canonical response-child characterization"
            git push
          fi

      - name: Audit source
        run: |
          bash scripts/check_paper_analysis_boundary.sh
          bash scripts/audit_assumptions.sh
          python3 scripts/check_root_manifest.py

      - uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Apply StrongPNT compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py

      - uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - run: lake build StrongPNT.PNT5_Strong

      - uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Build module
        id: build
        continue-on-error: true
        run: |
          lake build RHLean.Proof.SquareRootLowPrimeCanonicalChildCharacterization \
            > canonical-child-characterization.log 2>&1

      - name: Commit diagnostics on failure
        if: ${{ steps.build.outcome == 'failure' }}
        run: |
          cp canonical-child-characterization.log \
            research/canonical-child-characterization-build-errors.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/canonical-child-characterization-build-errors.txt
          git commit -m "Record canonical child compiler diagnostics"
          git push

      - name: Publish status
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const failed = '${{ steps.build.outcome }}' === 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: failed ? 'failure' : 'success',
              context: 'canonical-child-characterization-lean',
              description: failed
                ? 'Canonical response-child characterization failed'
                : 'Canonical response-child characterization compiled',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Fail on build error
        if: ${{ steps.build.outcome == 'failure' }}
        run: exit 1
