name: OAI window-saturated LOW versus principal gain

on:
  pull_request:
    paths:
      - 'research/oai_434/VF919WindowSaturatedLowPrincipal.lean'
      - '.github/workflows/vf919-window-saturated-low-principal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Distinguish source revisions so delayed PR events cannot cancel newer-head proofs.
  group: vf919-window-saturated-${{ github.head_ref || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  full-source-verified-window-gain:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Verify the pinned Lean and Mathlib versions
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.34.1"
          grep -q 'd13f23b723b8a846827a245b89c10fc7d3f11612' lakefile.lean
      - uses: ./.github/actions/lean-setup
      - name: Checkout the exact original analytic source
        uses: actions/checkout@v4
        with:
          repository: openai/math
          ref: 1581d4cbdd69a0faf34b2089614fe2a814316a6a
          path: oai-upstream
          persist-credentials: false
      - name: Restore native and unpatched Wiener shared caches
        uses: ./.github/actions/lean-compiled-cache
      - name: Verify native Wiener prerequisites
        shell: bash
        run: |
          set -euo pipefail
          lake build PrimeNumberTheoremAnd.Wiener
          test -s .lake/packages/PrimeNumberTheoremAnd/.lake/build/lib/lean/PrimeNumberTheoremAnd/Wiener.olean
      - name: Verify the unchanged native arithmetic import closure
        uses: ./.github/actions/research-compile
        with:
          build-library: 'true'
          targets: >-
            research/VF_919_SEVEN_EIGHTHS_SIGNED_COVARIANCE_20261019.lean
            research/VF_919_SEVEN_EIGHTHS_SQUARE_SHELL_BRIDGE_20261019.lean
            research/CORR4_OAI_POWER_GUIDEPOST_20261024.lean
            research/NATIVE_OWNER_PREFIX_MERTENS_20261021.lean
            research/VF_919_OAI_ACTUAL_MARKED_FOURTH_REAL_NNS_20261021.lean
            research/VF_919_RESONANT_FIBER_NNS_RECOMBINATION_20261022.lean
      - name: Restore source-pinned original analytic shared cache
        id: oai_cache
        uses: ./.github/actions/oai-434-shared-cache
      - name: Compile original analytic prerequisites only on a genuine cache miss
        if: ${{ steps.oai_cache.outputs.complete != 'true' }}
        shell: bash
        working-directory: oai-upstream/lean
        run: |
          set -euo pipefail
          lake build OAI.NumberTheory.DirichletL.Detector.FinalAssemblyUnconditional
      - name: Check shared package identity and pinned original source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C oai-upstream rev-parse HEAD)" = '1581d4cbdd69a0faf34b2089614fe2a814316a6a'
          python3 scripts/check_shared_lean_packages.py . oai-upstream/lean PrimeNumberTheoremAnd mathlib
      - name: Kernel-check prerequisite total-mass LOW and the complete endpoint
        id: slot_proof
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/lean/total_mass/run.sh "$PWD"
      - name: Compile window-saturated LOW-principal exponent gain (warnings fatal)
        id: new_gain
        shell: bash
        run: |
          set -euo pipefail
          OAI_PATH="$(cd oai-upstream/lean && lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          RH_PATH="$(lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          env LEAN_PATH="$RH_PATH:$OAI_PATH" lean -DwarningAsError=true \
            -o ".lake/build/lib/lean/research.oai_434.VF919WindowSaturatedLowPrincipal.olean" \
            research/oai_434/VF919WindowSaturatedLowPrincipal.lean 2>&1 | tee window-saturated-lean.log
          if grep -E 'sorryAx|admitAx' window-saturated-lean.log; then
            echo 'Rejected admitted Lean proof dependency' >&2
            exit 1
          fi
      - name: Check exact endpoint types, existing source inputs, and new axiom closure
        shell: bash
        run: |
          set -euo pipefail
          OAI_PATH="$(cd oai-upstream/lean && lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          RH_PATH="$(lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          cat >/tmp/window_saturated_gain_acceptance.lean <<'LEAN'
          import «research.oai_434.VF919WindowSaturatedLowPrincipal»
          open OAI.SevenEighths
          #check RHLeanWindowSaturated.windowSaturatedHighData_geometry
          #check RHLeanWindowSaturated.windowSaturatedHighData_window_exact
          #check RHLeanWindowSaturated.windowSaturatedHighData_sigma_exact_minimum
          #check RHLeanWindowSaturated.windowSaturatedHighData_sigma_ge_five_eighths
          #check RHLeanWindowSaturated.windowSaturatedHighData_tilt_budget
          #check RHLeanWindowSaturated.native_beta_le_window_saturated_minimum_of_fine
          #check RHLeanWindowSaturated.native_beta_le_window_saturated_five_eighths_of_fine
          #check RHLeanWindowSaturated.native_beta_le_explicit_window_saturated
          #check RHLean.Analysis.native_mertens_explicit_window_saturated
          #print axioms RHLeanWindowSaturated.native_beta_le_explicit_window_saturated
          #print axioms RHLean.Analysis.native_mertens_explicit_window_saturated
          LEAN
          env LEAN_PATH="$RH_PATH:$OAI_PATH" lean -DwarningAsError=true \
            /tmp/window_saturated_gain_acceptance.lean 2>&1 | tee window-saturated-acceptance.log
          if grep -E 'sorryAx|admitAx' window-saturated-acceptance.log; then exit 1; fi
      - name: Preserve generated proofs, exact provenance, and diagnostics
        if: ${{ !cancelled() && steps.slot_proof.outcome != 'skipped' && steps.slot_proof.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: vf919-window-saturated-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            anchored-tilt-generation.json
            total-mass-lean.log
            total-mass-audit.log
            total-mass-inventory.log
            window-saturated-lean.log
            window-saturated-acceptance.log
            research/oai_434/VF919WindowSaturatedLowPrincipal.lean
            research/oai_434/VF919TotalMass*.lean
            research/oai_434/VF919Anchored*.lean
            scripts/lean/total_mass/
          if-no-files-found: error
          retention-days: 30

