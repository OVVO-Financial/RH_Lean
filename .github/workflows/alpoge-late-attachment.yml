name: Cached principal quantitative attachment

# Run only when this targeted extraction changes; never on unrelated CM edits.
on:
  push:
    branches: [research/cm-seed-serre-degree-20261123]
    paths:
      - '.github/workflows/alpoge-late-attachment.yml'
      - 'scripts/alpoge_late_attachment/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpoge-late-attachment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            RHLean
            scripts/alpoge_late_attachment
            scripts/ci/install_pinned_lean_retry.sh
      # The community-linked frozen mirror has a SHA-256-checked public
      # cache of the original verified submission. This is a verification
      # checkout only; do not vendor or redistribute the upstream source.
      - uses: actions/checkout@v4
        with:
          repository: homeowmorphism/riemann-hypothesis-original
          ref: 774b9e8022f50d20be861ecc9d609cfc26436a81
          path: _alpoge_frozen
          persist-credentials: false
      - name: Verify frozen source and compiler pin
        working-directory: _alpoge_frozen
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:src)" = 24df20b62d9976ccd20da819bc20b16f808f0fdd
          test "$(cat lean-toolchain)" = leanprover/lean4:v4.33.1
          test "$(git hash-object lake-manifest.json)" = b4d1ec31575a26b2159ec3a262b482bc051f3f6f
          df -h .
          bash ../scripts/ci/install_pinned_lean_retry.sh
      - name: Restore the independently published pinned upstream cache
        working-directory: _alpoge_frozen
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get
          # A cache miss must fail, not start the massive upstream build.
          lake --no-build --rehash build \
            Development.AutomorphicArithmetic.ThetaCorrespondence.ThetaPairLifts.ThirdPlaceSeries.EveryCharacterOfLiteratureOfVWin \
            Development.AutomorphicArithmetic.AutomorphicVarieties.ModularityArgument.ThresholdArguments.DenseThresholdCases.VwinOfRow \
            Development.AutomorphicArithmetic.Foundations.LocalLanglands.LocalCentralUnits.RecTExists \
            Development.AutomorphicArithmetic.Foundations.GaloisRepresentations.IntegralStructures.RowSrc
      - name: Replay only the principal quantitative extraction
        working-directory: _alpoge_frozen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/alpoge-overlay"
          cp ../scripts/alpoge_late_attachment/PrincipalWindow.lean.in "$RUNNER_TEMP/alpoge-overlay/RHLeanPrincipalWindow.lean"
          lake env lean --root="$RUNNER_TEMP/alpoge-overlay" --tstack=400000 \
            -o "$RUNNER_TEMP/alpoge-overlay/RHLeanPrincipalWindow.olean" \
            "$RUNNER_TEMP/alpoge-overlay/RHLeanPrincipalWindow.lean" | tee "$RUNNER_TEMP/principal-window.log"
          echo 'Principal quantitative extraction replay passed on the frozen 4.33.1 environment; not yet native 4.34.1 certification.' >> "$GITHUB_STEP_SUMMARY"
      - name: Stage and check the actual #1205 native handoff in the same environment
        working-directory: _alpoge_frozen
        shell: bash
        run: |
          set -euo pipefail
          # Build only the native import closure needed by #1205, in an
          # isolated overlay. This is a compatibility trial of unchanged
          # native source, NOT a change to RH_Lean's toolchain or a proof
          # using mixed-version oleans. Report the first real mismatch.
          export RHLEAN_SOURCE="$GITHUB_WORKSPACE"
          export RHLEAN_OVERLAY="$RUNNER_TEMP/alpoge-overlay"
          cat > "$RUNNER_TEMP/alpoge-native-replay.py" <<'PY'
          import os
          import pathlib
          import re
          import shutil
          import subprocess

          source = pathlib.Path(os.environ["RHLEAN_SOURCE"])
          overlay = pathlib.Path(os.environ["RHLEAN_OVERLAY"])
          order = []
          seen = set()
          external = set()
          def visit(module):
              if module in seen:
                  return
              seen.add(module)
              path = pathlib.Path(*module.split(".")).with_suffix(".lean")
              original = source / path
              text = original.read_text()
              for line in text.splitlines():
                  match = re.match(r"^\s*(?:(?:public|private)\s+)?import\s+([^\n]+)", line)
                  if not match:
                      continue
                  for name in match.group(1).split("--", 1)[0].split():
                      if name.startswith("RHLean."):
                          visit(name)
                      else:
                          external.add(name)
              dest = overlay / path
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(original, dest)
              order.append(path)

          visit("RHLean.Analysis.AlpogeNativeBoundHandoff")
          print(f"Native handoff source closure: {len(order)} modules", flush=True)
          print("External imports:", ", ".join(sorted(external)), flush=True)
          env = dict(os.environ)
          env["LEAN_PATH"] = str(overlay) + os.pathsep + env.get("LEAN_PATH", "")
          for path in order:
              print(f"Replaying unchanged native module: {path}", flush=True)
              subprocess.run(["lean", "--tstack=400000", "-o",
                              str(path.with_suffix(".olean")), str(path)],
                             cwd=overlay, env=env, check=True)
          final = overlay / "RHLeanLateCombined.lean"
          final.write_text("""import RHLeanPrincipalWindow
          import RHLean.Analysis.AlpogeNativeBoundHandoff

          namespace RHLeanLateCombined
          open RHLean.Analysis.AlpogeNativeBoundHandoff

          theorem riemannHypothesis : RiemannHypothesis := by
            obtain ⟨K, eps1, hpos, hbound⟩ :=
              RHLeanLateAttachment.principalQuantitativeWindowBound
            exact riemannHypothesis_of_smallEpsilonWindowBound (K := K) hpos
              (by simpa only [SmallEpsilonWindowBound, statementOCGz, statementOCSz] using hbound)

          end RHLeanLateCombined

          open Lean Elab Command in
          run_cmd do
            let root := `RHLeanLateCombined.riemannHypothesis
            let axs ← liftCoreM (Lean.collectAxioms root)
            for a in axs do
              unless #[`propext, `Classical.choice, `Quot.sound].contains a do
                throwError "Unapproved terminal axiom: {a}"
            logInfo m!"Combined same-environment root axioms: {axs}"
          """)
          subprocess.run(["lean", "--tstack=400000", str(final)],
                         cwd=overlay, env=env, check=True)
          PY
          lake env python3 "$RUNNER_TEMP/alpoge-native-replay.py" | tee "$RUNNER_TEMP/native-window.log"
          echo 'Combined extracted bound plus unchanged #1205 handoff compiled under the original 4.33.1 toolchain. Native 4.34.1 and independent export replay remain separate acceptance gates.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve targeted replay logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpoge-principal-window-replay
          path: |
            ${{ runner.temp }}/principal-window.log
            ${{ runner.temp }}/native-window.log
          if-no-files-found: ignore
