name: Refresh q2 terminal root manifest

on:
  push:
    branches:
      - agent/q2-bookkeeping-synthesis

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/q2-bookkeeping-synthesis
      - name: Regenerate RHLean.lean deterministically
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('RHLean')
          modules = sorted('.'.join(p.with_suffix('').parts) for p in root.rglob('*.lean'))
          Path('RHLean.lean').write_text(''.join(f'import {m}\n' for m in modules), encoding='utf-8')
          PY
      - name: Commit manifest if changed
        run: |
          if git diff --quiet -- RHLean.lean; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RHLean.lean
          git commit -m 'Regenerate root import manifest for terminal q2 synthesis'
          git push origin HEAD:agent/q2-bookkeeping-synthesis
