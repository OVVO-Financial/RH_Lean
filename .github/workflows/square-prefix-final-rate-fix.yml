name: Square-prefix final rate fix

on:
  push:
    branches: [agent/native-square-prefix-mobius-contraction]
    paths:
      - '.github/square_prefix_final_rate_fix.py'
      - '.github/workflows/square-prefix-final-rate-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-square-prefix-mobius-contraction
      - name: Patch exact shell-rate bound
        run: python3 .github/square_prefix_final_rate_fix.py
      - name: Commit patch and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RHLean/Analysis/NativePNTSquarePrefixGoodMassRate.lean
          git rm .github/square_prefix_final_rate_fix.py .github/workflows/square-prefix-final-rate-fix.yml
          git commit -m 'Use exact square-prefix shell-rate bound'
          git push origin HEAD:agent/native-square-prefix-mobius-contraction
