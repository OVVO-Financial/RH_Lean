name: Fix root-floored predecessor positivity

on:
  push:
    branches:
      - agent/q2-parent-product-reassembly

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/q2-parent-product-reassembly
      - name: Patch RootFloored
        run: |
          python3 -c "from pathlib import Path; p=Path('RHLean/Proof/LowWheelFrozenSquareResidualRootFloored.lean'); s=p.read_text(); s=s.replace('  have hqR : q < R := Nat.lt_of_le_pred hqd.2','  have hRpos : 0 < R := by\\n    have hqpos := hqd.1.pos\\n    have hqle := hqd.2\\n    omega\\n  have hqR : q < R := Nat.lt_of_le_pred hRpos hqd.2'); p.write_text(s)"
          rm .github/workflows/fix-rootfloored-pred-pos.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RHLean/Proof/LowWheelFrozenSquareResidualRootFloored.lean .github/workflows/fix-rootfloored-pred-pos.yml
          git commit -m 'Supply positivity to root-floored predecessor lemma'
          git push origin HEAD:agent/q2-parent-product-reassembly
