name: Least-largest stable transfer check

on:
  push:
    branches:
      - agent/square-root-two-direction-othello-scratch
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: least-largest-stable-transfer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Restore Mathlib packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Set up Lean and Mathlib
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Restore scratch project build
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: least-largest-${{ runner.os }}-${{ runner.arch }}-v2-${{ github.sha }}
          restore-keys: |
            least-largest-${{ runner.os }}-${{ runner.arch }}-v1-
            othello-project-${{ runner.os }}-${{ runner.arch }}-v1-
            top-bottom-project-${{ runner.os }}-${{ runner.arch }}-v1-

      - name: Kernel-check least-largest stable transfer
        id: leancheck
        run: |
          set +e
          timeout 600 lake build RHLean.Proof.LowWheelLeastLargestStableTransfer
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Save project build
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .lake/build
          key: least-largest-${{ runner.os }}-${{ runner.arch }}-v2-${{ github.sha }}

      - name: Fail if Lean failed
        if: steps.leancheck.outputs.exit_code != '0'
        run: exit 1
