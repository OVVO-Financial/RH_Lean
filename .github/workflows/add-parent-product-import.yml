name: Wire parent product module

on:
  push:
    branches:
      - agent/q2-parent-product-reassembly

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/q2-parent-product-reassembly
      - name: Add sorted root import and remove helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('RHLean.lean')
          line = 'import RHLean.Proof.LowWheelFrozenSquareResidualParentProduct'
          xs = [x for x in p.read_text().splitlines() if x.strip()]
          if line not in xs:
              xs.append(line)
          p.write_text('\n'.join(sorted(xs)) + '\n')
          Path('.github/workflows/add-parent-product-import.yml').unlink()
          PY
      - name: Commit root wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RHLean.lean .github/workflows/add-parent-product-import.yml
          git commit -m 'Wire parent product reassembly into root build'
          git push origin HEAD:agent/q2-parent-product-reassembly
