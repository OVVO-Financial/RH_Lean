name: Finalize public export update

on:
  push:
    branches:
      - agent/update-public-export-paper-numerics
    paths:
      - '.export-paper-parts/**'
      - '.github/workflows/finalize-export-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/update-public-export-paper-numerics
          fetch-depth: 0

      - name: Decode and verify authoritative paper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/public-repo/paper
          cat .export-paper-parts/part* | base64 --decode > export/public-repo/paper/seeded_prime_comb_harmonic_reduction.tex
          echo '8f02277dd763774f1c4859c64c52157aa7a4323ffb4fc861b192ad3ab2617a72  export/public-repo/paper/seeded_prime_comb_harmonic_reduction.tex' | sha256sum --check -

      - name: Rename numerical program and update all export references
        shell: bash
        run: |
          set -euo pipefail
          mv export/public-repo/numerics/squared_space_reproducibility_v3.py \
             export/public-repo/numerics/primorial_block_validation.py
          test "$(git hash-object export/public-repo/numerics/primorial_block_validation.py)" = \
               '98ad192eb59c1ad9cf31ab8cdbfc43cf0f8497ed'
          python - <<'PY'
          from pathlib import Path

          root = Path('export/public-repo')
          gates = root / 'numerics' / 'analytic_kill_gates.py'
          text = gates.read_text(encoding='utf-8')
          text = text.replace('"squared_space_repro"', '"primorial_block_validation"')
          text = text.replace('"squared_space_reproducibility_v3.py"', '"primorial_block_validation.py"')
          gates.write_text(text, encoding='utf-8')

          files = {
            root / 'README.md': r'''# Prime-Wheel Möbius

Public companion repository for **Seeded Prime-Comb Dynamics and the Finite Harmonic Reduction of Primorial-Block Möbius Sums**.

This repository separates the paper-facing theorem chain from the broader `RH_Lean` sandbox.

## Contents

- `paper/` - current manuscript source and build notes.
- `formalization/` - standalone Lean 4 project pinned to Lean/mathlib `v4.24.0`.
- `numerics/` - finite primorial-block validation and analytic falsification gates.
- `docs/` - theorem status, source provenance, and publication checklist.
- `.github/workflows/` - Lean verification and numerical reproducibility.

## Mathematical boundary

The formalization proves the exact chain

```text
explicit pinned Dirichlet estimate
<-> harmonic nonconcentration
<-> finite wheel residual bound
<-> global Mertens-energy bound.
```

It does **not** claim an unconditional proof of the Riemann Hypothesis. Two inputs remain explicit:

1. the maximal pinned Dirichlet/nonconcentration estimate;
2. the classical theorem connecting the stated Mertens-energy bound to Mathlib's Riemann Hypothesis proposition.

See [`docs/THEOREM_STATUS.md`](docs/THEOREM_STATUS.md).

## Lean build

```bash
cd formalization
lake update
lake build RHLean --wfail
bash scripts/audit_assumptions.sh
```

## Paper

The manuscript source is [`paper/seeded_prime_comb_harmonic_reduction.tex`](paper/seeded_prime_comb_harmonic_reduction.tex).

## Numerical reproduction

The deterministic validation program used in Section 7 is [`numerics/primorial_block_validation.py`](numerics/primorial_block_validation.py).

See [`numerics/README.md`](numerics/README.md) for exact commands, status boundaries, and generated hash manifests.
''',
            root / 'paper' / 'README.md': r'''# Paper

The current manuscript is:

```text
seeded_prime_comb_harmonic_reduction.tex
```

It is titled **Seeded Prime-Comb Dynamics and the Finite Harmonic Reduction of Primorial-Block Möbius Sums**.

Compile from this directory with:

```bash
latexmk -pdf seeded_prime_comb_harmonic_reduction.tex
```

A standard TeX installation should provide `fontenc`, `inputenc`, `lmodern`, `microtype`, `geometry`, the AMS packages, `booktabs`, `array`, `longtable`, `enumitem`, `xcolor`, `hyperref`, `cleveref`, `fancyhdr`, and `lastpage`.

The source contains clickable links to the public Lean theorem files after the corresponding proofs. Section 7 links directly to:

```text
../numerics/primorial_block_validation.py
```

The numerical computations are evidence and implementation checks; they are not premises of the formal theorem chain.
''',
            root / 'numerics' / 'README.md': r'''# Numerical reproducibility

The numerical programs are deterministic diagnostics and implementation checks. They are not theorem premises and do not prove the remaining maximal nonconcentration estimate.

Install the pinned Python dependencies:

```bash
python -m pip install -r requirements.txt
```

## Finite primorial-block validation

This is the program linked directly from Section 7 of the paper:

```bash
python primorial_block_validation.py \
  --nmax 4096 \
  --out results/primorial_block_validation
```

The implementation is byte-for-byte identical to the file previously named `squared_space_reproducibility_v3.py`; only its repository path changed. Its reused Git blob SHA is:

```text
98ad192eb59c1ad9cf31ab8cdbfc43cf0f8497ed
```

The historical module docstring is retained unchanged to preserve byte-level provenance.

## Analytic falsification gates

```bash
python analytic_kill_gates.py \
  --nmax 4096 \
  --boundary-mmax 2048 \
  --rmax 240 \
  --cutoff 60 \
  --lambda-high 16 \
  --out results/analytic_kill_gates
```

These gates test exact identities and search for finite-range failure modes. Passing them is not a proof of the open theorem.

## Hash record

The numerical GitHub Actions workflow writes:

- `results/SOURCE_SHA256SUMS.txt` for the two Python source files;
- `results/SHA256SUMS.txt` for the generated numerical artifacts.

The generated archive hash can change when paths, metadata, or output files change. The main validation program's content identity is separately preserved by the Git blob SHA above.
''',
            root / 'CITATION.cff': '''cff-version: 1.2.0\ntitle: "Seeded Prime-Comb Dynamics and the Finite Harmonic Reduction of Primorial-Block Möbius Sums"\nmessage: "Please cite the accompanying paper and this formalization repository."\ntype: software\nauthors:\n  - family-names: Viole\n    given-names: Fred\n    affiliation: OVVO Labs\nversion: 1.0.0\ndate-released: 2026-07-30\nrepository-code: "https://github.com/OVVO-Financial/prime-wheel-mobius"\nurl: "https://github.com/OVVO-Financial/prime-wheel-mobius"\n''',
            root / 'docs' / 'PUBLICATION_CHECKLIST.md': r'''# Publication checklist

Before publishing or cutting a release:

- [ ] Copy the contents of `export/public-repo/` to the new repository root.
- [ ] Choose and add an explicit software/content license.
- [ ] Confirm the paper title, author line, version date, DOI/SSRN link, and preferred citation.
- [ ] Compile `paper/seeded_prime_comb_harmonic_reduction.tex` and optionally commit the resulting PDF.
- [ ] Confirm the Section 7 link resolves to `numerics/primorial_block_validation.py`.
- [ ] Run `cd formalization && lake build RHLean --wfail`.
- [ ] Run `cd formalization && bash scripts/audit_assumptions.sh`.
- [ ] Run the finite validation and analytic gate commands in `numerics/README.md`.
- [ ] Confirm `results/SOURCE_SHA256SUMS.txt` and `results/SHA256SUMS.txt` are produced by the numerical workflow.
- [ ] Confirm all GitHub Actions checks are green.
- [ ] Add the final paper URL or DOI to the repository README and citation metadata when available.
- [ ] Keep the two open inputs described exactly as in `docs/THEOREM_STATUS.md`.

Do not describe the repository as an unconditional proof of RH unless both the maximal nonconcentration estimate and the classical Lean Mertens/RH connection have been supplied and checked.
''',
            Path('export/README.md'): r'''# Public repository export

`public-repo/` is the complete copy-ready seed for `OVVO-Financial/prime-wheel-mobius`.

Copy **the contents of** `public-repo/`, not the enclosing `export/` directory, into the root of the public repository.

The package contains the current paper **Seeded Prime-Comb Dynamics and the Finite Harmonic Reduction of Primorial-Block Möbius Sums**, the standalone Lean project, the Section 7 validation program, analytic falsification gates, documentation, citation metadata, and CI workflows.

The formal theorem sources remain a curated standalone import closure. Arithmetic and Fourier proof modules reuse the checked source from the broader `RH_Lean` sandbox; the public bridge adapters and endpoint isolate the exact published theorem boundary.
''',
            Path('.github/workflows/export.yml'): r'''name: Public export verification

on:
  pull_request:
    paths:
      - 'export/**'
      - '.github/workflows/export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Audit unfinished proofs and project-local axioms
        working-directory: export/public-repo/formalization
        run: bash scripts/audit_assumptions.sh

      - name: Check exported numerical scripts
        working-directory: export/public-repo/formalization
        run: |
          python -m py_compile \
            ../numerics/primorial_block_validation.py \
            ../numerics/analytic_kill_gates.py

      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: export/public-repo/formalization
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Build standalone export
        working-directory: export/public-repo/formalization
        run: lake build RHLean --wfail
''',
            root / '.github' / 'workflows' / 'numerics.yml': r'''name: Numerical reproducibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'numerics/**'
      - '.github/workflows/numerics.yml'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r numerics/requirements.txt

      - name: Record environment
        run: |
          mkdir -p numerics/results
          python --version > numerics/results/python-version.txt
          python -m pip freeze > numerics/results/python-packages.txt

      - name: Record source hashes
        run: |
          sha256sum \
            numerics/primorial_block_validation.py \
            numerics/analytic_kill_gates.py \
            > numerics/results/SOURCE_SHA256SUMS.txt

      - name: Run finite primorial-block validation
        run: |
          python numerics/primorial_block_validation.py \
            --nmax 4096 \
            --out numerics/results/primorial_block_validation

      - name: Run analytic falsification gates
        run: |
          python numerics/analytic_kill_gates.py \
            --nmax 4096 \
            --boundary-mmax 2048 \
            --rmax 240 \
            --cutoff 60 \
            --lambda-high 16 \
            --out numerics/results/analytic_kill_gates

      - name: Hash generated results
        run: |
          find numerics/results -type f \
            ! -name 'SHA256SUMS.txt' \
            -print0 | sort -z | xargs -0 sha256sum \
            > numerics/results/SHA256SUMS.txt

      - name: Upload numerical archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prime-wheel-numerical-results
          path: numerics/results
''',
            root / '.gitignore': '''.DS_Store\nformalization/.lake/\nformalization/build/\nformalization/lean-build.log\nnumerics/results/\npaper/*.aux\npaper/*.bbl\npaper/*.bcf\npaper/*.blg\npaper/*.fdb_latexmk\npaper/*.fls\npaper/*.log\npaper/*.out\npaper/*.pdf\npaper/*.run.xml\npaper/*.synctex.gz\npaper/*.toc\n''',
          }

          for path, content in files.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')

          manifest = root / 'docs' / 'SOURCE_MANIFEST.md'
          current = manifest.read_text(encoding='utf-8')
          marker = '\n## Paper and numerical provenance\n'
          if marker in current:
              current = current.split(marker, 1)[0].rstrip() + '\n'
          current += r'''

## Paper and numerical provenance

- Current manuscript: `paper/seeded_prime_comb_harmonic_reduction.tex`.
- Public repository: `https://github.com/OVVO-Financial/prime-wheel-mobius`.
- The Section 7 program was renamed from `squared_space_reproducibility_v3.py` to `primorial_block_validation.py` without changing its bytes.
- Reused Git blob SHA for that program: `98ad192eb59c1ad9cf31ab8cdbfc43cf0f8497ed`.
- `analytic_kill_gates.py` was updated only where necessary to import the renamed program.
- The numerical workflow records source SHA-256 values and hashes every generated result artifact on each run.

The export update was prepared from the broader sandbox at commit `0376191574fa46ae9eea3c0e6a9f9372ad23576f`. The exact arithmetic and Fourier theorem blobs identified above retain their original checked provenance from `f6110ca00b27a0a329a0f74db8b7747ad4bae234`.
'''
          manifest.write_text(current, encoding='utf-8')
          PY

          rm -f export/public-repo/paper/Squared_Complex_Framework_Elementary_Pointwise_Bridge.tex
          rm -rf .export-paper-parts
          rm -f .github/workflows/finalize-export-update.yml

      - name: Validate updated export
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            export/public-repo/numerics/primorial_block_validation.py \
            export/public-repo/numerics/analytic_kill_gates.py
          test "$(git hash-object export/public-repo/numerics/primorial_block_validation.py)" = \
               '98ad192eb59c1ad9cf31ab8cdbfc43cf0f8497ed'
          ! grep -RIn \
            -e 'squared_space_reproducibility_v3.py' \
            -e 'Squared_Complex_Framework_Elementary_Pointwise_Bridge.tex' \
            export/public-repo .github/workflows/export.yml \
            --exclude='SOURCE_MANIFEST.md' \
            --exclude='README.md'
          grep -n 'primorial_block_validation.py' \
            export/public-repo/paper/seeded_prime_comb_harmonic_reduction.tex

      - name: Commit finalized export
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update public export paper and numerical provenance'
          git push origin HEAD:agent/update-public-export-paper-numerics
