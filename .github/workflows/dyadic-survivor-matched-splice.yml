name: Dyadic survivor matched splice

on:
  pull_request:
    branches: [main]
    paths:
      - RHLean/Proof/DyadicSurvivorMatchedSplice.lean
      - RHLean/Proof/DyadicSurvivorMertensInvariant.lean
      - RHLean/Proof/MatchedFarSurvivorBridge.lean
      - RHLean.lean
      - .github/workflows/dyadic-survivor-matched-splice.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Apply StrongPNT 4.24 compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py
      - name: Build dependency
        run: lake build StrongPNT.PNT5_Strong
      - name: Compile dyadic survivor matched splice
        run: lake build RHLean.Proof.DyadicSurvivorMatchedSplice
