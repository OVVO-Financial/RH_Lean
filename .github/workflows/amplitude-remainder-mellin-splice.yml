name: Amplitude remainder Mellin splice check

on:
  pull_request:
    branches: [main]
    paths:
      - research/LOW_OWNER_AMPLITUDE_MELLIN_LEDGER_SPLICE.lean
      - research/RECIPROCAL_COVARIANCE_PAIR_AMPLITUDE_CONTRACTION.lean
      - research/STABLE_FAR_OWNER_FIRST_CHILD_PLUS_CROSSING.lean
      - research/STABLE_FAR_OWNER_FIRST_COLLAPSE.lean
      - research/LOW_OWNER_PHYSICAL_AMPLITUDE_TRANSPORT.lean
      - research/COVARIANCE_RECIPROCAL_OWNER_CONGESTION.lean
      - RHLean/Proof/StableFarAdaptiveLedgerCollapse.lean
      - .github/workflows/amplitude-remainder-mellin-splice.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Apply StrongPNT 4.24 compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py

      - name: Restore StrongPNT port build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Prebuild StrongPNT dependency
        run: lake build StrongPNT.PNT5_Strong

      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Emit low-owner census dependencies
        run: |
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.CANONICAL_ROUGH_GLOBAL_BOUNDS.olean \
            research/CANONICAL_ROUGH_GLOBAL_BOUNDS.lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.CANONICAL_ROUGH_Q2_TAIL_REDUCTION.olean \
            research/CANONICAL_ROUGH_Q2_TAIL_REDUCTION.lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.LOW_OWNER_HIGH_Q2_SCALAR_CANCELLATION.olean \
            research/LOW_OWNER_HIGH_Q2_SCALAR_CANCELLATION.lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.LOW_OWNER_CHILD_FAR_NORMAL_FORM.olean \
            research/LOW_OWNER_CHILD_FAR_NORMAL_FORM.lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.LOW_OWNER_PHYSICAL_CENSUS_CORRELATION.olean \
            research/LOW_OWNER_PHYSICAL_CENSUS_CORRELATION.lean

      - name: Emit critical Perron synthesis dependencies
        run: |
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.STABLE_FAR_RETURNED_FIBER_PRODUCTION.olean \
            research/STABLE_FAR_RETURNED_FIBER_PRODUCTION.lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.STABLE_FAR_LOG_FREQUENCY_DIAGONALIZATION.olean \
            research/STABLE_FAR_LOG_FREQUENCY_DIAGONALIZATION.lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.STABLE_FAR_PERRON_RETURNED_FIBER_INTERFACE.olean \
            research/STABLE_FAR_PERRON_RETURNED_FIBER_INTERFACE.lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.STABLE_FAR_CRITICAL_Q2_ENERGY_MULTIPLIER.olean \
            research/STABLE_FAR_CRITICAL_Q2_ENERGY_MULTIPLIER.lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.STABLE_FAR_PERRON_QUARTER_FRAME_BOUND.olean \
            research/STABLE_FAR_PERRON_QUARTER_FRAME_BOUND.lean

      - name: Emit physical amplitude and covariance dependencies
        run: |
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.LOW_OWNER_PHYSICAL_AMPLITUDE_TRANSPORT.olean \
            research/LOW_OWNER_PHYSICAL_AMPLITUDE_TRANSPORT.lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.COVARIANCE_RECIPROCAL_OWNER_CONGESTION.olean \
            research/COVARIANCE_RECIPROCAL_OWNER_CONGESTION.lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.STABLE_FAR_OWNER_FIRST_COLLAPSE.olean \
            research/STABLE_FAR_OWNER_FIRST_COLLAPSE.lean

      - name: Kernel-check amplitude remainder Mellin splice
        run: |
          lake env lean -DwarningAsError=true research/LOW_OWNER_AMPLITUDE_MELLIN_LEDGER_SPLICE.lean
          lake env lean -DwarningAsError=true research/RECIPROCAL_COVARIANCE_PAIR_AMPLITUDE_CONTRACTION.lean
          lake env lean -DwarningAsError=true research/STABLE_FAR_OWNER_FIRST_CHILD_PLUS_CROSSING.lean
