name: Repair exceptional q2 telescope fast2

on:
  push:
    branches:
      - agent/exceptional-q2-exact-telescope
    paths:
      - scripts/repair_exceptional_q2_tmp.py
      - .github/workflows/repair-exceptional-q2-fast2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Apply repair
        run: python3 scripts/repair_exceptional_q2_tmp.py

      - name: Restore Mathlib and dependency builds
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Set up Lean and Mathlib
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Apply StrongPNT compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py

      - name: Restore StrongPNT build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Prebuild StrongPNT dependency
        run: lake build StrongPNT.PNT5_Strong

      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Compile repaired telescope
        run: lake build RHLean.Proof.ExceptionalContactFrameEnergyNoGo

      - name: Commit repaired source and delete temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RHLean/Proof/ExceptionalContactFrameEnergyNoGo.lean
          git rm -f scripts/repair_exceptional_q2_tmp.py
          git rm -f .github/workflows/repair-exceptional-q2-fast2.yml
          git rm -f .github/workflows/repair-exceptional-q2-telescope.yml
          git rm -f .github/workflows/repair-exceptional-q2-telescope-fast.yml
          git commit -m "Repair exact q2 telescope support proof"
          git push
