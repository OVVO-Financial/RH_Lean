name: VF 915 conditional source-payment audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Restore PNT+ build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Prebuild PNT+ StrongPNT dependency
        run: lake build PrimeNumberTheoremAnd.StrongPNT
      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      - name: Build library imports
        run: |
          python3 - <<'PY'
          import subprocess
          import sys
          sys.path.insert(0, 'scripts')
          import compile_research_import_closure as closure
          seen, roots = set(), set()
          def visit(module):
              if module in seen:
                  return
              seen.add(module)
              source = closure.source_for(module)
              for dependency in closure.research_imports(source):
                  visit(dependency)
              for line in source.read_text().splitlines():
                  if line.startswith('import RHLean'):
                      roots.add(line.removeprefix('import ').strip())
          visit('research.VF_MID_FIRST_BAD_EXACT_BUDGET_CLOSE')
          subprocess.run(['lake', 'build', *sorted(roots)], check=True)
          PY
      - name: Restore stable #914 research closure
        id: research-cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build/lib/lean/research.*
          key: vf915-research-base-${{ runner.os }}-${{ runner.arch }}-${{ github.event.pull_request.base.sha || github.sha }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Build RHLean modules imported by these research checks
        run: >-
          python3 scripts/compile_research_import_closure.py --library-only
          research/VF_MID_FIRST_BAD_EXACT_BUDGET_CLOSE.lean
          research/VF_MID_FIRST_BAD_FINAL_AGGREGATE_CONTRACTION.lean
      - name: Compile stable #914 research closure
        if: steps.research-cache.outputs.cache-hit != 'true'
        run: |
          python3 scripts/compile_research_import_closure.py research/VF_MID_FIRST_BAD_FINAL_AGGREGATE_CONTRACTION.lean
      - name: Save stable #914 research closure
        if: steps.research-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .lake/build/lib/lean/research.*
          key: vf915-research-base-${{ runner.os }}-${{ runner.arch }}-${{ github.event.pull_request.base.sha || github.sha }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Compile exact budget close only
        run: |
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.VF_MID_FIRST_BAD_EXACT_BUDGET_CLOSE.olean \
            research/VF_MID_FIRST_BAD_EXACT_BUDGET_CLOSE.lean

      - name: Audit explicit conditional consumers and standard axioms
        run: |
          cat > /tmp/VF915ConditionalAcceptance.lean <<'LEAN'
          import «research.VF_MID_FIRST_BAD_EXACT_BUDGET_CLOSE»
          #check RHLean.Analysis.VFMid915FirstBadSourcePaymentStatement
          #print axioms RHLean.Analysis.vfMidActualPrimeFirstBadAt_two_succ_halfScaleSectorSixPayment_of_anchoredBalance
          #print axioms RHLean.Analysis.vfMidActualPrimeFirstBadAt_two_succ_sourceInlet_of_anchoredBalance
          #print axioms RHLean.Analysis.vfMidActualPrimeFirstBadAt_two_succ_activeExcess_nonpos_of_anchoredBalance
          #print axioms RHLean.Analysis.vfMidActualPrimeFirstBadAt_two_succ_closed_of_anchoredBalance
          #print axioms RHLean.Analysis.vfMid915FirstBad_closed_of_sourcePayment
          LEAN
          lake env lean -DwarningAsError=true /tmp/VF915ConditionalAcceptance.lean | tee /tmp/vf915-conditional-axioms.log
          python3 - <<'PY_AUDIT'
          import re
          from pathlib import Path
          records = re.findall(r"depends on axioms:\s*\[([^\]]*)\]", Path('/tmp/vf915-conditional-axioms.log').read_text(), re.S)
          if len(records) != 5:
              raise SystemExit(f'Expected five conditional-consumer axiom records, got {len(records)}')
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for record in records:
              actual = {a.strip() for a in record.split(',') if a.strip()}
              if not actual <= allowed:
                  raise SystemExit(f'Nonstandard axioms: {actual - allowed}')
          PY_AUDIT
