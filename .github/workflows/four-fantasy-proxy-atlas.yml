name: Four fantasy proxy numerical atlas

on:
  push:
    branches:
      - openai/four-fantasy-proxy-atlas
    paths:
      - numerics/four_fantasy_proxy_atlas/run_atlas.py
      - numerics/four_fantasy_proxy_atlas/README.md
      - .github/workflows/four-fantasy-proxy-atlas.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependencies
        run: python -m pip install --upgrade numpy scipy matplotlib

      - name: Reproduce four-proxy atlas through x=1e8
        env:
          MPLBACKEND: Agg
        run: |
          python numerics/four_fantasy_proxy_atlas/run_atlas.py \
            --r-max 10000 \
            --local-x-max 2500 \
            --rh-start 56 \
            --out numerics/four_fantasy_proxy_atlas/results

      - name: Commit regenerated numerical record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add numerics/four_fantasy_proxy_atlas/results
          if git diff --cached --quiet; then
            echo "Atlas already current"
            exit 0
          fi
          git commit -m "Regenerate four fantasy proxy numerical atlas"
          git push origin HEAD:${GITHUB_REF_NAME}
