name: CODIV large-gcd triangular bound

on:
  pull_request:
    paths:
      - 'research/CODIV_LARGE_GCD_TRIANGULAR_20261107.lean'
      - 'RHLean/Analysis/DeterministicTGreenKuboComparison.lean'
      - 'scripts/codiv_large_gcd_triangular_regression.py'
      - '.github/workflows/codiv-large-gcd-triangular.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codiv-large-gcd-${{ github.head_ref || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  codiv-large-gcd-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Exact original-pair and lattice regressions
        run: python3 scripts/codiv_large_gcd_triangular_regression.py
      - name: Verify compiler and Mathlib pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q 'd13f23b723b8a846827a245b89c10fc7d3f11612' lakefile.lean
      - name: Pinned Lean and cached Mathlib
        uses: ./.github/actions/lean-setup
      - name: Restore native compiled prerequisites
        uses: ./.github/actions/lean-compiled-cache
      - name: Compile the source-addressed warning-fatal import closure
        uses: ./.github/actions/research-compile
        with:
          build-library: 'true'
          targets: research/CODIV_LARGE_GCD_TRIANGULAR_20261107.lean
      - name: Inspect exact theorem types and standard axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -DwarningAsError=true \
            research/CODIV_LARGE_GCD_TRIANGULAR_20261107.lean | tee codiv-large-gcd-audit.log
          python3 - <<'PY'
          import pathlib
          import re
          text = pathlib.Path('codiv-large-gcd-audit.log').read_text()
          expected = {
              'codivLargeGcdCovariance_eq_original',
              'codivLargeGcdCovariance_abs_le_support',
              'codivLargeGcdSupport_le_sharp',
              'codivLargeGcdSupport_le',
              'codivLargeGcdCovariance_abs_le',
          }
          entries = re.findall(r"'RHLean.Analysis.([^']+)' depends on axioms:\s*\[([^]]*)\]", text, re.S)
          assert len(entries) == len(expected), entries
          assert {name for name, _ in entries} == expected, entries
          for name, values in entries:
              used = {value.strip() for value in values.split(',') if value.strip()}
              assert used <= {'propext', 'Classical.choice', 'Quot.sound'}, (name, used)
          source = pathlib.Path('research/CODIV_LARGE_GCD_TRIANGULAR_20261107.lean').read_text()
          source = re.sub(r'/-.*?-/', '', source, flags=re.S)
          source = re.sub(r'--.*', '', source)
          assert not re.search(r'\b(sorry|admit|axiom|native_decide|unsafe)\b', source)
          assert set(re.findall(r'^theorem (\w+)', source, re.M)) == expected
          assert set(re.findall(r'^#check (\w+)', source, re.M)) == expected
          print('PASS: five source-exact declarations; standard logical axioms only')
          PY
      - name: Preserve exact signatures and axiom evidence
        if: ${{ !cancelled() && hashFiles('codiv-large-gcd-audit.log') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: codiv-large-gcd-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            codiv-large-gcd-audit.log
            research/CODIV_LARGE_GCD_TRIANGULAR_20261107.lean
          if-no-files-found: error
