name: Public export verification

on:
  pull_request:
    paths:
      - 'export/**'
      - '.github/workflows/export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: export/public-repo/formalization
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Audit unfinished proofs and project-local axioms
        run: bash scripts/audit_assumptions.sh

      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Build standalone export
        run: lake build RHLean --wfail
