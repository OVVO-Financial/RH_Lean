name: Public export verification

on:
  push:
    branches: [main]
    paths:
      - 'export_prime_wheel/**'
      - 'export_mobius_synthesis/**'
      - 'export_square_block/**'
      - '**.lean'
      - 'scripts/check_export_sync.py'
      - 'scripts/verify_exports_local.sh'
      - 'scripts/local_ci.sh'
      - '.github/workflows/export.yml'
  pull_request:
    paths:
      - 'export_prime_wheel/**'
      - 'export_mobius_synthesis/**'
      - 'export_square_block/**'
      - '**.lean'
      - 'scripts/check_export_sync.py'
      - 'scripts/verify_exports_local.sh'
      - 'scripts/local_ci.sh'
      - '.github/workflows/export.yml'
  workflow_dispatch:

permissions:
  contents: write

# This workflow fires on '**.lean', so it followed every Lean commit -- 839
# runs so far -- and without a concurrency group a burst of pushes left a
# queue of runs all verifying superseded trees.
concurrency:
  group: export-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Insert generated root import once
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("RHLean.lean")
          target = "import RHLean.Proof.LowPrimeCompletedPartnerWindowFold"
          lines = manifest.read_text(encoding="utf-8").splitlines()
          if target not in lines:
              lines.append(target)
          lines.sort()
          manifest.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RHLean.lean
          if ! git diff --cached --quiet; then
            git commit -m "Import completed partner fold in root manifest"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Verify every export closes as a buildable Lake project
        run: python3 scripts/check_export_sync.py

      - name: Audit Möbius Synthesis standalone invariants
        working-directory: export_mobius_synthesis
        run: bash scripts/audit_assumptions.sh

      - name: Audit the square-block export for unfinished proofs and axioms
        working-directory: export_square_block/lean
        run: bash scripts/audit_assumptions.sh

      - name: Verify paper and numerical provenance
        working-directory: export_prime_wheel
        run: |
          # The manuscript is deliberately not pinned by hash: it is revised as
          # research lands, and a content pin only turns every paper edit into a
          # red build. That already happened once, when c409a03 revised the paper
          # and left the gate failing on main until the hash was rebaselined.
          # What is checked is that the paper still exists and still resolves to
          # the program it cites.
          test -s paper/seeded_prime_comb_harmonic_reduction.tex
          test "$(git hash-object numerics/primorial_block_validation.py)" = '98ad192eb59c1ad9cf31ab8cdbfc43cf0f8497ed'
          grep -F 'https://github.com/OVVO-Financial/prime-wheel-mobius/blob/main/numerics/primorial_block_validation.py' paper/seeded_prime_comb_harmonic_reduction.tex
          test ! -e numerics/squared_space_reproducibility_v3.py
          # The square-block manuscript stays out of the public export. Both the
          # current filename and the superseded one are guarded, so neither the
          # live paper nor a resurrected stale copy can leak into the package.
          test ! -e paper/A_SquaredComplex_Framework_for_SquarePrefix_Mobius_Sums.tex
          test ! -e paper/Squared_Complex_Framework_Elementary_Pointwise_Bridge.tex

      - name: Audit unfinished proofs and project-local axioms
        working-directory: export_prime_wheel/formalization
        run: bash scripts/audit_assumptions.sh

      - name: Check exported numerical scripts
        working-directory: export_prime_wheel/formalization
        run: |
          python -m py_compile \
            ../numerics/primorial_block_validation.py \
            ../numerics/analytic_kill_gates.py

      - name: Record local Lean build policy
        run: |
          echo 'Lean compilation for the exports is intentionally local-only.'
          echo 'Every Lake project carries scripts/local_ci.sh, which mirrors that project'"'"'s hosted job:'
          echo '  audit sources, restore the Mathlib cache, lake build RHLean --wfail, run the axiom gate.'
          echo 'Per-project command, run from the package directory:'
          echo '  bash scripts/local_ci.sh'
          echo 'Package directories: . export_mobius_synthesis export_prime_wheel/formalization export_square_block/lean'

      - name: Record cross-project local verification policy
        run: |
          echo 'GitHub Desktop opens terminals at the repository root, but each export is a separate Lake project.'
          echo 'A root build never compiles export-only source, so before merging a change that crosses the'
          echo 'development tree and an export, use:'
          echo '  bash scripts/verify_exports_local.sh'
          echo 'That command pins the source surface (clean tree, local HEAD = origin head, export sync),'
          echo 'deletes every project'"'"'s .lake/build, then runs all four project CI mirrors from scratch.'
