name: Canonical Möbius liberty core check

on:
  push:
    branches: [agent/canonical-mobius-liberty-core]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Restore PNT+ build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Prebuild PNT+ StrongPNT dependency
        run: lake build PrimeNumberTheoremAnd.StrongPNT
      - name: Kernel-check canonical liberty branch
        shell: bash
        run: |
          set -o pipefail
          lake build \
            RHLean.Proof.SquareRootLowPrimeCanonicalLiberty \
            RHLean.Proof.SquareRootLowPrimeCanonicalLibertyPartition \
            RHLean.Proof.SquareRootLowPrimePartialPacketBoundary \
            2>&1 | tee canonical-liberty-core.log
      - name: Print log
        if: ${{ always() }}
        run: cat canonical-liberty-core.log
