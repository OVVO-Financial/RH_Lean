name: Canonical Möbius liberty core check

on:
  push:
    branches: [agent/canonical-mobius-liberty-core]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Apply StrongPNT compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py
      - name: Restore StrongPNT port build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Prebuild StrongPNT dependency
        run: lake build StrongPNT.PNT5_Strong
      - name: Kernel-check canonical liberty core
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          lake build RHLean.Proof.SquareRootLowPrimeCanonicalLiberty 2>&1 | tee canonical-liberty-core.log
      - name: Commit diagnostics on failure
        if: ${{ steps.build.outcome == 'failure' }}
        run: |
          cp canonical-liberty-core.log research/canonical-liberty-core-build-errors.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/canonical-liberty-core-build-errors.txt
          git commit -m "Record canonical liberty core diagnostics"
          git push origin HEAD:agent/canonical-mobius-liberty-core
      - name: Print log
        if: ${{ always() }}
        run: cat canonical-liberty-core.log
      - name: Fail on build error
        if: ${{ steps.build.outcome == 'failure' }}
        run: exit 1
