name: Canonical endpoint patch

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-endpoint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Correct isolated m=1 convention
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          module = Path('RHLean/Proof/CanonicalHighSectorBridge.lean')
          text = module.read_text()
          old = "estimate. The intended realization has `bound = floor Λ`; the bridge below\nrequires only a finite nonnegative uniform bound."
          new = "estimate. For the nontrivial canonical sources the manuscript gives the\n`floor Λ` occupancy bound. Because this exact square-prefix convention folds the\nisolated `μ(1)` term into the low block, a direct uniform realization may use\n`floor Λ + 1`, or handle that one endpoint separately. The bridge below requires\nonly a finite nonnegative uniform bound."
          if old not in text:
              raise SystemExit('module endpoint text not found')
          module.write_text(text.replace(old, new, 1))

          for name in ['FORMALIZATION_SEQUENCE.md', 'FORMALIZATION_CHECKLIST.md']:
              path = Path(name)
              text = path.read_text()
              text = text.replace(
                  'intended bound `⌊Λ⌋`',
                  'manuscript bound `⌊Λ⌋` for nontrivial sources, with the isolated `m=1` term handled separately or absorbed by `⌊Λ⌋+1`')
              text = text.replace(
                  'with the manuscript bound `⌊Λ⌋`',
                  'with the manuscript nontrivial-source bound `⌊Λ⌋` and the isolated `m=1` endpoint handled explicitly')
              path.write_text(text)
          PY

      - name: Commit endpoint correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RHLean/Proof/CanonicalHighSectorBridge.lean FORMALIZATION_SEQUENCE.md FORMALIZATION_CHECKLIST.md
          git commit -m "Clarify isolated canonical unit endpoint"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
