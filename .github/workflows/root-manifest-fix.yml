name: Refresh Lean root manifest

on:
  push:
    branches: [agent/terminal-high-prime-integration]
    paths: [.github/workflows/root-manifest-fix.yml]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/terminal-high-prime-integration
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Regenerate root manifest
        run: lake exe mk_all || true
      - name: Commit generated root
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RHLean.lean
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh Lean root import manifest'
          git push origin HEAD:agent/terminal-high-prime-integration
