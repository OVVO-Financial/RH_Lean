name: Mathlib dependency image

# Publishes the prebuilt Lean toolchain plus Mathlib image consumed by
# .github/workflows/lean-container.yml.  It runs only when the toolchain or the
# dependency set moves, which in practice means a Mathlib bump.

on:
  push:
    branches: [main]
    paths:
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'lakefile.lean'
      - '.github/docker/Dockerfile.mathlib'
      - '.github/workflows/mathlib-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mathlib-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-image:
    name: Build and publish dependency image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # GHCR rejects uppercase path segments, and the organization name is
      # mixed case, so derive the repository path in lowercase.
      - name: Resolve image reference
        id: ref
        run: |
          set -euo pipefail
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          toolchain="$(tr -d '[:space:]' < lean-toolchain | tr '/:' '--')"
          deps="$(sha256sum lake-manifest.json | cut -c1-12)"
          echo "image=ghcr.io/${owner}/rh-lean-mathlib" >> "$GITHUB_OUTPUT"
          echo "tag=${toolchain}-${deps}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The image is one big layer of oleans, so registry layer caching buys
      # nothing on a dependency bump; the value is that this runs rarely.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/Dockerfile.mathlib
          push: true
          provenance: false
          tags: |
            ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.tag }}
            ${{ steps.ref.outputs.image }}:latest

      - name: Report published reference
        run: |
          {
            echo "### Dependency image published"
            echo
            echo '```'
            echo "${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.tag }}"
            echo "${{ steps.ref.outputs.image }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
