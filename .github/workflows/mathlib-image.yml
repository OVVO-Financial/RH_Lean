name: Mathlib dependency image

# Publishes the prebuilt Lean toolchain plus Mathlib image consumed by
# .github/workflows/lean-container.yml.  It runs only when the toolchain or the
# dependency set moves, which in practice means a Mathlib bump.

on:
  push:
    branches: [main]
    paths:
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'lakefile.lean'
      - '.github/docker/Dockerfile.mathlib'
      - '.github/workflows/mathlib-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mathlib-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-image:
    name: Build and publish dependency image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Layered progress output collapses each step to a spinner, which is how
      # the first and only run of this workflow managed to fail without leaving
      # any indication of which layer broke.
      BUILDKIT_PROGRESS: plain
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Mathlib's oleans unpack to several gigabytes, and BuildKit needs room
      # for the layer snapshot and the export on top of that.  A stock
      # ubuntu-latest image ships ~25 GB of preinstalled toolchains this build
      # will never touch, and reclaiming them is the difference between a
      # comfortable margin and an out-of-space failure part way through a
      # multi-gigabyte download.
      - name: Reclaim runner disk space
        run: |
          set -eux
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/share/swift \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune -af || true
          df -h /

      # GHCR rejects uppercase path segments, and the organization name is
      # mixed case, so derive the repository path in lowercase.
      - name: Resolve image reference
        id: ref
        run: |
          set -euo pipefail
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          toolchain="$(tr -d '[:space:]' < lean-toolchain | tr '/:' '--')"
          deps="$(sha256sum lake-manifest.json | cut -c1-12)"
          echo "image=ghcr.io/${owner}/rh-lean-mathlib" >> "$GITHUB_OUTPUT"
          echo "tag=${toolchain}-${deps}" >> "$GITHUB_OUTPUT"

      # `latest` is what lean-container.yml pulls, so only a build of the
      # default branch is allowed to move it.  A dispatch from a topic branch
      # still publishes its content tag, which is enough to prove the image
      # builds without repointing CI at an unreviewed tree.
      - name: Resolve tag list
        id: tags
        run: |
          set -euo pipefail
          image='${{ steps.ref.outputs.image }}'
          tag='${{ steps.ref.outputs.tag }}'
          {
            echo 'list<<EOF'
            echo "${image}:${tag}"
            if [ '${{ github.ref }}' = 'refs/heads/main' ]; then
              echo "${image}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The image is one big layer of oleans, so registry layer caching buys
      # nothing on a dependency bump; the value is that this runs rarely.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/Dockerfile.mathlib
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.list }}

      - name: Report published reference
        run: |
          {
            echo "### Dependency image published"
            echo
            echo '```'
            echo '${{ steps.tags.outputs.list }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
