name: Canonical frontier bridge development check

on:
  push:
    branches: [agent/full-sequential-canonical-frontier-bridge]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  statuses: write

concurrency:
  group: canonical-frontier-bridge-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Publish pending validation status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'canonical-frontier-bridge-dev',
              description: 'Canonical frontier bridge validation is running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Repair and import development modules
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count == 0 and new in text:
                  return
              if count != 1:
                  raise SystemExit(f"expected one anchor in {path}, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_count(path: str, old: str, new: str, expected: int) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count == 0 and text.count(new) >= expected:
                  return
              if count != expected:
                  raise SystemExit(
                      f"expected {expected} anchors in {path}, found {count}: {old!r}"
                  )
              p.write_text(text.replace(old, new))

          replace_once(
              "RHLean/Proof/SquareRootLowPrimeSignedResponseMatching.lean",
              """  intro a _ha b _hb hab
  omega
""",
              """  intro a _ha b _hb hab
  exact Nat.mul_left_cancel hell.pos hab
""",
          )

          creation = "RHLean/Proof/CreationResponseFrontierCancellation.lean"
          replace_once(
              creation,
              """    unfold creationResponseMatchedImage
    symm
    apply Finset.sum_image
""",
              """    unfold creationResponseMatchedImage
    apply Finset.sum_image
""",
          )
          replace_once(
              creation,
              """  rw [← hCsplit, ← hRsplit, himageSum]
  abel
""",
              """  rw [← hCsplit, ← hRsplit, himageSum]
  calc
    _ = (∑ c ∈ C \\ M, wC c) +
          (∑ r ∈ R \\ creationResponseMatchedImage M φ, wR r) +
          ((∑ c ∈ M, wC c) + ∑ c ∈ M, wR (φ c)) := by
      abel
    _ = _ := by rw [hpair, add_zero]
""",
          )
          replace_count(creation, "abs_add _ _", "abs_add_le _ _", 1)
          replace_once(
              creation,
              "    cases haz.symm.trans hbz\n",
              "    cases haz.trans hbz.symm\n",
          )

          energy = "RHLean/Proof/SquareRootLowPrimeQuantitativeEnergyReduction.lean"
          replace_once(
              energy,
              """  have hstep :=
    squareRootLowPrimeRunningImbalanceReal_step_eq_freshIncrementReal
      R K j p hp
  nlinarith
""",
              """  have hstep :=
    squareRootLowPrimeRunningImbalanceReal_step_eq_freshIncrementReal
      R K j p hp
  rw [← hstep]
  ring
""",
          )
          replace_count(energy, "abs_add _ _", "abs_add_le _ _", 2)

          postroot = "RHLean/Proof/SquareRootLowPrimePostRootTransform.lean"
          replace_once(
              postroot,
              """  classical
  rw [squareRootLowPrimePostRootResponseAtoms_eq_product_filter]
  unfold squareRootLowPrimePostRootParentMass
    squareRootLowPrimePostRootCofactorTransform
  rw [Finset.sum_filter]
""",
              """  classical
  unfold squareRootLowPrimePostRootParentMass
    squareRootLowPrimePostRootCofactorTransform
  rw [squareRootLowPrimePostRootResponseAtoms_eq_product_filter,
    Finset.sum_filter]
""",
          )
          replace_once(
              postroot,
              """  have hXltSquare : squareRootEndpoint R < R ^ 2 := by
    unfold squareRootEndpoint
    positivity
""",
              """  have hXltSquare : squareRootEndpoint R < R ^ 2 := by
    unfold squareRootEndpoint
    have hsqpos : 0 < R ^ 2 := by positivity
    exact Nat.sub_lt hsqpos (by norm_num)
""",
          )

          rough = "RHLean/Proof/SquareRootLowPrimeRoughBaseResidual.lean"
          replace_once(
              rough,
              """  unfold squareRootLowPrimeOwnedResponseRoughBaseResidual
    squareRootLowPrimeOwnedResponseRoughBaseFiber
  symm
  simpa using
    (Finset.sum_fiberwise_of_maps_to'
      (s := squareRootLowPrimeOwnedResponseChildren R K U)
      (t := squareRootLowPrimeOwnedResponseRoughBases R K U)
      (g := squareRootLowPrimeResponseRoughBase K U)
      hmaps
      (fun n : ℕ => μ n))
""",
              """  unfold squareRootLowPrimeOwnedResponseRoughBaseResidual
    squareRootLowPrimeOwnedResponseRoughBaseFiber
  symm
  have h := Finset.sum_fiberwise_eq_sum_filter
    (squareRootLowPrimeOwnedResponseChildren R K U)
    (squareRootLowPrimeOwnedResponseRoughBases R K U)
    (squareRootLowPrimeResponseRoughBase K U)
    (fun n : ℕ => μ n)
  simpa [hmaps] using h
""",
          )

          manifest = Path("RHLean.lean")
          targets = {
              "import RHLean.Proof.SquareRootLowPrimeCanonicalFrontierBridge",
              "import RHLean.Proof.SquareRootLowPrimeCreationResponseCarriers",
              "import RHLean.Proof.SquareRootLowPrimeDeepResponseAtoms",
              "import RHLean.Proof.SquareRootLowPrimePostRootTransform",
              "import RHLean.Proof.SquareRootLowPrimeProcessedSeatCarrier",
              "import RHLean.Proof.SquareRootLowPrimeProcessedSeatMatching",
              "import RHLean.Proof.SquareRootLowPrimeResponseForest",
              "import RHLean.Proof.SquareRootLowPrimeResponseFrontier",
              "import RHLean.Proof.SquareRootLowPrimeSignedResponseChildren",
              "import RHLean.Proof.SquareRootLowPrimeSignedResponseEnergy",
          }
          lines = [line.strip() for line in manifest.read_text().splitlines() if line.strip()]
          for target in targets:
              if target not in lines:
                  lines.append(target)
          manifest.write_text("\n".join(sorted(lines)) + "\n")
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add RHLean.lean RHLean/Proof
            git commit -m "Repair PR 473 Lean checks"
            git push
          fi

      - name: Check paper / Analysis boundary
        run: bash scripts/check_paper_analysis_boundary.sh

      - name: Audit unfinished proofs and axioms
        run: bash scripts/audit_assumptions.sh

      - name: Check Lean root import manifest
        run: python3 scripts/check_root_manifest.py

      - name: Restore Mathlib packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Set up Lean and Mathlib
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Apply StrongPNT 4.24 compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py

      - name: Restore StrongPNT port build cache
        id: strongpnt_cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Prebuild StrongPNT dependency
        run: lake build StrongPNT.PNT5_Strong

      - name: Save StrongPNT port build cache
        if: ${{ !cancelled() && steps.strongpnt_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}

      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Kernel-check development modules
        id: kernel_checks
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          lake build \
            RHLean.Proof.SquareRootLowPrimeDeepResponseAtoms \
            RHLean.Proof.SquareRootLowPrimeSignedResponseChildren \
            RHLean.Proof.SquareRootLowPrimeSignedResponseEnergy \
            RHLean.Proof.SquareRootLowPrimeResponseFrontier \
            RHLean.Proof.SquareRootLowPrimeResponseForest \
            RHLean.Proof.SquareRootLowPrimePostRootTransform \
            RHLean.Proof.SquareRootLowPrimeCanonicalFrontierBridge \
            2>&1 | tee fast-check.log

      - name: Build Lean project
        id: directbuild
        continue-on-error: true
        run: lake build RHLean > lean-build.log 2>&1

      - name: Fail on RHLean-owned warnings
        id: rhlean_warnings
        if: ${{ always() && steps.directbuild.outcome != 'skipped' }}
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          owned_path = re.compile(r"(?:^|[\s:])(?:\./)*RHLean(?:\.lean|/)")
          lines = Path("lean-build.log").read_text(errors="replace").splitlines()
          owned = [
              line for line in lines
              if "warning:" in line.lower() and owned_path.search(line)
          ]
          if owned:
              print("RHLean-owned Lean warnings found:")
              print("\n".join(owned))
              raise SystemExit(1)
          print("No RHLean-owned Lean warnings found.")
          PY

      - name: Fail on StrongPNT port diagnostics
        id: strongpnt_noise
        if: ${{ always() && steps.directbuild.outcome != 'skipped' }}
        continue-on-error: true
        shell: bash
        run: python3 scripts/lean_diagnostic_inventory.py --gate StrongPNT lean-build.log

      - name: Print Lean build log
        if: ${{ always() && steps.directbuild.outcome != 'skipped' }}
        run: cat lean-build.log

      - name: Publish validation status
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const failed =
              '${{ steps.kernel_checks.outcome }}' === 'failure' ||
              '${{ steps.directbuild.outcome }}' === 'failure' ||
              '${{ steps.rhlean_warnings.outcome }}' === 'failure' ||
              '${{ steps.strongpnt_noise.outcome }}' === 'failure';
            const state = failed ? 'failure' : 'success';
            const description = failed
              ? 'Canonical frontier bridge validation failed'
              : 'Kernel checks and full RHLean validation passed';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'canonical-frontier-bridge-dev',
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Fail if validation did not close cleanly
        if: ${{ always() && (steps.kernel_checks.outcome == 'failure' || steps.directbuild.outcome == 'failure' || steps.rhlean_warnings.outcome == 'failure' || steps.strongpnt_noise.outcome == 'failure') }}
        run: exit 1
