name: Stable-far reciprocal owner Fubini check

on:
  pull_request:
    branches: [main]
    paths:
      - research/STABLE_FAR_RECIPROCAL_OWNER_FUBINI.lean
      - RHLean/Proof/StableFarWallCrossingOwnerWindow.lean
      - RHLean/Proof/StableFarWallQ2ChildFarSlice.lean
      - .github/workflows/stable-far-reciprocal-owner-fubini.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Restore PNT+ build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Prebuild PNT+ StrongPNT dependency
        run: lake build PrimeNumberTheoremAnd.StrongPNT

      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-

      - name: Build reciprocal Fubini dependencies
        run: |
          lake build RHLean.Proof.StableFarWallCrossingOwnerWindow
          lake build RHLean.Proof.StableFarWallQ2ChildFarSlice

      - name: Build RHLean modules imported by these research checks
        run: >-
          python3 scripts/compile_research_import_closure.py --library-only
          research/STABLE_FAR_RECIPROCAL_OWNER_FUBINI.lean

      - name: Kernel-check reciprocal stable-far Fubini
        run: lake env lean -DwarningAsError=true research/STABLE_FAR_RECIPROCAL_OWNER_FUBINI.lean
