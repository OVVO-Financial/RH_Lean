name: Stable-far reciprocal owner Fubini check

on:
  pull_request:
    branches: [main]
    paths:
      - research/STABLE_FAR_RECIPROCAL_OWNER_FUBINI.lean
      - RHLean/Proof/StableFarWallCrossingOwnerWindow.lean
      - RHLean/Proof/StableFarWallCrossingRenewal.lean
      - .github/workflows/stable-far-reciprocal-owner-fubini.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: true
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Kernel-check reciprocal stable-far Fubini
        run: lake env lean -DwarningAsError=true research/STABLE_FAR_RECIPROCAL_OWNER_FUBINI.lean
