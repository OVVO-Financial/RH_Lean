name: Go crossing global partner targeted check

on:
  push:
    branches: [agent/go-crossing-global-partner]
  workflow_dispatch:

concurrency:
  group: go-crossing-global-partner-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore Mathlib packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Set up Lean and Mathlib
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-go-partner-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean/Proof/SquareRootLowPrimeGoGlobalPartner.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Build Go global partner module
        run: lake build RHLean.Proof.SquareRootLowPrimeGoGlobalPartner

      - name: Audit unfinished proofs and axioms
        run: bash scripts/audit_assumptions.sh
