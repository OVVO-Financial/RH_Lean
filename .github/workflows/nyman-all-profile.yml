name: Nyman all-profile coercivity

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/NYMAN_ALL_PROFILE_COERCIVITY.lean'
      - 'scripts/lean/nyman_all_profile/**'
      - 'scripts/nyman_all_profile_regression.py'
      - '.github/workflows/nyman-all-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nyman-all-profile-${{ github.head_ref || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  nyman-all-profile-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Independent exact all-profile regression
        run: python3 scripts/nyman_all_profile_regression.py
      - name: Verify compiler and Mathlib pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q 'd13f23b723b8a846827a245b89c10fc7d3f11612' lakefile.lean
      - name: Pinned Lean and cached Mathlib
        uses: ./.github/actions/lean-setup
      - name: Restore native compiled prerequisites
        uses: ./.github/actions/lean-compiled-cache
      - name: Warning-fatal research import closure
        uses: ./.github/actions/research-compile
        with:
          build-library: 'true'
          targets: research/NYMAN_ALL_PROFILE_COERCIVITY.lean
      - name: Exact types, dependencies, and standard terminal axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -DwarningAsError=true scripts/lean/nyman_all_profile/ExactTypes.lean | tee nyman-all-profile-types.log
          lake env lean -DwarningAsError=true --run scripts/lean/nyman_all_profile/Audit.lean | tee nyman-all-profile-audit.log
          python3 scripts/lean/nyman_all_profile/check_inventory.py
      - name: Preserve proof and audit evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nyman-all-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/NYMAN_ALL_PROFILE_COERCIVITY.lean
            scripts/lean/nyman_all_profile/
            nyman-all-profile-types.log
            nyman-all-profile-audit.log
          if-no-files-found: error
