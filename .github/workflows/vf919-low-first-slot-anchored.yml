name: Native LOW-first slot-calibrated contraction

on:
  pull_request:
    paths:
      - 'research/oai_434/VF919LowFirstPhysicalTiltFullBudget.lean'
      - 'research/oai_434/VF919LowFirstSlotCalibratedData.lean'
      - 'research/oai_434/VF919LowFirstSlotAnchoredEndpoint.lean'
      - 'research/oai_434/VF919ActualSlotMinRetighten.lean'
      - 'research/oai_434/VF919OriginalExceptionalSignedGram.lean'
      - 'research/oai_434/VF919NativeOwnerDiagonalThreeQuarter.lean'
      - 'research/oai_434/VF919ImprovedOwnerDiagonal.lean'
      - 'research/oai_434/VF919ExplicitPhysicalSlotSeed.lean'
      - 'research/oai_434/VF919OwnerBootstrapIteration.lean'
      - 'research/oai_434/VF919FractionalOwnerContraction.lean'
      - 'research/oai_434/VF919OriginalGainComponentLedger.lean'
      - 'research/oai_434/VF919OriginalLowTupleSignedGram.lean'
      - 'scripts/native_owner_diagonal_three_quarter_audit.cpp'
      - 'research/oai_434/VF919Anchored*.lean'
      - 'scripts/lean/slot_anchored/**'
      - '.github/workflows/vf919-low-first-slot-anchored.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vf919-low-first-slot-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  low-first-slot-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Exact Mobius and high-prime owner-Gamma regression through R=3500
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Werror \
            scripts/native_owner_diagonal_three_quarter_audit.cpp -o /tmp/native_owner_three_quarter
          /tmp/native_owner_three_quarter 3500
      - name: Verify the pinned Lean and Mathlib versions
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.34.1"
          grep -q 'd13f23b723b8a846827a245b89c10fc7d3f11612' lakefile.lean
      - uses: ./.github/actions/lean-setup
      - name: Checkout the exact original analytic source
        uses: actions/checkout@v4
        with:
          repository: openai/math
          ref: 1581d4cbdd69a0faf34b2089614fe2a814316a6a
          path: oai-upstream
          persist-credentials: false
      - name: Restore native and unpatched Wiener shared caches
        uses: ./.github/actions/lean-compiled-cache
      - name: Verify native Wiener prerequisites
        shell: bash
        run: |
          set -euo pipefail
          lake build PrimeNumberTheoremAnd.Wiener
          test -s .lake/packages/PrimeNumberTheoremAnd/.lake/build/lib/lean/PrimeNumberTheoremAnd/Wiener.olean
      - name: Verify the unchanged native arithmetic import closure
        uses: ./.github/actions/research-compile
        with:
          build-library: 'true'
          targets: >-
            research/VF_919_SEVEN_EIGHTHS_SIGNED_COVARIANCE_20261019.lean
            research/VF_919_SEVEN_EIGHTHS_SQUARE_SHELL_BRIDGE_20261019.lean
            research/CORR4_OAI_POWER_GUIDEPOST_20261024.lean
            research/NATIVE_OWNER_PREFIX_MERTENS_20261021.lean
            research/VF_919_OAI_ACTUAL_MARKED_FOURTH_REAL_NNS_20261021.lean
      - name: Restore source-pinned original analytic shared cache
        id: oai_cache
        uses: ./.github/actions/oai-434-shared-cache
      - name: Compile original analytic prerequisites only on a genuine cache miss
        if: ${{ steps.oai_cache.outputs.complete != 'true' }}
        shell: bash
        working-directory: oai-upstream/lean
        run: |
          set -euo pipefail
          lake build OAI.NumberTheory.DirichletL.Detector.FinalAssemblyUnconditional
      - name: Check shared package identity and pinned original source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C oai-upstream rev-parse HEAD)" = '1581d4cbdd69a0faf34b2089614fe2a814316a6a'
          python3 scripts/check_shared_lean_packages.py . oai-upstream/lean PrimeNumberTheoremAnd mathlib
      - name: Generate, kernel-check, and audit the complete LOW-first contraction
        id: slot_proof
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/lean/slot_anchored/run_anchored_in_verified_ci.sh "$PWD"
      - name: Preserve generated proofs, exact provenance, and diagnostics
        if: ${{ !cancelled() && steps.slot_proof.outcome != 'skipped' && steps.slot_proof.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: vf919-low-first-slot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            anchored-tilt-generation.json
            slot-anchored-lean.log
            slot-anchored-audit-*.log
            research/oai_434/VF919LowFirstPhysicalTiltFullBudget.lean
            research/oai_434/VF919LowFirstSlotCalibratedData.lean
            research/oai_434/VF919LowFirstSlotAnchoredEndpoint.lean
            research/oai_434/VF919ActualSlotMinRetighten.lean
            research/oai_434/VF919OriginalExceptionalSignedGram.lean
            research/oai_434/VF919NativeOwnerDiagonalThreeQuarter.lean
            research/oai_434/VF919ImprovedOwnerDiagonal.lean
            research/oai_434/VF919ExplicitPhysicalSlotSeed.lean
            research/oai_434/VF919OwnerBootstrapIteration.lean
            research/oai_434/VF919FractionalOwnerContraction.lean
            research/oai_434/VF919OriginalGainComponentLedger.lean
            research/oai_434/VF919OriginalLowTupleSignedGram.lean
            research/oai_434/VF919Anchored*.lean
            scripts/lean/slot_anchored/
          if-no-files-found: error
          retention-days: 30
