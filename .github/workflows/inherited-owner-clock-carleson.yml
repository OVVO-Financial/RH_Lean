name: Inherited owner-clock Carleson check

on:
  pull_request:
    branches: [main, agent/inherited-mixed-clock-l2]
    paths:
      - research/GLOBAL_RETURNED_CORE_INHERITED_OWNER_CLOCK_CARLESON.lean
      - .github/workflows/inherited-owner-clock-carleson.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Apply StrongPNT 4.24 compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py
      - name: Build project dependencies
        run: |
          lake build StrongPNT.PNT5_Strong
          lake build
      - name: Check owner-clock Carleson bound
        run: |
          lake env lean -DwarningAsError=true \
            research/GLOBAL_RETURNED_CORE_INHERITED_OWNER_CLOCK_CARLESON.lean
