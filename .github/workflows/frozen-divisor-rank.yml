name: Frozen divisor rank and signed interior probes
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/EULER_FROZEN_DIVISOR_RANK.lean'
      - 'research/EULER_DOUBLE_CENTERED_SOURCE_20261117.lean'
      - 'research/EULER_FRACTIONAL_COUPLED_20261027.lean'
      - 'scripts/lean/frozen_rank/**'
      - 'scripts/audit_preservation_sources.py'
      - '.github/workflows/frozen-divisor-rank.yml'
      - 'lean-toolchain'
      - 'lake-manifest.json'
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check raw head, dependency pins and exact arithmetic
        env:
          PROOF_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PROOF_HEAD"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          jq -e '.packages[] | select(.name == "mathlib") | .rev == "d13f23b723b8a846827a245b89c10fc7d3f11612"' lake-manifest.json
          mkdir -p frozen-rank-evidence
          git rev-parse HEAD | tee frozen-rank-evidence/head
          python3 scripts/lean/frozen_rank/regression.py | tee frozen-rank-evidence/arithmetic.log
      - uses: ./.github/actions/lean-setup
      - uses: ./.github/actions/lean-compiled-cache
      - name: Compile the original historical source closure with warnings fatal
        uses: ./.github/actions/research-compile
        with:
          targets: research/EULER_DOUBLE_CENTERED_SOURCE_20261117.lean
      - name: Compile and record the new leaf with warnings fatal
        env:
          RHLEAN_RESEARCH_TARGETS: research/EULER_FROZEN_DIVISOR_RANK.lean
        run: |
          set -euo pipefail
          python3 scripts/compile_research_import_closure.py 2>&1 | tee frozen-rank-evidence/compile.log
      - name: Check exact public types and all transitive terminal axioms
        run: |
          set -euo pipefail
          lake env lean -DwarningAsError=true scripts/lean/frozen_rank/ExactTypes.lean | tee frozen-rank-evidence/types.log
          python3 scripts/lean/frozen_rank/audit.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: frozen-divisor-rank-${{ github.event.pull_request.head.sha }}
          path: frozen-rank-evidence/
          if-no-files-found: error
      - name: Annotate proof diagnostics
        if: ${{ failure() }}
        run: |
          if test -f frozen-rank-evidence/compile.log; then
            awk '/\.lean:[0-9]+:[0-9]+: error:/ {print "::error::" $0}' frozen-rank-evidence/compile.log
          fi
