name: Sanitize Möbius Synthesis standalone comments

on:
  push:
    branches:
      - agent/mobius-synthesis-standalone-cleanup

permissions:
  contents: write

jobs:
  sanitize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobius-synthesis-standalone-cleanup
          fetch-depth: 0

      - name: Remove inherited repository history from Lean comments only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('export_mobius_synthesis/RHLean')

          forbidden = [
              (re.compile(r'\b(?:PR|Issue)\s*#\d+\b'), 'the earlier development'),
              (re.compile(r'#\d+\b'), 'the earlier development'),
              (re.compile(r'RH_Lean'), 'this project'),
              (re.compile(r'square-block-mobius'), 'the square-block track'),
              (re.compile(r'prime-wheel-mobius'), 'the prime-wheel track'),
              (re.compile(r'https?://(?:www\.)?github\.com/OVVO-Financial/[^\s`)]+'), 'the external source'),
              (re.compile(r'https?://raw\.githubusercontent\.com/OVVO-Financial/[^\s`)]+'), 'the external source'),
              (re.compile(r'https?://api\.github\.com/repos/OVVO-Financial/[^\s`)]+'), 'the external source'),
          ]

          def clean_comment(segment: str) -> str:
              for pattern, replacement in forbidden:
                  segment = pattern.sub(replacement, segment)
              return segment

          def clean_lean(text: str) -> str:
              out = []
              i = 0
              n = len(text)
              while i < n:
                  if text.startswith('--', i):
                      j = text.find('\n', i)
                      if j == -1:
                          j = n
                      out.append(clean_comment(text[i:j]))
                      i = j
                      continue
                  if text.startswith('/-', i):
                      start = i
                      depth = 1
                      i += 2
                      while i < n and depth:
                          if text.startswith('/-', i):
                              depth += 1
                              i += 2
                          elif text.startswith('-/', i):
                              depth -= 1
                              i += 2
                          else:
                              i += 1
                      out.append(clean_comment(text[start:i]))
                      continue
                  out.append(text[i])
                  i += 1
              return ''.join(out)

          changed = []
          for path in sorted(root.rglob('*.lean')):
              old = path.read_text(encoding='utf-8')
              new = clean_lean(old)
              if new != old:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          print(f'sanitized {len(changed)} Lean file(s)')
          for path in changed:
              print(path)
          PY

      - name: Verify only comment sanitation changed the tree cleanly
        run: git diff --check

      - name: Commit sanitized comments when needed
        shell: bash
        run: |
          if git diff --quiet -- export_mobius_synthesis/RHLean; then
            echo 'No inherited comment history remains to sanitize.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add export_mobius_synthesis/RHLean
          git commit -m 'Remove inherited repository history from Lean comments'
          git push origin HEAD:agent/mobius-synthesis-standalone-cleanup
