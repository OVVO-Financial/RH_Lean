name: Strong Mertens K2 clean development gate

on:
  push:
    branches: [agent/strong-mertens-k2-clean]
    paths:
      - 'RHLean/Analysis/StrongMertens*.lean'
      - 'RHLean/Analysis/K2*Closure.lean'
      - 'RHLean.lean'
      - '.github/workflows/strong-mertens-k2-clean-dev.yml'
  pull_request:
    branches: [agent/strong-mertens-k2-ci-base]
    types: [opened, synchronize, reopened]
    paths:
      - 'RHLean/Analysis/StrongMertens*.lean'
      - 'RHLean/Analysis/K2*Closure.lean'
      - 'RHLean.lean'
      - '.github/workflows/strong-mertens-k2-clean-dev.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: strong-mertens-k2-clean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Targeted Lean build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Restore Mathlib and dependency builds
        id: lakepackages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Set up Lean and Mathlib
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Save Mathlib and dependency builds
        if: >-
          !cancelled()
          && steps.lakepackages.outcome == 'success'
          && steps.lakepackages.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Apply current StrongPNT 4.24 compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py

      - name: Restore StrongPNT port build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Prebuild StrongPNT dependency
        run: lake build StrongPNT.PNT5_Strong

      - name: Apply BoundsCore repair candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("RHLean/Analysis/StrongMertensLogNineBoundsCore.lean")
          text = path.read_text()

          def replace_exact(old: str, new: str, expected: int = 1) -> None:
              global text
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == expected:
                  text = text.replace(old, new)
                  return
              if old_count == 0 and new_count == expected:
                  return
              raise SystemExit(
                  f"BoundsCore repair pattern mismatch: expected {expected} old or new copies, "
                  f"found old={old_count}, new={new_count}"
              )

          replace_exact(
              """    have hmul := hpowIci.const_mul C
              apply hmul.congr_fun (s := Set.Ici T) ?_ measurableSet_Ici
              intro t ht
              rw [← Real.rpow_neg (by linarith [Set.mem_Ici.mp ht])]
              ring_nf""",
              """    apply IntegrableOn.congr_fun (hpowIci.const_mul C) ?_ measurableSet_Ici
              intro t ht
              rw [← Real.rpow_neg (by linarith [Set.mem_Ici.mp ht])]
              ring_nf""",
              expected=2,
          )

          replace_exact(
              """  have hpos := nativeLogSqOverTSq_integrableOn_Ici hT
              convert hpos.comp_neg using 1""",
              """  have hpos := nativeLogSqOverTSq_integrableOn_Ici hT
              simpa only [neg_Ici, neg_neg] using hpos.comp_neg""",
          )

          replace_exact(
              """  rw [← neg_neg T, ← integral_comp_neg_Iic]
              simpa only [neg_neg, neg_sq] using hpos T hT""",
              """  calc
              ∫ t in Set.Iic (-T), (Real.log (-t))^2 / (-t)^2 =
                  ∫ t in Set.Ioi T, (Real.log t)^2 / t^2 := by
                simpa only [neg_neg, neg_sq] using
                  (integral_comp_neg_Iic (-T) (fun t : ℝ => (Real.log t)^2 / t^2))
              _ = ∫ t in Set.Ici T, (Real.log t)^2 / t^2 := by
                rw [MeasureTheory.integral_Ici_eq_integral_Ioi]
              _ ≤ C / Real.sqrt T := hpos T hT""",
          )

          replace_exact(
              """  rw [nativeSmoothedMobiusIntegrand_norm_eq]
              change 1 / ‖zetaC s‖ *
                  ‖mellin (fun x => (Smooth1 f eps x : ℂ)) s‖ * ‖(X : ℂ) ^ s‖ ≤ _
              rw [hXs]""",
              """  have hsarg : (1 : ℂ) + ((Real.log X)⁻¹ : ℝ) + (t : ℂ) * I = s := by
                simp [s, sigma]
              rw [nativeSmoothedMobiusIntegrand_norm_eq, hsarg, hXs]""",
          )

          replace_exact(
              """    _ ≤ C1 * (X * Real.log X / eps) * (C2 / Real.sqrt T) := by
              apply mul_le_mul_of_nonneg_left (hint T hT)
              positivity
            _ = C1 * C2 * (X * Real.log X / (eps * Real.sqrt T)) := by
              field_simp
              ring""",
              """    _ ≤ C1 * (X * Real.log X / eps) * (C2 / Real.sqrt T) := by
              apply mul_le_mul_of_nonneg_left (hint T hT)
              have hX0 : 0 ≤ X := by linarith
              have hlogX0 : 0 ≤ Real.log X := Real.log_nonneg (by linarith)
              exact mul_nonneg hC1.le
                (div_nonneg (mul_nonneg hX0 hlogX0) heps.1.le)
            _ = C1 * C2 * (X * Real.log X / (eps * Real.sqrt T)) := by
              field_simp""",
          )

          replace_exact(
              """  rw [map_mul, map_mul, map_inv₀]
              congr 1
              · congr 1
                · exact riemannZeta_conj s
                · unfold mellin
                  rw [← integral_conj]
                  apply setIntegral_congr_fun measurableSet_Ioi
                  intro x hx
                  simp only [smul_eq_mul, map_mul, Complex.conj_ofReal]
                  congr 1
                  nth_rw 1 [← map_one (starRingEnd ℂ)]
                  rw [← map_sub, Complex.cpow_conj, Complex.conj_ofReal]
                  rw [Complex.arg_ofReal_of_nonneg hx.le]
                  exact Real.pi_ne_zero.symm
              · rw [Complex.cpow_conj, Complex.conj_ofReal]
                rw [Complex.arg_ofReal_of_nonneg hX.le]
                exact Real.pi_ne_zero.symm""",
              """  have hmellin :
              mellin (fun x => (Smooth1 f eps x : ℂ)) (starRingEnd ℂ s) =
                starRingEnd ℂ (mellin (fun x => (Smooth1 f eps x : ℂ)) s) := by
                unfold mellin
                rw [← integral_conj]
                apply setIntegral_congr_fun measurableSet_Ioi
                intro x hx
                simp only [smul_eq_mul, map_mul, Complex.conj_ofReal]
                congr 1
                nth_rw 1 [← map_one (starRingEnd ℂ)]
                rw [← map_sub, Complex.cpow_conj, Complex.conj_ofReal]
                rw [Complex.arg_ofReal_of_nonneg hx.le]
                exact Real.pi_ne_zero.symm
              have hcpow :
              (X : ℂ) ^ (starRingEnd ℂ s) = starRingEnd ℂ ((X : ℂ) ^ s) := by
                rw [Complex.cpow_conj, Complex.conj_ofReal]
                rw [Complex.arg_ofReal_of_nonneg hX.le]
                exact Real.pi_ne_zero.symm
              rw [map_mul, map_mul, map_inv₀, riemannZeta_conj, hmellin, hcpow]""",
          )

          replace_exact(
              """    · rw [← integral_conj, ← integral_comp_neg_Ioi, integral_Ici_eq_integral_Ioi]
              apply setIntegral_congr_fun measurableSet_Ioi""",
              """    · rw [← integral_conj, ← integral_comp_neg_Ioi, integral_Ici_eq_integral_Ioi]
              congr 1
              apply setIntegral_congr_fun measurableSet_Ioi""",
          )

          path.write_text(text)
          PY

      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Build recovered chain in dependency order
        id: directbuild
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          targets=(
            RHLean.Analysis.StrongMertensLogNineCorridor
            RHLean.Analysis.StrongMertensZetaKernel
            RHLean.Analysis.StrongMertensSmallHeight
            RHLean.Analysis.StrongMertensLogNineContour
            RHLean.Analysis.StrongMertensLogNineBoundsCore
            RHLean.Analysis.StrongMertensLogNineHorizontal
            RHLean.Analysis.StrongMertensLogNineBounds
            RHLean.Analysis.StrongMertensLogNineEnvelope
            RHLean.Analysis.StrongMertensSmoothingFinite
            RHLean.Analysis.StrongMertensSmoothing
            RHLean.Analysis.StrongMertensLogNineBalanceCore
            RHLean.Analysis.StrongMertensLogNineBalance
            RHLean.Analysis.K2RecipMomentAnalyticClosure
            RHLean.Analysis.K2CenteredClassicalClosure
          )
          : > strong-mertens-build.log
          for target in "${targets[@]}"; do
            file="${target//./\/}.lean"
            if [[ -f "$file" ]]; then
              echo "=== $target ===" | tee -a strong-mertens-build.log
              lake build "$target" 2>&1 | tee -a strong-mertens-build.log
            fi
          done

      - name: Fail on RHLean-owned Lean warnings
        id: rhlean_warnings
        if: steps.directbuild.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          owned_path = re.compile(r"(?:^|[\s:])(?:\./)*RHLean(?:\.lean|/)")
          lines = Path("strong-mertens-build.log").read_text(errors="replace").splitlines()
          owned = [line for line in lines if "warning:" in line.lower() and owned_path.search(line)]
          if owned:
              print("RHLean-owned Lean warnings found:")
              print("\n".join(owned))
              raise SystemExit(1)
          print("No RHLean-owned Lean warnings found.")
          PY

      - name: Save RHLean build cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}

      - name: Upload targeted Lean build log
        if: ${{ always() && hashFiles('strong-mertens-build.log') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: strong-mertens-k2-clean-build-log
          path: strong-mertens-build.log

      - name: Print targeted Lean build log
        if: ${{ always() && hashFiles('strong-mertens-build.log') != '' }}
        run: cat strong-mertens-build.log

      - name: Dependency diagnostic inventory
        if: ${{ always() && hashFiles('strong-mertens-build.log') != '' }}
        run: python3 scripts/lean_diagnostic_inventory.py strong-mertens-build.log

      - name: Fail on StrongPNT port diagnostics
        id: strongpnt_noise
        if: ${{ always() && hashFiles('strong-mertens-build.log') != '' }}
        continue-on-error: true
        run: python3 scripts/lean_diagnostic_inventory.py --gate StrongPNT strong-mertens-build.log

      - name: Publish validated BoundsCore repair
        if: >-
          github.event_name == 'push' &&
          steps.directbuild.outcome == 'success' &&
          steps.rhlean_warnings.outcome != 'failure' &&
          steps.strongpnt_noise.outcome != 'failure'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- RHLean/Analysis/StrongMertensLogNineBoundsCore.lean
          if ! git diff --cached --quiet; then
            git commit -m "Repair Strong Mertens BoundsCore proof structure"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Record development gate result on branch
        if: ${{ always() && github.event_name == 'push' }}
        shell: bash
        env:
          DIRECTBUILD: ${{ steps.directbuild.outcome }}
          RHLEAN_WARNINGS: ${{ steps.rhlean_warnings.outcome }}
          STRONGPNT_NOISE: ${{ steps.strongpnt_noise.outcome }}
        run: |
          inventory="$(python3 scripts/lean_diagnostic_inventory.py strong-mertens-build.log 2>&1 || true)"
          {
            echo "commit=${GITHUB_SHA}"
            echo "directbuild=${DIRECTBUILD}"
            echo "rhlean_warnings=${RHLEAN_WARNINGS}"
            echo "strongpnt_noise=${STRONGPNT_NOISE}"
            echo
            echo "--- diagnostic inventory ---"
            printf '%s\n' "$inventory"
            echo
            echo "--- build log tail ---"
            tail -n 160 strong-mertens-build.log 2>/dev/null || true
          } > .github/strong-mertens-k2-clean-status.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- .github/strong-mertens-k2-clean-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Strong Mertens clean gate result [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Fail if targeted build or owned diagnostics failed
        if: >-
          steps.directbuild.outcome == 'failure' ||
          steps.rhlean_warnings.outcome == 'failure' ||
          steps.strongpnt_noise.outcome == 'failure'
        run: exit 1
