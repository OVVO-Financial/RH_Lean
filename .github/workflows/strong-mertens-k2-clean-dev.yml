name: Strong Mertens K2 clean development gate

on:
  push:
    branches: [agent/strong-mertens-k2-clean]
    paths:
      - 'RHLean/Analysis/StrongMertens*.lean'
      - 'RHLean/Analysis/K2*Closure.lean'
      - 'RHLean.lean'
      - '.github/workflows/strong-mertens-k2-clean-dev.yml'
  pull_request:
    branches: [agent/strong-mertens-k2-ci-base]
    types: [opened, synchronize, reopened]
    paths:
      - 'RHLean/Analysis/StrongMertens*.lean'
      - 'RHLean/Analysis/K2*Closure.lean'
      - 'RHLean.lean'
      - '.github/workflows/strong-mertens-k2-clean-dev.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: strong-mertens-k2-clean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Targeted Lean build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Restore Mathlib and dependency builds
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Set up Lean and Mathlib
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Apply current StrongPNT 4.24 compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py

      - name: Restore StrongPNT port build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}

      - name: Prebuild StrongPNT dependency
        run: lake build StrongPNT.PNT5_Strong

      - name: Apply BoundsCore repair candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('RHLean/Analysis/StrongMertensLogNineBoundsCore.lean')
          text = path.read_text()

          def replace_exact(label: str, old: str, new: str, expected: int = 1) -> None:
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} matches, found {count}')
              text = text.replace(old, new)
              print(f'applied {label}: {count}')

          replace_exact(
              'rpow tail normalization',
              """    change C * t ^ (-((3 : ℝ) / 2)) = C / t ^ ((3 : ℝ) / 2)
              rw [Real.rpow_neg (by linarith [Set.mem_Ici.mp ht]), div_eq_mul_inv]""",
              """    change C * t ^ (-3 / 2 : ℝ) = C / t ^ (3 / 2 : ℝ)
              rw [show (-3 / 2 : ℝ) = -(3 / 2) by ring,
                Real.rpow_neg (by linarith [Set.mem_Ici.mp ht]), div_eq_mul_inv]""",
              expected=2,
          )

          replace_exact(
              'negative tail integral endpoint',
              """      exact integral_comp_neg_Iic (-T) (fun t : ℝ => (Real.log t)^2 / t^2)""",
              """      simpa only [neg_neg] using
                (integral_comp_neg_Iic (-T) (fun t : ℝ => (Real.log t)^2 / t^2))""",
          )

          replace_exact(
              'far tail field simp',
              """        field_simp [ne_of_gt heps.1, ne_of_gt htpos]
                      ring""",
              """        field_simp [ne_of_gt heps.1, ne_of_gt htpos]""",
          )

          replace_exact(
              'far tail log square monotonicity',
              """        rw [div_le_div_iff₀ hsqpos]
                      have hcoeff :
                          0 ≤ Cz * Cm * Real.exp 1 * (X * Real.log X / eps) := by
                        positivity
                      exact mul_le_mul_of_nonneg_left hlog_le_sq hcoeff""",
              """        have hcoeff :
                          0 ≤ Cz * Cm * Real.exp 1 * (X * Real.log X / eps) := by
                        have hnum : 0 ≤ X * Real.log X :=
                          mul_nonneg hXpos.le hlogXpos.le
                        have hratio : 0 ≤ X * Real.log X / eps :=
                          div_nonneg hnum heps.1.le
                        exact mul_nonneg
                          (mul_nonneg (mul_nonneg hCz.le hCm.le) (Real.exp_pos 1).le)
                          hratio
                      exact div_le_div_of_nonneg_right
                        (mul_le_mul_of_nonneg_left hlog_le_sq hcoeff)
                        (sq_nonneg (-t))""",
          )

          replace_exact(
              'far tail base nonnegativity',
              """        have hbase : 0 ≤ Cz * Cm * Real.exp 1 *
                          (X * Real.log X / eps) * (Real.log (-t)) ^ 2 / (-t) ^ 2 := by
                        positivity
                      nlinarith""",
              """        have hprefix :
                          0 ≤ Cz * Cm * Real.exp 1 * (X * Real.log X / eps) := by
                        have hnum : 0 ≤ X * Real.log X :=
                          mul_nonneg hXpos.le hlogXpos.le
                        have hratio : 0 ≤ X * Real.log X / eps :=
                          div_nonneg hnum heps.1.le
                        exact mul_nonneg
                          (mul_nonneg (mul_nonneg hCz.le hCm.le) (Real.exp_pos 1).le)
                          hratio
                      have hbase : 0 ≤ Cz * Cm * Real.exp 1 *
                          (X * Real.log X / eps) * (Real.log (-t)) ^ 2 / (-t) ^ 2 := by
                        exact div_nonneg
                          (mul_nonneg hprefix (sq_nonneg (Real.log (-t))))
                          (sq_nonneg (-t))
                      nlinarith""",
          )

          replace_exact(
              'M5 conjugate argument simplification',
              """        simp [sneg]
                      push_cast
                      ring""",
              """        simp [sneg]""",
          )

          replace_exact(
              'M5 final sneg normalization',
              """            ((1 + (Real.log X)⁻¹) + (-x) * I)) := by rfl""",
              """            ((1 + (Real.log X)⁻¹) + (-x) * I)) := by
                  simp [sneg]""",
          )

          path.write_text(text)
          PY

      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Build recovered chain in dependency order
        id: directbuild
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          targets=(
            RHLean.Analysis.StrongMertensLogNineCorridor
            RHLean.Analysis.StrongMertensZetaKernel
            RHLean.Analysis.StrongMertensSmallHeight
            RHLean.Analysis.StrongMertensLogNineContour
            RHLean.Analysis.StrongMertensLogNineBoundsCore
            RHLean.Analysis.StrongMertensLogNineHorizontal
            RHLean.Analysis.StrongMertensLogNineBounds
            RHLean.Analysis.StrongMertensLogNineEnvelope
            RHLean.Analysis.StrongMertensSmoothingFinite
            RHLean.Analysis.StrongMertensSmoothing
            RHLean.Analysis.StrongMertensLogNineBalanceCore
            RHLean.Analysis.StrongMertensLogNineBalance
            RHLean.Analysis.K2RecipMomentAnalyticClosure
            RHLean.Analysis.K2CenteredClassicalClosure
          )
          : > strong-mertens-build.log
          for target in "${targets[@]}"; do
            file="${target//./\/}.lean"
            if [[ -f "$file" ]]; then
              echo "=== $target ===" | tee -a strong-mertens-build.log
              lake build "$target" 2>&1 | tee -a strong-mertens-build.log
            fi
          done

      - name: Fail on RHLean-owned Lean warnings
        id: rhlean_warnings
        if: steps.directbuild.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          owned_path = re.compile(r"(?:^|[\s:])(?:\./)*RHLean(?:\.lean|/)")
          lines = Path('strong-mertens-build.log').read_text(errors='replace').splitlines()
          owned = [line for line in lines if 'warning:' in line.lower() and owned_path.search(line)]
          if owned:
              print('RHLean-owned Lean warnings found:')
              print('\n'.join(owned))
              raise SystemExit(1)
          print('No RHLean-owned Lean warnings found.')
          PY

      - name: Upload targeted Lean build log
        if: ${{ always() && hashFiles('strong-mertens-build.log') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: strong-mertens-k2-clean-build-log
          path: strong-mertens-build.log

      - name: Dependency diagnostic inventory
        if: ${{ always() && hashFiles('strong-mertens-build.log') != '' }}
        run: python3 scripts/lean_diagnostic_inventory.py strong-mertens-build.log

      - name: Fail on StrongPNT port diagnostics
        id: strongpnt_noise
        if: ${{ always() && hashFiles('strong-mertens-build.log') != '' }}
        continue-on-error: true
        run: python3 scripts/lean_diagnostic_inventory.py --gate StrongPNT strong-mertens-build.log

      - name: Publish validated BoundsCore repair
        if: >-
          github.event_name == 'push' &&
          steps.directbuild.outcome == 'success' &&
          steps.rhlean_warnings.outcome != 'failure' &&
          steps.strongpnt_noise.outcome != 'failure'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- RHLean/Analysis/StrongMertensLogNineBoundsCore.lean
          if ! git diff --cached --quiet; then
            git commit -m 'Repair remaining BoundsCore normalization goals'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Fail if targeted build or owned diagnostics failed
        if: >-
          steps.directbuild.outcome == 'failure' ||
          steps.rhlean_warnings.outcome == 'failure' ||
          steps.strongpnt_noise.outcome == 'failure'
        run: exit 1
