name: Strong Mertens K2 clean development gate

on:
  push:
    branches: [agent/strong-mertens-k2-clean]
    paths:
      - 'RHLean/Analysis/StrongMertensLogNineHorizontal.lean'
      - '.github/strong-mertens-k2-clean-status.txt'
      - '.github/workflows/strong-mertens-k2-clean-dev.yml'
  pull_request:
    branches: [agent/strong-mertens-k2-ci-base]
    types: [opened, synchronize, reopened]
    paths:
      - 'RHLean/Analysis/StrongMertensLogNineHorizontal.lean'
      - '.github/strong-mertens-k2-clean-status.txt'
      - '.github/workflows/strong-mertens-k2-clean-dev.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: strong-mertens-k2-clean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Targeted Lean build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out head branch
        uses: actions/checkout@v4
        with:
          ref: agent/strong-mertens-k2-clean

      - name: Restore Mathlib and dependency builds
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Set up Lean and Mathlib
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Apply current StrongPNT 4.24 compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py

      - name: Restore StrongPNT port build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}

      - name: Prebuild StrongPNT dependency
        run: lake build StrongPNT.PNT5_Strong

      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Apply Horizontal structural refactor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('RHLean/Analysis/StrongMertensLogNineHorizontal.lean')
          text = path.read_text()
          if '  have hHorizontalMapsUpper : Set.MapsTo' in text:
              print('Horizontal refactor already present')
              raise SystemExit(0)
          start = text.index('  have hM2 :')
          end = text.index('\n\n/-- Canonical existential facade for the horizontal estimate. -/', start)
          replacement = r'''  have hlen : sigmaRight - sigmaLeft ≤ 2 := by
    dsimp [sigmaLeft, sigmaRight, strongMertensLogNineShift]
    have hpow9 : (1 : ℝ) ≤ (Real.log T) ^ 9 := one_le_pow₀ hlogT.le 9
    have hfrac : corridor.A / (Real.log T) ^ 9 ≤ 1 := by
      apply (div_le_one (by positivity)).2
      nlinarith [corridor.A_mem.2, hpow9]
    have hinv : (Real.log X)⁻¹ ≤ 1 := inv_le_one_of_one_le₀ hlogX.le
    linarith
  have hbaseNonneg :
      0 ≤ Cpoint * X * (1 + (Real.log T) ^ 10) / (eps * T ^ 2) := by
    have hnum : 0 ≤ Cpoint * X * (1 + (Real.log T) ^ 10) := by
      exact mul_nonneg
        (mul_nonneg hCpoint.le (by linarith : 0 ≤ X))
        (by positivity)
    have hden : 0 ≤ eps * T ^ 2 := mul_nonneg heps.1.le (sq_nonneg T)
    exact div_nonneg hnum hden
  have hpref : ‖(1 / (2 * (Real.pi : ℂ) * I))‖ = 1 / (2 * Real.pi) := by
    rw [norm_div, norm_one, norm_mul, norm_mul, Complex.norm_ofNat,
      show ‖(Real.pi : ℂ)‖ = Real.pi from
        (RCLike.norm_ofReal _).trans (abs_of_pos Real.pi_pos), norm_I]
    ring
  have hepsne : eps ≠ 0 := ne_of_gt heps.1
  have hTne : T ≠ 0 := ne_of_gt (by linarith : 0 < T)
  have hM2 : ‖nativeMertensContourM2 f eps X T sigmaLeft‖ ≤
      Cpoint / Real.pi * X * (1 + (Real.log T) ^ 10) / (eps * T ^ 2) := by
    unfold nativeMertensContourM2
    rw [norm_mul, hpref]
    have hint :
        ‖∫ sigma in sigmaLeft..sigmaRight,
            nativeSmoothedMobiusIntegrand f eps X (sigma - T * I)‖ ≤
          2 * (Cpoint * X * (1 + (Real.log T) ^ 10) / (eps * T ^ 2)) := by
      calc
        ‖∫ sigma in sigmaLeft..sigmaRight,
            nativeSmoothedMobiusIntegrand f eps X (sigma - T * I)‖
          ≤ ∫ sigma in sigmaLeft..sigmaRight,
            ‖nativeSmoothedMobiusIntegrand f eps X (sigma - T * I)‖ :=
              intervalIntegral.norm_integral_le_integral_norm _
        _ ≤ (sigmaRight - sigmaLeft) *
            (Cpoint * X * (1 + (Real.log T) ^ 10) / (eps * T ^ 2)) := by
          rw [intervalIntegral.integral_of_le hsigOrder]
          calc
            ∫ sigma in Set.Ioc sigmaLeft sigmaRight,
                ‖nativeSmoothedMobiusIntegrand f eps X (sigma - T * I)‖
              ≤ ∫ _sigma in Set.Ioc sigmaLeft sigmaRight,
                  (Cpoint * X * (1 + (Real.log T) ^ 10) / (eps * T ^ 2)) := by
                apply setIntegral_mono_on
                · exact hHorizontalContinuous.norm.integrableOn_compact isCompact_Icc
                · exact integrableOn_const (by simp)
                · exact measurableSet_Ioc
                · intro sigma hs
                  exact hpoint sigma ⟨hs.1.le, hs.2.le⟩
            _ = (sigmaRight - sigmaLeft) *
                (Cpoint * X * (1 + (Real.log T) ^ 10) / (eps * T ^ 2)) := by
                  rw [setIntegral_const, Real.volume_Ioc]
                  simp [hsigOrder]
        _ ≤ 2 * (Cpoint * X * (1 + (Real.log T) ^ 10) / (eps * T ^ 2)) :=
          mul_le_mul_of_nonneg_right hlen hbaseNonneg
    calc
      1 / (2 * Real.pi) *
          ‖∫ sigma in sigmaLeft..sigmaRight,
            nativeSmoothedMobiusIntegrand f eps X (sigma - T * I)‖
        ≤ 1 / (2 * Real.pi) *
            (2 * (Cpoint * X * (1 + (Real.log T) ^ 10) / (eps * T ^ 2))) :=
          mul_le_mul_of_nonneg_left hint (by positivity)
      _ = Cpoint / Real.pi * X * (1 + (Real.log T) ^ 10) /
          (eps * T ^ 2) := by
        field_simp [Real.pi_ne_zero, hepsne, hTne]
        ring
  have hXpos : 0 < X := by linarith
  have hpointUpper : ∀ sigma ∈ Set.Icc sigmaLeft sigmaRight,
      ‖nativeSmoothedMobiusIntegrand f eps X (sigma + T * I)‖ ≤
        Cpoint * X * (1 + (Real.log T) ^ 10) / (eps * T ^ 2) := by
    intro sigma hs
    have hsym := nativeSmoothedMobiusIntegrand_conj
      (f := f) (eps := eps) (X := X) hXpos ((sigma : ℂ) - T * I)
    have hstar : starRingEnd ℂ ((sigma : ℂ) - T * I) =
        (sigma : ℂ) + T * I := by simp
    rw [hstar] at hsym
    have hnorm := congrArg norm hsym
    rw [RCLike.norm_conj] at hnorm
    rw [hnorm]
    exact hpoint sigma hs
  have hHorizontalMapsUpper : Set.MapsTo
      (fun sigma : ℝ => (sigma : ℂ) + T * I)
      (Set.Icc sigmaLeft sigmaRight)
      (((Set.Icc (strongMertensLogNineShift corridor.A T) 2) ×ℂ
        Set.Icc (-T) T) \ {(1 : ℂ)}) := by
    intro sigma hsigma
    constructor
    · rw [Complex.mem_reProdIm]
      constructor
      · have hre : ((sigma : ℂ) + T * I).re = sigma := by simp
        rw [hre]
        exact ⟨by simpa [sigmaLeft] using hsigma.1, hsigma.2.trans hsigRightLe2⟩
      · have him : ((sigma : ℂ) + T * I).im = T := by simp
        rw [him]
        exact ⟨by linarith, le_rfl⟩
    · intro heq
      have him := congrArg Complex.im heq
      simp at him
      linarith
  have hHorizontalContinuousUpper : ContinuousOn
      (fun sigma : ℝ => nativeSmoothedMobiusIntegrand f eps X (sigma + T * I))
      (Set.Icc sigmaLeft sigmaRight) := by
    exact ContinuousOn.comp' hHolo.continuousOn (by fun_prop) hHorizontalMapsUpper
  have hM4 : ‖nativeMertensContourM4 f eps X T sigmaLeft‖ ≤
      Cpoint / Real.pi * X * (1 + (Real.log T) ^ 10) / (eps * T ^ 2) := by
    unfold nativeMertensContourM4
    rw [norm_mul, hpref]
    have hint :
        ‖∫ sigma in sigmaLeft..sigmaRight,
            nativeSmoothedMobiusIntegrand f eps X (sigma + T * I)‖ ≤
          2 * (Cpoint * X * (1 + (Real.log T) ^ 10) / (eps * T ^ 2)) := by
      calc
        ‖∫ sigma in sigmaLeft..sigmaRight,
            nativeSmoothedMobiusIntegrand f eps X (sigma + T * I)‖
          ≤ ∫ sigma in sigmaLeft..sigmaRight,
            ‖nativeSmoothedMobiusIntegrand f eps X (sigma + T * I)‖ :=
              intervalIntegral.norm_integral_le_integral_norm _
        _ ≤ (sigmaRight - sigmaLeft) *
            (Cpoint * X * (1 + (Real.log T) ^ 10) / (eps * T ^ 2)) := by
          rw [intervalIntegral.integral_of_le hsigOrder]
          calc
            ∫ sigma in Set.Ioc sigmaLeft sigmaRight,
                ‖nativeSmoothedMobiusIntegrand f eps X (sigma + T * I)‖
              ≤ ∫ _sigma in Set.Ioc sigmaLeft sigmaRight,
                  (Cpoint * X * (1 + (Real.log T) ^ 10) / (eps * T ^ 2)) := by
                apply setIntegral_mono_on
                · exact hHorizontalContinuousUpper.norm.integrableOn_compact isCompact_Icc
                · exact integrableOn_const (by simp)
                · exact measurableSet_Ioc
                · intro sigma hs
                  exact hpointUpper sigma ⟨hs.1.le, hs.2.le⟩
            _ = (sigmaRight - sigmaLeft) *
                (Cpoint * X * (1 + (Real.log T) ^ 10) / (eps * T ^ 2)) := by
                  rw [setIntegral_const, Real.volume_Ioc]
                  simp [hsigOrder]
        _ ≤ 2 * (Cpoint * X * (1 + (Real.log T) ^ 10) / (eps * T ^ 2)) :=
          mul_le_mul_of_nonneg_right hlen hbaseNonneg
    calc
      1 / (2 * Real.pi) *
          ‖∫ sigma in sigmaLeft..sigmaRight,
            nativeSmoothedMobiusIntegrand f eps X (sigma + T * I)‖
        ≤ 1 / (2 * Real.pi) *
            (2 * (Cpoint * X * (1 + (Real.log T) ^ 10) / (eps * T ^ 2))) :=
          mul_le_mul_of_nonneg_left hint (by positivity)
      _ = Cpoint / Real.pi * X * (1 + (Real.log T) ^ 10) /
          (eps * T ^ 2) := by
        field_simp [Real.pi_ne_zero, hepsne, hTne]
        ring
  dsimp [C]
  have hBnonneg :
      0 ≤ Cpoint / Real.pi * X * (1 + (Real.log T) ^ 10) / (eps * T ^ 2) := by
    have hcoef : 0 ≤ Cpoint / Real.pi := div_nonneg hCpoint.le Real.pi_pos.le
    have hnum : 0 ≤ Cpoint / Real.pi * X * (1 + (Real.log T) ^ 10) := by
      exact mul_nonneg
        (mul_nonneg hcoef (by linarith : 0 ≤ X))
        (by positivity)
    have hden : 0 ≤ eps * T ^ 2 := mul_nonneg heps.1.le (sq_nonneg T)
    exact div_nonneg hnum hden
  calc
    ‖nativeMertensContourM2 f eps X T (strongMertensLogNineShift corridor.A T)‖ +
        ‖nativeMertensContourM4 f eps X T (strongMertensLogNineShift corridor.A T)‖
      ≤ (Cpoint / Real.pi * X * (1 + (Real.log T) ^ 10) / (eps * T ^ 2)) +
        (Cpoint / Real.pi * X * (1 + (Real.log T) ^ 10) / (eps * T ^ 2)) := by
          simpa [sigmaLeft] using add_le_add hM2 hM4
    _ = 2 * (Cpoint / Real.pi * X * (1 + (Real.log T) ^ 10) /
          (eps * T ^ 2)) := by ring
    _ ≤ 4 * (Cpoint / Real.pi * X * (1 + (Real.log T) ^ 10) /
          (eps * T ^ 2)) := by nlinarith
    _ = 4 * Cpoint / Real.pi * X * (1 + (Real.log T) ^ 10) /
          (eps * T ^ 2) := by ring'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY

      - name: Build Horizontal
        id: directbuild
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          lake build RHLean.Analysis.StrongMertensLogNineHorizontal 2>&1 | tee strong-mertens-build.log

      - name: Fail on RHLean-owned Lean warnings
        id: rhlean_warnings
        if: steps.directbuild.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          owned_path = re.compile(r"(?:^|[\s:])(?:\./)*RHLean(?:\.lean|/)")
          lines = Path('strong-mertens-build.log').read_text(errors='replace').splitlines()
          owned = [line for line in lines if 'warning:' in line.lower() and owned_path.search(line)]
          if owned:
              print('RHLean-owned Lean warnings found:')
              print('\n'.join(owned))
              raise SystemExit(1)
          print('No RHLean-owned Lean warnings found.')
          PY

      - name: Dependency diagnostic inventory
        if: ${{ always() && hashFiles('strong-mertens-build.log') != '' }}
        run: python3 scripts/lean_diagnostic_inventory.py strong-mertens-build.log

      - name: Fail on StrongPNT port diagnostics
        id: strongpnt_noise
        if: ${{ always() && hashFiles('strong-mertens-build.log') != '' }}
        continue-on-error: true
        run: python3 scripts/lean_diagnostic_inventory.py --gate StrongPNT strong-mertens-build.log

      - name: Publish repaired Horizontal
        if: >-
          steps.directbuild.outcome == 'success' &&
          steps.rhlean_warnings.outcome != 'failure' &&
          steps.strongpnt_noise.outcome != 'failure'
        shell: bash
        run: |
          if git diff --quiet -- RHLean/Analysis/StrongMertensLogNineHorizontal.lean; then
            echo 'No source repair to publish.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- RHLean/Analysis/StrongMertensLogNineHorizontal.lean
          git commit -m 'Refactor Horizontal contour bounds'
          git push origin HEAD:agent/strong-mertens-k2-clean

      - name: Upload targeted Lean build log
        if: ${{ always() && hashFiles('strong-mertens-build.log') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: strong-mertens-k2-clean-build-log
          path: strong-mertens-build.log

      - name: Fail if targeted build or owned diagnostics failed
        if: >-
          steps.directbuild.outcome == 'failure' ||
          steps.rhlean_warnings.outcome == 'failure' ||
          steps.strongpnt_noise.outcome == 'failure'
        run: exit 1
