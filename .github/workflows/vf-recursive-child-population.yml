name: VF recursive child population

on:
  pull_request:
    branches: [main]
    paths:
      - research/VF_MID_RECURSIVE_REMAINDER_BOUND.lean
      - .github/workflows/vf-recursive-child-population.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vf-recursive-child-population-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Apply StrongPNT compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py
      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-
            rhlean-build-${{ runner.os }}-
      - name: Build imported RHLean modules
        run: |
          lake build --wfail \
            RHLean.Proof.LowWheelHighPrimeSurvivor \
            RHLean.Analysis.SquareRootPrimeCountGap \
            RHLean.Analysis.PrimeSieveAbelIdentity \
            RHLean.Analysis.SquareRootMiddleSequentialCoherence \
            RHLean.Proof.LargePrimeTerminalFlipLayers \
            RHLean.Proof.SquareRootLegalAncestryGramReduction \
            RHLean.Analysis.PrimeSieveDyadicCoherentAbel \
            RHLean.Analysis.PrimeSievePNTCentering \
            RHLean.Analysis.NativePNTMertens \
            RHLean.Analysis.PrimeSieveQuotientPNTError \
            RHLean.Analysis.MobiusRenewalTelescope \
            RHLean.Analysis.PrimeSieveFiniteDifferenceModulus \
            RHLean.Proof.FinitePartialMoments \
            RHLean.Analysis.NativePNTChebyshev \
            RHLean.Arithmetic.PrimesUpToFrontier \
            RHLean.Analysis.NativePNTErrorMass \
            RHLean.Arithmetic.SignedBuchstabRecursion \
            RHLean.Proof.LowWheelSurvivorFloorExpansion
      - name: Compile recursive child decomposition import closure
        run: |
          python3 scripts/compile_research_import_closure.py research/VF_MID_RECURSIVE_REMAINDER_BOUND.lean
      - name: Check exact decomposition declarations and axioms
        shell: bash
        run: |
          set -o pipefail
          cat > /tmp/VF_MID_CHILD_POPULATION_ACCEPTANCE.lean <<'EOF'
          import «research.VF_MID_RECURSIVE_REMAINDER_BOUND»
          #check RHLean.Analysis.vfMidRecursiveNativeChargeInBlock_eq_population_sub_prime
          #check RHLean.Analysis.vfMidRecursiveInteriorChildren_subset_oddCandidateSeats
          #check RHLean.Analysis.vfMidRecursiveInterior_card_add_complement_card
          #check RHLean.Analysis.vfMidRecursiveInteriorChildren_filter_prime
          #check RHLean.Analysis.vfMidRecursiveInterior_primeCard_add_complement_primeCard
          #check RHLean.Analysis.vfMidRecursiveInterior_card_add_rightSquareAtom
          #check RHLean.Analysis.vfMidRecursiveInteriorNativeChargeInBlock_eq_population_sub_prime
          #check RHLean.Analysis.vfMidRecursiveComplementNativeChargeInBlock_eq_population_sub_prime
          #check RHLean.Analysis.vfMidRecursiveNativeChargeInBlock_eq_interior_add_rightSquareAtom
          #check RHLean.Analysis.vfMidOddCompositeTrackingDefect_eq_recursiveInterior_add_complement
          #check RHLean.Analysis.vfMidOddCompositeTrackingDefect_eq_recursiveNative_add_complement_sub_rightSquareAtom
          #print axioms RHLean.Analysis.vfMidRecursiveNativeChargeInBlock_eq_population_sub_prime
          #print axioms RHLean.Analysis.vfMidRecursiveInteriorChildren_subset_oddCandidateSeats
          #print axioms RHLean.Analysis.vfMidRecursiveInterior_primeCard_add_complement_primeCard
          #print axioms RHLean.Analysis.vfMidRecursiveNativeChargeInBlock_eq_interior_add_rightSquareAtom
          #print axioms RHLean.Analysis.vfMidOddCompositeTrackingDefect_eq_recursiveNative_add_complement_sub_rightSquareAtom
          EOF
          lake env lean -DwarningAsError=true /tmp/VF_MID_CHILD_POPULATION_ACCEPTANCE.lean | tee child-population-acceptance.log
          python3 - <<'PY'
          import re
          from pathlib import Path

          log = Path('child-population-acceptance.log').read_text()
          audited = re.findall(r"depends on axioms:\s*\[([^\]]*)\]", log)
          if len(audited) != 5:
              raise SystemExit(f'Expected five axiom audits, found {len(audited)}')
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for entry in audited:
              unexpected = {name.strip() for name in entry.split(',') if name.strip()} - allowed
              if unexpected:
                  raise SystemExit(f'Unexpected axioms: {sorted(unexpected)}')
          print('All decomposition axiom audits use only standard logical axioms.')
          PY
