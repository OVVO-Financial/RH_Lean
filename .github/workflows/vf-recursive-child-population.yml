name: VF recursive child population and complement capacity

on:
  push:
    branches: [main]
    paths:
      - 'research/**/*.lean'
      - 'RHLean.lean'
      - 'RHLean/**/*.lean'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'scripts/strongpnt_424/**'
      - '.github/actions/**'
      - 'scripts/compile_research_import_closure.py'
      - '.github/workflows/vf-recursive-child-population.yml'
  pull_request:
    branches: [main, vf-recursive-child-population]
    paths:
      - 'research/**/*.lean'
      - .github/workflows/vf-recursive-child-population.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vf-recursive-child-population-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Route changed files through the import DAG
        id: affected
        uses: ./.github/actions/research-affected
        with:
          targets: |
            research/VF_MID_PROXY_ENERGY_PULL.lean
      - name: Set up Lean and cached Mathlib
        if: steps.affected.outputs.affected == 'true'
        uses: ./.github/actions/lean-setup
      - name: Apply StrongPNT compatibility patch
        if: steps.affected.outputs.affected == 'true'
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py
      - name: Restore StrongPNT port build cache
        if: steps.affected.outputs.affected == 'true'
        id: strongpntcache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Prebuild StrongPNT dependency
        if: steps.affected.outputs.affected == 'true'
        run: lake build StrongPNT.PNT5_Strong
      - name: Save StrongPNT port build cache
        if: steps.affected.outputs.affected == 'true' && steps.strongpntcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: ${{ steps.strongpntcache.outputs.cache-primary-key }}
      - name: Restore RHLean build cache
        if: steps.affected.outputs.affected == 'true'
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
      - name: Build imported RHLean modules
        if: steps.affected.outputs.affected == 'true'
        run: |
          lake build --wfail \
            RHLean.Proof.LowWheelHighPrimeSurvivor \
            RHLean.Analysis.SquareRootPrimeCountGap \
            RHLean.Analysis.PrimeSieveAbelIdentity \
            RHLean.Analysis.SquareRootMiddleSequentialCoherence \
            RHLean.Proof.LargePrimeTerminalFlipLayers \
            RHLean.Proof.SquareRootLegalAncestryGramReduction \
            RHLean.Analysis.PrimeSieveDyadicCoherentAbel \
            RHLean.Analysis.PrimeSievePNTCentering \
            RHLean.Analysis.NativePNTMertens \
            RHLean.Analysis.PrimeSieveQuotientPNTError \
            RHLean.Analysis.MobiusRenewalTelescope \
            RHLean.Analysis.PrimeSieveFiniteDifferenceModulus \
            RHLean.Proof.FinitePartialMoments \
            RHLean.Analysis.NativePNTChebyshev \
            RHLean.Arithmetic.PrimesUpToFrontier \
            RHLean.Analysis.NativePNTErrorMass \
            RHLean.Arithmetic.SignedBuchstabRecursion \
            RHLean.Proof.LowWheelSurvivorFloorExpansion \
            RHLean.Analysis.NativePNTTransfer \
            RHLean.Analysis.VioleSequentialEulerClosure \
            RHLean.Analysis.NativePNTSignedSecondSelbergFrontierCharge
      - name: Compile cached research import closure
        if: steps.affected.outputs.affected == 'true'
        uses: ./.github/actions/research-compile
        with:
          targets: |
            research/VF_MID_PROXY_ENERGY_PULL.lean
          build-library: 'false'
      - name: Check decomposition, capacity, endpoint consumers, and axioms
        if: steps.affected.outputs.affected == 'true'
        shell: bash
        run: |
          set -o pipefail
          cat > /tmp/VF_MID_CHILD_POPULATION_ACCEPTANCE.lean <<'EOF'
          import «research.VF_MID_PROXY_ENERGY_PULL»
          #check RHLean.Analysis.vfMidRecursiveNativeChargeInBlock_eq_population_sub_prime
          #check RHLean.Analysis.vfMidRecursiveInteriorChildren_subset_oddCandidateSeats
          #check RHLean.Analysis.vfMidRecursiveInterior_card_add_complement_card
          #check RHLean.Analysis.vfMidRecursiveInteriorChildren_filter_prime
          #check RHLean.Analysis.vfMidRecursiveInterior_primeCard_add_complement_primeCard
          #check RHLean.Analysis.vfMidRecursiveInterior_card_add_rightSquareAtom
          #check RHLean.Analysis.vfMidRecursiveInteriorNativeChargeInBlock_eq_population_sub_prime
          #check RHLean.Analysis.vfMidRecursiveComplementNativeChargeInBlock_eq_population_sub_prime
          #check RHLean.Analysis.vfMidRecursiveNativeChargeInBlock_eq_interior_add_rightSquareAtom
          #check RHLean.Analysis.vfMidOddCompositeTrackingDefect_eq_recursiveInterior_add_complement
          #check RHLean.Analysis.vfMidOddCompositeTrackingDefect_eq_recursiveNative_add_complement_sub_rightSquareAtom
          #check RHLean.Analysis.vfMidRecursiveComplement_primeCard_le_min_population_remainingPrefixWheel
          #check RHLean.Analysis.vfMidRecursiveComplement_sub_rightSquareAtom_bounds
          #check RHLean.Analysis.vfMidOddCompositeTrackingDefect_recursiveComplement_bounds
          #check RHLean.Analysis.vfMidNativePacket_forces_fullScaleViolation_of_complement_margin
          #check RHLean.Analysis.vfMidRecursiveChildrenInBlock_seven_four
          #check RHLean.Analysis.vfMidOddCandidateSeats_four
          #check RHLean.Analysis.vfMidRecursiveComplementCarrier_seven_four
          #check RHLean.Analysis.vfMidRecursivePacket_complement_cancellation_witness
          #check RHLean.Analysis.vfMidFullScaleViolation_forces_thetaEndpointViolation
          #check RHLean.Analysis.vfMidThetaLocalBlockEscapeThreshold
          #check RHLean.Analysis.vfMidThetaLocalBlockEscapeEnergyThreshold
          #check RHLean.Analysis.vfMidThetaLocalBlockEscapeThreshold_nonneg
          #check RHLean.Analysis.vfMidThetaEndpointOutside_of_localBlockDefect
          #check RHLean.Analysis.vfMidThetaEndpointOutside_of_localBlockDefect_sq
          #check RHLean.Analysis.vfMidNativePacket_forces_recursiveViolation_of_complement_margin
          #print axioms RHLean.Analysis.vfMidRecursiveNativeChargeInBlock_eq_population_sub_prime
          #print axioms RHLean.Analysis.vfMidRecursiveInteriorChildren_subset_oddCandidateSeats
          #print axioms RHLean.Analysis.vfMidRecursiveInterior_primeCard_add_complement_primeCard
          #print axioms RHLean.Analysis.vfMidRecursiveNativeChargeInBlock_eq_interior_add_rightSquareAtom
          #print axioms RHLean.Analysis.vfMidOddCompositeTrackingDefect_eq_recursiveNative_add_complement_sub_rightSquareAtom
          #print axioms RHLean.Analysis.vfMidRecursiveComplement_primeCard_le_min_population_remainingPrefixWheel
          #print axioms RHLean.Analysis.vfMidNativePacket_forces_fullScaleViolation_of_complement_margin
          #print axioms RHLean.Analysis.vfMidRecursivePacket_complement_cancellation_witness
          #print axioms RHLean.Analysis.vfMidThetaEndpointOutside_of_localBlockDefect
          #print axioms RHLean.Analysis.vfMidThetaEndpointOutside_of_localBlockDefect_sq
          #print axioms RHLean.Analysis.vfMidNativePacket_forces_recursiveViolation_of_complement_margin
          EOF
          lake env lean -DwarningAsError=true /tmp/VF_MID_CHILD_POPULATION_ACCEPTANCE.lean | tee child-population-acceptance.log
          python3 - <<'PY'
          import re
          from pathlib import Path

          log = Path('child-population-acceptance.log').read_text()
          audited = re.findall(r"depends on axioms:\s*\[([^\]]*)\]", log)
          if len(audited) != 11:
              raise SystemExit(f'Expected eleven axiom audits, found {len(audited)}')
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for entry in audited:
              unexpected = {name.strip() for name in entry.split(',') if name.strip()} - allowed
              if unexpected:
                  raise SystemExit(f'Unexpected axioms: {sorted(unexpected)}')
          print('All decomposition, capacity, and endpoint axiom audits use only standard logical axioms.')
          PY
