name: Native discrete sextic Gauss and local cancellation proof

on:
  pull_request:
    paths:
      - '.github/workflows/vf919-discrete-gauss-proof.yml'
      - 'research/VF_919_NATIVE_DISCRETE_GAUSS_PARTIAL_MOMENTS_20261019.lean'
      - 'research/VF_919_DISCRETE_GAUSS_UPM_LPM_20261019.lean'
      - 'research/VF_MID_919_DISCRETE_GAUSS_PARTIAL_MOMENT_COMPLETION_20261019.lean'
      - 'research/VF_MID_919_DISCRETE_SPLIT_PRIME_GAUSS_NORM_20261019.lean'
      - 'research/VF_919_NATIVE_FINITE_GAUSS_GEOMETRIC_BOUND_20261019.lean'
      - 'research/VF_919_NATIVE_PRIME_GAUSS_NORM_20261019.lean'
      - 'research/VF_919_NATIVE_PRIME_FOURIER_ENVELOPE_20261019.lean'
      - 'research/VF_919_NATIVE_LOCAL_COMPENSATION_ERROR_BOUND_20261019.lean'
      - 'research/NATIVE_SEVEN_EIGHTHS_LOCAL_COMPENSATION_20261019.lean'
      - 'research/VF_MID_919_OAI_PARTIAL_MOMENT_TAILS.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vf919-native-discrete-gauss-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  discrete-gauss:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lean-setup
      # StrongPNT 4.24 patches were retired by the tracker-pinned PNT+ upgrade.
      # Compile the exact, unmodified PNT+ theorem boundary on Lean 4.34.1.
      - name: Restore pinned PNT+ build cache
        id: strongpntcache
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Prebuild PNT+ StrongPNT dependency
        run: lake build PrimeNumberTheoremAnd.StrongPNT
      - name: Save pinned PNT+ build cache
        if: steps.strongpntcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Restore native library artifacts
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      - name: Kernel-compile all eight native Gauss and local error modules, warnings fatal
        uses: ./.github/actions/research-compile
        with:
          targets: >-
            research/VF_919_NATIVE_DISCRETE_GAUSS_PARTIAL_MOMENTS_20261019.lean
            research/VF_919_NATIVE_FINITE_GAUSS_GEOMETRIC_BOUND_20261019.lean
            research/VF_919_NATIVE_PRIME_GAUSS_NORM_20261019.lean
            research/VF_919_NATIVE_PRIME_FOURIER_ENVELOPE_20261019.lean
            research/VF_919_NATIVE_LOCAL_COMPENSATION_ERROR_BOUND_20261019.lean
            research/VF_919_DISCRETE_GAUSS_UPM_LPM_20261019.lean
            research/VF_MID_919_DISCRETE_GAUSS_PARTIAL_MOMENT_COMPLETION_20261019.lean
            research/VF_MID_919_DISCRETE_SPLIT_PRIME_GAUSS_NORM_20261019.lean
      - name: Reverify same eight-module closure using content-addressed cache
        run: |
          set -euo pipefail
          python3 scripts/compile_research_import_closure.py \
            research/VF_919_NATIVE_DISCRETE_GAUSS_PARTIAL_MOMENTS_20261019.lean \
            research/VF_919_NATIVE_FINITE_GAUSS_GEOMETRIC_BOUND_20261019.lean \
            research/VF_919_NATIVE_PRIME_GAUSS_NORM_20261019.lean \
            research/VF_919_NATIVE_PRIME_FOURIER_ENVELOPE_20261019.lean \
            research/VF_919_NATIVE_LOCAL_COMPENSATION_ERROR_BOUND_20261019.lean \
            research/VF_919_DISCRETE_GAUSS_UPM_LPM_20261019.lean \
            research/VF_MID_919_DISCRETE_GAUSS_PARTIAL_MOMENT_COMPLETION_20261019.lean \
            research/VF_MID_919_DISCRETE_SPLIT_PRIME_GAUSS_NORM_20261019.lean
