name: Square-root two-direction Othello check

on:
  push:
    branches:
      - agent/square-root-two-direction-othello
      - agent/square-root-two-direction-othello-proof
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: square-root-two-direction-othello-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore Mathlib packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Set up Lean and Mathlib
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Apply StrongPNT compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py

      - name: Kernel-check creation-response involution
        run: timeout 300 lake build RHLean.Proof.CreationResponseOthelloInvolution

      - name: Kernel-check response-forest involution
        run: timeout 300 lake build RHLean.Proof.SquareRootLowPrimeResponseForestOthelloInvolution

      - name: Kernel-check arithmetic response involution
        run: timeout 300 lake build RHLean.Proof.SquareRootLowPrimeResponseMatchingOthelloInvolution

      - name: Kernel-check signed downcross parent split
        run: timeout 300 lake build RHLean.Proof.LowWheelCanonicalDowncrossSignedParentSplit

      - name: Kernel-check face-tail opposite move
        run: timeout 300 lake build RHLean.Proof.LowWheelFaceTailToggle

      - name: Kernel-check opposite-fixed classification
        run: timeout 300 lake build RHLean.Proof.SquareRootLowPrimeOppositeFixedClassification

      - name: Audit assumptions
        run: bash scripts/audit_assumptions.sh
