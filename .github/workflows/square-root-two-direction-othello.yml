name: Square-root Othello scratch check

on:
  push:
    branches:
      - agent/square-root-two-direction-othello-scratch
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: square-root-othello-scratch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Lean and Mathlib
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Apply StrongPNT compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py

      - name: Kernel-check face-tail opposite move
        id: leancheck
        run: |
          set +e
          timeout 600 lake build RHLean.Proof.LowWheelFaceTailToggle > lean-build.log 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Lean compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-log
          path: lean-build.log
          if-no-files-found: error

      - name: Fail if Lean failed
        if: steps.leancheck.outputs.exit_code != '0'
        run: exit 1
