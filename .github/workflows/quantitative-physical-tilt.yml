name: Quantitative physical tilt

on:
  pull_request:
    paths:
      - 'research/oai_434/VF919Quantitative*.lean'
      - 'scripts/generate_quantitative_tilt.py'
      - 'scripts/lean/QuantitativeTiltAudit.lean'
      - '.github/workflows/quantitative-physical-tilt.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantitative-physical-tilt-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quantitative-tilt-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned compiler
        run: test "$(cat lean-toolchain)" = "leanprover/lean4:v4.34.1"
      - uses: ./.github/actions/lean-setup
      - uses: actions/checkout@v4
        with:
          repository: openai/math
          ref: 1581d4cbdd69a0faf34b2089614fe2a814316a6a
          path: oai-upstream
          persist-credentials: false
      - name: Generate exact pinned-source extensions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/generate_quantitative_tilt.py
          python3 scripts/generate_quantitative_tilt.py
      - uses: ./.github/actions/lean-compiled-cache
      - name: Verify native Wiener prerequisites
        run: lake build PrimeNumberTheoremAnd.Wiener
      - uses: ./.github/actions/research-compile
        with:
          build-library: 'true'
          targets: >-
            research/VF_919_SEVEN_EIGHTHS_SIGNED_COVARIANCE_20261019.lean
            research/VF_919_SEVEN_EIGHTHS_SQUARE_SHELL_BRIDGE_20261019.lean
            research/CORR4_OAI_POWER_GUIDEPOST_20261024.lean
            research/VF_919_OAI_ACTUAL_MARKED_FOURTH_REAL_NNS_20261021.lean
      - uses: ./.github/actions/oai-434-shared-cache
        id: oai_cache
      - name: Build pinned upstream only on incomplete shared cache
        if: ${{ steps.oai_cache.outputs.complete != 'true' }}
        working-directory: oai-upstream/lean
        shell: bash
        run: |
          set -euo pipefail
          lake build \
            RellichKondrachov.Analysis.FunctionalSpaces.Sobolev.Euclidean.TranslationEstimateL2 \
            RellichKondrachov.Analysis.FunctionalSpaces.Sobolev.Euclidean.L2Compactness.Approximation \
            RellichKondrachov.Analysis.FunctionalSpaces.Sobolev.Euclidean.L2Compactness.ArzelaAscoli \
            RellichKondrachov.Analysis.FunctionalSpaces.Sobolev.Euclidean.L2Compactness.Transfer
          lake build OAI.NumberTheory.DirichletL.PrimeCounting.Progressions
          lake build OAI.NumberTheory.DirichletL.Detector.FinalAssemblyUnconditional
      - name: Kernel check all original and strengthened targets
        shell: bash
        run: |
          set -euo pipefail
          OAI_PATH="$(cd oai-upstream/lean && lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          RH_PATH="$(lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          export LEAN_PATH="$RH_PATH:$OAI_PATH"
          python3 scripts/check_shared_lean_packages.py . oai-upstream/lean PrimeNumberTheoremAnd mathlib
          targets=(
            VF919OriginalMarkedSharpenedSignedNNS
            VF919NativeEnergyInduction
            VF919NativeSourceMoments
            VF919NativeSevenEighthsReplay
            VF919FiniteSlotReflectedGain
            VF919TiltedLowReflection
            VF919TiltedLowPhysical
            VF919TiltedProbe
            VF919TiltedHighTails
            VF919TiltedHighCentral
            VF919TiltedHighPrincipal
            VF919TiltedHighTransport
            VF919TiltedHighAssembly
            VF919NativeStrictSevenEighths
            VF919NativeStrictMertens
            VF919QuantitativeTiltBudgets
            VF919QuantitativeSmallTail
            VF919QuantitativeHighTails
            VF919QuantitativeHighTransport
            VF919QuantitativeHighAssembly
            VF919QuantitativeTilt
          )
          : > /tmp/quantitative-tilt-compile.log
          for target in "${targets[@]}"; do
            source="research/oai_434/${target}.lean"
            echo "CHECKING $source" | tee -a /tmp/quantitative-tilt-compile.log
            if grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' "$source"; then exit 1; fi
            lean -DwarningAsError=true -o ".lake/build/lib/lean/research.oai_434.${target}.olean" "$source" 2>&1 | tee -a /tmp/quantitative-tilt-compile.log
          done
          if grep -E 'sorryAx|admitAx' /tmp/quantitative-tilt-compile.log; then exit 1; fi
          lean -DwarningAsError=true --run scripts/lean/QuantitativeTiltAudit.lean 2>&1 | tee /tmp/quantitative-tilt-audit.log
      - name: Preserve source and proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantitative-tilt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/oai_434/VF919Quantitative*.lean
            scripts/generate_quantitative_tilt.py
            scripts/lean/QuantitativeTiltAudit.lean
            /tmp/quantitative-tilt-compile.log
            /tmp/quantitative-tilt-audit.log
          retention-days: 14
          if-no-files-found: warn
