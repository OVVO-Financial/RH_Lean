name: Dyadic survivor Mertens invariant

on:
  pull_request:
    branches: [main]
    paths:
      - RHLean/Proof/DyadicSurvivorMertensInvariant.lean
      - RHLean/Analysis/DyadicTransportCompression.lean
      - RHLean/Proof/PrimeCombReciprocalBandCancellation.lean
      - RHLean/Analysis/SquareRootMatchedTransport.lean
      - .github/workflows/dyadic-survivor-mertens.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Build dependency
        run: lake build PrimeNumberTheoremAnd.StrongPNT
      - name: Compile survivor invariant
        run: lake build RHLean.Proof.DyadicSurvivorMertensInvariant
