name: Canonical creation-response energy reduction check

on:
  push:
    branches:
      - agent/full-sequential-canonical-frontier-bridge
      - agent/canonical-mobius-liberty-core
    paths:
      - RHLean/Proof/CreationResponseFrontierCancellation.lean
      - RHLean/Proof/CreationResponseFrontierCancellationReal.lean
      - RHLean/Proof/SquareRootLowPrimeChannelCreationCarrier.lean
      - RHLean/Proof/SquareRootLowPrimeResponseSeatCarrier.lean
      - RHLean/Proof/SquareRootLowPrimeEulerCreationResponseEnergyGate.lean
      - RHLean/Proof/SquareRootLowPrimeCanonicalCreationResponseMap.lean
      - RHLean/Proof/SquareRootLowPrimeCanonicalCreationResponseEnergy.lean
      - RHLean/Proof/SquareRootLowPrimeCanonicalLiberty.lean
      - RHLean/Proof/SquareRootLowPrimeCanonicalLibertyPartition.lean
      - RHLean/Proof/SquareRootLowPrimePartialPacketBoundary.lean
      - .github/workflows/canonical-creation-response-energy-lean.yml
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: canonical-creation-response-energy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Import canonical C-to-R modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('RHLean.lean')
          targets = {
              'import RHLean.Proof.CreationResponseFrontierCancellation',
              'import RHLean.Proof.CreationResponseFrontierCancellationReal',
              'import RHLean.Proof.SquareRootLowPrimeChannelCreationCarrier',
              'import RHLean.Proof.SquareRootLowPrimeResponseSeatCarrier',
              'import RHLean.Proof.SquareRootLowPrimeEulerCreationResponseEnergyGate',
              'import RHLean.Proof.SquareRootLowPrimeCanonicalCreationResponseMap',
              'import RHLean.Proof.SquareRootLowPrimeCanonicalCreationResponseEnergy',
              'import RHLean.Proof.SquareRootLowPrimeCanonicalLiberty',
              'import RHLean.Proof.SquareRootLowPrimeCanonicalLibertyPartition',
              'import RHLean.Proof.SquareRootLowPrimePartialPacketBoundary',
          }
          lines = [line.strip() for line in manifest.read_text().splitlines() if line.strip()]
          manifest.write_text('\n'.join(sorted(set(lines) | targets)) + '\n')
          PY
          if ! git diff --quiet -- RHLean.lean; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add RHLean.lean
            git commit -m "Import the canonical liberty reduction"
            git push
          fi

      - name: Audit source and manifest
        run: |
          bash scripts/check_paper_analysis_boundary.sh
          bash scripts/audit_assumptions.sh
          python3 scripts/check_root_manifest.py

      - name: Restore Mathlib packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Set up Lean and Mathlib
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Apply StrongPNT compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py

      - name: Restore StrongPNT build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-

      - name: Prebuild StrongPNT dependency
        run: lake build StrongPNT.PNT5_Strong

      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Build canonical liberty chain
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          lake build \
            RHLean.Proof.CreationResponseFrontierCancellation \
            RHLean.Proof.CreationResponseFrontierCancellationReal \
            RHLean.Proof.SquareRootLowPrimeChannelCreationCarrier \
            RHLean.Proof.SquareRootLowPrimeResponseSeatCarrier \
            RHLean.Proof.SquareRootLowPrimeEulerCreationResponseEnergyGate \
            RHLean.Proof.SquareRootLowPrimeCanonicalCreationResponseMap \
            RHLean.Proof.SquareRootLowPrimeCanonicalCreationResponseEnergy \
            RHLean.Proof.SquareRootLowPrimeCanonicalLiberty \
            RHLean.Proof.SquareRootLowPrimeCanonicalLibertyPartition \
            RHLean.Proof.SquareRootLowPrimePartialPacketBoundary \
            2>&1 | tee canonical-creation-response-energy.log

      - name: Commit diagnostics on failure
        if: ${{ steps.build.outcome == 'failure' }}
        run: |
          cp canonical-creation-response-energy.log \
            research/canonical-creation-response-energy-build-errors.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/canonical-creation-response-energy-build-errors.txt
          git commit -m "Record canonical liberty compiler diagnostics"
          git push

      - name: Publish status
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const failed = '${{ steps.build.outcome }}' === 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: failed ? 'failure' : 'success',
              context: 'canonical-liberty-reduction-lean',
              description: failed
                ? 'Canonical liberty reduction failed'
                : 'Canonical liberty reduction compiled',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Fail on build error
        if: ${{ steps.build.outcome == 'failure' }}
        run: exit 1
