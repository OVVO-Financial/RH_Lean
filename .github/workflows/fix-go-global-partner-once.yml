name: Fix Go global partner once

on:
  push:
    branches: [agent/go-crossing-global-partner]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace opaque omega contradiction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('RHLean/Proof/SquareRootLowPrimeGoGlobalPartner.lean')
          text = path.read_text()
          old = '''    omega
  exact Finset.mem_filter.mpr ⟨hsource, hmateMem, hmateNe⟩'''
          new = '''    exact (Nat.ne_of_gt hlt) hsecond
  exact Finset.mem_filter.mpr ⟨hsource, hmateMem, hmateNe⟩'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/fix-go-global-partner-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RHLean/Proof/SquareRootLowPrimeGoGlobalPartner.lean .github/workflows/fix-go-global-partner-once.yml
          git commit -m 'Close Go partner distinctness without omega'
          git push
