name: Zero-target square finite-difference check

on:
  pull_request:
    branches: [main]
    paths:
      - research/ZERO_TARGET_SQUARE_FINITE_DIFFERENCE_REDUCTION.lean
      - research/ZERO_TARGET_COVARIANCE_OWNER_DESCENT.lean
      - RHLean/Proof/PostRootMertensSquareFiniteDifference.lean
      - .github/workflows/zero-target-square-fd.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Restore PNT+ build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Prebuild PNT+ StrongPNT dependency
        run: lake build PrimeNumberTheoremAnd.StrongPNT

      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-

      - name: Build RHLean modules imported by these research checks
        run: >-
          python3 scripts/compile_research_import_closure.py --library-only
          research/ZERO_TARGET_COVARIANCE_OWNER_DESCENT.lean
          research/ZERO_TARGET_PARTIAL_MOMENT_COVARIANCE.lean
          research/ZERO_TARGET_SQUARE_FINITE_DIFFERENCE_REDUCTION.lean

      - name: Emit zero-target partial moments olean
        run: |
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.ZERO_TARGET_PARTIAL_MOMENT_COVARIANCE.olean \
            research/ZERO_TARGET_PARTIAL_MOMENT_COVARIANCE.lean

      - name: Emit zero-target owner descent olean
        run: |
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.ZERO_TARGET_COVARIANCE_OWNER_DESCENT.olean \
            research/ZERO_TARGET_COVARIANCE_OWNER_DESCENT.lean

      - name: Kernel-check square finite-difference reduction
        run: lake env lean -DwarningAsError=true research/ZERO_TARGET_SQUARE_FINITE_DIFFERENCE_REDUCTION.lean
