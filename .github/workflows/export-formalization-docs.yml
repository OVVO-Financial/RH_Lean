name: Finalize dyadic transport closeout

on:
  push:
    branches:
      - agent/dyadic-transport-closeout

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dyadic-transport-closeout
          fetch-depth: 0
      - name: Finalize canonical documents and remove one-shot workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('BIG_PICTURE_PROOF_MAP.md')
          s = p.read_text()
          old = '''The next dependency-bounded work should combine the scale-transfer operator with the retained arithmetic coordinates:

          1. identify each prime-first lower cofactor fiber directly with the existing `mertensSummatory` API;
          2. group the exact transform by `d=floor((R^2-1)/q)` and formalize the kernel `K_R(d)`;
          3. refine the kernel or discrepancy by Fermat residue lane, cofactor `omega`, and orientation;
          4. test whether multiplication by a new prime, orientation reversal, or another canonical transport maps admissible lanes to admissible lanes while flipping the Mobius sign;
          5. retain every unmatched boundary term and the born-smooth remainder explicitly;
          6. state a cancellation-aware operator estimate sufficient for the protected pointwise or uniform-local criterion;
          7. preserve the complete signed interaction when passing to energy.
          '''
          new = '''The next dependency-bounded work should combine the exact dyadic support with the retained arithmetic coordinates:

          1. group the exact prime transform by `d=floor((R^2-1)/q)` and formalize the reciprocal kernel `K_R(d)`;
          2. refine the dyadic high/smooth partition by Fermat residue lane, cofactor `omega`, and orientation;
          3. test whether orientation reversal or another canonical transport pairs the smooth complement with the compressed high packets while flipping the Möbius sign;
          4. retain every unmatched boundary term and the born-smooth remainder explicitly;
          5. state a cancellation-aware joint estimate sufficient for the protected pointwise or uniform-local criterion;
          6. preserve the complete signed interaction when passing to energy.
          '''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('FORMALIZATION_CHECKLIST.md')
          s = p.read_text()
          old = '''The exact combinatorial, geometric, signed-Gram, residual, canonical low-occupancy, lifetime-flow, death-shell identity, divisor-fiber, and finite cofactor-parity layers are machine checked. On the PR #95 branch the exact `2ab` scale-transfer layer additionally proves

          ```text
          entered = smooth - transport,
          squarePrefixMertens = squareRootSmoothMass - squareRootTransportMass,
          iota_R(x)=R^2/x,
          weighted high observable = baseline-scaled low observable + discrepancy,
          cofactor-first transport pairs = prime-first lower-cofactor fibers.
          ```

          The accompanying analytical reindexing gives, for `X=R^2-1`,

          ```text
          T_R = ∑_{R<q≤X, q prime} M(floor(X/q))
              = ∑_{d<R} K_R(d) M(d).
          ```

          The reproducible experiment verifies all exact identities with zero integer error through `R=10000`; those finite results remain diagnostics rather than asymptotic theorems.
          '''
          new = '''The exact combinatorial, geometric, signed-Gram, residual, canonical low-occupancy, lifetime-flow, death-shell, `2ab` scale-transfer, and dyadic-compression layers are machine checked. The merged exact identities now include

          ```text
          entered = smooth - transport,
          squarePrefixMertens = squareRootSmoothMass - squareRootTransportMass,
          iota_R(x)=R^2/x,
          cofactor-first transport pairs = prime-first lower-cofactor fibers,
          parent packet + doubled-child packet = dyadic boundary packet,
          T_R = sum_{R<q≤X, q prime} sum_{c odd, X<2cq≤2X} mu(c),
          -T_R = the corresponding canonical source-sign sum,
          M(B) = sum_{m odd, B<2m≤2B} mu(m).
          ```

          The reproducible `2ab` experiment verifies its finite identities with zero integer error through `R=10000`; those numerical results remain diagnostics rather than asymptotic theorems. The transport-only high subset is not substituted for the complete annulus or the full `A-T` residual.
          '''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('FORMALIZATION_SEQUENCE.md')
          s = p.read_text()
          anchor = '''Thus the high transport term is an exact lower-triangular prime-dilation operator on lower-scale Mertens data. The remaining theorem is not the realization but a cancellation-aware operator or discrepancy estimate, with the born-smooth remainder and full signed interaction retained.
          '''
          insert = anchor + '''
          Dyadic compression further proves

          ```text
          parent packet + doubled-child packet = explicit boundary packet,
          -T_R = canonical `P+(m)>R` part of the odd top-half annulus,
          M(X_R) = complete odd top-half annulus.
          ```

          The smooth `P+(m)<=R` complement remains part of the protected residual. Therefore the next analytic step is a joint smooth/high estimate or a direct complete-annulus estimate, not an identification of transport alone with the RH criterion.
          '''
          if insert not in s:
              assert anchor in s
              s = s.replace(anchor, insert, 1)
          p.write_text(s)
          PY
          rm .github/workflows/export-formalization-docs.yml
      - name: Commit final closeout
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finalize dyadic transport closeout"
          git push origin HEAD:agent/dyadic-transport-closeout
