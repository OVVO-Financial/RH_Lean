name: Close scale-transfer formalization docs

on:
  push:
    branches:
      - agent/twoab-scale-transfer

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/twoab-scale-transfer
          fetch-depth: 0
      - name: Update canonical formalization documents
