name: Export formalization docs

on:
  push:
    branches:
      - agent/twoab-scale-transfer

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: formalization-docs
          path: |
            FORMALIZATION_SEQUENCE.md
            FORMALIZATION_CHECKLIST.md
