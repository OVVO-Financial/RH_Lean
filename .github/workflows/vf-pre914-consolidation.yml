name: VF pre-914 consolidation

on:
  push:
    branches: [main]
    paths:
      - 'research/**/*.lean'
      - 'RHLean.lean'
      - 'RHLean/**/*.lean'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/actions/**'
      - 'scripts/compile_research_import_closure.py'
      - 'scripts/repo_index.py'
      - 'scripts/rhlean_kg.py'
      - '.github/workflows/vf-pre914-consolidation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/**/*.lean'
      - 'RHLean.lean'
      - 'RHLean/**/*.lean'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/actions/**'
      - 'scripts/compile_research_import_closure.py'
      - 'scripts/repo_index.py'
      - 'scripts/rhlean_kg.py'
      - '.github/workflows/vf-pre914-consolidation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Route changed files through the import DAG
        id: affected
        uses: ./.github/actions/research-affected
        with:
          targets: |
            research/VF_MID_FIRST_BAD_SOURCE_TO_SECTOR_SIX_INLET.lean
            research/VF_MID_FIRST_BAD_ACTIVE_RAW_PARENT_SPLICE.lean
      - name: Set up Lean and cached Mathlib
        if: steps.affected.outputs.affected == 'true'
        uses: ./.github/actions/lean-setup
      - name: Restore PNT+ build cache
        if: steps.affected.outputs.affected == 'true'
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Prebuild PNT+ StrongPNT dependency
        if: steps.affected.outputs.affected == 'true'
        run: lake build PrimeNumberTheoremAnd.StrongPNT
      - name: Restore RHLean build cache
        if: steps.affected.outputs.affected == 'true'
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
      - name: Build RHLean modules imported by these research checks
        run: >-
          python3 scripts/compile_research_import_closure.py --library-only
          research/VF_MID_FIRST_BAD_ACTIVE_RAW_PARENT_SPLICE.lean
          research/VF_MID_FIRST_BAD_SOURCE_TO_SECTOR_SIX_INLET.lean
      - name: Compile cached research import closure
        if: steps.affected.outputs.affected == 'true'
        uses: ./.github/actions/research-compile
        with:
          targets: |
            research/VF_MID_FIRST_BAD_SOURCE_TO_SECTOR_SIX_INLET.lean
            research/VF_MID_FIRST_BAD_ACTIVE_RAW_PARENT_SPLICE.lean
