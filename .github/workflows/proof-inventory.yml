name: Proof inventory

on:
  push:
    branches: [main]
    paths:
      - 'RHLean.lean'
      - 'RHLean/**/*.lean'
      - 'scripts/proof_inventory.py'
      - 'scripts/rhlean_kg.py'
      - 'scripts/decl_graph.py'
      - 'scripts/proofq.py'
      - 'scripts/semantic_facets.json'
      - 'scripts/lean/DeclGraph.lean'
      - '.github/workflows/proof-inventory.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'RHLean.lean'
      - 'RHLean/**/*.lean'
      - 'scripts/proof_inventory.py'
      - 'scripts/rhlean_kg.py'
      - 'scripts/decl_graph.py'
      - 'scripts/proofq.py'
      - 'scripts/semantic_facets.json'
      - 'scripts/lean/DeclGraph.lean'
      - '.github/workflows/proof-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proof-inventory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build primary-source proof inventory
        run: |
          python3 scripts/proof_inventory.py \
            --json proof-inventory.json \
            --dot proof-import-graph.dot \
            | tee proof-inventory.txt
          {
            echo '## RHLean proof inventory'
            echo '```text'
            cat proof-inventory.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Layer 2a: the declaration graph. Source-level and dependency-free, so it
      # runs in seconds without a Lean toolchain. The exact elaborated graph is
      # validated after the hosted RHLean build in the Lean source-audit workflow.
      - name: Build declaration dependency graph
        run: |
          python3 scripts/decl_graph.py \
            --json decl-graph.json \
            --dot decl-graph.dot \
            --require-acyclic \
            | tee decl-graph.txt
          python3 - <<'PY'
          import json
          inv = json.load(open('proof-inventory.json'))
          graph = json.load(open('decl-graph.json'))
          expected = inv['named_proofs']['total_theorem_plus_lemma']
          actual = graph['stats']['named_proofs']
          if expected != actual:
              raise SystemExit(
                  f'named-proof count mismatch: inventory={expected}, graph={actual}'
              )
          print(f'Source counters agree on {actual:,} named proofs.')
          PY
          {
            echo '## RHLean declaration graph'
            echo '```text'
            cat decl-graph.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The standing reports a research agent would otherwise have to rerun by
      # hand. `obligations` maps genuinely open propositions appearing on RH
      # reduction routes; multi-premise packages remain conjunctive in proofq.
      - name: Standing knowledge-graph reports
        run: |
          python3 scripts/proofq.py status > kg-status.txt
          python3 scripts/proofq.py open-leaves --rh-only --limit 40 \
            > kg-open-leaves.txt
          python3 scripts/proofq.py obligations --rh-only --limit 40 \
            > kg-obligations.txt
          python3 scripts/proofq.py terminal-cone --limit 30 > kg-terminal-cone.txt
          python3 scripts/proofq.py duplicates --limit 30 > kg-duplicates.txt
          {
            echo '## Open propositions on RH reduction routes'
            echo '```text'
            cat kg-obligations.txt
            echo '```'
            echo '## Duplicate statement signatures'
            echo '```text'
            head -60 kg-duplicates.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload proof inventory
        uses: actions/upload-artifact@v4
        with:
          name: proof-inventory
          path: |
            proof-inventory.txt
            proof-inventory.json
            proof-import-graph.dot
            decl-graph.txt
            decl-graph.json
            decl-graph.dot
            kg-status.txt
            kg-open-leaves.txt
            kg-obligations.txt
            kg-terminal-cone.txt
            kg-duplicates.txt
