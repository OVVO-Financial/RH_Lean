name: Proof inventory

on:
  push:
    branches: [main]
    paths:
      - '**.lean'
      - '**.md'
      - 'scripts/**'
      - 'research/**'
      - 'experiments/**'
      - 'numerics/**'
      - 'export_*/**'
      - 'docs/**'
      - '.github/workflows/**'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.gitignore'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.lean'
      - '**.md'
      - 'scripts/**'
      - 'research/**'
      - 'experiments/**'
      - 'numerics/**'
      - 'export_*/**'
      - 'docs/**'
      - '.github/workflows/**'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proof-inventory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build primary-source proof inventory
        run: |
          python3 scripts/proof_inventory.py \
            --json proof-inventory.json \
            --dot proof-import-graph.dot \
            | tee proof-inventory.txt
          {
            echo '## RHLean proof inventory'
            echo '```text'
            cat proof-inventory.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Layer 2a: the declaration graph. Source-level and dependency-free, so it
      # runs in seconds without a Lean toolchain. The exact elaborated graph is
      # validated after the hosted RHLean build in the Lean source-audit workflow.
      - name: Build declaration dependency graph
        run: |
          python3 scripts/decl_graph.py \
            --json decl-graph.json \
            --dot decl-graph.dot \
            --require-acyclic \
            | tee decl-graph.txt
          python3 - <<'PY'
          import json
          inv = json.load(open('proof-inventory.json'))
          graph = json.load(open('decl-graph.json'))
          expected = inv['named_proofs']['total_theorem_plus_lemma']
          actual = graph['stats']['named_proofs']
          if expected != actual:
              raise SystemExit(
                  f'named-proof count mismatch: inventory={expected}, graph={actual}'
              )
          print(f'Source counters agree on {actual:,} named proofs.')
          PY
          {
            echo '## RHLean declaration graph'
            echo '```text'
            cat decl-graph.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check knowledge-graph semantics
        run: |
          python3 scripts/check_knowledge_graph.py decl-graph.json \
            | tee kg-check.txt
          {
            echo '## Knowledge-graph regression checks'
            echo '```text'
            cat kg-check.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check repository navigation regressions
        run: python3 -m unittest discover -s scripts -p test_repo_index.py -v

      - name: Build full repository source index and import DAG
        run: |
          python3 scripts/repo_index.py build \
            --dot repo-imports.dot --report repo-map.md --require-acyclic
          python3 - <<'PY'
          import json
          inv = json.load(open('proof-inventory.json'))
          repo = json.load(open('repo-index.json'))
          files = repo['files']
          library = [d for d in repo['declarations']
                     if files[d['file_id']]['scope'] == 'library'
                     and d['kind'] in ('theorem', 'lemma')]
          expected = inv['named_proofs']['total_theorem_plus_lemma']
          assert len(library) == expected, (len(library), expected)
          staging_roots = inv['dependent_lean_outside_scope']['roots']
          staging = [e for e in repo['modules'].values()
                     if e['path'].split('/')[0] in staging_roots]
          assert len(staging) == inv['dependent_lean_outside_scope']['lean_files']
          assert any(d['name'].endswith('vfMidActualPrimeFirstBadAt_two_succ_activeExcess_nonpos_of_exactBudget')
                     for d in repo['declarations']), 'lost the final aggregate research sentinel'
          print(f'Library counters agree: {expected}; staging modules indexed: {len(staging)}')
          PY
          python3 scripts/proofq.py repo-search 'SectorSix' \
            --scope research --kind declaration --limit 20 > repo-frontier.txt
          cat repo-map.md >> "$GITHUB_STEP_SUMMARY"

      # The standing reports a research agent would otherwise have to rerun by
      # hand. `obligations` maps genuinely open propositions appearing on RH
      # reduction routes; multi-premise packages remain conjunctive in proofq.
      - name: Standing knowledge-graph reports
        run: |
          python3 scripts/proofq.py status > kg-status.txt
          python3 scripts/proofq.py open-leaves --rh-only --limit 40 \
            > kg-open-leaves.txt
          python3 scripts/proofq.py obligations --rh-only --limit 40 \
            > kg-obligations.txt
          python3 scripts/proofq.py terminal-cone --limit 30 > kg-terminal-cone.txt
          python3 scripts/proofq.py duplicates --limit 30 > kg-duplicates.txt
          {
            echo '## Open propositions on RH reduction routes'
            echo '```text'
            cat kg-obligations.txt
            echo '```'
            echo '## Duplicate statement signatures'
            echo '```text'
            head -60 kg-duplicates.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # research/**.lean is a staging tree outside the compiled library. Work
      # leaves it by being promoted into RHLean/, and the scratch copy is easy
      # to leave behind. This reports the leftovers; it is informational and
      # never fails the job, because name/signature twinning is a heuristic.
      - name: Research scratch already absorbed by the library
        continue-on-error: true
        run: |
          python3 scripts/research_overlap.py --verbose \
            > kg-research-overlap.txt || true
          {
            echo '## Research scratch already in the library'
            echo '```text'
            head -40 kg-research-overlap.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Regional geometry of the library
        run: |
          # --check is a gate, not a report: it fails when the region
          # vocabulary has gone stale against the library (a partition witness
          # renamed away, a cut the library stopped writing that way). That is
          # a silent failure otherwise -- coverage just quietly drops.
          python3 scripts/region_graph.py --check
          # Writing the JSON also prints the report, so this is one rebuild,
          # not two.
          python3 scripts/region_graph.py --json region-graph.json > kg-regions.txt
          {
            echo '## Regional geometry'
            echo '```text'
            sed -n '1,40p' kg-regions.txt
            echo '```'
            echo '<details><summary>crossings and gaps</summary>'
            echo
            echo '```text'
            sed -n '/REGION-CROSSING/,$p' kg-regions.txt | head -60
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload proof inventory
        uses: actions/upload-artifact@v4
        with:
          name: proof-inventory
          path: |
            proof-inventory.txt
            proof-inventory.json
            proof-import-graph.dot
            decl-graph.txt
            decl-graph.json
            decl-graph.dot
            kg-check.txt
            kg-status.txt
            kg-open-leaves.txt
            kg-obligations.txt
            kg-terminal-cone.txt
            kg-duplicates.txt
            kg-research-overlap.txt
            kg-regions.txt
            region-graph.json
            repo-index.json
            repo-imports.dot
            repo-map.md
            repo-frontier.txt
