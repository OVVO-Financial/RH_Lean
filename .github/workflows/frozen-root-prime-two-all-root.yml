name: Frozen root prime-two all-root theorem

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/FROZEN_ROOT_PRIME_TWO_HIGH_HIGH_GENERAL_20261108.lean'
      - 'docs/FROZEN_ROOT_PRIME_TWO_ALL_AGENTS_20261108.md'
      - 'AGENTS.md'
      - '.github/workflows/frozen-root-prime-two-all-root.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frozen-root-prime-two-${{ github.head_ref || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  frozen-root-general:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Reject proof holes and axioms
        run: |
          if grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' \
             research/FROZEN_ROOT_PRIME_TWO_HIGH_HIGH_GENERAL_20261108.lean; then exit 1; fi
      - uses: ./.github/actions/lean-setup
      - name: Compile general theorem and full original import closure, warnings fatal
        run: >-
          python3 scripts/compile_research_import_closure.py --build-library
          research/FROZEN_ROOT_PRIME_TWO_HIGH_HIGH_GENERAL_20261108.lean
      - name: Kernel-check general theorem statements and axioms
        run: |
          cat >/tmp/frozen_root_prime_two_acceptance.lean <<'LEAN'
          import «research.FROZEN_ROOT_PRIME_TWO_HIGH_HIGH_GENERAL_20261108»
          #check RHLean.Proof.frozenOddHigh_floor_one_to_three
          #check RHLean.Proof.frozenOddHigh_floor_eq_three_masks
          #check RHLean.Proof.frozenOddHighPairFloor_eq_mass_square_add_two_masks
          #check RHLean.Proof.frozenOddHighPairFloor_sub_mass_square
          #check RHLean.Proof.frozenOddHighParents_eq_dyadicBoundary
          #check RHLean.Proof.frozenOddHighMass_cast_eq_mertensSummatory
          #check RHLean.Proof.frozenOddHighPairFloor_cast_eq_historicalMertens_square_add_masks
          #print axioms RHLean.Proof.frozenOddHigh_floor_one_to_three
          #print axioms RHLean.Proof.frozenOddHigh_floor_eq_three_masks
          #print axioms RHLean.Proof.frozenOddHighPairFloor_eq_mass_square_add_two_masks
          #print axioms RHLean.Proof.frozenOddHighPairFloor_sub_mass_square
          #print axioms RHLean.Proof.frozenOddHighParents_eq_dyadicBoundary
          #print axioms RHLean.Proof.frozenOddHighMass_cast_eq_mertensSummatory
          #print axioms RHLean.Proof.frozenOddHighPairFloor_cast_eq_historicalMertens_square_add_masks
          LEAN
          lake env lean -DwarningAsError=true /tmp/frozen_root_prime_two_acceptance.lean
