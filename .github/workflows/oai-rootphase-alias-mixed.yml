name: Original Mobius root-phase Fourier alias and mixed-mode CI

on:
  pull_request:
    branches: [main]
    paths:
      - "research/OAI_ROOTPHASE_FOURIER_ALIAS_MIXED_20261028.lean"
      - "research/OAI_ROOTPHASE_FOURIER_ALIAS_MIXED_20261028.md"
      - "scripts/oai_rootphase_alias_mixed_probe.py"
      - ".github/workflows/oai-rootphase-alias-mixed.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Lean and cached Mathlib
        uses: ./.github/actions/lean-setup
      - name: Warning-fatal original arithmetic proof
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -DwarningAsError=true research/OAI_ROOTPHASE_FOURIER_ALIAS_MIXED_20261028.lean | tee /tmp/oai_rootalias_axioms.log
          if grep -Eq 'sorryAx|admitAx' /tmp/oai_rootalias_axioms.log; then
            echo "Unacceptable proof hole"; exit 1
          fi
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path("research/OAI_ROOTPHASE_FOURIER_ALIAS_MIXED_20261028.lean").read_text()
          s=re.sub(r"/-.*?-/", "", s, flags=re.S)
          s=re.sub(r"--.*", "", s)
          assert not re.search(r"\b(sorry|admit|axiom)\b",s)
          log=pathlib.Path("/tmp/oai_rootalias_axioms.log").read_text()
          allowed={"propext","Classical.choice","Quot.sound"}
          for blob in re.findall(r"depends on axioms:\s*\[([^\]]+)\]",log,re.S):
              used={a.strip() for a in blob.split(",") if a.strip()}
              assert used<=allowed,used-allowed
          assert "oaiRootAlias_twoSitePhysicalPhase_zero" in log
          assert "oaiRootAlias_not_diagonal_orthogonality" in log
          print("PASS actual Mobius counterexample and standard axioms only")
          PY
      - name: Independent original-Mobius smooth harmonic interference test
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/oai_rootphase_alias_mixed_probe.py
