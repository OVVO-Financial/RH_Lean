name: Mertens signed higher-order lift

on:
  pull_request:
    paths:
      - 'research/MERTENS_HEATH_BROWN*'
      - 'research/MERTENS_SIGNED_HYPERBOLA*'
      - 'experiments/mertens_signed_lift/**'
      - '.github/workflows/mertens-signed-lift.yml'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mertens-signed-lift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  signed-lift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lean-setup
      - name: Restore pinned PNT+ boundary
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Restore native library artifacts
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      - name: Build RHLean modules imported by these research checks
        run: >-
          python3 scripts/compile_research_import_closure.py --library-only
          research/MERTENS_HEATH_BROWN_ACCEPTANCE.lean
      - name: Compile signed lift and hyperbola closure
        uses: ./.github/actions/research-compile
        with:
          targets: research/MERTENS_HEATH_BROWN_ACCEPTANCE.lean
      - name: Audit exact kernel dependency lists
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -DwarningAsError=true research/MERTENS_HEATH_BROWN_ACCEPTANCE.lean 2>&1 | tee mertens-signed-lift-axioms.log
          python3 - <<'PY'
          import pathlib, re
          source = pathlib.Path('research/MERTENS_HEATH_BROWN_ACCEPTANCE.lean').read_text()
          expected = re.findall(r'^#print axioms (\S+)', source, re.M)
          text = pathlib.Path('mertens-signed-lift-axioms.log').read_text()
          rows = re.findall(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]", text)
          assert expected and len(rows) == len(expected)
          assert {name for name, _ in rows} == set(expected)
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for name, axioms in rows:
              found = {s.strip() for s in axioms.split(',') if s.strip()}
              assert found <= allowed, (name, found - allowed)
          print(f'PASS: {len(rows)} exact signed-lift kernel dependency lists.')
          PY
      - name: Preserve proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mertens-signed-lift-evidence-${{ github.sha }}
          path: mertens-signed-lift-axioms.log
          if-no-files-found: ignore
