name: VF first-bad terminal contradiction

on:
  pull_request:
    branches: [main]
    paths:
      - research/VF_MID_FIRST_BAD_TERMINAL_CONTRADICTION.lean
      - research/VF_MID_FIRST_BAD_AFFINE_OWNER_SPLICE.lean
      - research/VF_MID_FULL_AFFINE_PAIR_CLASSIFIER.lean
      - research/VF_MID_FRACTIONAL_INCIDENCE_CAPACITY.lean
      - research/VF_MID_ADJACENT_SQUARE_SELBERG_BOUNDARY.lean
      - research/VF_MID_ONE_BLOCK_SOURCE_TO_RANK_INLET.lean
      - research/VF_MID_GLOBAL_FIRST_BAD_RADIAL_BUDGET.lean
      - research/VF_MID_FIRST_BAD_PARTIAL_MOMENT_SYNTHESIS.lean
      - research/VF_MID_FIRST_BAD_NORMALIZED_PARTIAL_MOMENT.lean
      - research/NNS_EQUAL_ABS_DEGREE_NORMALIZATION.lean
      - research/VF_MID_OWNER_FIBER_DEGREE_NORMALIZATION.lean
      - research/NNS_ZERO_TARGET_FIRST_OWNER_CODIV_FUBINI.lean
      - research/VF_MID_COMPLETED_GATE_PM_DENOMINATOR.lean
      - research/VF_MID_GLOBAL_COMPLETED_GATE_PM_BUDGET.lean
      - research/VF_MID_ANCHORED_CODIV_GATE_INLET.lean
      - research/VF_MID_FIRST_BAD_RESTORING_DECOMPOSITION.lean
      - research/VF_MID_FIRST_BAD_CORRELATION_DESCENT.lean
      - research/VF_MID_FIRST_BAD_HISTORY_COMPRESSION.lean
      - research/VF_MID_FIRST_BAD_GLOBAL_HNORM.lean
      - .github/workflows/vf-first-bad-terminal.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Apply StrongPNT compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py
      - name: Restore StrongPNT port build cache
        id: strongpntcache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Prebuild StrongPNT dependency
        run: lake build StrongPNT.PNT5_Strong
      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-
            rhlean-build-${{ runner.os }}-
      - name: Compile exact first-bad restoring decomposition
        run: |
          python3 scripts/compile_research_import_closure.py research/VF_MID_FIRST_BAD_RESTORING_DECOMPOSITION.lean
          cat > /tmp/VF_MID_FIRST_BAD_RESTORING_ACCEPTANCE.lean <<'EOF'
          import «research.VF_MID_FIRST_BAD_RESTORING_DECOMPOSITION»
          #check RHLean.Analysis.vfMidFirstBadAnchoredCoDivExcess_eq_upper_restoring_slack
          #check RHLean.Analysis.vfMidFirstBadAnchoredCoDivExcess_eq_lower_restoring_slack
          #print axioms RHLean.Analysis.vfMidFirstBadUpperRestoringAnchorSlack_nonpos
          #print axioms RHLean.Analysis.vfMidFirstBadLowerRestoringAnchorSlack_nonpos
          EOF
          lake env lean -DwarningAsError=true /tmp/VF_MID_FIRST_BAD_RESTORING_ACCEPTANCE.lean
      - name: Compile finite first-bad correlation descent
        run: |
          python3 scripts/compile_research_import_closure.py research/VF_MID_FIRST_BAD_CORRELATION_DESCENT.lean
          cat > /tmp/VF_MID_FIRST_BAD_CORRELATION_DESCENT_ACCEPTANCE.lean <<'EOF'
          import «research.VF_MID_FIRST_BAD_CORRELATION_DESCENT»
          #check RHLean.Analysis.vfMidActualPrimeFirstBadAt_two_succ_nnsNormalized_gt_half
          #check RHLean.Analysis.abs_vfMidActualPrimeEndpointDefect_sub_primeLi_le_uniform
          #check RHLean.Analysis.vfMidActualPrimeEndpointDefect_eq_anchor_sub_frozenAffineRun
          #check RHLean.Analysis.vfMidActualPrimeFirstBadAt_forces_frozenAffineRun_depthAware
          #check RHLean.Analysis.vfMidCenteredSeatPair_eq_quarter_zeroTargetExcess_of_cube
          #check RHLean.Analysis.descendingGreatestOwner_retained_zeroTargetExcess_flip
          #check RHLean.Analysis.exists_recursive_half_excess_of_sum_gt_half
          #check RHLean.Analysis.no_bad_of_strict_rank_descent
          #print axioms RHLean.Analysis.vfMidCenteredSeatPair_eq_quarter_zeroTargetExcess_of_cube
          #print axioms RHLean.Analysis.no_bad_of_strict_rank_descent
          EOF
          lake env lean -DwarningAsError=true /tmp/VF_MID_FIRST_BAD_CORRELATION_DESCENT_ACCEPTANCE.lean
      - name: Compile first-bad historical decompression
        run: |
          python3 scripts/compile_research_import_closure.py research/VF_MID_FIRST_BAD_HISTORY_COMPRESSION.lean
          cat > /tmp/VF_MID_FIRST_BAD_HISTORY_COMPRESSION_ACCEPTANCE.lean <<'EOF'
          import «research.VF_MID_FIRST_BAD_HISTORY_COMPRESSION»
          #check RHLean.Analysis.vfMidActualPrimeEndpointDefect_eq_anchor_sub_oddRunSeatMass
          #check RHLean.Analysis.abs_vfMidActualPrimeEndpointDefect_le_anchor_add_historyAbs
          #check RHLean.Analysis.vfMidActualPrimeFirstBadAt_two_succ_priorAnchor_inside
          #check RHLean.Analysis.vfMidLi_squareEndpoint_O_one
          #check RHLean.Analysis.vfMidActualPrimeEndpointDefect_eq_primeLi_sub_liError
          #check RHLean.Analysis.abs_vfMidActualPrimeEndpointDefect_sub_primeLi_le_uniform
          #print axioms RHLean.Analysis.vfMidActualPrimeEndpointDefect_eq_anchor_sub_oddRunSeatMass
          #print axioms RHLean.Analysis.vfMidLi_squareEndpoint_O_one
          EOF
          lake env lean -DwarningAsError=true /tmp/VF_MID_FIRST_BAD_HISTORY_COMPRESSION_ACCEPTANCE.lean
      - name: Compile affine-scaled first-owner half gate
        run: |
          python3 scripts/compile_research_import_closure.py research/GLOBAL_RETURNED_CORE_VIRTUAL_OWNER_HALF_GATE.lean
          cat > /tmp/VF_MID_AFFINE_SCALE_HALF_GATE_ACCEPTANCE.lean <<'EOF'
          import «research.GLOBAL_RETURNED_CORE_VIRTUAL_OWNER_HALF_GATE»
          noncomputable section
          open scoped BigOperators
          namespace RHLean.Analysis
          open RHLean.Arithmetic RHLean.Proof
          theorem vfMidScaledFirstOwnerSignedCellTelescope_le_half_dirichletIncidence_sq_acceptance
              {R p : ℕ} {sig : Finset ℕ}
              (hp : p.Prime) (scale : ℝ) :
              scale ^ 2 * lowOwnerFirstOwnerSignedCellTelescope R p sig ≤
                (1 / 2 : ℝ) *
                  (scale * lowOwnerFirstOwnerDirichletIncidenceAmplitude R p sig) ^ 2 := by
            have hcore :=
              lowOwnerFirstOwnerSignedCellTelescope_le_half_dirichletIncidence_sq
                (R := R) (p := p) (sig := sig) hp
            have hscale : 0 ≤ scale ^ 2 := sq_nonneg scale
            have hscaled :=
              mul_le_mul_of_nonneg_left hcore hscale
            calc
              scale ^ 2 * lowOwnerFirstOwnerSignedCellTelescope R p sig ≤
                  scale ^ 2 *
                    ((1 / 2 : ℝ) *
                      lowOwnerFirstOwnerDirichletIncidenceAmplitude R p sig ^ 2) :=
                hscaled
              _ = (1 / 2 : ℝ) *
                  (scale * lowOwnerFirstOwnerDirichletIncidenceAmplitude R p sig) ^ 2 := by
                ring
          #check vfMidScaledFirstOwnerSignedCellTelescope_le_half_dirichletIncidence_sq_acceptance
          #print axioms vfMidScaledFirstOwnerSignedCellTelescope_le_half_dirichletIncidence_sq_acceptance
          end RHLean.Analysis
          EOF
          lake env lean -DwarningAsError=true /tmp/VF_MID_AFFINE_SCALE_HALF_GATE_ACCEPTANCE.lean
      - name: Compile terminal contradiction import closure
        run: |
          python3 scripts/compile_research_import_closure.py research/VF_MID_FIRST_BAD_TERMINAL_CONTRADICTION.lean
          python3 scripts/compile_research_import_closure.py research/VF_MID_GLOBAL_FIRST_BAD_RADIAL_BUDGET.lean
          python3 scripts/compile_research_import_closure.py research/VF_MID_FIRST_BAD_PARTIAL_MOMENT_SYNTHESIS.lean
          python3 scripts/compile_research_import_closure.py research/VF_MID_FIRST_BAD_NORMALIZED_PARTIAL_MOMENT.lean
          python3 scripts/compile_research_import_closure.py research/NNS_EQUAL_ABS_DEGREE_NORMALIZATION.lean
          python3 scripts/compile_research_import_closure.py research/VF_MID_OWNER_FIBER_DEGREE_NORMALIZATION.lean
          python3 scripts/compile_research_import_closure.py research/NNS_ZERO_TARGET_FIRST_OWNER_CODIV_FUBINI.lean
          python3 scripts/compile_research_import_closure.py research/VF_MID_COMPLETED_GATE_PM_DENOMINATOR.lean
          python3 scripts/compile_research_import_closure.py research/VF_MID_GLOBAL_COMPLETED_GATE_PM_BUDGET.lean
          python3 scripts/compile_research_import_closure.py research/VF_MID_ANCHORED_CODIV_GATE_INLET.lean
          python3 scripts/compile_research_import_closure.py research/VF_MID_FIRST_BAD_GLOBAL_HNORM.lean
      - name: Require final hnorm and contradiction theorems
        run: |
          cat > /tmp/VF_MID_FIRST_BAD_GLOBAL_HNORM_ACCEPTANCE.lean <<'EOF'
          import «research.VF_MID_FIRST_BAD_GLOBAL_HNORM»
          #check RHLean.Analysis.vfMidFirstBadNNSNormalizedCovariance_le_half
          #check RHLean.Analysis.vfMidActualPrimeFirstBadAt_two_succ_closed
          #print axioms RHLean.Analysis.vfMidFirstBadNNSNormalizedCovariance_le_half
          #print axioms RHLean.Analysis.vfMidActualPrimeFirstBadAt_two_succ_closed
          EOF
          lake env lean -DwarningAsError=true /tmp/VF_MID_FIRST_BAD_GLOBAL_HNORM_ACCEPTANCE.lean
