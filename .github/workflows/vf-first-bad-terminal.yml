name: VF first-bad normalized infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'research/**/*.lean'
      - 'RHLean.lean'
      - 'RHLean/**/*.lean'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/actions/**'
      - 'scripts/compile_research_import_closure.py'
      - 'scripts/repo_index.py'
      - 'scripts/rhlean_kg.py'
      - '.github/workflows/vf-first-bad-terminal.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/**/*.lean'
      - 'RHLean.lean'
      - 'RHLean/**/*.lean'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/actions/**'
      - 'scripts/compile_research_import_closure.py'
      - 'scripts/repo_index.py'
      - 'scripts/rhlean_kg.py'
      - '.github/workflows/vf-first-bad-terminal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  # Let an active expensive build reach its cache checkpoint. GitHub still
  # coalesces superseded pending revisions; actual failed prerequisites
  # retain the separate exact-revision fail-fast gate.
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Prior cold closure was cancelled at 30 minutes after native build succeeded.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Route changed files through the import DAG
        id: affected
        uses: ./.github/actions/research-affected
        with:
          targets: |
            research/VF_MID_FIRST_BAD_RESTORING_DECOMPOSITION.lean
            research/VF_MID_FIRST_BAD_CORRELATION_DESCENT.lean
            research/VF_MID_FIRST_BAD_HISTORY_COMPRESSION.lean
      - name: Set up Lean and cached Mathlib
        if: steps.affected.outputs.affected == 'true'
        uses: ./.github/actions/lean-setup
      - name: Restore PNT+ build cache
        if: steps.affected.outputs.affected == 'true'
        id: strongpntcache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Prebuild PNT+ StrongPNT dependency
        if: steps.affected.outputs.affected == 'true'
        run: lake build PrimeNumberTheoremAnd.StrongPNT
      # Reuse the independently completed upstream dependency on repair runs.
      - name: Checkpoint compiled PNT+ dependency
        if: steps.affected.outputs.affected == 'true' && steps.strongpntcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Restore RHLean build cache
        if: steps.affected.outputs.affected == 'true'
        id: rhleancache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          # This key is a partial checkpoint, never a complete RHLean build.
          key: rhlean-preflight-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}-vf-infrastructure
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
            rhlean-preflight-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}-
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            rhlean-preflight-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      - name: Build RHLean modules imported by these research checks
        id: vfprerequisites
        if: steps.affected.outputs.affected == 'true'
        run: >-
          python3 scripts/compile_research_import_closure.py --library-only
          research/VF_MID_FIRST_BAD_CORRELATION_DESCENT.lean
          research/VF_MID_FIRST_BAD_HISTORY_COMPRESSION.lean
          research/VF_MID_FIRST_BAD_RESTORING_DECOMPOSITION.lean
      # Retain the successful native import closure before starting the
      # long research pass. The compiler still validates each source/artifact.
      - name: Checkpoint compiled native VF prerequisites
        if: >-
          steps.vfprerequisites.outcome == 'success' &&
          steps.rhleancache.outputs.cache-hit != 'true' &&
          steps.rhleancache.outputs.cache-matched-key != format('rhlean-build-{0}-{1}-{2}-{3}', runner.os, runner.arch, hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json'), hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean'))
        uses: actions/cache/save@v5
        with:
          path: .lake/build
          key: ${{ steps.rhleancache.outputs.cache-primary-key }}
      - name: Compile cached research import closure
        if: steps.affected.outputs.affected == 'true'
        uses: ./.github/actions/research-compile
        with:
          native-cache-ready: 'true'
          targets: |
            research/VF_MID_FIRST_BAD_RESTORING_DECOMPOSITION.lean
            research/VF_MID_FIRST_BAD_CORRELATION_DESCENT.lean
            research/VF_MID_FIRST_BAD_HISTORY_COMPRESSION.lean
      - name: Compile banked first-bad infrastructure
        if: steps.affected.outputs.affected == 'true'
        run: |
          cat > /tmp/VF_MID_FIRST_BAD_BANK_ACCEPTANCE.lean <<'EOF'
          import «research.VF_MID_FIRST_BAD_CORRELATION_DESCENT»
          import «research.VF_MID_FIRST_BAD_HISTORY_COMPRESSION»
          #check RHLean.Analysis.vfMidActualPrimeFirstBadAt_two_succ_nnsNormalized_gt_half
          #check RHLean.Analysis.vfMidActualPrimeEndpointDefect_eq_anchor_sub_frozenAffineRun
          #check RHLean.Analysis.vfMidActualPrimeEndpointDefect_eq_anchor_sub_oddRunSeatMass
          #print axioms RHLean.Analysis.vfMidActualPrimeFirstBadAt_two_succ_nnsNormalized_gt_half
          EOF
          lake env lean -DwarningAsError=true /tmp/VF_MID_FIRST_BAD_BANK_ACCEPTANCE.lean
