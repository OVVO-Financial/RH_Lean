name: Mobius inversion global cancellation

on:
  pull_request:
    branches: [main]
    paths:
      - research/MOBIUS_INVERSION_GLOBAL_CANCELLATION.lean
      - scripts/mobius_inversion_autopsy_probe.py
      - .github/workflows/mobius-inversion-global-cancellation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Restore PNT+ build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Prebuild PNT+ StrongPNT dependency
        run: lake build PrimeNumberTheoremAnd.StrongPNT
      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      - name: Build library dependencies
        run: |
          lake build RHLean.Analysis.NativePNTMertens
          lake build RHLean.Analysis.NativePNTQuantitativeStatements
          lake build RHLean.Analysis.SquareRootPositiveSmoothCollapse
          lake build RHLean.Proof.MatchedFarSurvivorBridge
          lake build RHLean.Proof.SquareRootAncestryRoot
      - name: Build RHLean modules imported by these research checks
        run: >-
          python3 scripts/compile_research_import_closure.py --library-only
          research/MOBIUS_INVERSION_GLOBAL_CANCELLATION.lean
      - name: Kernel-check Mobius inversion global cancellation
        run: |
          mkdir -p .lake/build/lib/lean
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.MOBIUS_INVERSION_GLOBAL_CANCELLATION.olean research/MOBIUS_INVERSION_GLOBAL_CANCELLATION.lean
      - name: Check exact Mobius inversion identities
        run: python3 scripts/mobius_inversion_autopsy_probe.py --max-root 300
