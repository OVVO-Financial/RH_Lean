name: Perron quarter-frame bound check

on:
  pull_request:
    branches: [main]
    paths:
      - research/STABLE_FAR_PERRON_QUARTER_FRAME_BOUND.lean
      - research/STABLE_FAR_PERRON_BASEL_FRAME_SHARPENING.lean
      - research/COVARIANCE_RECIPROCAL_OWNER_BASEL_CONTRACTION.lean
      - research/STABLE_FAR_PERRON_RETURNED_FIBER_INTERFACE.lean
      - research/STABLE_FAR_CRITICAL_Q2_ENERGY_MULTIPLIER.lean
      - research/ZERO_TARGET_PARTIAL_MOMENT_COVARIANCE.lean
      - research/ZERO_TARGET_COVARIANCE_OWNER_DESCENT.lean
      - research/GLOBAL_RETURNED_CORE_STOKES_ZERO_TARGET_COVARIANCE.lean
      - RHLean/Proof/SquareRootLowPrimeSharpFrameBudget.lean
      - RHLean/Proof/ComplexVerticalLineGreenKubo.lean
      - RHLean/Proof/EndpointCubeAnalyticClosure.lean
      - .github/workflows/perron-quarter-frame.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Apply StrongPNT 4.24 compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py

      - name: Restore StrongPNT port build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Prebuild StrongPNT dependency
        run: lake build StrongPNT.PNT5_Strong

      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Emit returned-fibre production olean
        run: |
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.STABLE_FAR_RETURNED_FIBER_PRODUCTION.olean \
            research/STABLE_FAR_RETURNED_FIBER_PRODUCTION.lean

      - name: Emit exact log-frequency diagonalization olean
        run: |
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.STABLE_FAR_LOG_FREQUENCY_DIAGONALIZATION.olean \
            research/STABLE_FAR_LOG_FREQUENCY_DIAGONALIZATION.lean

      - name: Emit Perron returned-fibre interface olean
        run: |
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.STABLE_FAR_PERRON_RETURNED_FIBER_INTERFACE.olean \
            research/STABLE_FAR_PERRON_RETURNED_FIBER_INTERFACE.lean

      - name: Emit critical q2 multiplier olean
        run: |
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.STABLE_FAR_CRITICAL_Q2_ENERGY_MULTIPLIER.olean \
            research/STABLE_FAR_CRITICAL_Q2_ENERGY_MULTIPLIER.lean

      - name: Kernel-check Perron quarter-frame theorem
        run: lake env lean -DwarningAsError=true research/STABLE_FAR_PERRON_QUARTER_FRAME_BOUND.lean

      - name: Kernel-check Basel-style frame sharpening
        run: lake env lean -DwarningAsError=true research/STABLE_FAR_PERRON_BASEL_FRAME_SHARPENING.lean

      - name: Emit zero-target partial-moment covariance olean
        run: |
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.ZERO_TARGET_PARTIAL_MOMENT_COVARIANCE.olean \
            research/ZERO_TARGET_PARTIAL_MOMENT_COVARIANCE.lean

      - name: Kernel-check zero-target covariance owner descent
        run: lake env lean -DwarningAsError=true research/ZERO_TARGET_COVARIANCE_OWNER_DESCENT.lean

      - name: Kernel-check Basel covariance contraction
        run: lake env lean -DwarningAsError=true research/COVARIANCE_RECIPROCAL_OWNER_BASEL_CONTRACTION.lean

      - name: Kernel-check final Stokes zero-target covariance bridge
        run: lake env lean -DwarningAsError=true research/GLOBAL_RETURNED_CORE_STOKES_ZERO_TARGET_COVARIANCE.lean
