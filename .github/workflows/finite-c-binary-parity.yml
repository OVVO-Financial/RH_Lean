name: Finite-C binary parity obstruction

on:
  pull_request:
    paths:
      - 'research/FINITE_C_BINARY_PARITY_OBSTRUCTION_20261102.lean'
      - '.github/workflows/finite-c-binary-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finite-c-binary-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  finite-c-binary-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Pinned Lean and Mathlib
        uses: ./.github/actions/lean-setup
      - name: Restore PNT+ build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Prebuild PNT+ StrongPNT
        run: lake build PrimeNumberTheoremAnd.StrongPNT
      - name: Restore native library cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      - name: Warning-fatal source-addressed proof closure
        run: |
          python3 scripts/compile_research_import_closure.py --build-library \
            research/FINITE_C_BINARY_PARITY_OBSTRUCTION_20261102.lean
      - name: Exact signatures and standard logical axioms
        run: |
          set -o pipefail
          cat > /tmp/finite_c_binary_parity_audit.lean <<'EOF'
          import «research.FINITE_C_BINARY_PARITY_OBSTRUCTION_20261102»
          #check RHLean.Proof.eulerSelfDualBilinear_eq_sum_paritySectors
          #check RHLean.Proof.eulerSelfDualParitySector_five_odd_odd
          #check RHLean.Proof.eulerSelfDualBilinear_five
          #check RHLean.Proof.no_uniform_oddOdd_control_by_eulerSelfDualBilinear
          #print axioms RHLean.Proof.eulerSelfDualBilinear_eq_sum_paritySectors
          #print axioms RHLean.Proof.eulerSelfDualParitySector_five_odd_odd
          #print axioms RHLean.Proof.eulerSelfDualBilinear_five
          #print axioms RHLean.Proof.no_uniform_oddOdd_control_by_eulerSelfDualBilinear
          EOF
          lake env lean -DwarningAsError=true /tmp/finite_c_binary_parity_audit.lean | tee /tmp/finite_c_binary_parity_audit.log
          python3 - <<'PY'
          import pathlib,re
          log=pathlib.Path('/tmp/finite_c_binary_parity_audit.log').read_text()
          assert 'sorryAx' not in log
          found=re.findall(r'depends on axioms:\s*\[([^]]*)\]',log,re.S)
          assert found
          for item in found:
              used={a.strip() for a in item.split(',') if a.strip()}
              assert used <= {'propext','Classical.choice','Quot.sound'},used
          text=pathlib.Path('research/FINITE_C_BINARY_PARITY_OBSTRUCTION_20261102.lean').read_text()
          text=re.sub(r'/-.*?-/', '',text,flags=re.S)
          text=re.sub(r'--.*','',text)
          assert not re.search(r'\b(sorry|admit|axiom|native_decide)\b',text)
          print('PASS: complete parity reassembly, exact witness, and standard logical axioms only')
          PY
