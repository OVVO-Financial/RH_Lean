name: Canonical covariance patch

on:
  pull_request:
  push:
    branches: [agent/canonical-centered-covariance]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Audit
        run: bash scripts/audit_assumptions.sh
      - name: Build and retain log
        id: build
        shell: bash
        run: |
          set +e
          lake build RHLean --wfail > covariance-build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-covariance-compiler-log
          path: covariance-build.log
      - name: Fail if build failed
        if: steps.build.outputs.status != '0'
        run: exit 1
