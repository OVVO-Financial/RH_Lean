name: Euler prime-ray source admission

on:
  pull_request:
    paths:
      - 'research/EULER_PRIME_RAY_SOURCE_ADMISSION_20261031.lean'
      - '.github/workflows/euler-prime-ray-source-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: euler-prime-ray-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prime-ray-source-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Pinned Lean and Mathlib
        uses: ./.github/actions/lean-setup
      - name: Restore PNT+ build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Prebuild PNT+ StrongPNT
        run: lake build PrimeNumberTheoremAnd.StrongPNT
      - name: Restore native library cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      - name: Warning-fatal source-addressed proof closure
        run: |
          python3 scripts/compile_research_import_closure.py --build-library \
            research/EULER_PRIME_RAY_SOURCE_ADMISSION_20261031.lean
      - name: Exact signature and standard logical axioms
        run: |
          set -o pipefail
          cat > /tmp/euler_prime_ray_source_audit.lean <<'EOF'
          import «research.EULER_PRIME_RAY_SOURCE_ADMISSION_20261031»
          #check RHLean.Proof.eulerPrimeRay_row_admitted_and_weight
          #print axioms RHLean.Proof.eulerPrimeRay_row_admitted_and_weight
          EOF
          lake env lean -DwarningAsError=true /tmp/euler_prime_ray_source_audit.lean | tee /tmp/euler_prime_ray_source_audit.log
          python3 - <<'PY'
          import pathlib,re
          log=pathlib.Path('/tmp/euler_prime_ray_source_audit.log').read_text()
          assert 'sorryAx' not in log
          found=re.findall(r'depends on axioms:\\s*\\[([^]]*)\\]',log,re.S)
          assert found
          for item in found:
              used={a.strip() for a in item.split(',') if a.strip()}
              assert used <= {'propext','Classical.choice','Quot.sound'},used
          text=pathlib.Path('research/EULER_PRIME_RAY_SOURCE_ADMISSION_20261031.lean').read_text()
          text=re.sub(r'/-.*?-/', '',text,flags=re.S)
          text=re.sub(r'--.*','',text)
          assert not re.search(r'\\b(sorry|admit|axiom|native_decide)\\b',text)
          print('PASS: exact prime-ray carrier, weight, and standard logical axioms only')
          PY
