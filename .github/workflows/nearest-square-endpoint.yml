name: Nearest-square q2 endpoint check

on:
  pull_request:
    branches: [main]
    paths:
      - research/LOW_OWNER_Q2_NEAREST_SQUARE_ENDPOINT.lean
      - research/LOW_OWNER_Q2_ENDPOINT_FREQUENCY_DISTANCE.lean
      - research/LOW_OWNER_Q2_ENDPOINT_ARC_FUBINI.lean
      - research/LOW_OWNER_Q2_NEAREST_SQUARE_WHEEL_SHELL.lean
      - research/LOW_OWNER_Q2_NEAREST_SQUARE_ENDPOINT_ENERGY.lean
      - .github/workflows/nearest-square-endpoint.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Restore PNT+ build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Prebuild PNT+ StrongPNT dependency
        run: lake build PrimeNumberTheoremAnd.StrongPNT
      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      - name: Build RHLean modules imported by these research checks
        run: >-
          python3 scripts/compile_research_import_closure.py --library-only
          research/CANONICAL_ROUGH_GLOBAL_BOUNDS.lean
          research/CANONICAL_ROUGH_Q2_TAIL_REDUCTION.lean
          research/COVARIANCE_RECIPROCAL_OWNER_CONGESTION.lean
          research/LOW_OWNER_AMPLITUDE_MELLIN_LEDGER_SPLICE.lean
          research/LOW_OWNER_CHILD_FAR_NORMAL_FORM.lean
          research/LOW_OWNER_HIGH_Q2_SCALAR_CANCELLATION.lean
          research/LOW_OWNER_PHYSICAL_AMPLITUDE_TRANSPORT.lean
          research/LOW_OWNER_PHYSICAL_CENSUS_CORRELATION.lean
          research/LOW_OWNER_Q2_ENDPOINT_ARC_FUBINI.lean
          research/LOW_OWNER_Q2_ENDPOINT_FREQUENCY_DISTANCE.lean
          research/LOW_OWNER_Q2_NEAREST_SQUARE_ENDPOINT.lean
          research/LOW_OWNER_Q2_NEAREST_SQUARE_ENDPOINT_ENERGY.lean
          research/LOW_OWNER_Q2_NEAREST_SQUARE_WHEEL_SHELL.lean
          research/STABLE_FAR_CRITICAL_Q2_ENERGY_MULTIPLIER.lean
          research/STABLE_FAR_LOG_FREQUENCY_DIAGONALIZATION.lean
          research/STABLE_FAR_PERRON_QUARTER_FRAME_BOUND.lean
          research/STABLE_FAR_PERRON_RETURNED_FIBER_INTERFACE.lean
          research/STABLE_FAR_RECIPROCAL_OWNER_FUBINI.lean
          research/STABLE_FAR_RETURNED_FIBER_FUBINI.lean
          research/STABLE_FAR_RETURNED_FIBER_PRODUCTION.lean
          research/STABLE_FAR_RETURNED_RECIPROCAL_FROZEN_WINDOW.lean
      - name: Emit reciprocal-column foundation
        run: |
          mkdir -p .lake/build/lib/lean
          emit() { f="$1"; b="$(basename "$f" .lean)"; lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/research.${b}.olean" "$f"; }
          emit research/STABLE_FAR_RETURNED_FIBER_PRODUCTION.lean
          emit research/STABLE_FAR_RETURNED_FIBER_FUBINI.lean
          emit research/STABLE_FAR_RECIPROCAL_OWNER_FUBINI.lean
          emit research/STABLE_FAR_RETURNED_RECIPROCAL_FROZEN_WINDOW.lean
          emit research/CANONICAL_ROUGH_GLOBAL_BOUNDS.lean
          emit research/CANONICAL_ROUGH_Q2_TAIL_REDUCTION.lean
          emit research/LOW_OWNER_HIGH_Q2_SCALAR_CANCELLATION.lean
          emit research/LOW_OWNER_CHILD_FAR_NORMAL_FORM.lean
          emit research/LOW_OWNER_PHYSICAL_CENSUS_CORRELATION.lean
          emit research/STABLE_FAR_LOG_FREQUENCY_DIAGONALIZATION.lean
          emit research/STABLE_FAR_PERRON_RETURNED_FIBER_INTERFACE.lean
          emit research/STABLE_FAR_CRITICAL_Q2_ENERGY_MULTIPLIER.lean
          emit research/STABLE_FAR_PERRON_QUARTER_FRAME_BOUND.lean
          emit research/LOW_OWNER_PHYSICAL_AMPLITUDE_TRANSPORT.lean
          emit research/COVARIANCE_RECIPROCAL_OWNER_CONGESTION.lean
          emit research/LOW_OWNER_AMPLITUDE_MELLIN_LEDGER_SPLICE.lean
      - name: Check nearest-square endpoint reduction
        run: lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.LOW_OWNER_Q2_NEAREST_SQUARE_ENDPOINT.olean research/LOW_OWNER_Q2_NEAREST_SQUARE_ENDPOINT.lean
      - name: Check endpoint frequency-distance reduction
        run: lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.LOW_OWNER_Q2_ENDPOINT_FREQUENCY_DISTANCE.olean research/LOW_OWNER_Q2_ENDPOINT_FREQUENCY_DISTANCE.lean
      - name: Check endpoint arc Fubini
        run: lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.LOW_OWNER_Q2_ENDPOINT_ARC_FUBINI.olean research/LOW_OWNER_Q2_ENDPOINT_ARC_FUBINI.lean
      - name: Check physical nearest-square wheel shell
        run: lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.LOW_OWNER_Q2_NEAREST_SQUARE_WHEEL_SHELL.olean research/LOW_OWNER_Q2_NEAREST_SQUARE_WHEEL_SHELL.lean
      - name: Check nearest-square endpoint energy consumer
        run: lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.LOW_OWNER_Q2_NEAREST_SQUARE_ENDPOINT_ENERGY.olean research/LOW_OWNER_Q2_NEAREST_SQUARE_ENDPOINT_ENERGY.lean
