name: Repeated terminal high-prime synthesis

on:
  push:
    branches: [agent/repeated-terminal-high-prime-synthesis]
    paths:
      - RHLean.lean
      - RHLean/Proof/LowWheelCanonicalRepeatedTerminalHighPrimeBridge.lean
      - RHLean/Proof/LowWheelExternalTerminalFaceLedger.lean
      - RHLean/Proof/LowWheelExternalTerminalParentSplit.lean
      - RHLean/Proof/LowWheelExternalTerminalEightRootBound.lean
      - .github/workflows/repeated-terminal-high-prime-synthesis.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repeated-terminal-high-prime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Apply StrongPNT compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py

      - uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Prebuild StrongPNT dependency
        run: lake build StrongPNT.PNT5_Strong

      - uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Build quantitative closure
        run: |
          lake build RHLean.Proof.LowWheelCanonicalRepeatedTerminalHighPrimeBridge
          lake build RHLean.Proof.LowWheelExternalTerminalFaceLedger
          lake build RHLean.Proof.LowWheelExternalTerminalParentSplit
          lake build RHLean.Proof.LowWheelExternalTerminalEightRootBound

      - name: Refresh canonical root manifest
        run: lake exe mk_all || test $? -eq 1

      - name: Build root manifest
        run: lake build RHLean

      - name: Commit canonical root manifest
        run: |
          if ! git diff --quiet -- RHLean.lean; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add RHLean.lean
            git commit -m "Export external terminal eight-root closure"
            git push
          fi
