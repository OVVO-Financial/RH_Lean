name: Li model discretization

on:
  pull_request:
    branches: [main]
    paths:
      - research/LI_MODEL_DISCRETIZATION.lean
      - FORMALIZATION_SEQUENCE.md
      - FORMALIZATION_CHECKLIST.md
      - .github/workflows/li-model-discretization.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify append-only formalization records
        run: |
          grep -F '## Li-model discretization and discrepancy identity (2026-09-29)' FORMALIZATION_SEQUENCE.md
          grep -F '## Li-model discretization and discrepancy identity (2026-09-29)' FORMALIZATION_CHECKLIST.md
          git rev-parse HEAD
      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Apply StrongPNT 4.24 compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py
      - name: Restore StrongPNT port build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-
            rhlean-build-${{ runner.os }}-
      - name: Audit repository assumptions
        run: bash scripts/audit_assumptions.sh
      - name: Build exact dependencies
        run: |
          lake build RHLean.Analysis.SquareRootMatchedTransport
          lake build RHLean.Analysis.SquareRootTransportRealization
          lake build RHLean.Analysis.PrimeSieveLipschitzExcursion
          lake build RHLean.Analysis.CanonicalLowOccupancy
      - name: Kernel-check Li model discretization
        run: |
          mkdir -p .lake/build/lib/lean
          set -o pipefail
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.LI_MODEL_DISCRETIZATION.olean research/LI_MODEL_DISCRETIZATION.lean 2>&1 | tee li-model-discretization.log
      - name: Audit named theorem axioms
        run: |
          cat > /tmp/LiModelAxioms.lean <<'LEAN'
          import «research.LI_MODEL_DISCRETIZATION»
          #print axioms RHLean.Proof.liHybridModel_sub_continuous
          #print axioms RHLean.Proof.norm_squareRootTransportRoundingWeight_le
          #print axioms RHLean.Proof.norm_squareRootTransportFloorCorrection_le
          #print axioms RHLean.Proof.norm_liHybridModel_sub_continuous_le
          #print axioms RHLean.Proof.squareRootTransportDiscretePNTMain_eq_oddPaired
          #print axioms RHLean.Proof.norm_liHybridGridModel_sub_liHybridModel_le_card
          #print axioms RHLean.Proof.norm_liHybridGridModel_sub_liHybridModel_le
          #print axioms RHLean.Proof.norm_liHybridGridModel_sub_continuous_le
          #print axioms RHLean.Proof.liHybridModel_eq_mertens_add_pntError
          #print axioms RHLean.Proof.liHybridModel_eq_mertens_add_primeCountDiscrepancy
          LEAN
          set -o pipefail
          lake env lean -DwarningAsError=true /tmp/LiModelAxioms.lean 2>&1 | tee li-model-discretization-axioms.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          s = Path('li-model-discretization-axioms.log').read_text()
          records = re.findall(r"depends on axioms:\s*\[([^\]]*)\]", s, re.S)
          assert len(records) == 10, records
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for record in records:
              actual = {a.strip() for a in record.split(',') if a.strip()}
              assert actual <= allowed, actual
          PY
      - name: Retain compiler and axiom logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: li-model-discretization-logs
          path: li-model-discretization*.log
          if-no-files-found: ignore
