name: Fix square residual q2 local proof

on:
  push:
    branches:
      - agent/square-residual-q2-reindex

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/square-residual-q2-reindex
      - name: Apply exact local repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('RHLean/Proof/LowWheelFrozenSquareResidualQ2Reindex.lean')
          s = p.read_text()
          old = '''  have hq2 : q * q * canonicalCofactor c ≤ B := by
    calc
      q * q * canonicalCofactor c = q * c := by rw [← hfactor]; ring
      _ = canonicalLargestPrimeFactor c * c := by rw [howner]
      _ ≤ B := hcontact
'''
          new = '''  have hq2 : q * q * canonicalCofactor c ≤ B := by
    have hqmul : q * (q * canonicalCofactor c) = q * c :=
      congrArg (fun n : ℕ => q * n) hfactor
    calc
      q * q * canonicalCofactor c = q * (q * canonicalCofactor c) := by ring
      _ = q * c := hqmul
      _ = canonicalLargestPrimeFactor c * c := by rw [howner]
      _ ≤ B := hcontact
'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''  have hdPos : 1 ≤ canonicalCofactor c :=
    canonicalCofactor_pos (by
      have hres := (mem_lowWheelFrozenSourceSquareResidualOwnerFiber.mp hc).1
      have hrough := (Finset.mem_filter.mp hres).1
      have hIcc := (Finset.mem_filter.mp hrough).1
      omega)
'''
          new = '''  have hcgt : 1 < c := by
    have hres := (mem_lowWheelFrozenSourceSquareResidualOwnerFiber.mp hc).1
    have hrough := (Finset.mem_filter.mp hres).1
    have hIcc := (Finset.mem_filter.mp hrough).1
    have hbounds := Finset.mem_Icc.mp hIcc
    omega
  have hdPos : 1 ≤ canonicalCofactor c := canonicalCofactor_pos hcgt
'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RHLean/Proof/LowWheelFrozenSquareResidualQ2Reindex.lean
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair local square residual q2 proof'
          git push origin HEAD:agent/square-residual-q2-reindex
