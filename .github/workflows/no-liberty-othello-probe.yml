name: No-liberty Othello probe

on:
  push:
    branches: [agent/processed-seat-no-liberty-othello]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: no-liberty-othello-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
      - name: Kernel-check processed-seat no-liberty Othello
        run: lake build RHLean.Proof.SquareRootLowPrimeOppositeFixedClassification
      - name: Kernel-check finite equivalence interface
        run: lake build RHLean.Proof.SquareRootLowPrimeNoLibertyFiniteEquiv
      - name: Smoke-test no-liberty interface
        run: lake env lean ScratchNoLibertyOthello.lean
