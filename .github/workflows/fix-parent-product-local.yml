name: Fix parent product local arithmetic

on:
  push:
    branches:
      - agent/q2-parent-product-reassembly

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/q2-parent-product-reassembly
      - name: Patch local Lean arithmetic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('RHLean/Proof/LowWheelFrozenSquareResidualParentProduct.lean')
          s = p.read_text()
          s = s.replace(
          '''  have hzDeath : R < orderedEulerCutDeathRoot z := by
    change R < p * primeFaceProduct y.1
    have hroot := lowWheelFrozenSourceScale_root_lt hA
    simpa [p, lowWheelFrozenSecondContactSourceScale, hyA] using hroot
''',
          '''  have hzDeath : R < orderedEulerCutDeathRoot z := by
    change R < p * primeFaceProduct y.1
    have hroot := lowWheelFrozenSourceScale_root_lt hA
    have hbase : p * primeFaceProduct y.1 = A := by
      simpa [p, lowWheelFrozenSecondContactSourceScale] using hyA
    rw [hbase]
    exact hroot
''')
          s = s.replace(
          '''  rcases Finset.mem_filter.mp hd with ⟨hdIcc, _hdSq, _hdRough, _hdLt⟩
  have hdUpper := (Finset.mem_Icc.mp hdIcc).2
''',
          '''  rcases Finset.mem_filter.mp hd with ⟨hdIcc, _hdSq, _hdRough, hdLt⟩
  have hdUpper := (Finset.mem_Icc.mp hdIcc).2
''', 1)
          s = s.replace(
          '''  have hq2d : q * q * d ≤ squareRootEndpoint R / A := by
    by_cases hqq : 0 < q * q
    · exact (Nat.le_div_iff_mul_le hqq).1 hdUpper
    · have hq0 : q = 0 := by omega
      simp [hq0]
''',
          '''  have hqPos : 0 < q := by omega
  have hqqPos : 0 < q * q := Nat.mul_pos hqPos hqPos
  have hq2d : q * q * d ≤ squareRootEndpoint R / A := by
    have h := (Nat.le_div_iff_mul_le hqqPos).1 hdUpper
    simpa [Nat.mul_assoc, Nat.mul_left_comm, Nat.mul_comm] using h
''')
          p.write_text(s)
          Path('.github/workflows/fix-parent-product-local.yml').unlink()
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RHLean/Proof/LowWheelFrozenSquareResidualParentProduct.lean .github/workflows/fix-parent-product-local.yml
          git commit -m 'Fix parent product local arithmetic rewrites'
          git push origin HEAD:agent/q2-parent-product-reassembly
