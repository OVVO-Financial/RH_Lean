name: Fix parent product local arithmetic

on:
  push:
    branches:
      - agent/q2-parent-product-reassembly

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/q2-parent-product-reassembly
      - name: Patch Lean source
        run: |
          python3 -c "from pathlib import Path; p=Path('RHLean/Proof/LowWheelFrozenSquareResidualParentProduct.lean'); s=p.read_text(); s=s.replace('  have hzDeath : R < orderedEulerCutDeathRoot z := by\\n    change R < p * primeFaceProduct y.1\\n    have hroot := lowWheelFrozenSourceScale_root_lt hA\\n    simpa [p, lowWheelFrozenSecondContactSourceScale, hyA] using hroot\\n','  have hzDeath : R < orderedEulerCutDeathRoot z := by\\n    change R < p * primeFaceProduct y.1\\n    have hroot := lowWheelFrozenSourceScale_root_lt hA\\n    have hbase : p * primeFaceProduct y.1 = A := by\\n      simpa [p, lowWheelFrozenSecondContactSourceScale] using hyA\\n    rw [hbase]\\n    exact hroot\\n'); s=s.replace('  rcases Finset.mem_filter.mp hd with ⟨hdIcc, _hdSq, _hdRough, _hdLt⟩\\n  have hdUpper := (Finset.mem_Icc.mp hdIcc).2\\n','  rcases Finset.mem_filter.mp hd with ⟨hdIcc, _hdSq, _hdRough, hdLt⟩\\n  have hdUpper := (Finset.mem_Icc.mp hdIcc).2\\n',1); s=s.replace('  have hq2d : q * q * d ≤ squareRootEndpoint R / A := by\\n    by_cases hqq : 0 < q * q\\n    · exact (Nat.le_div_iff_mul_le hqq).1 hdUpper\\n    · have hq0 : q = 0 := by omega\\n      simp [hq0]\\n','  have hqPos : 0 < q := by omega\\n  have hqqPos : 0 < q * q := Nat.mul_pos hqPos hqPos\\n  have hq2d : q * q * d ≤ squareRootEndpoint R / A := by\\n    have h := (Nat.le_div_iff_mul_le hqqPos).1 hdUpper\\n    simpa [Nat.mul_assoc, Nat.mul_left_comm, Nat.mul_comm] using h\\n'); p.write_text(s)"
          rm .github/workflows/fix-parent-product-local.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RHLean/Proof/LowWheelFrozenSquareResidualParentProduct.lean .github/workflows/fix-parent-product-local.yml
          git commit -m 'Fix parent product local arithmetic rewrites'
          git push origin HEAD:agent/q2-parent-product-reassembly
