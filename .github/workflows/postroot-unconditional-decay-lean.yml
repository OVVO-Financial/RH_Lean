name: Post-root unconditional decay check

on:
  push:
    branches: [claude/wizardly-mayer-lwd8bb]
    paths:
      - RHLean/Proof/PostRootCovarianceUnconditionalDecayScratch.lean
      - .github/workflows/postroot-unconditional-decay-lean.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: postroot-unconditional-decay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Restore PNT+ build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Prebuild PNT+ StrongPNT dependency
        run: lake build PrimeNumberTheoremAnd.StrongPNT
      - name: Kernel-check unconditional decay and wheel continuation
        shell: bash
        run: |
          set -o pipefail
          lake build RHLean.Proof.PostRootCovarianceUnconditionalDecayScratch --wfail \
            2>&1 | tee postroot-unconditional-decay.log
      - name: Print logs
        if: ${{ always() }}
        run: |
          cat postroot-unconditional-decay.log || true
