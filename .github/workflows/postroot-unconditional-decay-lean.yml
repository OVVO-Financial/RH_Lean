name: Post-root unconditional decay check

on:
  push:
    branches: [claude/wizardly-mayer-lwd8bb]
    paths:
      - RHLean/Proof/PostRootCovarianceUnconditionalDecayScratch.lean
      - RHLean/Proof/PostRootCovarianceNormalizedDecay.lean
      - .github/workflows/postroot-unconditional-decay-lean.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: postroot-unconditional-decay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Apply StrongPNT compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py
      - name: Restore StrongPNT port build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Prebuild StrongPNT dependency
        run: lake build StrongPNT.PNT5_Strong
      - name: Kernel-check unconditional decay scratch
        shell: bash
        run: |
          set -o pipefail
          lake build RHLean.Proof.PostRootCovarianceUnconditionalDecayScratch --wfail \
            2>&1 | tee postroot-unconditional-decay.log
      - name: Kernel-check normalized decay
        shell: bash
        run: |
          set -o pipefail
          lake build RHLean.Proof.PostRootCovarianceNormalizedDecay --wfail \
            2>&1 | tee postroot-normalized-decay.log
      - name: Print logs
        if: ${{ always() }}
        run: |
          cat postroot-unconditional-decay.log || true
          cat postroot-normalized-decay.log || true
