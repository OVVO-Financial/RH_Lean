name: Four-prime fixed square-block physical drift

on:
  pull_request:
    branches: [main]
    paths:
      - research/FOUR_PRIME_FIXED_SQUARE_BLOCK_PHYSICAL_DRIFT_20261108.lean
      - research/FOUR_PRIME_FIXED_SQUARE_BLOCK_PHYSICAL_DRIFT_20261108.md
      - research/FOUR_PRIME_SUBWHEEL_LOG_DIFFERENCES_20261108.lean
      - research/FROZEN_ROOT_PRIME_TWO_HIGH_HIGH_THREE_FLOOR_20261108.lean
      - scripts/four_prime_subwheel_comparison.py
      - scripts/frozen_root_two_coordinate_census.cpp
      - scripts/four_prime_fixed_squareblock_certificate.py
      - .github/workflows/four-prime-fixed-squareblock-drift.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: four-prime-fixed-squareblock-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  original-four-prime-source-and-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reject proof holes and new axioms
        run: |
          if grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' \
            research/FOUR_PRIME_FIXED_SQUARE_BLOCK_PHYSICAL_DRIFT_20261108.lean \
            research/FOUR_PRIME_SUBWHEEL_LOG_DIFFERENCES_20261108.lean \
            research/FROZEN_ROOT_PRIME_TWO_HIGH_HIGH_THREE_FLOOR_20261108.lean; then
            exit 1
          fi
      - name: Verify independent exact CRT and true-Mobius tests
        run: |
          python3 scripts/four_prime_fixed_squareblock_certificate.py
          python3 scripts/four_prime_subwheel_comparison.py
      - name: Verify the exact frozen sqrt-only two-coordinate endpoint reconstructions
        run: |
          g++ -O3 -std=c++17 scripts/frozen_root_two_coordinate_census.cpp -o /tmp/frozen_root_two
          /tmp/frozen_root_two
      - name: Install pinned Lean and Mathlib
        uses: ./.github/actions/lean-setup
      - name: Warning-fatal compile of original finite source
        run: >-
          python3 scripts/compile_research_import_closure.py --build-library
          research/FOUR_PRIME_FIXED_SQUARE_BLOCK_PHYSICAL_DRIFT_20261108.lean
          research/FOUR_PRIME_SUBWHEEL_LOG_DIFFERENCES_20261108.lean
          research/FROZEN_ROOT_PRIME_TWO_HIGH_HIGH_THREE_FLOOR_20261108.lean
      - name: Verify exact theorem signatures and axiom closure
        run: |
          cat >/tmp/four_prime_fixed_squareblock_acceptance.lean <<'LEAN'
          import «research.FOUR_PRIME_FIXED_SQUARE_BLOCK_PHYSICAL_DRIFT_20261108»
          import «research.FOUR_PRIME_SUBWHEEL_LOG_DIFFERENCES_20261108»
          import «research.FROZEN_ROOT_PRIME_TWO_HIGH_HIGH_THREE_FLOOR_20261108»
          #check RHLean.Arithmetic.fourPrimeSquarekillSign_add_period
          #check RHLean.Arithmetic.fourPrimeSquarekill_completePeriod
          #check RHLean.Arithmetic.fourPrimeReciprocalLinearFactor
          #check RHLean.Arithmetic.fourPrimeSquarekill_squareBlock_at_periodRoot
          #check RHLean.Arithmetic.fourPrimeSquarekill_squareBlock_at_periodRoot_pos
          #print axioms RHLean.Arithmetic.fourPrimeSquarekill_completePeriod
          #print axioms RHLean.Arithmetic.fourPrimeSquarekill_squareBlock_at_periodRoot
          #print axioms RHLean.Arithmetic.fourPrimeSquarekill_squareBlock_at_periodRoot_pos
          #check RHLean.Arithmetic.twoPrimeSquarekill_periodMass
          #check RHLean.Arithmetic.sixPrimeSquarekill_periodMass
          #check RHLean.Arithmetic.thirtyPrimeSquarekill_periodMass
          #check RHLean.Proof.frozenOddHigh_floor_bounds
          #check RHLean.Proof.frozenOddHigh_floor_three
          #check RHLean.Proof.frozenOddHighHigh_eq_square_add_two_masks
          #print axioms RHLean.Proof.frozenOddHighHigh_eq_square_add_two_masks
          #check RHLean.Arithmetic.fourPrime_logCubic_zero
          #check RHLean.Arithmetic.fourPrime_logQuartic_leading
          #print axioms RHLean.Arithmetic.fourPrime_logCubic_zero
          #print axioms RHLean.Arithmetic.fourPrime_logQuartic_leading
          LEAN
          lake env lean -DwarningAsError=true /tmp/four_prime_fixed_squareblock_acceptance.lean
