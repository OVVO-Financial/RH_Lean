name: VF first-bad terminal consumer

on:
  pull_request:
    branches: [vf-first-bad-source-sector-six-inlet]
    paths:
      - research/VF_MID_FIRST_BAD_FINISH_LINE.lean
      - .github/workflows/vf-first-bad-terminal-consumer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Apply StrongPNT compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py
      - name: Restore StrongPNT port build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Prebuild StrongPNT dependency
        run: lake build StrongPNT.PNT5_Strong
      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-
            rhlean-build-${{ runner.os }}-
      - name: Compile terminal consumer
        run: |
          python3 scripts/compile_research_import_closure.py research/VF_MID_FIRST_BAD_FINISH_LINE.lean
          cat > /tmp/VF_MID_FIRST_BAD_FINISH_LINE_ACCEPTANCE.lean <<'EOF'
          import «research.VF_MID_FIRST_BAD_FINISH_LINE»
          #check RHLean.Analysis.vfMidActualPrimeFirstBadAt_two_succ_closed_of_sourceToSectorSixInlet
          #print axioms RHLean.Analysis.vfMidActualPrimeFirstBadAt_two_succ_closed_of_sourceToSectorSixInlet
          EOF
          lake env lean -DwarningAsError=true /tmp/VF_MID_FIRST_BAD_FINISH_LINE_ACCEPTANCE.lean
