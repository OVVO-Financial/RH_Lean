name: Canonical downcross parent-fiber check

on:
  push:
    branches: [agent/canonical-downcross-parent-fibers]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: canonical-downcross-parent-fibers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Import parent-fiber module in root manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("RHLean.lean")
          target = "import RHLean.Proof.LowWheelCanonicalDowncrossParentFibers"
          lines = [line.strip() for line in manifest.read_text().splitlines() if line.strip()]
          if target not in lines:
              lines.append(target)
              manifest.write_text("\n".join(sorted(lines)) + "\n")
          PY
          if ! git diff --quiet -- RHLean.lean; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add RHLean.lean
            git commit -m "Import canonical downcross parent-fiber module"
            git push
          fi

      - name: Check Lean root import manifest
        run: python3 scripts/check_root_manifest.py

      - name: Audit unfinished proofs and axioms
        run: bash scripts/audit_assumptions.sh

      - uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Apply StrongPNT compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py

      - uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-

      - name: Prebuild StrongPNT dependency
        run: lake build StrongPNT.PNT5_Strong

      - uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-downcross-parent-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/Proof/LowWheelCanonicalDowncrossParentFibers.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Build canonical downcross parent fibers
        run: lake build RHLean.Proof.LowWheelCanonicalDowncrossParentFibers
