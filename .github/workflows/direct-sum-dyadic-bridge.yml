name: Direct-sum dyadic deterministic bridge check

on:
  pull_request:
    branches: [main]
    paths:
      - research/DIRECT_SUM_DYADIC_DISPERSION_BRIDGE.lean
      - research/DIRECT_SUM_LOW_FRESHNESS_ABEL.lean
      - research/DIRECT_SUM_COUPLED_PACKET.lean
      - research/DIRECT_SUM_COUPLED_FRESH_PRIME_RANGE_EXIT.lean
      - research/DIRECT_SUM_COUPLED_RANGE_EXIT_COLLAPSE.lean
      - research/DIRECT_SUM_FRESH_PRIME_GLOBAL_COLLAPSE.lean
      - research/DIRECT_SUM_FRESH_PRIME_STOKES_PRE_SQUARE.lean
      - research/CANONICAL_DESCENDING_PRIME_CHRONOLOGY.lean
      - research/CORRELATION_FOUR_TERMINAL_BRIDGE.lean
      - .github/workflows/direct-sum-dyadic-bridge.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Apply StrongPNT 4.24 compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py

      - name: Restore StrongPNT port build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Prebuild StrongPNT dependency
        run: lake build StrongPNT.PNT5_Strong

      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Kernel-check direct-sum deterministic bridge and emit importable olean
        run: |
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.DIRECT_SUM_DYADIC_DISPERSION_BRIDGE.olean \
            research/DIRECT_SUM_DYADIC_DISPERSION_BRIDGE.lean

      - name: Kernel-check low freshness boundary-free Abel layer and emit importable olean
        run: |
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.DIRECT_SUM_LOW_FRESHNESS_ABEL.olean \
            research/DIRECT_SUM_LOW_FRESHNESS_ABEL.lean

      - name: Kernel-check coupled scalar packet layer and emit importable olean
        run: |
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.DIRECT_SUM_COUPLED_PACKET.olean \
            research/DIRECT_SUM_COUPLED_PACKET.lean

      - name: Kernel-check coupled fresh-prime range-exit layer and emit importable olean
        run: |
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.DIRECT_SUM_COUPLED_FRESH_PRIME_RANGE_EXIT.olean \
            research/DIRECT_SUM_COUPLED_FRESH_PRIME_RANGE_EXIT.lean

      - name: Kernel-check evolved range-exit collapse layer and emit importable olean
        run: |
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.DIRECT_SUM_COUPLED_RANGE_EXIT_COLLAPSE.olean \
            research/DIRECT_SUM_COUPLED_RANGE_EXIT_COLLAPSE.lean

      - name: Kernel-check global fresh-prime chronological collapse and emit importable olean
        run: |
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.DIRECT_SUM_FRESH_PRIME_GLOBAL_COLLAPSE.olean \
            research/DIRECT_SUM_FRESH_PRIME_GLOBAL_COLLAPSE.lean

      - name: Kernel-check fresh-prime Stokes pre-square layer and emit importable olean
        run: |
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.DIRECT_SUM_FRESH_PRIME_STOKES_PRE_SQUARE.olean \
            research/DIRECT_SUM_FRESH_PRIME_STOKES_PRE_SQUARE.lean

      - name: Kernel-check canonical descending prime chronology
        run: lake env lean -DwarningAsError=true research/CANONICAL_DESCENDING_PRIME_CHRONOLOGY.lean

      - name: Kernel-check CORR-4 terminal bridge
        run: lake env lean -DwarningAsError=true research/CORRELATION_FOUR_TERMINAL_BRIDGE.lean
