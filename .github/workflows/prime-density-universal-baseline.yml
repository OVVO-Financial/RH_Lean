name: Prime density universal baseline

on:
  pull_request:
    branches: [main]
    paths:
      - research/PRIME_DENSITY_UNIVERSAL_BASELINE.lean
      - research/PRIME_DENSITY_UNIVERSAL_BASELINE.md
      - .github/workflows/prime-density-universal-baseline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Restore PNT+ build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      - name: Audit repository assumptions
        run: bash scripts/audit_assumptions.sh
      - name: Build existing density-model dependencies
        run: lake build RHLean.Analysis.PrimeSievePNTCentering
      - name: Build RHLean modules imported by these research checks
        run: >-
          python3 scripts/compile_research_import_closure.py --library-only
          research/PRIME_DENSITY_UNIVERSAL_BASELINE.lean
      - name: Kernel-check universal density bounds
        run: |
          mkdir -p .lake/build/lib/lean
          set -o pipefail
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.PRIME_DENSITY_UNIVERSAL_BASELINE.olean research/PRIME_DENSITY_UNIVERSAL_BASELINE.lean 2>&1 | tee prime-density-compile.log
      - name: Audit baseline theorem axioms
        run: |
          cat > /tmp/PrimeDensityAxiomAudit.lean <<'LEAN'
          import «research.PRIME_DENSITY_UNIVERSAL_BASELINE»
          #print axioms RHLean.Analysis.primeSieveEqualDensityBulk_energy_le_sixteen
          #print axioms RHLean.Analysis.primeSievePNTBulk_energy_le_sixteen
          #print axioms RHLean.Analysis.primeSievePNTError_energy_le_twentyFive
          LEAN
          set -o pipefail
          lake env lean -DwarningAsError=true /tmp/PrimeDensityAxiomAudit.lean 2>&1 | tee prime-density-axioms.log
          if grep -E 'sorryAx|Lean.ofReduceBool' prime-density-axioms.log; then
            echo 'Unexpected axiom in density baseline'
            exit 1
          fi
      - name: Retain compiler and axiom logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prime-density-baseline-logs
          path: |
            prime-density-compile.log
            prime-density-axioms.log
          if-no-files-found: ignore
