name: Odd Mobius floor telescope

on:
  pull_request:
    paths:
      - 'research/ODD_MOBIUS_FLOOR_TELESCOPE_20261101.lean'
      - '.github/workflows/odd-mobius-floor-telescope.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: odd-mobius-floor-telescope-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  odd-mobius-floor-telescope:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Pinned Lean and Mathlib
        uses: ./.github/actions/lean-setup
      - name: Restore PNT+ build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Prebuild PNT+ StrongPNT
        run: lake build PrimeNumberTheoremAnd.StrongPNT
      - name: Restore native library cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      - name: Warning-fatal source-addressed proof closure
        run: |
          python3 scripts/compile_research_import_closure.py --build-library \
            research/ODD_MOBIUS_FLOOR_TELESCOPE_20261101.lean
      - name: Exact signatures and standard logical axioms
        run: |
          set -o pipefail
          cat > /tmp/odd_mobius_floor_audit.lean <<'EOF'
          import «research.ODD_MOBIUS_FLOOR_TELESCOPE_20261101»
          #check RHLean.Analysis.oddMoebiusFloorSum_eq_sum_oddDivisorMoebiusSum
          #check RHLean.Analysis.oddDivisorMoebiusSum_two_pow
          #print axioms RHLean.Analysis.oddMoebiusFloorSum_eq_sum_oddDivisorMoebiusSum
          #print axioms RHLean.Analysis.oddDivisorMoebiusSum_two_pow
          EOF
          lake env lean -DwarningAsError=true /tmp/odd_mobius_floor_audit.lean | tee /tmp/odd_mobius_floor_audit.log
          python3 - <<'PY'
          import pathlib,re
          log=pathlib.Path('/tmp/odd_mobius_floor_audit.log').read_text()
          assert 'sorryAx' not in log
          found=re.findall(r'depends on axioms:\s*\[([^]]*)\]',log,re.S)
          assert found
          for item in found:
              used={a.strip() for a in item.split(',') if a.strip()}
              assert used <= {'propext','Classical.choice','Quot.sound'},used
          text=pathlib.Path('research/ODD_MOBIUS_FLOOR_TELESCOPE_20261101.lean').read_text()
          text=re.sub(r'/-.*?-/', '',text,flags=re.S)
          text=re.sub(r'--.*','',text)
          assert not re.search(r'\b(sorry|admit|axiom|native_decide)\b',text)
          print('PASS: exact finite odd Mobius identities and standard logical axioms only')
          PY
