name: Native effective ideal resonance and compensated sextic Holder 4.34.1

on:
  pull_request:
    paths:
      - 'research/VF_919_OAI_EFFECTIVE_SEXTIC_VALUATION_CLASSIFICATION_20261022.lean'
      - 'research/VF_919_OAI_GROUPED_HOLDER_SIXTH_SOURCE_20261022.lean'
      - 'research/VF_919_OAI_NNS_PRINCIPAL_NONPRINCIPAL_CROSS_20261022.lean'
      - 'research/VF_919_OAI_COMPENSATED_TWO_BILL_L65_20261022.lean'
      - 'research/VF_919_OAI_NNS_POST_GROUPED_SEXTIC_DUAL_20261022.lean'
      - 'research/VF_919_OAI_PRINCIPAL_SOURCE_EXPONENT_BUDGET_20261022.lean'
      - 'research/VF_919_OAI_THREE_TIER_SIGNED_RATE_20261022.lean'
      - 'research/VF_919_OAI_CUBIC_FREE_ROW_FIBER_SIEVE_20261022.lean'
      - 'research/VF_919_RESONANT_FIBER_NNS_RECOMBINATION_20261022.lean'
      - 'research/VF_919_SEXTIC_SECTOR_MEAN_DEFECT_20261022.lean'
      - 'RHLean/**/*.lean'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - '.github/workflows/vf919-bounded-sextic-fibers-434.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-compensated-sixth-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  certified-native-sixth:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup pinned Lean 4.34.1 and Mathlib
        uses: ./.github/actions/lean-setup
      - name: Restore source-pinned native RHLean baseline from main
        uses: ./.github/actions/lean-compiled-cache
      - name: Kernel-compile native ideal classification and compensated sixth-moment Holder
        uses: ./.github/actions/research-compile
        with:
          build-library: 'true'
          targets: |
            research/VF_919_OAI_EFFECTIVE_SEXTIC_VALUATION_CLASSIFICATION_20261022.lean
            research/VF_919_OAI_GROUPED_HOLDER_SIXTH_SOURCE_20261022.lean
            research/VF_919_OAI_NNS_PRINCIPAL_NONPRINCIPAL_CROSS_20261022.lean
            research/VF_919_OAI_COMPENSATED_TWO_BILL_L65_20261022.lean
            research/VF_919_OAI_NNS_POST_GROUPED_SEXTIC_DUAL_20261022.lean
            research/VF_919_OAI_PRINCIPAL_SOURCE_EXPONENT_BUDGET_20261022.lean
            research/VF_919_OAI_THREE_TIER_SIGNED_RATE_20261022.lean
            research/VF_919_OAI_CUBIC_FREE_ROW_FIBER_SIEVE_20261022.lean
