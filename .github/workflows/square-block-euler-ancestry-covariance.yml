name: Fixed square-block Euler ancestry covariance Lean

on:
  pull_request:
    branches: [main]
    paths:
      - "research/SQUARE_BLOCK_EULER_ANCESTRY_COVARIANCE_20261017.lean"
      - "research/SQUARE_BLOCK_EULER_ANCESTRY_COVARIANCE_20261017.md"
      - "scripts/square_block_euler_ancestry_20261017.py"
      - "research/VF974_FIRST_BAD_BOUNDARY_DESCENT_OBSTRUCTION_20261018.lean"
      - "research/VF974_ORIGINAL_FIRSTBAD_GLOBAL_RESIDUAL_DOMINANCE_20261018.lean"
      - "research/VF974_FIRST_BAD_BOUNDARY_DESCENT_OBSTRUCTION_20261018.md"
      - "scripts/vf974_firstbad_boundary_probe_20261018.py"
      - ".github/workflows/square-block-euler-ancestry-covariance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify genuine Möbius pairs and fixed-wheel census
        run: |
          python3 scripts/square_block_euler_ancestry_20261017.py
          python3 scripts/vf974_firstbad_boundary_probe_20261018.py

  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Restore PNT+ build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Prebuild PNT+ StrongPNT and existing bridges
        run: |
          lake build PrimeNumberTheoremAnd.StrongPNT
      - name: Restore RHLean cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      - name: Build existing bridges
        run: |
          lake build RHLean.Proof.SquareBlockSmoothTransportGram
          lake build RHLean.Proof.CanonicalGapAncestryHighRealization
          lake build RHLean.Analysis.MathlibMertensHook
          lake build RHLean.Arithmetic.PrimeWheelMobiusRecovery
      - name: Build RHLean modules imported by these research checks
        run: >-
          python3 scripts/compile_research_import_closure.py --library-only
          research/SQUARE_BLOCK_EULER_ANCESTRY_COVARIANCE_20261017.lean
          research/VF974_FIRST_BAD_BOUNDARY_DESCENT_OBSTRUCTION_20261018.lean
          research/VF974_ORIGINAL_FIRSTBAD_GLOBAL_RESIDUAL_DOMINANCE_20261018.lean
      - name: Check new theorems with warnings fatal and inspect axioms
        run: |
          mkdir -p .lake/build/lib/lean
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.SQUARE_BLOCK_EULER_ANCESTRY_COVARIANCE_20261017.olean research/SQUARE_BLOCK_EULER_ANCESTRY_COVARIANCE_20261017.lean
      - name: Build the original first-bad and cofactor-obstruction Lean closure
        uses: ./.github/actions/research-compile
        with:
          targets: |
            research/VF974_ORIGINAL_FIRSTBAD_GLOBAL_RESIDUAL_DOMINANCE_20261018.lean
      - name: Inspect new named theorems and standard axioms
        run: |
          cat >/tmp/VF974_FIRSTBAD_AUDIT.lean <<'EOF'
          import «research.VF974_ORIGINAL_FIRSTBAD_GLOBAL_RESIDUAL_DOMINANCE_20261018»
          #print axioms RHLean.Analysis.vf974_root_lt_halfRunStart_square
          #print axioms RHLean.Analysis.vf974_highPrimeCofactor_lt_originalHalfRun
          #print axioms RHLean.Analysis.vf974_highPrimeCofactor_not_in_originalHistoricalBlock
          #print axioms RHLean.Analysis.vf974_oppositeMoebius_sameVFCharge_at_eighteen
          #print axioms RHLean.Analysis.vf974_firstBadExcess_eq_residual_add_twoUpper_sub_sixLower
          #print axioms RHLean.Analysis.vf974_firstBad_forces_positive_unmatched_boundary_pressure
          #print axioms RHLean.Analysis.vf974_halfGate_fails_of_anchor_dominates
          #print axioms RHLean.Analysis.vf974_anchoredModel_ge_history_minus_budget
          #print axioms RHLean.Analysis.vf974_globalResidual_eq_exactAnchorModel
          #print axioms RHLean.Analysis.vf974_firstBad_large_anchor_dominates_sevenBlockAbs
          #print axioms RHLean.Analysis.vf974_firstBad_large_forces_positive_globalResidual
          EOF
          lake env lean -DwarningAsError=true /tmp/VF974_FIRSTBAD_AUDIT.lean | tee /tmp/vf974-firstbad-axioms.log
          if grep -q 'sorryAx' /tmp/vf974-firstbad-axioms.log; then exit 1; fi
      - name: Reject admitted proofs
        run: |
          python3 - <<'PY'
          import pathlib,re
          for path in ['research/SQUARE_BLOCK_EULER_ANCESTRY_COVARIANCE_20261017.lean',
                       'research/VF974_FIRST_BAD_BOUNDARY_DESCENT_OBSTRUCTION_20261018.lean',
                       'research/VF974_ORIGINAL_FIRSTBAD_GLOBAL_RESIDUAL_DOMINANCE_20261018.lean']:
              s=pathlib.Path(path).read_text()
              assert not re.search(r'\b(sorry|admit|axiom)\b', re.sub(r'/\-.*?\-/', '', s, flags=re.S)), path
          print('PASS no sorry/admit/axiom in Lean source')
          PY
