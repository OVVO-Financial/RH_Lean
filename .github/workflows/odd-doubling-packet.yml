name: Native Euler odd-doubling packet Lean

on:
  pull_request:
    paths:
      - "research/EULER_ODD_DOUBLING_PACKET_20261030.lean"
      - ".github/workflows/odd-doubling-packet.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Lean and cached Mathlib
        uses: ./.github/actions/lean-setup
      - name: Restore PNT+ build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Prebuild PNT+ StrongPNT
        run: lake build PrimeNumberTheoremAnd.StrongPNT
      - name: Restore native library build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      - name: Compile exact research import closure with warnings fatal
        run: |
          python3 scripts/compile_research_import_closure.py --build-library \
            research/EULER_ODD_DOUBLING_PACKET_20261030.lean
      - name: Audit theorem axioms
        run: |
          cat > /tmp/odd_doubling_axioms.lean <<'EOF'
          import «research.EULER_ODD_DOUBLING_PACKET_20261030»
          #print axioms RHLean.Proof.mod_two_mul_eq_mod_or_mod_add
          #print axioms RHLean.Proof.oddDoublingPacket_eq_zero_or_neg_two_mul
          #print axioms RHLean.Proof.oddDoublingPacket_centered_sq
          #print axioms RHLean.Proof.nativeEulerOddDoublingPacket_centered_sq
          #print axioms RHLean.Proof.nativeEulerOddDoublingPacket_period_energy
          EOF
          lake env lean -DwarningAsError=true /tmp/odd_doubling_axioms.lean | tee /tmp/odd_doubling_axioms.log
          if grep -q 'sorryAx' /tmp/odd_doubling_axioms.log; then exit 1; fi
          python3 - <<'PY'
          import re
          log = open('/tmp/odd_doubling_axioms.log').read()
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for line in log.splitlines():
              match = re.search(r"depends on axioms: \[(.*)\]", line)
              if match:
                  used = {a.strip() for a in match.group(1).split(',') if a.strip()}
                  assert used <= allowed, f"Nonstandard axioms: {used - allowed}"
          print("PASS standard axioms only")
          PY
      - name: Reject admitted proofs in changed source
        run: |
          python3 - <<'PY'
          import pathlib, re
          path = pathlib.Path('research/EULER_ODD_DOUBLING_PACKET_20261030.lean')
          body = path.read_text()
          body = re.sub(r'/-.*?-/', '', body, flags=re.S)
          body = re.sub(r'--.*', '', body)
          assert not re.search(r'\b(sorry|admit|axiom)\b', body), path
          print('PASS no sorry, admit or new axiom')
          PY
