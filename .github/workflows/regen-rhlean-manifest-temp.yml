name: Temp regenerate RHLean manifest

on:
  push:
    branches:
      - agent/local-block-close

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-block-close
      - name: Regenerate sorted root import manifest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("RHLean")
          modules = sorted(".".join(p.with_suffix("").parts) for p in root.rglob("*.lean"))
          Path("RHLean.lean").write_text("".join(f"import {m}\n" for m in modules), encoding="utf-8")
          PY
      - name: Commit manifest if changed
        shell: bash
        run: |
          if git diff --quiet -- RHLean.lean; then
            echo "RHLean.lean already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RHLean.lean
          git commit -m "Regenerate RHLean root manifest"
          git push origin HEAD:agent/local-block-close
