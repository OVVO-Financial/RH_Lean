name: OAI principal all-delay return

on:
  pull_request:
    paths:
      - 'research/oai_434/VF919PrincipalAllDelayReturn.lean'
      - 'research/oai_434/VF919PrincipalResponseMass.lean'
      - 'research/oai_434/VF919PrincipalFiniteResponse.lean'
      - 'research/oai_434/VF919PrincipalSignedRemainder.lean'
      - 'research/oai_434/VF919FiniteSlotReflectedGain.lean'
      - 'scripts/lean/principal_all_delay_return/**'
      - '.github/workflows/vf919-principal-all-delay-return.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: principal-all-delay-${{ github.head_ref || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  original-principal-all-delay-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/lean-setup
      - uses: actions/checkout@v4
        with:
          repository: openai/math
          ref: 1581d4cbdd69a0faf34b2089614fe2a814316a6a
          path: oai-upstream
          persist-credentials: false
      - name: Restore source-pinned original analytic shared cache
        uses: ./.github/actions/oai-434-shared-cache
      - name: Verify toolchain and original signal sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          test "$(git -C oai-upstream rev-parse HEAD)" = '1581d4cbdd69a0faf34b2089614fe2a814316a6a'
          test "$(git hash-object oai-upstream/lean/OAI/NumberTheory/DirichletL/Hecke/Signal.lean)" = '9b0f1f6ff5f74c77fee06327c4936c2a9e180df5'
          test "$(git hash-object research/oai_434/VF919PrincipalResponseMass.lean)" = '5f7e812108ff7eff4a60da7055c2dd5f852c4941'
          python3 scripts/check_shared_lean_packages.py . oai-upstream/lean PrimeNumberTheoremAnd mathlib
          lean --version
      - name: Build unchanged original analytic prerequisites
        shell: bash
        working-directory: oai-upstream/lean
        run: |
          lake build OAI.NumberTheory.DirichletL.Reflection.LowExponent \
            OAI.NumberTheory.DirichletL.Reflection.TupleDyads \
            OAI.NumberTheory.DirichletL.Detector.LowNominalGeometry \
            OAI.NumberTheory.DirichletL.ParametersHighDataFine \
            OAI.NumberTheory.DirichletL.Detector.GlobalRegion \
            OAI.NumberTheory.DirichletL.Hecke.SignalIdentity \
            OAI.NumberTheory.DirichletL.PrincipalSignalComparison \
            OAI.NumberTheory.DirichletL.Detector.PrincipalRemainderBounds \
            OAI.NumberTheory.DirichletL.Detector.PrincipalPhysical \
            OAI.NumberTheory.DirichletL.Reflection.LowSector
      - name: Compile original return and exact public types with warnings fatal
        shell: bash
        run: |
          set -euo pipefail
          OAI_PATH="$(cd oai-upstream/lean && lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          RH_PATH="$(lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          mkdir -p .lake/build/lib/lean
          for name in VF919PrincipalSignedRemainder VF919PrincipalFiniteResponse VF919PrincipalResponseMass VF919FiniteSlotReflectedGain VF919PrincipalAllDelayReturn; do
            env LEAN_PATH="$RH_PATH:$OAI_PATH" lean -DwarningAsError=true \
              -o ".lake/build/lib/lean/research.oai_434.$name.olean" \
              "research/oai_434/$name.lean" 2>&1 | tee "principal-all-delay-$name.log"
          done
          env LEAN_PATH="$RH_PATH:$OAI_PATH" lean -DwarningAsError=true \
            scripts/lean/principal_all_delay_return/ExactTypes.lean 2>&1 | tee principal-all-delay-types.log
          env LEAN_PATH="$RH_PATH:$OAI_PATH" lean -DwarningAsError=true \
            --run scripts/lean/principal_all_delay_return/Audit.lean 2>&1 | tee principal-all-delay-audit.log
          if grep -E 'sorryAx|admitAx' principal-all-delay-*.log; then exit 1; fi
      - name: Preserve exact proof diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: principal-all-delay-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            principal-all-delay-*.log
            research/oai_434/VF919PrincipalAllDelayReturn.lean
            scripts/lean/principal_all_delay_return/
          if-no-files-found: error
          retention-days: 30
