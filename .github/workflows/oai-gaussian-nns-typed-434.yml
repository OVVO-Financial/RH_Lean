name: Original OAI GaussianSubset to RHLean NNS typecheck

on:
  workflow_call:
  pull_request:
    paths:
      - 'research/oai_434/VF919OriginalGaussianIntegratedNNS.lean'
      - 'research/oai_434/VF919OriginalMarkedSharpenedSignedNNS.lean'
      - 'research/oai_434/VF919OriginalDetectorSignedNNS.lean'
      - 'research/oai_434/VF919OriginalDetectorSexticSectorDefect.lean'
      - 'research/oai_434/VF919OriginalGaussianResonantFibers.lean'
      - 'research/oai_434/VF919OriginalGaussianResonantSextic.lean'
      - 'research/oai_434/VF919ActualSexticLocalResonanceAndCompensation.lean'
      - 'research/oai_434/VF919OriginalOnePrimePowerGain.lean'
      - 'research/oai_434/VF919OriginalCubeFreeIdealAdapter.lean'
      - 'research/oai_434/VF919OriginalDetectorResonantFibers.lean'
      - 'research/VF_919_RESONANT_FIBER_NNS_RECOMBINATION_20261022.lean'
      - 'research/VF_919_SEXTIC_SECTOR_MEAN_DEFECT_20261022.lean'
      - 'research/VF_919_OAI_ACTUAL_MARKED_FOURTH_REAL_NNS_20261021.lean'
      - 'research/VF_919_OAI_GAUSSIAN_SUBSET_EXACT_COEFFICIENT_NNS_20261021.lean'
      - '.github/workflows/oai-gaussian-nns-typed-434.yml'
      - 'scripts/apply_oai_434_upstream_patches.py'
      - 'scripts/check_shared_lean_packages.py'
      - '.github/actions/lean-compiled-cache/**'
      - '.github/actions/oai-434-shared-cache/**'
  workflow_dispatch:
  push:
    # A trusted default-branch build seeds a cache that subsequent PRs
    # may read. Pull-request-only caches live under refs/pull/*/merge
    # and cannot be reused by a sibling PR (GitHub cache scopes).
    branches: [main]
    paths:
      - 'research/oai_434/**'
      - 'research/VF_919_*.lean'
      - 'RHLean/**/*.lean'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - '.github/workflows/oai-gaussian-nns-typed-434.yml'
      - 'scripts/apply_oai_434_upstream_patches.py'
      - 'scripts/check_shared_lean_packages.py'
      - '.github/actions/lean-compiled-cache/**'
      - '.github/actions/oai-434-shared-cache/**'

permissions:
  contents: read

concurrency:
  group: oai-gaussian-nns-typed-434-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  original-oai-gaussian-nns:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout RHLean original NNS source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require original Lean and Mathlib pins
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.34.1"
          grep -q d13f23b723b8a846827a245b89c10fc7d3f11612 lakefile.lean
          ! grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' research/oai_434/VF919OriginalGaussianIntegratedNNS.lean
      - name: Setup pinned Lean and cached Mathlib
        uses: ./.github/actions/lean-setup
      - name: Checkout pinned ORIGINAL OpenAI Lean source
        uses: actions/checkout@v4
        with:
          repository: openai/math
          ref: 1581d4cbdd69a0faf34b2089614fe2a814316a6a
          path: oai-upstream
          persist-credentials: false
      - name: Verify original checkout
        run: |
          set -euo pipefail
          test "$(git -C oai-upstream rev-parse HEAD)" = "1581d4cbdd69a0faf34b2089614fe2a814316a6a"
          test "$(cat oai-upstream/lean/lean-toolchain)" = "leanprover/lean4:v4.34.1"
      - name: Restore compiled native RHLean plus unpatched Wiener from main
        id: native_cache
        uses: ./.github/actions/lean-compiled-cache
      # The trusted main cache can legitimately miss (new source version or
      # cache eviction). Preserve the expensive imported DAG on THIS PR too.
      # This key is a partial/work cache, NEVER an accepted full-library cache.
      - name: Restore verified PR-local native imported library if main missed
        id: native_import_cache
        if: ${{ steps.native_cache.outputs.native-matched-key == '' }}
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/build
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: rhlean-oai-imports-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ hashFiles('RHLean.lean', 'RHLean/**/*.lean', 'scripts/compile_research_import_closure.py') }}
          restore-keys: |
            rhlean-oai-imports-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      - name: Build original native PNT Wiener before shared-path setup
        run: |
          set -euo pipefail
          lake build PrimeNumberTheoremAnd.Wiener
      - name: Restore original OAI compiled DAG, verifying source pins and patches
        id: oai_cache
        uses: ./.github/actions/oai-434-shared-cache
      - name: Report shared cache decisions
        run: |
          echo "RHLean native: ${{ steps.native_cache.outputs.native-matched-key }}"
          echo "PNT Wiener exact: ${{ steps.native_cache.outputs.wiener-hit }}"
          echo "OpenAI matched: ${{ steps.oai_cache.outputs.cache-matched-key }}"
          echo "OpenAI complete: ${{ steps.oai_cache.outputs.complete }}"
      - name: Prebuild patched original Rellich prerequisites
        if: ${{ steps.oai_cache.outputs.complete != 'true' }}
        working-directory: oai-upstream/lean
        run: |
          set -euo pipefail
          lake build \
            RellichKondrachov.Analysis.FunctionalSpaces.Sobolev.Euclidean.TranslationEstimateL2 \
            RellichKondrachov.Analysis.FunctionalSpaces.Sobolev.Euclidean.L2Compactness.Approximation \
            RellichKondrachov.Analysis.FunctionalSpaces.Sobolev.Euclidean.L2Compactness.ArzelaAscoli \
            RellichKondrachov.Analysis.FunctionalSpaces.Sobolev.Euclidean.L2Compactness.Transfer
      # Fail fast on OAI-only ideal algebra before compiling native RHLean's
      # large import DAG or the expensive GaussianCommon detector.
      - name: Build exact original OAI FreeRow adapter import closure
        if: ${{ steps.oai_cache.outputs.complete != 'true' }}
        working-directory: oai-upstream/lean
        run: |
          set -euo pipefail
          lake build \
            OAI.NumberTheory.DirichletL.Hecke.InverseAmplificationRows \
            OAI.NumberTheory.DirichletL.CenteredExceptionalCount \
            OAI.NumberTheory.DirichletL.GaussSum.CubicNormalization \
            OAI.NumberTheory.DirichletL.GaussSum.LocalProductAssembly \
            OAI.NumberTheory.DirichletL.Detector.EulerCoordinates
          test -s .lake/build/lib/lean/OAI/NumberTheory/DirichletL/Hecke/InverseAmplificationRows.olean
      - name: KERNEL-CHECK original FreeRow ideal base-3 and true cubic mask
        id: verify_cube
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OAI_PATH="$(cd oai-upstream/lean && lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          RH_PATH="$(lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          python3 scripts/check_shared_lean_packages.py . oai-upstream/lean PrimeNumberTheoremAnd mathlib
          # This leaf precedes the native library build; the output directory
          # is not guaranteed to exist on a cold or partial native cache.
          mkdir -p .lake/build/lib/lean
          env LEAN_PATH="$RH_PATH:$OAI_PATH" lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.oai_434.VF919OriginalCubeFreeIdealAdapter.olean \
            research/oai_434/VF919OriginalCubeFreeIdealAdapter.lean \
            | tee /tmp/oai-original-cubefree-ideal-mask.log
          test -s .lake/build/lib/lean/research.oai_434.VF919OriginalCubeFreeIdealAdapter.olean
          if grep -E 'sorryAx|admitAx|_private' /tmp/oai-original-cubefree-ideal-mask.log; then
            echo 'Unexpected axiom in actual OAI cube-free ideal mask adapter.' >&2
            exit 1
          fi
      - name: Build upstream original GaussianCommon theorem imports
        if: ${{ steps.oai_cache.outputs.complete != 'true' }}
        working-directory: oai-upstream/lean
        run: |
          set -euo pipefail
          lake build OAI.NumberTheory.DirichletL.Detector.GaussianCommon
          test -s .lake/build/lib/lean/OAI/NumberTheory/DirichletL/Detector/GaussianCommon.olean
      - name: Build only imported RHLean library modules from the native source DAG
        # The research compiler already supports --library-only, which
        # guarantees native .olean prerequisites are complete even when
        # a NEW research proof itself fails to elaborate.
        shell: bash
        run: |
          set -euo pipefail
          export RHLEAN_RESEARCH_TARGETS="$(cat <<'TARGETS'
          research/VF_919_OAI_GAUSSIAN_SUBSET_EXACT_COEFFICIENT_NNS_20261021.lean
          research/VF_919_OAI_ACTUAL_MARKED_FOURTH_REAL_NNS_20261021.lean
          research/VF_919_SEXTIC_SECTOR_MEAN_DEFECT_20261022.lean
          research/VF_919_RESONANT_FIBER_NNS_RECOMBINATION_20261022.lean
          research/VF_919_OAI_EFFECTIVE_SEXTIC_VALUATION_CLASSIFICATION_20261022.lean
          research/VF_919_OAI_GROUPED_HOLDER_SIXTH_SOURCE_20261022.lean
          research/VF_919_OAI_NNS_PRINCIPAL_NONPRINCIPAL_CROSS_20261022.lean
          research/VF_919_OAI_COMPENSATED_TWO_BILL_L65_20261022.lean
          research/VF_919_OAI_NNS_POST_GROUPED_SEXTIC_DUAL_20261022.lean
          research/VF_919_OAI_PRINCIPAL_SOURCE_EXPONENT_BUDGET_20261022.lean
          TARGETS
          )"
          python3 scripts/compile_research_import_closure.py --library-only
      # Verified native imports come from the main cache. Changed research
      # leaves remain warning-fatal kernel-checked by research-compile.
      - name: Checkpoint compiled PR-local native imports BEFORE leaf research
        if: ${{ !cancelled() && steps.native_import_cache.outcome == 'success' && steps.native_import_cache.outputs.cache-hit != 'true' && steps.native_cache.outputs.native-matched-key == '' }}
        uses: actions/cache/save@v5
        with:
          path: |
            .lake/build
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: ${{ steps.native_import_cache.outputs.cache-primary-key }}
      - name: Kernel-check ONLY new / changed signed NNS research sources
        uses: ./.github/actions/research-compile
        with:
          build-library: 'false'
          targets: |
            research/VF_919_OAI_GAUSSIAN_SUBSET_EXACT_COEFFICIENT_NNS_20261021.lean
            research/VF_919_OAI_ACTUAL_MARKED_FOURTH_REAL_NNS_20261021.lean
            research/VF_919_SEXTIC_SECTOR_MEAN_DEFECT_20261022.lean
            research/VF_919_RESONANT_FIBER_NNS_RECOMBINATION_20261022.lean
            research/VF_919_OAI_EFFECTIVE_SEXTIC_VALUATION_CLASSIFICATION_20261022.lean
            research/VF_919_OAI_GROUPED_HOLDER_SIXTH_SOURCE_20261022.lean
            research/VF_919_OAI_NNS_PRINCIPAL_NONPRINCIPAL_CROSS_20261022.lean
            research/VF_919_OAI_COMPENSATED_TWO_BILL_L65_20261022.lean
            research/VF_919_OAI_NNS_POST_GROUPED_SEXTIC_DUAL_20261022.lean
            research/VF_919_OAI_PRINCIPAL_SOURCE_EXPONENT_BUDGET_20261022.lean
      # Main publishes the full OAI DAG; do not duplicate multi-GB caches
      # after intermediate steps on successful PR runs.
      # Research imports are quoted flat dotted module names such as
      # `import «research.oai_434.Foo»`. Emit their .olean files as
      # `research.oai_434.Foo.olean` (as the native research compiler does),
      # not under the nested source tree `research/oai_434/Foo.olean`.
      - name: KERNEL-CHECK ORIGINAL actualSextic local classification and two-bill compensation
        id: verify_actual
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OAI_PATH="$(cd oai-upstream/lean && lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          RH_PATH="$(lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          python3 scripts/check_shared_lean_packages.py . oai-upstream/lean PrimeNumberTheoremAnd mathlib
          mkdir -p .lake/build/lib/lean/research/oai_434
          env LEAN_PATH="$RH_PATH:$OAI_PATH" lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.oai_434.VF919ActualSexticLocalResonanceAndCompensation.olean \
            research/oai_434/VF919ActualSexticLocalResonanceAndCompensation.lean \
            | tee /tmp/oai-actual-sextic-compensation.log
          test -s .lake/build/lib/lean/research.oai_434.VF919ActualSexticLocalResonanceAndCompensation.olean
          if grep -E 'sorryAx|admitAx|_private' /tmp/oai-actual-sextic-compensation.log; then
            echo 'Unexpected axiom in true OAI local residue and compensation.' >&2
            exit 1
          fi
      - name: Compile ORIGINAL OAI unramified source prerequisite once
        if: ${{ steps.oai_cache.outputs.complete != 'true' }}
        working-directory: oai-upstream/lean
        run: |
          set -euo pipefail
          lake build OAI.NumberTheory.DirichletL.Detector.HighRowsSelectedUnramified
          test -s .lake/build/lib/lean/OAI/NumberTheory/DirichletL/Detector/HighRowsSelectedUnramified.olean
      - name: KERNEL-CHECK original one-prime signed compensation power diagnostic
        id: verify_oneprime
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OAI_PATH="$(cd oai-upstream/lean && lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          RH_PATH="$(lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          python3 scripts/check_shared_lean_packages.py . oai-upstream/lean PrimeNumberTheoremAnd mathlib
          mkdir -p .lake/build/lib/lean/research/oai_434
          env LEAN_PATH="$RH_PATH:$OAI_PATH" lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.oai_434.VF919OriginalOnePrimePowerGain.olean \
            research/oai_434/VF919OriginalOnePrimePowerGain.lean \
            | tee /tmp/oai-original-one-prime-power-gain.log
          if grep -E 'sorryAx|admitAx|_private' /tmp/oai-original-one-prime-power-gain.log; then
            echo 'Unexpected axiom in original one-prime signed power gain.' >&2
            exit 1
          fi
      - name: KERNEL-CHECK original OAI type specialization and NNS
        id: verify_typed
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OAI_PATH="$(cd oai-upstream/lean && lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          RH_PATH="$(lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          python3 scripts/check_shared_lean_packages.py . oai-upstream/lean PrimeNumberTheoremAnd mathlib
          mkdir -p .lake/build/lib/lean/research/oai_434
          env LEAN_PATH="$RH_PATH:$OAI_PATH" lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.oai_434.VF919OriginalGaussianIntegratedNNS.olean \
            research/oai_434/VF919OriginalGaussianIntegratedNNS.lean \
            | tee /tmp/oai-gaussian-nns-typed.log
          if grep -E 'sorryAx|admitAx|_private' /tmp/oai-gaussian-nns-typed.log; then
            echo 'Unexpected axiom in original OAI/RHLean NNS bridge.' >&2
            exit 1
          fi
      - name: KERNEL-CHECK original GaussianSubset compensated resonant fiber regrouping
        id: verify_fibers
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OAI_PATH="$(cd oai-upstream/lean && lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          RH_PATH="$(lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          python3 scripts/check_shared_lean_packages.py . oai-upstream/lean PrimeNumberTheoremAnd mathlib
          mkdir -p .lake/build/lib/lean/research/oai_434
          env LEAN_PATH="$RH_PATH:$OAI_PATH" lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.oai_434.VF919OriginalGaussianResonantFibers.olean \
            research/oai_434/VF919OriginalGaussianResonantFibers.lean \
            | tee /tmp/oai-original-gaussian-resonant-fibers.log
          if grep -E 'sorryAx|admitAx|_private' /tmp/oai-original-gaussian-resonant-fibers.log; then exit 1; fi
      - name: KERNEL-CHECK exact ORIGINAL Gaussian resonance plus sextic defect
        id: verify_sextic
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OAI_PATH="$(cd oai-upstream/lean && lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          RH_PATH="$(lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          python3 scripts/check_shared_lean_packages.py . oai-upstream/lean PrimeNumberTheoremAnd mathlib
          mkdir -p .lake/build/lib/lean/research/oai_434
          env LEAN_PATH="$RH_PATH:$OAI_PATH" lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.oai_434.VF919OriginalGaussianResonantSextic.olean \
            research/oai_434/VF919OriginalGaussianResonantSextic.lean \
            | tee /tmp/oai-original-gaussian-resonant-sextic.log
          if grep -E 'sorryAx|admitAx|_private' /tmp/oai-original-gaussian-resonant-sextic.log; then exit 1; fi
      - name: Build ORIGINAL OAI refined marked analytic moment prerequisites
        if: ${{ steps.oai_cache.outputs.complete != 'true' }}
        working-directory: oai-upstream/lean
        run: |
          set -euo pipefail
          lake build OAI.NumberTheory.DirichletL.Detector.DetectorPlainMarkedFineField
          test -s .lake/build/lib/lean/OAI/NumberTheory/DirichletL/Detector/DetectorPlainMarkedFineField.olean
      # A failed uncached run retains a single partial checkpoint at the end.
      - name: KERNEL-CHECK exact original detector ideal columns into NNS CoDiv
        id: verify_detector
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OAI_PATH="$(cd oai-upstream/lean && lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          RH_PATH="$(lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          python3 scripts/check_shared_lean_packages.py . oai-upstream/lean PrimeNumberTheoremAnd mathlib
          mkdir -p .lake/build/lib/lean/research/oai_434
          env LEAN_PATH="$RH_PATH:$OAI_PATH" lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.oai_434.VF919OriginalDetectorSignedNNS.olean \
            research/oai_434/VF919OriginalDetectorSignedNNS.lean \
            | tee /tmp/oai-original-detector-signed-nns.log
          if grep -E 'sorryAx|admitAx|_private' /tmp/oai-original-detector-signed-nns.log; then
            echo 'Unexpected axiom in original detector NNS theorem.' >&2
            exit 1
          fi
      - name: KERNEL-CHECK ORIGINAL ideal pair sextic source defect and phase gate
        id: verify_defect
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OAI_PATH="$(cd oai-upstream/lean && lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          RH_PATH="$(lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          python3 scripts/check_shared_lean_packages.py . oai-upstream/lean PrimeNumberTheoremAnd mathlib
          mkdir -p .lake/build/lib/lean/research/oai_434
          env LEAN_PATH="$RH_PATH:$OAI_PATH" lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.oai_434.VF919OriginalDetectorSexticSectorDefect.olean \
            research/oai_434/VF919OriginalDetectorSexticSectorDefect.lean \
            | tee /tmp/oai-original-ideal-sextic-sector-defect.log
          if grep -E 'sorryAx|admitAx|_private' /tmp/oai-original-ideal-sextic-sector-defect.log; then
            echo 'Unexpected axiom in original typed sextic defect.' >&2
            exit 1
          fi
      - name: KERNEL-CHECK independent sharper source moment IN NNS coordinates
        id: verify_marked
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OAI_PATH="$(cd oai-upstream/lean && lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          RH_PATH="$(lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          python3 scripts/check_shared_lean_packages.py . oai-upstream/lean PrimeNumberTheoremAnd mathlib
          mkdir -p .lake/build/lib/lean/research/oai_434
          env LEAN_PATH="$RH_PATH:$OAI_PATH" lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.oai_434.VF919OriginalMarkedSharpenedSignedNNS.olean \
            research/oai_434/VF919OriginalMarkedSharpenedSignedNNS.lean \
            | tee /tmp/oai-marked-sharper-nns.log
          if grep -E 'sorryAx|admitAx|_private' /tmp/oai-marked-sharper-nns.log; then
            echo 'Unexpected axiom in independent original-OAI marked NNS theorem.' >&2
            exit 1
          fi
      - name: KERNEL-CHECK original finite ideal-column resonant fiber grouping
        id: verify_resonant
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OAI_PATH="$(cd oai-upstream/lean && lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          RH_PATH="$(lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          python3 scripts/check_shared_lean_packages.py . oai-upstream/lean PrimeNumberTheoremAnd mathlib
          mkdir -p .lake/build/lib/lean/research/oai_434
          env LEAN_PATH="$RH_PATH:$OAI_PATH" lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.oai_434.VF919OriginalDetectorResonantFibers.olean \
            research/oai_434/VF919OriginalDetectorResonantFibers.lean \
            | tee /tmp/oai-original-detector-resonant-fibers.log
          if grep -E 'sorryAx|admitAx|_private' /tmp/oai-original-detector-resonant-fibers.log; then exit 1; fi
      # Every individual proof check remains mandatory. Do not short-circuit
      # on the first failed leaf after expensive source DAG compilation.
      - name: Enforce every independent original OAI kernel and axiom check
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          for result in \
            "cube=${{ steps.verify_cube.outcome }}" \
            "actual=${{ steps.verify_actual.outcome }}" \
            "oneprime=${{ steps.verify_oneprime.outcome }}" \
            "typed=${{ steps.verify_typed.outcome }}" \
            "fibers=${{ steps.verify_fibers.outcome }}" \
            "sextic=${{ steps.verify_sextic.outcome }}" \
            "detector=${{ steps.verify_detector.outcome }}" \
            "defect=${{ steps.verify_defect.outcome }}" \
            "marked=${{ steps.verify_marked.outcome }}" \
            "resonant=${{ steps.verify_resonant.outcome }}"
          do
            if [[ "${result#*=}" != success ]]; then
              echo "::error::Original proof check not green: $result"
              bad=1
            fi
          done
          exit "$bad"
      - name: Save partial OAI DAG only on first cold miss (avoid 3.3GB duplicate caches)
        if: ${{ !cancelled() && failure() && steps.oai_cache.outcome == 'success' && steps.oai_cache.outputs.cache-matched-key == '' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: oai-upstream/lean/.lake
          key: oai-certified-434-pntnative-v3-${{ runner.os }}-${{ runner.arch }}-1581d4cbdd69a0faf34b2089614fe2a814316a6a-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'oai-upstream/lean/lean-toolchain', 'oai-upstream/lean/lakefile.lean', 'oai-upstream/lean/lake-manifest.json', 'oai-upstream/lean/patches/**', 'scripts/apply_oai_434_upstream_patches.py') }}-progress-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload original typed theorem axiom log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oai-gaussian-nns-typed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/oai-gaussian-nns-typed.log
            /tmp/oai-marked-sharper-nns.log
            /tmp/oai-original-detector-signed-nns.log
            /tmp/oai-original-ideal-sextic-sector-defect.log
            /tmp/oai-original-gaussian-resonant-fibers.log
            /tmp/oai-original-detector-resonant-fibers.log
            /tmp/oai-original-gaussian-resonant-sextic.log
            /tmp/oai-actual-sextic-compensation.log
            /tmp/oai-original-one-prime-power-gain.log
          if-no-files-found: warn
          retention-days: 7
