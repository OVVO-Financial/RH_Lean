name: Wire parent carrier module

on:
  push:
    branches:
      - agent/q2-parent-product-reassembly

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/q2-parent-product-reassembly
      - name: Add sorted root import
        run: |
          python3 -c "from pathlib import Path; p=Path('RHLean.lean'); xs=[x for x in p.read_text().splitlines() if x.strip()]; line='import RHLean.Proof.LowWheelFrozenSquareResidualParentCarrier'; xs.append(line) if line not in xs else None; p.write_text('\\n'.join(sorted(xs))+'\\n')"
          rm .github/workflows/wire-parent-carrier.yml
      - name: Commit root wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RHLean.lean .github/workflows/wire-parent-carrier.yml
          git commit -m 'Wire parent carrier flattening into root build'
          git push origin HEAD:agent/q2-parent-product-reassembly
