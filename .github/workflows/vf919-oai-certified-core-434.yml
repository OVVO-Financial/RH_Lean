name: Seven-eighths LOW-HIGH mechanism and original Mobius covariance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - lean-toolchain
      - lakefile.lean
      - lake-manifest.json
      - 'research/VF_919_*.lean'
      - 'research/MERTENS_*.lean'
      - scripts/apply_oai_434_upstream_patches.py
      - scripts/check_shared_lean_packages.py
      - scripts/ci/vf919_common_probe_dependency_audit.lean
      - .github/workflows/vf919-oai-certified-core-434.yml

permissions:
  contents: read

concurrency:
  group: vf919-oai-certified-core-434-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  original-oai-complete-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Require exact Lean and Mathlib pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          grep -q 'd13f23b723b8a846827a245b89c10fc7d3f11612' lakefile.lean
      - name: Reject source-level proof shortcuts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          paths = [
              'research/VF_919_COMMON_PROBE_SEVEN_EIGHTHS_20261020.lean',
              'research/VF_919_OPENAI_434_UNCONDITIONAL_SQUARE_BLOCK_COVARIANCE_20261019.lean',
          ]
          for path in paths:
              text = pathlib.Path(path).read_text()
              text = re.sub(r'/-.*?-/', '', text, flags=re.S)
              text = re.sub(r'--[^\n]*', '', text)
              if re.search(r'\b(sorry|admit|axiom)\b|FinalAssemblyUnconditional|riemannZeta_ne_zero_of_seven_eighths_lt_re', text):
                  raise SystemExit(f'Forbidden shortcut in {path}')
          print('PASS: no terminal theorem import or admitted proof')
          PY
      - uses: ./.github/actions/lean-setup
      - name: Compile original signed covariance and square-shell consumers
        uses: ./.github/actions/research-compile
        with:
          build-library: 'true'
          targets: >-
            research/VF_919_SEVEN_EIGHTHS_SIGNED_COVARIANCE_20261019.lean
            research/VF_919_SEVEN_EIGHTHS_SQUARE_SHELL_BRIDGE_20261019.lean
      # The final RHLean+OAI consumer imports PrimeNumberTheoremAnd.Wiener
      # through the native Mertens converse. Research-only compilation may
      # reuse earlier oleans without materializing this transitive dependency.
      # Catch missing external oleans *before* restoring the large OAI DAG.
      - name: Restore independently cached PNT+ Wiener prerequisites
        id: pnt-wiener-cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: vf919-pnt-wiener-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}
          restore-keys: |
            pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Materialize and validate missing PNT+ transitive imports
        id: pnt-build
        shell: bash
        run: |
          set -euo pipefail
          lake build PrimeNumberTheoremAnd.SmoothExistence PrimeNumberTheoremAnd.Wiener
          test -s .lake/packages/PrimeNumberTheoremAnd/.lake/build/lib/lean/PrimeNumberTheoremAnd/SmoothExistence.olean
          test -s .lake/packages/PrimeNumberTheoremAnd/.lake/build/lib/lean/PrimeNumberTheoremAnd/Wiener.olean
          echo 'PASS: PNT+ SmoothExistence and Wiener oleans exist before OAI setup'
          # Verify the same import chain that failed after the two-hour run.
          # This cannot import OpenAI and therefore runs before OAI checkout.
          lake env lean -DwarningAsError=true \
            research/VF_919_SEVEN_EIGHTHS_SIGNED_COVARIANCE_20261019.lean \
            > /tmp/vf919-pnt-native-import-preflight.log
          echo 'PASS: full native Mertens/covariance import closure is loadable'
      - name: Save complete PNT+ prerequisites for subsequent attempts
        if: steps.pnt-build.outcome == 'success' && steps.pnt-wiener-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: ${{ steps.pnt-wiener-cache.outputs.cache-primary-key }}
      - name: Checkout pinned intermediate analytic source
        uses: actions/checkout@v4
        with:
          repository: openai/math
          ref: 1581d4cbdd69a0faf34b2089614fe2a814316a6a
          path: oai-upstream
          persist-credentials: false
      - name: Restore exact upstream analytic build
        id: oai-cache
        uses: actions/cache/restore@v5
        with:
          path: oai-upstream/lean/.lake
          key: vf919-oai-4341-pntnative-v4-${{ runner.os }}-${{ runner.arch }}-1581d4cbdd69a0faf34b2089614fe2a814316a6a-${{ hashFiles('scripts/apply_oai_434_upstream_patches.py') }}-intermediate
          restore-keys: |
            vf919-oai-4341-pntnative-v4-${{ runner.os }}-${{ runner.arch }}-1581d4cbdd69a0faf34b2089614fe2a814316a6a-${{ hashFiles('scripts/apply_oai_434_upstream_patches.py') }}-full
            vf919-oai-4341-pntnative-v4-${{ runner.os }}-${{ runner.arch }}-1581d4cbdd69a0faf34b2089614fe2a814316a6a-${{ hashFiles('scripts/apply_oai_434_upstream_patches.py') }}-
      - name: Fetch pinned dependencies on a cold cache
        if: steps.oai-cache.outputs.cache-hit != 'true'
        working-directory: oai-upstream/lean
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          lake exe cache get
      # RH_Lean pins the same PrimeNumberTheoremAnd commit unpatched, and the
      # combined check loads each package from ONE search-path entry, so the
      # OpenAI side is compiled against those identical PNT sources. OpenAI's
      # PNT patch cannot be used on both sides: it removes SmoothExistence,
      # which native MediumPNT needs. Every other upstream patch is applied.
      - name: Verify and apply the ORIGINAL OpenAI Lean 4.34.1 upstream patches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_oai_434_upstream_patches.py oai-upstream/lean --keep-pinned PrimeNumberTheoremAnd
      - name: Kernel-check patched prerequisite proofs
        working-directory: oai-upstream/lean
        shell: bash
        run: |
          set -euo pipefail
          lake build \
            RellichKondrachov.Analysis.FunctionalSpaces.Sobolev.Euclidean.TranslationEstimateL2 \
            RellichKondrachov.Analysis.FunctionalSpaces.Sobolev.Euclidean.TranslationEstimateH1 \
            RellichKondrachov.Analysis.FunctionalSpaces.Sobolev.Euclidean.Rellich \
            RellichKondrachov.Analysis.FunctionalSpaces.Sobolev.Euclidean.L2Compactness.Approximation \
            RellichKondrachov.Analysis.FunctionalSpaces.Sobolev.Euclidean.L2Compactness.ArzelaAscoli \
            RellichKondrachov.Analysis.FunctionalSpaces.Sobolev.Euclidean.L2Compactness.Transfer
      # PrimeCounting/Progressions imports only PNT Wiener and uses each
      # Wiener declaration OpenAI needs; fail here, not after the full build.
      - name: Preflight OpenAI's PNT Wiener consumers against native PNT
        working-directory: oai-upstream/lean
        shell: bash
        run: |
          set -euo pipefail
          lake build OAI.NumberTheory.DirichletL.PrimeCounting.Progressions
      - name: Build the actual intermediate moments, not the terminal theorem
        id: analytic-build
        working-directory: oai-upstream/lean
        shell: bash
        run: |
          set -euo pipefail
          lake build \
            OAI.NumberTheory.DirichletL.Energy.CertifiedExistence \
            OAI.NumberTheory.DirichletL.Detector.FinalAssemblyCertifiedBands \
            OAI.NumberTheory.DirichletL.Moments.DetectorPlainSlotProfile
      - name: Save successful analytic build before checking the native assembly
        if: steps.analytic-build.outcome == 'success' && steps.oai-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: oai-upstream/lean/.lake
          key: ${{ steps.oai-cache.outputs.cache-primary-key }}
      - name: Kernel-check LOW-HIGH closure, Mertens, and all square blocks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean
          RH_PATH="$(lake env printenv LEAN_PATH)"
          OAI_PATH="$(cd oai-upstream/lean && lake env printenv LEAN_PATH)"
          export LEAN_PATH="$PWD/.lake/build/lib/lean:$RH_PATH:$OAI_PATH"
          test -s .lake/packages/PrimeNumberTheoremAnd/.lake/build/lib/lean/PrimeNumberTheoremAnd/Wiener.olean
          python3 scripts/check_shared_lean_packages.py . oai-upstream/lean PrimeNumberTheoremAnd mathlib
          # Quoted research module names are flat identifiers containing dots.
          # Match the output convention of compile_research_import_closure.py.
          lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.VF_919_COMMON_PROBE_SEVEN_EIGHTHS_20261020.olean \
            research/VF_919_COMMON_PROBE_SEVEN_EIGHTHS_20261020.lean \
            | tee /tmp/vf919-common-probe-axioms.txt
          lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.VF_919_OPENAI_434_UNCONDITIONAL_SQUARE_BLOCK_COVARIANCE_20261019.olean \
            research/VF_919_OPENAI_434_UNCONDITIONAL_SQUARE_BLOCK_COVARIANCE_20261019.lean \
            | tee /tmp/vf919-original-covariance-axioms.txt
          lean -DwarningAsError=true scripts/ci/vf919_common_probe_dependency_audit.lean \
            | tee /tmp/vf919-common-probe-dependencies.txt
          if grep -E 'sorryAx|admitAx' /tmp/vf919-common-probe-axioms.txt /tmp/vf919-original-covariance-axioms.txt; then
            exit 1
          fi
      - name: Publish exact verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vf919-common-probe-proof-audit-${{ github.sha }}
          path: |
            /tmp/vf919-common-probe-axioms.txt
            /tmp/vf919-original-covariance-axioms.txt
            /tmp/vf919-common-probe-dependencies.txt
          if-no-files-found: ignore
      - name: Report the verified scope
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Seven-eighths mechanism acceptance'
            echo 'Actual intermediate certified moments + locally assembled LOW/HIGH/Mellin contradiction.'
            echo 'No upstream terminal nonvanishing wrapper in the proof dependency closure.'
            echo 'Original rational Mobius Mertens exponent and full signed square-block covariance checked.'
            echo 'The direct sharp covariance estimate without the nonvanishing intermediate remains separate.'
          } >> "$GITHUB_STEP_SUMMARY"
