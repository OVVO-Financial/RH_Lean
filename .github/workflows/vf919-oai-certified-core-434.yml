name: OpenAI COMPLETE 7/8 theorem on original RHLean square-block covariance

on:
  pull_request:
    paths:
      - 'research/VF_919_OPENAI_434_UNCONDITIONAL_SQUARE_BLOCK_COVARIANCE_20261019.lean'
      - 'research/CORR4_OAI_POWER_GUIDEPOST_20261024.lean'
      - 'research/oai_434/CORR4OpenAICertifiedRemainderGuidepost.lean'
      - 'research/oai_434/VF919NativeEnergyInduction.lean'
      - 'research/oai_434/VF919FiniteSlotReflectedGain.lean'
      - 'research/oai_434/VF919TiltedLowReflection.lean'
      - 'research/oai_434/VF919TiltedLowPhysical.lean'
      - 'research/oai_434/VF919TiltedProbe.lean'
      - 'research/oai_434/VF919TiltedHighTails.lean'
      - 'research/oai_434/VF919TiltedHighCentral.lean'
      - 'research/oai_434/VF919TiltedHighPrincipal.lean'
      - 'research/oai_434/VF919TiltedHighTransport.lean'
      - 'research/oai_434/VF919TiltedHighAssembly.lean'
      - 'research/oai_434/VF919NativeStrictSevenEighths.lean'
      - 'research/oai_434/VF919NativeStrictMertens.lean'
      - 'research/oai_434/VF919NativeSourceMoments.lean'
      - 'research/oai_434/VF919NativeSevenEighthsReplay.lean'
      - 'research/oai_434/VF919OriginalMarkedSharpenedSignedNNS.lean'
      - 'research/oai_434/VF919PhysicalTiltFullBudget.lean'
      - 'research/oai_434/VF919SlotCalibratedData.lean'
      - 'research/oai_434/VF919SlotAnchoredEndpoint.lean'
      - 'research/oai_434/VF919Anchored*.lean'
      - 'scripts/lean/NativeSevenEighthsReplayAudit.lean'
      - 'research/VF_919_SEVEN_EIGHTHS_SIGNED_COVARIANCE_20261019.lean'
      - 'research/VF_919_SEVEN_EIGHTHS_SQUARE_SHELL_BRIDGE_20261019.lean'
      - 'research/VF_919_OAI_GAUSSIAN_SUBSET_EXACT_COEFFICIENT_NNS_20261021.lean'
      - 'research/oai_434/VF919OriginalGaussianIntegratedNNS.lean'
      - '.github/workflows/vf919-oai-certified-core-434.yml'
      - '.github/actions/lean-setup/**'
      - '.github/actions/research-compile/**'
      - 'scripts/apply_oai_434_upstream_patches.py'
      - 'scripts/check_shared_lean_packages.py'
      - 'scripts/compile_research_import_closure.py'
      - 'scripts/ci/**'
      - 'RHLean/**'
      - 'research/MERTENS_*.lean'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vf919-openai-certified-core-434-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  original-oai-complete-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Require original Lean 4.34.1 / Mathlib tracker pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.34.1"
          grep -q "d13f23b723b8a846827a245b89c10fc7d3f11612" lakefile.lean
      - name: Reject admitted proofs or new axioms
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' \
            research/VF_919_OPENAI_434_UNCONDITIONAL_SQUARE_BLOCK_COVARIANCE_20261019.lean
      - uses: ./.github/actions/lean-setup
      - name: Checkout entire ACTUAL original OpenAI 7/8 proof DAG
        uses: actions/checkout@v4
        with:
          repository: openai/math
          ref: 1581d4cbdd69a0faf34b2089614fe2a814316a6a
          path: oai-upstream
          persist-credentials: false
      - name: Verify exact upstream checkout and compiler pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C oai-upstream rev-parse HEAD)" = "1581d4cbdd69a0faf34b2089614fe2a814316a6a"
          test "$(cat oai-upstream/lean/lean-toolchain)" = "leanprover/lean4:v4.34.1"
      - name: Restore main-branch native RHLean and shared unpatched Wiener
        id: native_cache
        uses: ./.github/actions/lean-compiled-cache
      # RH_PATH must supply the same unpatched PNT package to both proof chains.
      - name: Compile Wiener in the native PNT namespace before the expensive OAI build
        shell: bash
        run: |
          set -euo pipefail
          lake build PrimeNumberTheoremAnd.Wiener
          test -s .lake/packages/PrimeNumberTheoremAnd/.lake/build/lib/lean/PrimeNumberTheoremAnd/Wiener.olean
      - name: Compile only the ORIGINAL native signed covariance and square-shell telescope
        id: native_build
        uses: ./.github/actions/research-compile
        with:
          build-library: 'true'
          targets: >-
            research/VF_919_SEVEN_EIGHTHS_SIGNED_COVARIANCE_20261019.lean
            research/VF_919_SEVEN_EIGHTHS_SQUARE_SHELL_BRIDGE_20261019.lean
            research/CORR4_OAI_POWER_GUIDEPOST_20261024.lean
            research/VF_919_OAI_ACTUAL_MARKED_FOURTH_REAL_NNS_20261021.lean
      - name: Restore verified original OpenAI compiled baseline from main
        id: oai_cache
        uses: ./.github/actions/oai-434-shared-cache
      - name: Kernel-check patched pinned Rellich prerequisites before full OpenAI DAG
        if: ${{ steps.oai_cache.outputs.complete != 'true' }}
        shell: bash
        working-directory: oai-upstream/lean
        run: |
          set -euo pipefail
          lake build \
            RellichKondrachov.Analysis.FunctionalSpaces.Sobolev.Euclidean.TranslationEstimateL2 \
            RellichKondrachov.Analysis.FunctionalSpaces.Sobolev.Euclidean.L2Compactness.Approximation \
            RellichKondrachov.Analysis.FunctionalSpaces.Sobolev.Euclidean.L2Compactness.ArzelaAscoli \
            RellichKondrachov.Analysis.FunctionalSpaces.Sobolev.Euclidean.L2Compactness.Transfer
      - name: Preflight OpenAI's PNT Wiener consumers against native PNT
        if: ${{ steps.oai_cache.outputs.complete != 'true' }}
        shell: bash
        working-directory: oai-upstream/lean
        run: |
          set -euo pipefail
          lake build OAI.NumberTheory.DirichletL.PrimeCounting.Progressions
      - name: Compile entire original OpenAI moment and final detector chain
        if: ${{ steps.oai_cache.outputs.complete != 'true' }}
        id: oai_build
        shell: bash
        working-directory: oai-upstream/lean
        run: |
          set -euo pipefail
          lake build OAI.NumberTheory.DirichletL.Detector.FinalAssemblyUnconditional
          test -s .lake/build/lib/lean/OAI/NumberTheory/DirichletL/Detector/FinalAssemblyUnconditional.olean
      # A partial DAG must never be published as a complete baseline.
      - name: Preserve partial original OpenAI DAG only on true cold miss
        if: ${{ !cancelled() && failure() && steps.oai_cache.outcome == 'success' && steps.oai_cache.outputs.cache-matched-key == '' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: oai-upstream/lean/.lake
          key: oai-certified-434-pntnative-v3-${{ runner.os }}-${{ runner.arch }}-1581d4cbdd69a0faf34b2089614fe2a814316a6a-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'oai-upstream/lean/lean-toolchain', 'oai-upstream/lean/lakefile.lean', 'oai-upstream/lean/lake-manifest.json', 'oai-upstream/lean/patches/**', 'scripts/apply_oai_434_upstream_patches.py') }}-progress-${{ github.run_id }}-${{ github.run_attempt }}
      - name: KERNEL-CHECK native UNCONDITIONAL signed covariance and ALL square-block bounds
        id: native_theorem
        shell: bash
        run: |
          set -euo pipefail
          OAI_PATH="$(cd oai-upstream/lean && lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          RH_PATH="$(lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          test -s .lake/packages/PrimeNumberTheoremAnd/.lake/build/lib/lean/PrimeNumberTheoremAnd/Wiener.olean
          python3 scripts/check_shared_lean_packages.py . oai-upstream/lean PrimeNumberTheoremAnd mathlib
          env LEAN_PATH="$RH_PATH:$OAI_PATH" lean -DwarningAsError=true \
            research/VF_919_OPENAI_434_UNCONDITIONAL_SQUARE_BLOCK_COVARIANCE_20261019.lean \
            | tee /tmp/vf919-oai-certified-core-434-axioms.log
          if grep -E 'sorryAx|admitAx|_private' /tmp/vf919-oai-certified-core-434-axioms.log; then
            echo "Nonstandard axiom contamination in full theorem DAG" >&2
            exit 1
          fi
      - name: Kernel-check actual OAI 7/8 physical CORR4 guidepost
        shell: bash
        run: |
          set -euo pipefail
          OAI_PATH="$(cd oai-upstream/lean && lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          RH_PATH="$(lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          test -s .lake/build/lib/lean/research.CORR4_OAI_POWER_GUIDEPOST_20261024.olean
          python3 scripts/check_shared_lean_packages.py . oai-upstream/lean PrimeNumberTheoremAnd mathlib
          env LEAN_PATH="$RH_PATH:$OAI_PATH" lean -DwarningAsError=true \
            research/oai_434/CORR4OpenAICertifiedRemainderGuidepost.lean \
            | tee /tmp/corr4-oai-certified-guidepost.log
          if grep -E 'sorryAx|admitAx|_private' /tmp/corr4-oai-certified-guidepost.log; then
            echo "Nonstandard axiom contamination in CORR4 imported theorem" >&2
            exit 1
          fi
      - name: Kernel-check the complete native UPM/LPM contraction replay
        id: native_replay
        shell: bash
        run: |
          set -euo pipefail
          OAI_PATH="$(cd oai-upstream/lean && lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          RH_PATH="$(lake env python3 -c 'import os; print(os.pathsep.join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(os.pathsep) if p))')"
          python3 scripts/check_shared_lean_packages.py . oai-upstream/lean PrimeNumberTheoremAnd mathlib
          targets=(
            research/oai_434/VF919OriginalMarkedSharpenedSignedNNS.lean
            research/oai_434/VF919NativeEnergyInduction.lean
            research/oai_434/VF919NativeSourceMoments.lean
            research/oai_434/VF919NativeSevenEighthsReplay.lean
            research/oai_434/VF919FiniteSlotReflectedGain.lean
            research/oai_434/VF919TiltedLowReflection.lean
            research/oai_434/VF919TiltedLowPhysical.lean
            research/oai_434/VF919TiltedProbe.lean
            research/oai_434/VF919TiltedHighTails.lean
            research/oai_434/VF919TiltedHighCentral.lean
            research/oai_434/VF919TiltedHighPrincipal.lean
            research/oai_434/VF919TiltedHighTransport.lean
            research/oai_434/VF919TiltedHighAssembly.lean
            research/oai_434/VF919NativeStrictSevenEighths.lean
            research/oai_434/VF919NativeStrictMertens.lean
          )
          : > /tmp/vf919-native-seven-eighths-replay-axioms.log
          compile_failed=0
          for source in "${targets[@]}"; do
            if grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' "$source"; then
              exit 1
            fi
            module="${source%.lean}"
            module="${module//\//.}"
            if ! env LEAN_PATH="$RH_PATH:$OAI_PATH" lean -DwarningAsError=true \
              -o ".lake/build/lib/lean/${module}.olean" "$source" \
              | tee -a /tmp/vf919-native-seven-eighths-replay-axioms.log; then
              compile_failed=1
            fi
          done
          if (( compile_failed )); then
            echo "At least one native contraction target failed Lean verification" >&2
            exit 1
          fi
          if grep -E 'sorryAx|admitAx|_private' /tmp/vf919-native-seven-eighths-replay-axioms.log; then
            echo "Nonstandard axiom contamination in native contraction replay" >&2
            exit 1
          fi
          env LEAN_PATH="$RH_PATH:$OAI_PATH" lean -DwarningAsError=true \
            --run scripts/lean/NativeSevenEighthsReplayAudit.lean \
            | tee /tmp/vf919-native-seven-eighths-replay-dependencies.log
          env LEAN_PATH="$RH_PATH:$OAI_PATH" lean -DwarningAsError=true \
            --run scripts/lean/NativeSevenEighthsReplayAudit.lean \
            research.oai_434.VF919NativeStrictSevenEighths \
            OAI.SevenEighths.RHLeanNativeSevenEighthsReplay.native_beta_lt_seven_eighths \
            | tee /tmp/vf919-native-strict-seven-eighths-dependencies.log
          env LEAN_PATH="$RH_PATH:$OAI_PATH" lean -DwarningAsError=true \
            --run scripts/lean/NativeSevenEighthsReplayAudit.lean \
            research.oai_434.VF919NativeStrictMertens \
            RHLean.Analysis.native_mertens_growth_exponent_lt_seven_eighths \
            | tee /tmp/vf919-native-strict-mertens-dependencies.log
      - name: Preserve native contraction proof and dependency evidence
        if: ${{ !cancelled() && steps.native_replay.outcome != 'skipped' && steps.native_replay.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: vf919-native-seven-eighths-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/vf919-native-seven-eighths-replay-axioms.log
            /tmp/vf919-native-seven-eighths-replay-dependencies.log
            /tmp/vf919-native-strict-seven-eighths-dependencies.log
            /tmp/vf919-native-strict-mertens-dependencies.log
          if-no-files-found: warn
          retention-days: 7
      - name: Generate and kernel-check the slot-anchored contraction
        id: slot_anchored
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/slot_anchored/run.sh "$PWD"
      - name: Preserve generated slot-anchored proofs and verification evidence
        if: ${{ !cancelled() && steps.slot_anchored.outcome != 'skipped' && steps.slot_anchored.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: vf919-slot-anchored-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            anchored-tilt-generation.json
            slot-anchored-lean.log
            slot-anchored-audit-*.log
            research/oai_434/VF919Anchored*.lean
            research/oai_434/VF919PhysicalTiltFullBudget.lean
            research/oai_434/VF919SlotCalibratedData.lean
            research/oai_434/VF919SlotAnchoredEndpoint.lean
            scripts/ci/slot_anchored/
          if-no-files-found: warn
          retention-days: 30
      - name: Accept actual full imported proof and genuine RHLean signed covariance
        run: |
          printf '%s\n' 'Original OpenAI CERTIFIED 7/8 proof: verified by kernel.'
          printf '%s\n' 'Original RHLean signed covariance at EVERY X: verified by kernel.'
          printf '%s\n' 'ALL ORIGINAL signed square-block global covariance: verified by kernel.'
      - name: Preserve final theorem and axiom-check diagnostics
        if: ${{ !cancelled() && steps.native_theorem.outcome != 'skipped' && steps.native_theorem.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: vf919-oai-certified-core-434-axioms-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/vf919-oai-certified-core-434-axioms.log
          if-no-files-found: warn
          retention-days: 7
