name: Three-slot Walsh transition development check

on:
  push:
    branches: [agent/three-slot-walsh-transition]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: three-slot-walsh-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Restore Mathlib packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Set up Lean and Mathlib
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', '**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Compile finite-difference and collision layers
        run: |
          lake build RHLean.Arithmetic.PrimeCombFiniteDifferenceFreshPrime --wfail
          lake build RHLean.Arithmetic.PrimeSquareCollisionKernel --wfail
          lake build RHLean.Arithmetic.PrimeSquareCollisionCRT --wfail
