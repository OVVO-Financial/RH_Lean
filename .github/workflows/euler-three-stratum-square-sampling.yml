name: Euler three-stratum moving square-block sampling Lean

on:
  pull_request:
    branches: [main]
    paths:
      - "research/EULER_THREE_STRATUM_SQUARE_SAMPLING_20261028.lean"
      - "research/EULER_THREE_SITE_STRATIFIED_SAMPLING_20261028.lean"
      - "research/EULER_THREE_STRATUM_SQUARE_SAMPLING_20261028.md"
      - "scripts/euler_three_stratum_square_sampler.cpp"
      - "scripts/euler_three_site_owner_surrogate_sampler.cpp"
      - ".github/workflows/euler-three-stratum-square-sampling.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Lean and cached Mathlib
        uses: ./.github/actions/lean-setup
      - name: Restore PNT+ build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Prebuild PNT+ StrongPNT
        run: lake build PrimeNumberTheoremAnd.StrongPNT
      - name: Restore native library build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      - name: Compile exact research import closure, warnings fatal
        run: |
          python3 scripts/compile_research_import_closure.py --build-library \
            research/EULER_THREE_SITE_STRATIFIED_SAMPLING_20261028.lean
      - name: Standard-axioms audit
        run: |
          cat > /tmp/euler_pop_axioms.lean <<'EOF'
          import «research.EULER_ADMISSIBLE_SIGNED_RETURN_TELESCOPE_20261028»
          #print axioms RHLean.Proof.eulerThree_root_le_half
          #print axioms RHLean.Proof.eulerThreeTopDebt_eq_prime_singletons
          #print axioms RHLean.Proof.eulerThreeTopDebt_eq_primeCounting_gap
          #print axioms RHLean.Proof.eulerAdmissiblePrimeDebt_eq_middle_add_top
          #print axioms RHLean.Proof.eulerThree_endpoint_eq_three_strata
          #print axioms RHLean.Proof.eulerThree_selfDual_eq_three_strata
          #print axioms RHLean.Proof.eulerThree_shellFlow_eq_three
          #print axioms RHLean.Proof.eulerThree_sampledSixTermGram
          #print axioms RHLean.Proof.eulerSite_endpoint_eq_three_location_strata
          #print axioms RHLean.Proof.eulerSite_eq_primeOwner_partition
          #print axioms RHLean.Proof.eulerSite_shellFlow_eq_three
          #print axioms RHLean.Proof.eulerSite_sampledSixTermGram
          #print axioms RHLean.Proof.eulerSiteOwnerSampledCross_eq_squareShellEnergy
          #print axioms RHLean.Proof.eulerSiteOwnerSampledCross_eq_nine_terms
          EOF
          lake env lean -DwarningAsError=true /tmp/euler_pop_axioms.lean | tee /tmp/euler_pop_axioms.log
          if grep -q 'sorryAx' /tmp/euler_pop_axioms.log; then exit 1; fi
          python3 - <<'PY'
          import re
          log = open('/tmp/euler_pop_axioms.log').read()
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for line in log.splitlines():
              match = re.search(r"depends on axioms: \[(.*)\]", line)
              if match:
                  used = {a.strip() for a in match.group(1).split(',') if a.strip()}
                  assert used <= allowed, f"Nonstandard axioms: {used - allowed}"
          print("PASS standard axioms only")
          PY
      - name: No admitted statements
        run: |
          python3 - <<'PY'
          import pathlib, re
          body = ''.join(pathlib.Path(p).read_text() for p in ['research/EULER_THREE_STRATUM_SQUARE_SAMPLING_20261028.lean', 'research/EULER_THREE_SITE_STRATIFIED_SAMPLING_20261028.lean'])
          body = re.sub(r'/-.*?-/', '', body, flags=re.S)
          body = re.sub(r'--.*', '', body)
          assert not re.search(r'\b(sorry|admit|axiom)\b', body)
          print('PASS no sorry, admit, or axiom declarations')
          PY
      - name: Independent moving three-stratum numerical census
        run: |
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            scripts/euler_three_stratum_square_sampler.cpp \
            -o /tmp/euler_three_stratum_square_sampler
          /tmp/euler_three_stratum_square_sampler
      - name: Exact two-stage site/owner surrogate sampling census
        run: |
          g++ -O3 -std=c++17 -Wall -Wextra -Werror \
            scripts/euler_three_site_owner_surrogate_sampler.cpp \
            -o /tmp/euler_three_site_owner_surrogate_sampler
          /tmp/euler_three_site_owner_surrogate_sampler

