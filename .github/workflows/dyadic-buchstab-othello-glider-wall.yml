name: Dyadic Buchstab Othello glider wall check

on:
  pull_request:
    branches: [agent/post-770-long-range-tether-audit, agent/post-771-buchstab-joint-splice, agent/post-772-typeii-glider-splice]
    paths:
      - research/DYADIC_BUCHSTAB_OTHELLO_GLIDER_WALL.lean
      - experiments/dyadic_glider_middle_R56.py
      - .github/workflows/dyadic-buchstab-othello-glider-wall.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Restore PNT+ build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
          key: pntplus-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Prebuild PNT+ StrongPNT dependency
        run: lake build PrimeNumberTheoremAnd.StrongPNT

      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-

      - name: Build RHLean modules imported by these research checks
        run: >-
          python3 scripts/compile_research_import_closure.py --library-only
          research/DYADIC_BUCHSTAB_OTHELLO_GLIDER_WALL.lean
          research/DYADIC_LONG_RANGE_TETHER_AUDIT.lean
          research/DYADIC_SMOOTH_HIGH_JOINT_PACKET.lean

      - name: Build dependencies
        run: |
          lake build RHLean.Analysis.SquareRootPrimeCountGap
          lake build RHLean.Proof.PrefixCarrierOthelloWalls
          lake build RHLean.Proof.RecursivePrimeReplacement
          lake build RHLean.Proof.ReplacementFibreOrientationSplit
          lake build RHLean.Analysis.SquareRootPostCrossingRenewal
          lake build RHLean.Proof.TerminalMertensReduction
          lake build RHLean.Proof.PrimeWheelRoughSeatCorrelation
          lake build RHLean.Arithmetic.MobiusFiniteDifferenceIdentification
          lake build RHLean.Proof.SquareRootLowPrimeBornSquareBoundary
          lake build RHLean.Proof.CanonicalRoughAdaptiveWeightedIteration
          lake build RHLean.Proof.PrimeCombReciprocalBandCancellation
          mkdir -p .lake/build/lib/lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.DYADIC_SMOOTH_HIGH_JOINT_PACKET.olean \
            research/DYADIC_SMOOTH_HIGH_JOINT_PACKET.lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.DYADIC_LONG_RANGE_TETHER_AUDIT.olean \
            research/DYADIC_LONG_RANGE_TETHER_AUDIT.lean

      - name: Kernel-check glider-wall splice
        run: lake env lean -DwarningAsError=true research/DYADIC_BUCHSTAB_OTHELLO_GLIDER_WALL.lean

      - name: Check exact R56 active-middle regression
        run: python3 experiments/dyadic_glider_middle_R56.py
