name: Dyadic Buchstab Othello glider wall check

on:
  pull_request:
    branches: [agent/post-770-long-range-tether-audit, agent/post-771-buchstab-joint-splice]
    paths:
      - research/DYADIC_BUCHSTAB_OTHELLO_GLIDER_WALL.lean
      - experiments/dyadic_glider_middle_R56.py
      - .github/workflows/dyadic-buchstab-othello-glider-wall.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Apply StrongPNT 4.24 compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py

      - name: Restore StrongPNT port build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages/PrimeNumberTheoremAnd/.lake/build
            .lake/packages/StrongPNT/.lake/build
          key: strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('scripts/strongpnt_424/*.py') }}
          restore-keys: |
            strongpnt-port-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Prebuild StrongPNT dependency
        run: lake build StrongPNT.PNT5_Strong

      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-
            rhlean-build-${{ runner.os }}-

      - name: Build dependencies
        run: |
          lake build RHLean.Analysis.SquareRootPrimeCountGap
          lake build RHLean.Proof.PrefixCarrierOthelloWalls
          lake build RHLean.Proof.RecursivePrimeReplacement
          lake build RHLean.Proof.ReplacementFibreOrientationSplit
          lake build RHLean.Analysis.SquareRootPostCrossingRenewal
          mkdir -p .lake/build/lib/lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.DYADIC_SMOOTH_HIGH_JOINT_PACKET.olean \
            research/DYADIC_SMOOTH_HIGH_JOINT_PACKET.lean
          lake env lean -DwarningAsError=true \
            -o .lake/build/lib/lean/research.DYADIC_LONG_RANGE_TETHER_AUDIT.olean \
            research/DYADIC_LONG_RANGE_TETHER_AUDIT.lean

      - name: Kernel-check glider-wall splice
        run: lake env lean -DwarningAsError=true research/DYADIC_BUCHSTAB_OTHELLO_GLIDER_WALL.lean

      - name: Check exact R56 active-middle regression
        run: python3 experiments/dyadic_glider_middle_R56.py
