name: Alpoge Stage 1 closed external proof
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/alpoge_stage1/**'
      - '.github/workflows/alpoge-stage1-external.yml'
      - 'RHLean/Analysis/AlpogeNativeBoundHandoff.lean'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alpoge-stage1-external-${{ github.ref }}
  cancel-in-progress: true
jobs:
  closed-external-rh:
    # The frozen upstream cache requires about 105 GB of free disk. Use
    # an authorized large hosted runner through a repository variable.
    # On a smaller runner the resource preflight fails before downloading.
    runs-on: ${{ vars.RHLEAN_ALPOGE_REPLAY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Check capacity before restoring the pinned external proof
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          free -h
          available=$(df -Pk . | awk 'NR==2 {print $4}')
          if (( available < 115 * 1024 * 1024 )); then
            echo "::error::Frozen Alpoge replay requires at least 115 GiB free disk including headroom. Configure RHLEAN_ALPOGE_REPLAY_RUNNER to an authorized sufficiently large hosted runner."
            exit 1
          fi
      - name: Check out frozen upstream with published compiled cache
        uses: actions/checkout@v4
        with:
          repository: homeowmorphism/riemann-hypothesis-original
          ref: 774b9e8022f50d20be861ecc9d609cfc26436a81
          path: alpoge-stage1-upstream
          persist-credentials: false
      - name: Restore exact upstream toolchain and compressed proof cache
        id: frozen-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.elan/toolchains
            alpoge-stage1-upstream/.lake/cache
          key: alpoge-stage1-frozen-v1-${{ runner.os }}-${{ runner.arch }}-774b9e8022f50d20be861ecc9d609cfc26436a81
      - name: Compile and audit the closed quantitative and RH roots
        run: bash scripts/alpoge_stage1/replay.sh alpoge-stage1-upstream
      - name: Save pinned compressed cache on success
        if: steps.frozen-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.elan/toolchains
            alpoge-stage1-upstream/.lake/cache
          key: ${{ steps.frozen-cache.outputs.cache-primary-key }}
      - name: Publish compilation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpoge-stage1-closed-rh
          path: |
            alpoge-stage1.log
            alpoge-stage1-upstream/RHLeanStage1.olean
            alpoge-stage1-upstream/RHLeanStage1.lean
          if-no-files-found: warn
