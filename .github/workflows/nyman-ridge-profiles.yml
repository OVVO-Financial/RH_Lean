name: Nyman finite ridge profiles
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/NYMAN_RIDGE_*.lean'
      - 'scripts/lean/nyman_ridge/**'
      - 'scripts/nyman_ridge_regression.py'
      - '.github/workflows/nyman-ridge-profiles.yml'
permissions:
  contents: read
concurrency:
  group: nyman-ridge-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true
jobs:
  ridge-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check raw head, pins, public inventory and rational fixtures
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          test "$(jq -r '.packages[] | select(.name=="mathlib") | .rev' lake-manifest.json)" = 'd13f23b723b8a846827a245b89c10fc7d3f11612'
          python3 scripts/nyman_ridge_regression.py
      - uses: ./.github/actions/lean-setup
      - uses: ./.github/actions/lean-compiled-cache
      - name: Warning-fatal original-source import closure
        id: proof
        uses: ./.github/actions/research-compile
        with:
          build-library: 'true'
          targets: research/NYMAN_RIDGE_PROFILES.lean
      - name: Verify exact interfaces and transitive kernel dependencies
        run: |
          set -euo pipefail
          lake env lean -DwarningAsError=true scripts/lean/nyman_ridge/ExactTypes.lean 2>&1 | tee ridge-types.log
          lake env lean -DwarningAsError=true --run scripts/lean/nyman_ridge/Audit.lean 2>&1 | tee ridge-audit.log
          test "$(grep -c '^RIDGE_AUDIT ' ridge-audit.log)" -eq 7
      - name: Annotate first compiler failure
        if: failure() && steps.proof.outcome == 'failure'
        run: |
          for file in research/NYMAN_RIDGE_{GEOMETRY,PROFILES}.lean; do
            if ! lake env lean -DwarningAsError=true "$file" >ridge-diagnostics.log 2>&1; then
              sed -n '/: \(error\|warning\)/,$p' ridge-diagnostics.log | head -c 4500 || true
              break
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nyman-ridge-${{ github.event.pull_request.head.sha }}
          path: |
            ridge-types.log
            ridge-audit.log
            ridge-diagnostics.log
          if-no-files-found: warn
