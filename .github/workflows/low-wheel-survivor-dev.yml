name: Low-wheel survivor proof gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'RHLean/Proof/LowWheelHighPrimeSurvivor.lean'
      - 'RHLean/Proof/LowWheelSurvivorInclusionExclusion.lean'
      - 'RHLean/Proof/LowWheelSurvivorFloorExpansion.lean'
      - 'RHLean/Proof/LowWheelTransportTripleCarrier.lean'
      - 'RHLean/Proof/LowWheelCofactorQuotientToggle.lean'
      - 'RHLean/Proof/LowWheelCanonicalCofactorQuotientPairing.lean'
      - 'RHLean/Proof/LowWheelDoubleFaceFiniteDifference.lean'
      - 'RHLean/Proof/LowWheelSequentialGeometricSavings.lean'
      - 'RHLean/Proof/LowWheelSequentialPrimeWindows.lean'
      - 'RHLean/Proof/LowWheelSequentialWindowTelescope.lean'
      - 'RHLean/Proof/LowWheelDoubleCubeTransport.lean'
      - 'RHLean/Proof/LowWheelDoubleCubeSequentialFold.lean'
      - 'RHLean/Proof/LowWheelDoubleCubeWindowFold.lean'
      - 'RHLean/Proof/LowWheelSequentialRoughWindowFold.lean'
      - 'RHLean/Proof/LowWheelSequentialSmoothRoughBoundary.lean'
      - 'RHLean/Proof/LowWheelAncestryCrossLedgerBridge.lean'
      - '.github/workflows/low-wheel-survivor-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: low-wheel-survivor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  target:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore Mathlib and dependency builds
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Apply StrongPNT compatibility patches
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py
      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py') }}-
            rhlean-build-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore partial low-wheel build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: low-wheel-build-${{ github.sha }}
          restore-keys: |
            low-wheel-build-
      - name: Compile targets
        run: |
          lake build RHLean.Proof.LowWheelHighPrimeSurvivor
          lake build RHLean.Proof.LowWheelSurvivorInclusionExclusion
          lake build RHLean.Proof.LowWheelSurvivorFloorExpansion
          lake build RHLean.Proof.LowWheelTransportTripleCarrier
          lake build RHLean.Proof.LowWheelCofactorQuotientToggle
          lake build RHLean.Proof.LowWheelCanonicalCofactorQuotientPairing
          lake build RHLean.Proof.LowWheelDoubleFaceFiniteDifference
          lake build RHLean.Proof.LowWheelSequentialGeometricSavings
          lake build RHLean.Proof.LowWheelSequentialPrimeWindows
          lake build RHLean.Proof.LowWheelSequentialWindowTelescope
          lake build RHLean.Proof.LowWheelDoubleCubeTransport
          lake build RHLean.Proof.LowWheelDoubleCubeSequentialFold
          lake build RHLean.Proof.LowWheelDoubleCubeWindowFold
          lake build RHLean.Proof.LowWheelSequentialRoughWindowFold
          lake build RHLean.Proof.LowWheelSequentialSmoothRoughBoundary
          lake build RHLean.Proof.LowWheelAncestryCrossLedgerBridge
      - name: Save partial low-wheel build cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .lake/build
          key: low-wheel-build-${{ github.sha }}
