name: OAI marked polarized NNS and phase-correct Euler
on:
  pull_request:
    paths:
      - 'research/VF_919_OAI_POLARIZED_EULER_BRIDGE_20261021.lean'
      - 'research/OAI_POLARIZED_PARSEVAL_EULER_OBSTRUCTION_20261021.md'
      - 'scripts/oai_marked_polarized_euler_audit.py'
      - '.github/workflows/oai-marked-polarized-euler.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  polarized-numerical:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Test all marked derivative pairs and exact character phases
        run: python3 scripts/oai_marked_polarized_euler_audit.py

  polarized-mathlib-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/lean-setup
      - name: Compile standalone polarized NNS math (no full RHLean library)
        run: |
          lake env lean -DwarningAsError=true research/VF_919_OAI_POLARIZED_EULER_BRIDGE_20261021.lean
      - name: Check the actual compiled NNS and phase-theorem signatures
        run: |
          cp research/VF_919_OAI_POLARIZED_EULER_BRIDGE_20261021.lean /tmp/VF_919_OAI_POLAR_ACCEPTANCE_TEMP.lean
          cat >> /tmp/VF_919_OAI_POLAR_ACCEPTANCE_TEMP.lean <<'LEAN'
          #check RHLean.Analysis.vf919Polar_mixed_fourth
          #check RHLean.Analysis.vf919Polar_weighted_mixed_fourth
          #check RHLean.Analysis.vf919Polar_character_toggle_log1
          #check RHLean.Analysis.vf919Polar_character_toggle_log2
          #check RHLean.Analysis.vf919Polar_restricted_char_resonance_counterexample
          #print axioms RHLean.Analysis.vf919Polar_mixed_fourth
          #print axioms RHLean.Analysis.vf919Polar_restricted_char_resonance_counterexample
          LEAN
          lake env lean -DwarningAsError=true /tmp/VF_919_OAI_POLAR_ACCEPTANCE_TEMP.lean
