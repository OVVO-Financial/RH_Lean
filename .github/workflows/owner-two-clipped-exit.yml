name: Owner-two clipped exit audit

on:
  pull_request:
    branches: [main]
    paths:
      - research/GLOBAL_RETURNED_CORE_OWNER_TWO_CLIPPED_EXIT.lean
      - research/SQUARE_ENDPOINT_STEP_POLYLOG_STRENGTH.lean
      - research/OWNER_TWO_UPPER_HALF_POLARIZATION.lean
      - research/DYADIC_SMOOTH_HIGH_JOINT_PACKET.lean
      - .github/workflows/owner-two-clipped-exit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore Lake packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Apply StrongPNT 4.24 compatibility patch
        run: |
          python3 scripts/strongpnt_424/apply.py
          python3 scripts/strongpnt_424/apply_post.py
          python3 scripts/strongpnt_424/apply_pnt5_mid.py
          python3 scripts/strongpnt_424/apply_pnt5_strong.py
          python3 scripts/strongpnt_424/apply_lint.py
      - name: Restore RHLean build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: rhlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/strongpnt_424/*.py', 'RHLean.lean', 'RHLean/**/*.lean') }}
          restore-keys: |
            rhlean-build-${{ runner.os }}-
      - name: Audit repository assumptions
        run: bash scripts/audit_assumptions.sh
      - name: Build exact library dependencies
        run: |
          lake build RHLean.Proof.SquareRootLowPrimeTSectorQ2Renormalization RHLean.Proof.VanishingTransitionRelevanceBase
      - name: Compile research dependency chain
        run: |
          mkdir -p .lake/build/lib/lean
          emit() { f="$1"; b="$(basename "$f" .lean)"; lake env lean -DwarningAsError=true -o ".lake/build/lib/lean/research.${b}.olean" "$f"; }
          emit research/STABLE_FAR_RECIPROCAL_OWNER_FUBINI.lean
          emit research/STABLE_FAR_RETURNED_FIBER_PRODUCTION.lean
          emit research/STABLE_FAR_RETURNED_RECIPROCAL_FROZEN_WINDOW.lean
          emit research/STABLE_FAR_RETURNED_FIBER_FUBINI.lean
          emit research/CANONICAL_ROUGH_GLOBAL_BOUNDS.lean
          emit research/CANONICAL_ROUGH_Q2_TAIL_REDUCTION.lean
          emit research/LOW_OWNER_HIGH_Q2_SCALAR_CANCELLATION.lean
          emit research/LOW_OWNER_CHILD_FAR_NORMAL_FORM.lean
          emit research/LOW_OWNER_PHYSICAL_CENSUS_CORRELATION.lean
          emit research/STABLE_FAR_LOG_FREQUENCY_DIAGONALIZATION.lean
          emit research/STABLE_FAR_PERRON_RETURNED_FIBER_INTERFACE.lean
          emit research/STABLE_FAR_CRITICAL_Q2_ENERGY_MULTIPLIER.lean
          emit research/STABLE_FAR_PERRON_QUARTER_FRAME_BOUND.lean
          emit research/LOW_OWNER_PHYSICAL_AMPLITUDE_TRANSPORT.lean
          emit research/COVARIANCE_RECIPROCAL_OWNER_CONGESTION.lean
          emit research/LOW_OWNER_AMPLITUDE_MELLIN_LEDGER_SPLICE.lean
          emit research/AMPLITUDE_STOKES_MEMORY_SPLIT.lean
          emit research/AMPLITUDE_RECIPROCAL_DROP_PHYSICAL_DEFECT.lean
          emit research/DIRECT_SUM_DYADIC_DISPERSION_BRIDGE.lean
          emit research/DIRECT_SUM_LOW_FRESHNESS_ABEL.lean
          emit research/DIRECT_SUM_COUPLED_PACKET.lean
          emit research/DIRECT_SUM_COUPLED_FRESH_PRIME_RANGE_EXIT.lean
          emit research/DIRECT_SUM_COUPLED_RANGE_EXIT_COLLAPSE.lean
          emit research/DIRECT_SUM_FRESH_PRIME_GLOBAL_COLLAPSE.lean
          emit research/DIRECT_SUM_FRESH_PRIME_STOKES_PRE_SQUARE.lean
          emit research/AMPLITUDE_GLOBAL_PHYSICAL_DEFECT_LEDGER.lean
          emit research/CANONICAL_DESCENDING_PRIME_CHRONOLOGY.lean
          emit research/AMPLITUDE_RETURNED_FIBER_PHYSICAL_BRIDGE.lean
          emit research/STABLE_FAR_RETURNED_RECIPROCAL_PHYSICAL_BRIDGE.lean
          emit research/STABLE_FAR_GLOBAL_RETURNED_MEMORY_FUBINI.lean
          emit research/LOW_OWNER_RETURNED_AMPLITUDE_CORE.lean
          emit research/STABLE_FAR_PERRON_REALIFICATION.lean
          emit research/ZERO_TARGET_PARTIAL_MOMENT_COVARIANCE.lean
          emit research/ZERO_TARGET_MELLIN_FRESH_PRIME_SQUARE.lean
          emit research/ZERO_TARGET_COVARIANCE_OWNER_DESCENT.lean
          emit research/ZERO_TARGET_MELLIN_PHYSICAL_LCM_STENCIL.lean
          emit research/ZERO_TARGET_PERRON_RECIPROCAL_IDENTIFICATION.lean
          emit research/ZERO_TARGET_CRITICAL_CLIPPED_EDGE.lean
          emit research/ZERO_TARGET_CRITICAL_CLIPPED_EDGE_BOUNDARY_SPLIT.lean
          emit research/RECIPROCAL_COVARIANCE_PAIR_AMPLITUDE_CONTRACTION.lean
          emit research/ZERO_TARGET_CLIPPED_OWNER_ENERGY_CONTRACTION.lean
          emit research/ZERO_TARGET_MELLIN_COMPLETE_POST_ROOT_CUBES.lean
          emit research/GLOBAL_RETURNED_CORE_ZERO_TARGET_COVARIANCE.lean
          emit research/GLOBAL_RETURNED_CORE_CONTINUATION_CARRIER.lean
          emit research/GLOBAL_RETURNED_CORE_WEIGHTED_MOBIUS_COORDINATE.lean
          emit research/GLOBAL_RETURNED_CORE_WEIGHTED_GRAM.lean
          emit research/GLOBAL_RETURNED_CORE_ONE_AMPLITUDE.lean
          emit research/GLOBAL_RETURNED_CORE_FIRST_OWNER_GRAM.lean
          emit research/GLOBAL_RETURNED_CORE_FIRST_OWNER_CELLS.lean
          emit research/GLOBAL_RETURNED_CORE_FIRST_OWNER_CELL_FUBINI.lean
          emit research/GLOBAL_RETURNED_CORE_COMPENSATED_OWNER_BLOCK.lean
      - name: Kernel-check owner-two clipped exit and step strength
        run: |
          mkdir -p .lake/build/lib/lean
          set -o pipefail
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.GLOBAL_RETURNED_CORE_OWNER_TWO_CLIPPED_EXIT.olean research/GLOBAL_RETURNED_CORE_OWNER_TWO_CLIPPED_EXIT.lean 2>&1 | tee owner-two-clipped-exit.log
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.SQUARE_ENDPOINT_STEP_POLYLOG_STRENGTH.olean research/SQUARE_ENDPOINT_STEP_POLYLOG_STRENGTH.lean 2>&1 | tee -a owner-two-clipped-exit.log
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.DYADIC_SMOOTH_HIGH_JOINT_PACKET.olean research/DYADIC_SMOOTH_HIGH_JOINT_PACKET.lean 2>&1 | tee -a owner-two-clipped-exit.log
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/research.OWNER_TWO_UPPER_HALF_POLARIZATION.olean research/OWNER_TWO_UPPER_HALF_POLARIZATION.lean 2>&1 | tee -a owner-two-clipped-exit.log
      - name: Audit named theorem axioms
        run: |
          cat > /tmp/OwnerTwoClippedExitAxioms.lean <<'LEAN'
          import «research.GLOBAL_RETURNED_CORE_OWNER_TWO_CLIPPED_EXIT»
          import «research.SQUARE_ENDPOINT_STEP_POLYLOG_STRENGTH»
          import «research.OWNER_TWO_UPPER_HALF_POLARIZATION»
          #print axioms RHLean.Proof.lowOwnerFirstOwnerClippedAmplitude_two_eq_topMertens
          #print axioms RHLean.Proof.lowOwnerFirstOwnerCompensatedInteriorAmplitude_two_eq
          #print axioms RHLean.Proof.lowOwnerZeroFrequencyMobiusAmplitude_eq_ownerTwoInterior_add_clipped
          #print axioms RHLean.Proof.sum_Icc_pFree_clipped_realMoebiusStep_eq_mertens
          #print axioms RHLean.Proof.squareEndpointMertensEnergyReal_eq_ownerTwoClipped_sq
          #print axioms RHLean.Proof.squareEndpointRoundedOddQ2EnergyStep_iff_ownerTwoClippedExit
          #print axioms RHLean.Proof.lowOwnerFirstOwnerCompensatedInteriorAmplitude_two_sq_le
          #print axioms RHLean.Proof.ownerTwoCompensatedInterior_fourEnergyBound_unconditional
          #print axioms RHLean.Proof.lowerMertensCriticalEnvelope_two_one_kernel
          #print axioms RHLean.Proof.lowerMertensCriticalEnvelope_sq_of_amplification
          #print axioms RHLean.Proof.lowerMertensCriticalEnvelope_doubleExponential_of_amplification
          #print axioms RHLean.Proof.squareEndpointRoundedOddQ2EnergyStep_forces_polylogMertensEnvelope
          #print axioms RHLean.Proof.squareRootDyadicJointPacket_eq_smooth_sub_transport
          #print axioms RHLean.Proof.squareRootDyadicJointPacket_normSq_eq_smooth_transport_polarization
          #print axioms RHLean.Proof.squareEndpointMertensEnergyReal_eq_ownerTwoJointPacket_normSq
          #print axioms RHLean.Proof.squareEndpointMertensEnergyReal_eq_smooth_transport_polarization
          #print axioms RHLean.Proof.squareEndpointRoundedOddQ2EnergyStep_iff_ownerTwoSmoothTransportCovariance
          LEAN
          set -o pipefail
          lake env lean -DwarningAsError=true /tmp/OwnerTwoClippedExitAxioms.lean 2>&1 | tee owner-two-clipped-exit-axioms.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          s = Path('owner-two-clipped-exit-axioms.log').read_text()
          records = re.findall(r"depends on axioms:\s*\[([^\]]*)\]", s, re.S)
          assert len(records) == 17, records
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for record in records:
              actual = {a.strip() for a in record.split(',') if a.strip()}
              assert actual <= allowed, actual
          PY
      - name: Retain compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-two-clipped-exit-logs
          path: owner-two-clipped-exit*.log
          if-no-files-found: ignore
