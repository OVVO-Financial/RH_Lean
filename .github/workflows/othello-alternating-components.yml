name: Othello alternating-component theorem check

on:
  push:
    branches: [agent/othello-alternating-components]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: othello-alternating-components-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Import finite matching modules in root manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("RHLean.lean")
          targets = {
              "import RHLean.Proof.FiniteOthelloMatching",
              "import RHLean.Proof.FiniteLeastToggleDuality",
          }
          lines = [line.strip() for line in manifest.read_text().splitlines() if line.strip()]
          for target in targets:
              if target not in lines:
                  lines.append(target)
          manifest.write_text("\n".join(sorted(lines)) + "\n")
          PY
          if ! git diff --quiet -- RHLean.lean; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add RHLean.lean
            git commit -m "Import finite Othello theorem modules"
            git push
          fi

      - name: Check Lean root import manifest
        run: python3 scripts/check_root_manifest.py

      - name: Audit unfinished proofs and axioms
        run: bash scripts/audit_assumptions.sh

      - uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Kernel-check finite Othello parity theorems
        run: |
          lake build \
            RHLean.Proof.FiniteOthelloMatching \
            RHLean.Proof.FiniteLeastToggleDuality
