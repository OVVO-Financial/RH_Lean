name: Othello alternating-component theorem check

on:
  push:
    branches: [agent/othello-alternating-components]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: othello-alternating-components-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - name: Kernel-check finite Othello parity theorems
        run: |
          lake build \
            RHLean.Proof.FiniteOthelloMatching \
            RHLean.Proof.FiniteLeastToggleDuality
