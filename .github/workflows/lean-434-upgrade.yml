name: Staged Lean 4.34.1 tracker migration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/lean434/**'
      - '.github/workflows/lean-434-upgrade.yml'
      - 'scripts/strongpnt_434/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staged-lean434-pr983
  cancel-in-progress: true

jobs:
  stage:
    name: Isolated 4.34.1 dependency and Lean port
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout source and retain root 4.24 verification environment
        uses: actions/checkout@v4

      - name: Overlay 4.34.1 candidate pins in this runner ONLY
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.24.0'
          cp .github/lean434/lean-toolchain lean-toolchain
          cp .github/lean434/lakefile.lean lakefile.lean
          cp .github/lean434/lake-manifest.json lake-manifest.json
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          echo 'Root checked-in toolchain is unchanged; runner uses candidate v4.34.1.'

      - name: Install candidate compiler without forcing old-package caches
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
          build: false
          test: false
          lint: false

      - name: Regenerate candidate dependency graph and check source pins
        shell: bash
        run: |
          set -euo pipefail
          lake update 2>&1 | tee lean-434-update.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('lake-manifest.json').read_text())
          packages = {row['name']: row['rev'] for row in manifest['packages']}
          required = {
              'mathlib': 'd13f23b723b8a846827a245b89c10fc7d3f11612',
              'PrimeNumberTheoremAnd': 'c39a751132c88b6e8080b74c74023fd95b3d8be0',
          }
          for name, rev in required.items():
              print(f'{name}: {packages.get(name)}')
              assert packages.get(name) == rev, f'{name} version drift: {packages.get(name)}'
          mathlib = json.loads(Path('.lake/packages/mathlib/lake-manifest.json').read_text())
          for row in mathlib['packages']:
              got = packages.get(row['name'])
              if got is not None and got != row['rev']:
                  raise RuntimeError(
                      f"Mathlib transitive mismatch {row['name']}: {got} != {row['rev']}"
                  )
          PY
          if ! cmp -s lake-manifest.json .github/lean434/lake-manifest.json; then
            echo 'Candidate lock regeneration changed packages; see artifact and commit the correct lock.'
            diff -u .github/lean434/lake-manifest.json lake-manifest.json > lean-434-lock-diff.log || true
          else
            echo 'Candidate manifest already matches Lake regeneration.'
          fi

      - name: Get consistent Mathlib cache and smoke-test Lean
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get 2>&1 | tee lean-434-cache.log
          printf 'import Mathlib\n#check Nat.Prime\n' > lean-434-smoke.lean
          lake env lean lean-434-smoke.lean 2>&1 | tee lean-434-smoke.log

      - name: Compile modern PNT+ StrongPNT and zero-free source
        shell: bash
        run: |
          set -euo pipefail
          lake build PrimeNumberTheoremAnd.StrongPNT 2>&1 | tee lean-434-modern-pnt.log

      - name: Audit the modern strong PNT and zero-free axioms
        shell: bash
        run: |
          set -euo pipefail
          cat > lean-434-modern-axioms.lean <<'EOF'
          import PrimeNumberTheoremAnd.StrongPNT
          #print axioms StrongPNT
          #print axioms ZetaZeroFree1
          #print axioms ZetaNoZerosInBox
          EOF
          lake env lean lean-434-modern-axioms.lean 2>&1 | tee lean-434-modern-axioms.log
          if grep -E 'sorryAx|admitAx' lean-434-modern-axioms.log; then
            echo "Modern PNT+ proof uses forbidden axioms." >&2
            exit 1
          fi

      - name: Adapt RHLean's historical imports to equivalent modern PNT+ theorems
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/strongpnt_434/use_modern_pnt.py 2>&1 | tee lean-434-modern-adapter.log

      - name: Compile the zero-free corridor against modern theorems
        shell: bash
        run: |
          set -euo pipefail
          lake build RHLean.Analysis.StrongMertensLogNineCorridor 2>&1 | tee lean-434-modern-corridor.log

      - name: Compile direct smoothing and reciprocal-zeta kernel
        shell: bash
        run: |
          set -euo pipefail
          lake build RHLean.Analysis.StrongMertensZetaKernel 2>&1 | tee lean-434-modern-kernel.log
          lake build RHLean.Analysis.StrongMertensSmoothingFinite 2>&1 | tee lean-434-modern-smoothing.log

      - name: Compile the complete RHLean library on Lean 4.34.1
        shell: bash
        run: |
          set -euo pipefail
          lake build RHLean 2>&1 | tee lean-434-rhlean.log

      - name: Audit repository-owned proof assumptions
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/audit_assumptions.sh
          lake env lean research/MERTENS_CONVERSE_IDENTIFICATION.lean 2>&1 |
            tee lean-434-mertens-converse.log

      - name: Publish available migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-434-isolated-diagnostics
          path: |
            lean-434-*.log
            lean-434-*.lean
            lake-manifest.json
          if-no-files-found: ignore
