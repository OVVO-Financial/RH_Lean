name: Regenerate RHLean root manifest

on:
  push:
    branches: [agent/strong-mertens-k2-clean]
    paths:
      - '.github/workflows/strong-mertens-boundscore-repair.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strong-mertens-k2-clean
          fetch-depth: 0

      - name: Regenerate sorted root imports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          modules = sorted(
              '.'.join(path.with_suffix('').parts)
              for path in Path('RHLean').rglob('*.lean')
          )
          Path('RHLean.lean').write_text(
              ''.join(f'import {module}\n' for module in modules),
              encoding='utf-8',
          )
          PY
          python3 scripts/check_root_manifest.py
          git diff --check

      - name: Publish root manifest
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- RHLean.lean; then
            echo 'RHLean.lean already current'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- RHLean.lean
          git commit -m 'Regenerate RHLean root manifest'
          git push origin HEAD:agent/strong-mertens-k2-clean
