name: Strong Mertens Bounds warning repair

on:
  push:
    branches: [agent/strong-mertens-k2-clean]
    paths:
      - '.github/workflows/strong-mertens-boundscore-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strong-mertens-k2-clean

      - name: Remove Bounds dead tactics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('RHLean/Analysis/StrongMertensLogNineBounds.lean')
          text = path.read_text()

          old1 = '''                  convert hp using 1 <;>
                    field_simp [ne_of_gt heps.1] <;> ring'''
          new1 = '''                  convert hp using 1
                  field_simp [ne_of_gt heps.1]'''
          if text.count(old1) != 1:
              raise SystemExit(f'pointwise warning site: expected 1, found {text.count(old1)}')
          text = text.replace(old1, new1)

          old2 = '''              field_simp [Real.pi_ne_zero, ne_of_gt heps.1, ne_of_gt hsigpos]
              <;> ring'''
          new2 = '''              field_simp [Real.pi_ne_zero, ne_of_gt heps.1, ne_of_gt hsigpos]'''
          if text.count(old2) != 1:
              raise SystemExit(f'final algebra warning site: expected 1, found {text.count(old2)}')
          text = text.replace(old2, new2)

          path.write_text(text)
          PY

      - name: Publish Bounds warning repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- RHLean/Analysis/StrongMertensLogNineBounds.lean
          git commit -m 'Remove dead tactics from Strong Mertens bounds'
          git push origin HEAD:agent/strong-mertens-k2-clean
