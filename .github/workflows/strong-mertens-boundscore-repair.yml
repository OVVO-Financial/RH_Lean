name: Strong Mertens finite smoothing proof repair

on:
  push:
    branches: [agent/strong-mertens-k2-clean]
    paths:
      - '.github/workflows/strong-mertens-boundscore-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strong-mertens-k2-clean

      - name: Apply finite smoothing proof repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('RHLean/Analysis/StrongMertensSmoothingFinite.lean')
          text = path.read_text()

          old = '''    rw [Real.norm_of_nonneg]
    · apply smooth_le_one
      omega
    · apply smooth_nonneg
      omega'''
          new = '''    rw [Real.norm_of_nonneg]
    · simpa [F, Nat.cast_add] using smooth_le_one (n + n0) (by omega)
    · simpa [F, Nat.cast_add] using smooth_nonneg (n + n0) (by omega)'''
          if text.count(old) != 1:
              raise SystemExit(f'smoothing cast site: expected 1, found {text.count(old)}')
          text = text.replace(old, new)

          old = '''        · apply floor_X_add_one_le_self.trans
          rw [show X + 1 ≤ X * (1 + eps * c1) by
            ring_nf
            linarith [X_bound_1]]'''
          new = '''        · exact floor_X_add_one_le_self.trans (by
            ring_nf
            linarith [X_bound_1])'''
          if text.count(old) != 1:
              raise SystemExit(f'floor transitivity site: expected 1, found {text.count(old)}')
          text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Publish finite smoothing proof repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- RHLean/Analysis/StrongMertensSmoothingFinite.lean
          git commit -m 'Repair Strong Mertens finite smoothing proof'
          git push origin HEAD:agent/strong-mertens-k2-clean
