name: Strong Mertens Horizontal warning repair

on:
  push:
    branches: [agent/strong-mertens-k2-clean]
    paths:
      - '.github/workflows/strong-mertens-boundscore-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strong-mertens-k2-clean

      - name: Remove dead Horizontal tactic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('RHLean/Analysis/StrongMertensLogNineHorizontal.lean')
          text = path.read_text()
          old = '                field_simp [ne_of_gt hApos] <;> ring'
          new = '                field_simp [ne_of_gt hApos]'
          n = text.count(old)
          if n != 1:
              raise SystemExit(f'expected exactly one dead-tactic site, found {n}')
          path.write_text(text.replace(old, new))
          PY

      - name: Publish warning repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- RHLean/Analysis/StrongMertensLogNineHorizontal.lean
          git commit -m 'Remove dead Horizontal tactic'
          git push origin HEAD:agent/strong-mertens-k2-clean
