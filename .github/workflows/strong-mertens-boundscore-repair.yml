name: Strong Mertens finite smoothing proof repair

on:
  push:
    branches: [agent/strong-mertens-k2-clean]
    paths:
      - '.github/workflows/strong-mertens-boundscore-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strong-mertens-k2-clean

      - name: Apply finite smoothing proof repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('RHLean/Analysis/StrongMertensSmoothingFinite.lean')
          text = path.read_text()
          original = text

          replacements = [
            (
              '    · apply smooth_le_one\n      omega',
              '    · simpa [F, Nat.cast_add] using smooth_le_one (n + n0) (by omega)',
              'upper smoothing cast'
            ),
            (
              '    · apply smooth_nonneg\n      omega',
              '    · simpa [F, Nat.cast_add] using smooth_nonneg (n + n0) (by omega)',
              'lower smoothing cast'
            ),
            (
              '        · apply floor_X_add_one_le_self.trans\n          rw [show X + 1 ≤ X * (1 + eps * c1) by\n            ring_nf\n            linarith [X_bound_1]]',
              '        · exact floor_X_add_one_le_self.trans (by\n            ring_nf\n            linarith [X_bound_1])',
              'floor transitivity'
            ),
          ]
          for old, new, label in replacements:
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly one site, found {n}')
              text = text.replace(old, new)

          if text == original:
              raise SystemExit('repair made no changes')
          path.write_text(text)
          PY
          git diff --check
          git diff -- RHLean/Analysis/StrongMertensSmoothingFinite.lean

      - name: Publish finite smoothing proof repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- RHLean/Analysis/StrongMertensSmoothingFinite.lean
          git commit -m 'Repair Strong Mertens finite smoothing proof'
          git push origin HEAD:agent/strong-mertens-k2-clean
