name: Strong Mertens finite smoothing warning repair

on:
  push:
    branches: [agent/strong-mertens-k2-clean]
    paths:
      - '.github/workflows/strong-mertens-boundscore-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strong-mertens-k2-clean

      - name: Remove unused c2_lt parameter
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('RHLean/Analysis/StrongMertensSmoothingFinite.lean')
          text = path.read_text()
          old = '(c2 : ℝ) (c2_pos : 0 < c2) (c2_lt : c2 < 2)'
          new = '(c2 : ℝ) (c2_pos : 0 < c2)'
          n = text.count(old)
          if n != 1:
              raise SystemExit(f'c2_lt parameter: expected exactly one site, found {n}')
          text = text.replace(old, new)
          path.write_text(text)
          PY
          git diff --check
          git diff -- RHLean/Analysis/StrongMertensSmoothingFinite.lean

      - name: Publish finite smoothing warning repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- RHLean/Analysis/StrongMertensSmoothingFinite.lean
          git commit -m 'Remove unused Strong Mertens smoothing parameter'
          git push origin HEAD:agent/strong-mertens-k2-clean
