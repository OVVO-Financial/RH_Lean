name: Strong Mertens finite smoothing syntax repair

on:
  push:
    branches: [agent/strong-mertens-k2-clean]
    paths:
      - '.github/workflows/strong-mertens-boundscore-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strong-mertens-k2-clean

      - name: Port finite-sum binders to Lean 4.24
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('RHLean/Analysis/StrongMertensSmoothingFinite.lean')
          text = path.read_text()
          new, count = re.subn(r'∑ ([A-Za-z_][A-Za-z0-9_]*) in ', r'∑ \1 ∈ ', text)
          if count < 2:
              raise SystemExit(f'expected multiple historical finite-sum binders, found {count}')
          if '∑ n in ' in new or '∑ x in ' in new or '∑ _n in ' in new:
              raise SystemExit('old finite-sum binder syntax remains')
          path.write_text(new)
          print(f'ported {count} finite-sum binders')
          PY

      - name: Publish finite smoothing syntax repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- RHLean/Analysis/StrongMertensSmoothingFinite.lean
          git commit -m 'Port Strong Mertens finite sums to Lean 4.24'
          git push origin HEAD:agent/strong-mertens-k2-clean
