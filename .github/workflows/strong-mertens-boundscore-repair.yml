name: Strong Mertens Horizontal repair pass

on:
  push:
    branches: [agent/strong-mertens-k2-clean]
    paths:
      - '.github/workflows/strong-mertens-boundscore-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strong-mertens-k2-clean

      - name: Apply final Horizontal repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('RHLean/Analysis/StrongMertensLogNineHorizontal.lean')
          text = path.read_text()
          old1 = """    have hMnonneg : 0 ≤ Cm * (eps * ‖s‖ ^ 2)⁻¹ := by positivity"""
          new1 = """    have hMnonneg : 0 ≤ Cm * (eps * ‖s‖ ^ 2)⁻¹ := by
      have hden : 0 ≤ eps * ‖s‖ ^ 2 :=
        mul_nonneg heps.1.le (sq_nonneg ‖s‖)
      exact mul_nonneg hCm.le (inv_nonneg.mpr hden)"""
          old2 = """                have hbase : 0 ≤ Cz * Cm * Real.exp 1 * X *
                    (1 + (Real.log T) ^ 10) / (eps * T ^ 2) := by positivity"""
          new2 = """                have hnum : 0 ≤ Cz * Cm * Real.exp 1 * X *
                    (1 + (Real.log T) ^ 10) := by
                  exact mul_nonneg
                    (mul_nonneg
                      (mul_nonneg (mul_nonneg hCz.le hCm.le) (Real.exp_pos 1).le)
                        (by linarith : 0 ≤ X))
                    (by positivity)
                have hden : 0 ≤ eps * T ^ 2 :=
                  mul_nonneg heps.1.le (sq_nonneg T)
                have hbase : 0 ≤ Cz * Cm * Real.exp 1 * X *
                    (1 + (Real.log T) ^ 10) / (eps * T ^ 2) :=
                  div_nonneg hnum hden"""
          for label, old, new in [('Mellin sign', old1, new1), ('base quotient sign', old2, new2)]:
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Publish Horizontal repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- RHLean/Analysis/StrongMertensLogNineHorizontal.lean
          git commit -m 'Close Horizontal sign goals'
          git push origin HEAD:agent/strong-mertens-k2-clean
