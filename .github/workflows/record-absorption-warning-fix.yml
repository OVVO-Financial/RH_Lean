name: Record absorption warning fix

on:
  push:
    branches: [agent/record-square-row-bound]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/record-square-row-bound
      - name: Remove unused simp arguments
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('RHLean/Proof/PostRootCovarianceRecordAbsorption.lean')
          s = p.read_text()
          old1 = 'simp [departureWallIndices, Finset.mem_filter, Finset.mem_range, and_assoc]'
          new1 = 'simp [departureWallIndices, Finset.mem_filter, Finset.mem_range]'
          old2 = 'simp [departureWallPrimes, Finset.mem_filter, Finset.mem_range, and_assoc]'
          new2 = 'simp [departureWallPrimes, Finset.mem_filter, Finset.mem_range]'
          if old1 not in s or old2 not in s:
              raise SystemExit('expected warning sites not found')
          p.write_text(s.replace(old1, new1).replace(old2, new2))
          PY
          git config user.name 'OVVO-Financial'
          git config user.email 'ovvo.financial.systems@gmail.com'
          git add RHLean/Proof/PostRootCovarianceRecordAbsorption.lean
          git diff --cached --quiet && exit 0
          git commit -m 'Remove unused simp args in record absorption'
          git push origin HEAD:agent/record-square-row-bound
