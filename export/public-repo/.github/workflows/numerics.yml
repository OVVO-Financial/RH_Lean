name: Numerical reproducibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'numerics/**'
      - '.github/workflows/numerics.yml'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r numerics/requirements.txt

      - name: Record environment
        run: |
          mkdir -p numerics/results
          python --version > numerics/results/environment.txt
          python -m pip freeze >> numerics/results/environment.txt

      - name: Run paper reproducibility suite
        run: |
          python numerics/squared_space_reproducibility_v3.py \
            --nmax 4096 \
            --out numerics/results/squared_space_repro_v2

      - name: Run analytic falsification gates
        run: |
          python numerics/analytic_kill_gates.py \
            --nmax 4096 \
            --boundary-mmax 2048 \
            --rmax 240 \
            --cutoff 60 \
            --lambda-high 16 \
            --out numerics/results/analytic_gate_results

      - name: Hash outputs
        if: always()
        run: |
          find numerics/results -type f -print0 | sort -z | xargs -0 sha256sum > numerics/results/SHA256SUMS.txt

      - name: Upload numerical archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numerical-reproducibility-archive
          path: numerics/results
